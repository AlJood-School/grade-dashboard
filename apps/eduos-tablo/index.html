<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>نظام التبليغ — EduOS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<script src="../platform-config.js"></script>
<script src="../platform-shield.js"></script>
<script src="../platform-lang.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',Arial,sans-serif;background:#F0F4F8;color:#1C2A2A;min-height:100vh}
.header{background:linear-gradient(135deg,#1C2A2A 0%,#0D3333 100%);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-brand{display:flex;align-items:center;gap:12px}
.header-logo{width:36px;height:36px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.header-title{font-size:18px;font-weight:800}
.header-sub{font-size:12px;opacity:.7;margin-top:2px}
.header-user{font-size:13px;opacity:.85}
.header-actions{display:flex;align-items:center;gap:10px}
.btn-lang{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:13px}
.btn-logout{background:rgba(255,80,80,.15);border:1px solid rgba(255,80,80,.3);color:#ff9090;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:13px}
.main{max-width:1100px;margin:0 auto;padding:24px 16px}
.page-title{font-size:22px;font-weight:800;color:#1C2A2A;margin-bottom:6px}
.page-sub{font-size:14px;color:#64748b;margin-bottom:24px}
.grid-top{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-right:4px solid #e2e8f0}
.stat-card.red{border-color:#ef4444}
.stat-card.orange{border-color:#f97316}
.stat-card.blue{border-color:#3b82f6}
.stat-card.green{border-color:#22c55e}
.stat-val{font-size:28px;font-weight:800;color:#1C2A2A}
.stat-lbl{font-size:13px;color:#64748b;margin-top:2px}
.panels{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden}
.card-head{padding:16px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between}
.card-head h3{font-size:15px;font-weight:700;color:#1C2A2A}
.btn-new{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.card-body{padding:16px 20px}
/* Form */
.form-group{margin-bottom:14px}
.form-label{font-size:13px;font-weight:600;color:#374151;margin-bottom:5px;display:block}
.form-control{width:100%;padding:10px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:14px;background:#fafafa;transition:.2s}
.form-control:focus{outline:none;border-color:#6C3DD6;background:#fff;box-shadow:0 0 0 3px rgba(108,61,214,.1)}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:90px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.type-btn{padding:8px 10px;border:1.5px solid #e5e7eb;border-radius:8px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:600;text-align:center;transition:.2s;background:#fff}
.type-btn:hover{border-color:#6C3DD6;color:#6C3DD6}
.type-btn.active{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border-color:transparent}
.btn-submit{width:100%;background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:10px;padding:12px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-submit:hover{opacity:.9}
/* Reports list */
.report-item{border-bottom:1px solid #f1f5f9;padding:12px 0;display:flex;gap:12px;align-items:flex-start}
.report-item:last-child{border-bottom:none}
.report-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ri-red{background:#fee2e2}
.ri-orange{background:#ffedd5}
.ri-blue{background:#dbeafe}
.ri-green{background:#dcfce7}
.ri-purple{background:#ede9fe}
.report-info{flex:1}
.report-title{font-size:14px;font-weight:700;color:#1C2A2A}
.report-meta{font-size:12px;color:#64748b;margin-top:2px}
.report-status{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.s-open{background:#fee2e2;color:#dc2626}
.s-progress{background:#ffedd5;color:#c2410c}
.s-closed{background:#dcfce7;color:#16a34a}
.s-pending{background:#dbeafe;color:#1d4ed8}
.empty-state{text-align:center;padding:30px;color:#94a3b8}
.empty-state .empty-icon{font-size:40px;margin-bottom:8px}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border:1.5px solid #e5e7eb;border-radius:20px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:12px;background:#fff;transition:.2s}
.filter-btn.active{background:#6C3DD6;color:#fff;border-color:#6C3DD6}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:500px;width:90%;max-height:85vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{font-size:16px;font-weight:800}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#64748b}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1C2A2A;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;display:none}
.toast.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.badge-urgent{background:#ef4444;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;margin-right:6px}
@media(max-width:768px){.grid-top{grid-template-columns:1fr 1fr}.panels{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="header-brand">
    <div class="header-logo">📋</div>
    <div>
      <div class="header-title" data-ar="نظام التبليغ" data-en="Reporting System">نظام التبليغ</div>
      <div class="header-sub" data-ar="بوابة الجود الذكية — EduOS" data-en="AlJood Smart Portal — EduOS">بوابة الجود الذكية — EduOS</div>
    </div>
  </div>
  <div class="header-actions">
    <div class="header-user" id="userNameHeader">—</div>
    <button class="btn-lang" onclick="toggleLang()">EN</button>
    <button class="btn-logout" onclick="doLogout()" data-ar="خروج" data-en="Logout">خروج</button>
  </div>
</div>

<div class="main">
  <div class="page-title" data-ar="📋 نظام التبليغ الموحَّد" data-en="📋 Unified Reporting System">📋 نظام التبليغ الموحَّد</div>
  <div class="page-sub" data-ar="تبليغ عن حوادث، سلوك، غياب، صحة، بنية تحتية وأي حدث يستوجب التوثيق" data-en="Report incidents, behavior, absence, health, maintenance and any event requiring documentation">تبليغ عن حوادث، سلوك، غياب، صحة، بنية تحتية وأي حدث يستوجب التوثيق</div>

  <div class="grid-top">
    <div class="stat-card red">
      <div class="stat-val" id="statOpen">—</div>
      <div class="stat-lbl" data-ar="بلاغات مفتوحة" data-en="Open Reports">بلاغات مفتوحة</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-val" id="statProgress">—</div>
      <div class="stat-lbl" data-ar="قيد المعالجة" data-en="In Progress">قيد المعالجة</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-val" id="statToday">—</div>
      <div class="stat-lbl" data-ar="بلاغات اليوم" data-en="Today's Reports">بلاغات اليوم</div>
    </div>
    <div class="stat-card green">
      <div class="stat-val" id="statClosed">—</div>
      <div class="stat-lbl" data-ar="مُغلقة هذا الأسبوع" data-en="Closed This Week">مُغلقة هذا الأسبوع</div>
    </div>
  </div>

  <div class="panels">
    <!-- Left: New Report -->
    <div class="card">
      <div class="card-head">
        <h3 data-ar="📝 تبليغ جديد" data-en="📝 New Report">📝 تبليغ جديد</h3>
      </div>
      <div class="card-body">
        <div class="form-group">
          <div class="form-label" data-ar="نوع البلاغ" data-en="Report Type">نوع البلاغ</div>
          <div class="type-grid">
            <button class="type-btn" onclick="selectType(this,'behavioral')" data-ar="🔴 سلوكي" data-en="🔴 Behavioral">🔴 سلوكي</button>
            <button class="type-btn" onclick="selectType(this,'health')" data-ar="🏥 صحي" data-en="🏥 Health">🏥 صحي</button>
            <button class="type-btn" onclick="selectType(this,'absence')" data-ar="📅 غياب" data-en="📅 Absence">📅 غياب</button>
            <button class="type-btn" onclick="selectType(this,'maintenance')" data-ar="🔧 بنية تحتية" data-en="🔧 Maintenance">🔧 بنية تحتية</button>
            <button class="type-btn" onclick="selectType(this,'safety')" data-ar="⚠️ سلامة" data-en="⚠️ Safety">⚠️ سلامة</button>
            <button class="type-btn" onclick="selectType(this,'other')" data-ar="📌 أخرى" data-en="📌 Other">📌 أخرى</button>
          </div>
          <input type="hidden" id="reportType" value=""/>
        </div>

        <div class="form-group">
          <label class="form-label" data-ar="الأولوية" data-en="Priority">الأولوية</label>
          <select class="form-control" id="priority">
            <option value="urgent" data-ar="🔴 عاجل جداً" data-en="🔴 Urgent">🔴 عاجل جداً</option>
            <option value="high" data-ar="🟠 عالية" data-en="🟠 High">🟠 عالية</option>
            <option value="medium" selected data-ar="🟡 متوسطة" data-en="🟡 Medium">🟡 متوسطة</option>
            <option value="low" data-ar="🟢 منخفضة" data-en="🟢 Low">🟢 منخفضة</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group" style="margin-bottom:0">
            <label class="form-label" data-ar="الفصل / المكان" data-en="Class / Location">الفصل / المكان</label>
            <select class="form-control" id="location">
              <option value="">— اختر —</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label class="form-label" data-ar="الطالب/ة (اختياري)" data-en="Student (optional)">الطالب/ة (اختياري)</label>
            <input type="text" class="form-control" id="studentName" placeholder="اسم الطالب/ة"/>
          </div>
        </div>

        <div class="form-group" style="margin-top:14px">
          <label class="form-label" data-ar="وصف الحادثة" data-en="Incident Description">وصف الحادثة</label>
          <textarea class="form-control" id="description" placeholder="اكتب/ي وصفاً دقيقاً للحادثة…"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" data-ar="جهة الإحالة" data-en="Refer To">جهة الإحالة</label>
          <select class="form-control" id="referTo">
            <option value="principal" data-ar="مدير/ة المدرسة" data-en="Principal">مدير/ة المدرسة</option>
            <option value="specialist" data-ar="الأخصائي/ة الاجتماعي/ة" data-en="Social Worker">الأخصائي/ة الاجتماعي/ة</option>
            <option value="nurse" data-ar="التمريض" data-en="Nurse">التمريض</option>
            <option value="security" data-ar="الأمن" data-en="Security">الأمن</option>
            <option value="maintenance" data-ar="الصيانة / الفني/ة" data-en="Maintenance">الصيانة / الفني/ة</option>
            <option value="admin" data-ar="الإدارة" data-en="Administration">الإدارة</option>
          </select>
        </div>

        <button class="btn-submit" onclick="submitReport()" data-ar="📤 إرسال البلاغ" data-en="📤 Submit Report">📤 إرسال البلاغ</button>
      </div>
    </div>

    <!-- Right: Reports List -->
    <div class="card">
      <div class="card-head">
        <h3 data-ar="📂 البلاغات" data-en="📂 Reports">📂 البلاغات</h3>
        <button class="btn-new" onclick="loadReports()" data-ar="🔄 تحديث" data-en="🔄 Refresh">🔄 تحديث</button>
      </div>
      <div class="card-body">
        <div class="filter-bar">
          <button class="filter-btn active" onclick="filterReports(this,'all')" data-ar="الكل" data-en="All">الكل</button>
          <button class="filter-btn" onclick="filterReports(this,'open')" data-ar="مفتوح" data-en="Open">مفتوح</button>
          <button class="filter-btn" onclick="filterReports(this,'in_progress')" data-ar="قيد المعالجة" data-en="In Progress">قيد المعالجة</button>
          <button class="filter-btn" onclick="filterReports(this,'closed')" data-ar="مُغلق" data-en="Closed">مُغلق</button>
        </div>
        <div id="reportsList">
          <div class="empty-state"><div class="empty-icon">📋</div><div data-ar="جارٍ التحميل…" data-en="Loading…">جارٍ التحميل…</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-head">
      <h3 data-ar="تفاصيل البلاغ" data-en="Report Details">تفاصيل البلاغ</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = window.EduOS?.SB_URL || 'https://zuyizaiugpmhmeycqton.supabase.co';
const SB_KEY = window.EduOS?.SB_KEY || '';
const DEMO = new URLSearchParams(location.search).get('demo') === '1';

let currentFilter = 'all';
let selectedType = '';
let allReports = [];
let session = null;

const DEMO_SB_URL = 'https://xdkiktwuuwghvzcukvew.supabase.co';
const DEMO_SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhka2lrdHd1dXdnaHZ6Y3VrdmV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzQ2NzksImV4cCI6MjA5Njc1MDY3OX0.3vL9Xi0wW9xDyDKtCsX7lYgwCvRDnNOUDbCHLiJmfgU';

function getBaseHeaders() {
  const url = DEMO ? DEMO_SB_URL : SB_URL;
  const key = DEMO ? DEMO_SB_KEY : SB_KEY;
  return { url, headers: { 'apikey': key, 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' } };
}

async function sbFetch(endpoint, options = {}) {
  const { url, headers } = getBaseHeaders();
  const res = await fetch(`${url}${endpoint}`, { headers, ...options });
  if (!res.ok) return null;
  return res.json().catch(() => null);
}

function selectType(btn, type) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedType = type;
}

async function loadClasses() {
  const data = await sbFetch('/rest/v1/classes?select=id,name&order=name&limit=60');
  const sel = document.getElementById('location');
  if (data && data.length) {
    data.forEach(c => {
      const o = document.createElement('option');
      o.value = c.name; o.textContent = c.name;
      sel.appendChild(o);
    });
  }
  // Add common locations
  ['فناء المدرسة','مكتب الإدارة','المصلى','المطعم','الصالة الرياضية','المختبر','دورة المياه'].forEach(l => {
    const o = document.createElement('option'); o.value = l; o.textContent = l; sel.appendChild(o);
  });
}

async function loadReports() {
  const data = await sbFetch('/rest/v1/incident_reports?select=*&order=created_at.desc&limit=50');
  allReports = data || generateDemoReports();
  updateStats();
  renderReports();
}

function generateDemoReports() {
  return [
    {id:1, type:'behavioral', priority:'urgent', status:'open', description:'شجار بين طالبين في الفناء', location:'فناء المدرسة', student_name:'أحمد محمد', reporter_name:'معلمة الفصل', refer_to:'principal', created_at: new Date().toISOString()},
    {id:2, type:'health', priority:'high', status:'in_progress', description:'طالبة تشكو من صداع شديد', location:'3A', student_name:'مريم علي', reporter_name:'معلمة الرياضيات', refer_to:'nurse', created_at: new Date(Date.now()-3600000).toISOString()},
    {id:3, type:'maintenance', priority:'medium', status:'open', description:'تسرب مياه في دورة المياه B2', location:'دورة المياه', student_name:'', reporter_name:'منسقة المبنى', refer_to:'maintenance', created_at: new Date(Date.now()-7200000).toISOString()},
    {id:4, type:'absence', priority:'low', status:'closed', description:'تغيب متكرر بدون عذر', location:'5B', student_name:'خالد ناصر', reporter_name:'معلم العلوم', refer_to:'specialist', created_at: new Date(Date.now()-86400000).toISOString()},
    {id:5, type:'safety', priority:'high', status:'in_progress', description:'بلاطة مكسورة في الممر الرئيسي', location:'الممر الرئيسي', student_name:'', reporter_name:'حارس الأمن', refer_to:'maintenance', created_at: new Date(Date.now()-10800000).toISOString()},
  ];
}

function updateStats() {
  const open = allReports.filter(r => r.status === 'open').length;
  const prog = allReports.filter(r => r.status === 'in_progress').length;
  const today = allReports.filter(r => new Date(r.created_at).toDateString() === new Date().toDateString()).length;
  const closed = allReports.filter(r => r.status === 'closed').length;
  document.getElementById('statOpen').textContent = open;
  document.getElementById('statProgress').textContent = prog;
  document.getElementById('statToday').textContent = today;
  document.getElementById('statClosed').textContent = closed;
}

function filterReports(btn, filter) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = filter;
  renderReports();
}

function renderReports() {
  const list = document.getElementById('reportsList');
  let filtered = allReports;
  if (currentFilter !== 'all') filtered = allReports.filter(r => r.status === currentFilter);
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div><div>لا بلاغات في هذا التصنيف</div></div>';
    return;
  }
  const typeConfig = {
    behavioral: {icon:'🔴', cls:'ri-red'},
    health: {icon:'🏥', cls:'ri-orange'},
    absence: {icon:'📅', cls:'ri-blue'},
    maintenance: {icon:'🔧', cls:'ri-purple'},
    safety: {icon:'⚠️', cls:'ri-orange'},
    other: {icon:'📌', cls:'ri-blue'}
  };
  const statusLabel = {open:'مفتوح', in_progress:'قيد المعالجة', closed:'مُغلق', pending:'معلَّق'};
  const statusCls = {open:'s-open', in_progress:'s-progress', closed:'s-closed', pending:'s-pending'};
  list.innerHTML = filtered.map(r => {
    const tc = typeConfig[r.type] || {icon:'📌', cls:'ri-blue'};
    const urgentBadge = r.priority === 'urgent' ? '<span class="badge-urgent">عاجل</span>' : '';
    const time = new Date(r.created_at).toLocaleString('ar-AE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<div class="report-item" onclick="showDetail(${r.id})" style="cursor:pointer">
      <div class="report-icon ${tc.cls}">${tc.icon}</div>
      <div class="report-info">
        <div class="report-title">${urgentBadge}${r.description ? r.description.substring(0,60)+'…' : 'بلاغ'}</div>
        <div class="report-meta">${r.location || ''} ${r.student_name ? '· '+r.student_name : ''} · ${time}</div>
      </div>
      <span class="report-status ${statusCls[r.status] || 's-pending'}">${statusLabel[r.status] || r.status}</span>
    </div>`;
  }).join('');
}

function showDetail(id) {
  const r = allReports.find(x => x.id === id);
  if (!r) return;
  const statusLabel = {open:'مفتوح 🔴', in_progress:'قيد المعالجة 🟠', closed:'مُغلق ✅', pending:'معلَّق 🔵'};
  const time = new Date(r.created_at).toLocaleString('ar-AE');
  document.getElementById('modalBody').innerHTML = `
    <div style="display:grid;gap:12px">
      <div><b>النوع:</b> ${r.type}</div>
      <div><b>الأولوية:</b> ${r.priority}</div>
      <div><b>الحالة:</b> ${statusLabel[r.status] || r.status}</div>
      <div><b>المكان / الفصل:</b> ${r.location || '—'}</div>
      <div><b>الطالب/ة:</b> ${r.student_name || '—'}</div>
      <div><b>الإحالة إلى:</b> ${r.refer_to || '—'}</div>
      <div><b>المُبلِّغ/ة:</b> ${r.reporter_name || '—'}</div>
      <div><b>الوصف:</b><br/><p style="background:#f8fafc;padding:10px;border-radius:8px;margin-top:6px">${r.description || '—'}</p></div>
      <div style="color:#64748b;font-size:12px">${time}</div>
      ${r.status !== 'closed' ? `<div style="display:flex;gap:8px">
        <button onclick="updateStatus(${r.id},'in_progress')" style="flex:1;padding:8px;border:1px solid #f97316;border-radius:8px;background:#fff;cursor:pointer;color:#f97316;font-family:Tajawal,sans-serif;font-weight:700">قيد المعالجة</button>
        <button onclick="updateStatus(${r.id},'closed')" style="flex:1;padding:8px;border:1px solid #22c55e;border-radius:8px;background:#fff;cursor:pointer;color:#22c55e;font-family:Tajawal,sans-serif;font-weight:700">✅ إغلاق</button>
      </div>` : ''}
    </div>`;
  document.getElementById('detailModal').classList.add('open');
}

async function updateStatus(id, status) {
  if (DEMO) {
    const r = allReports.find(x => x.id === id);
    if (r) r.status = status;
    updateStats(); renderReports(); closeModal();
    showToast('تم تحديث الحالة ✅'); return;
  }
  const { url, headers } = getBaseHeaders();
  await fetch(`${url}/rest/v1/incident_reports?id=eq.${id}`, {
    method: 'PATCH', headers,
    body: JSON.stringify({ status, updated_at: new Date().toISOString() })
  });
  closeModal(); loadReports(); showToast('تم تحديث الحالة ✅');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('open');
}

async function submitReport() {
  if (!selectedType) { showToast('اختر/ي نوع البلاغ أولاً'); return; }
  const description = document.getElementById('description').value.trim();
  if (!description) { showToast('أدخل/ي وصف الحادثة'); return; }

  const payload = {
    type: selectedType,
    priority: document.getElementById('priority').value,
    location: document.getElementById('location').value,
    student_name: document.getElementById('studentName').value,
    description,
    refer_to: document.getElementById('referTo').value,
    reporter_name: session?.name || 'مستخدم',
    reporter_id: session?.id || null,
    status: 'open',
    created_at: new Date().toISOString()
  };

  if (DEMO) {
    payload.id = Date.now();
    allReports.unshift(payload);
    updateStats(); renderReports();
    document.getElementById('description').value = '';
    document.getElementById('studentName').value = '';
    showToast('✅ تم إرسال البلاغ بنجاح');
    return;
  }

  const { url, headers } = getBaseHeaders();
  const res = await fetch(`${url}/rest/v1/incident_reports`, {
    method: 'POST', headers,
    body: JSON.stringify(payload)
  });
  if (res.ok || res.status === 201) {
    document.getElementById('description').value = '';
    document.getElementById('studentName').value = '';
    showToast('✅ تم إرسال البلاغ بنجاح');
    loadReports();
  } else {
    showToast('❌ حدث خطأ، حاول/ي مرة أخرى');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function doLogout() {
  sessionStorage.removeItem('edoos_user');
  location.href = '/apps/eduos-login/';
}

function toggleLang() {
  const current = document.documentElement.lang;
  const newLang = current === 'ar' ? 'en' : 'ar';
  document.documentElement.lang = newLang;
  document.documentElement.dir = newLang === 'ar' ? 'rtl' : 'ltr';
  if (window.EduOSLang) window.EduOSLang.setLang(newLang);
  document.querySelector('.btn-lang').textContent = newLang === 'ar' ? 'EN' : 'AR';
}

// Init
window.addEventListener('DOMContentLoaded', async () => {
  const raw = sessionStorage.getItem('edoos_user');
  if (!raw && !DEMO) { location.href = '/apps/eduos-login/'; return; }
  if (raw) {
    session = JSON.parse(raw);
    document.getElementById('userNameHeader').textContent = session.name || session.username || '';
  } else {
    document.getElementById('userNameHeader').textContent = 'تجربة مباشرة';
  }
  await loadClasses();
  await loadReports();
});
</script>
</body>
</html>
