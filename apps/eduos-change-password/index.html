<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>تغيير كلمة المرور — EduOS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<script src="../platform-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',Arial,sans-serif;background:linear-gradient(135deg,#F0F4F8 0%,#ede9fe 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;direction:rtl;padding:20px}
:root{--primary:#6C3DD6;--secondary:#22D3EE;--border:#e2e8f0;--text:#1e293b;--text2:#64748b}
.box{background:#fff;border-radius:20px;padding:40px 36px;max-width:450px;width:100%;box-shadow:0 12px 40px rgba(108,61,214,.15)}
.logo-area{text-align:center;margin-bottom:28px}
.logo-badge{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border-radius:16px;padding:10px 20px;font-size:1.5rem;font-weight:900;display:inline-flex;align-items:center;gap:8px;margin-bottom:10px}
.title{font-size:1.2rem;font-weight:900;color:var(--text);text-align:center;margin-bottom:4px}
.sub{font-size:.85rem;color:var(--text2);text-align:center;margin-bottom:28px}
.form-group{margin-bottom:16px;position:relative}
.form-label{display:block;font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap input{width:100%;padding:11px 14px 11px 44px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:.9rem;background:#F8FAFF;color:var(--text)}
.input-wrap input:focus{outline:none;border-color:#6C3DD6;background:#fff}
.eye-btn{position:absolute;left:12px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;font-size:1rem;color:var(--text2);padding:4px}
.strength-bar{height:5px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:6px}
.strength-fill{height:100%;border-radius:4px;transition:.3s;width:0}
.strength-label{font-size:.72rem;font-weight:700;margin-top:4px}
.requirements{background:#F8FAFF;border-radius:10px;padding:12px 14px;margin-bottom:20px;font-size:.78rem}
.req-item{display:flex;align-items:center;gap:6px;padding:3px 0;color:var(--text2)}
.req-item.valid{color:#16a34a}
.req-item.valid::before{content:'✅'}
.req-item:not(.valid)::before{content:'⬜'}
.btn{width:100%;padding:12px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;font-size:.92rem;font-weight:700;transition:.2s;margin-top:4px}
.btn-primary{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text2);margin-top:10px}
.btn-outline:hover{border-color:#6C3DD6}
.error-msg{background:#fef2f2;color:#dc2626;border-radius:8px;padding:10px 14px;font-size:.82rem;font-weight:600;margin-bottom:12px;display:none}
.success-msg{background:#f0fdf4;color:#16a34a;border-radius:8px;padding:10px 14px;font-size:.82rem;font-weight:600;margin-bottom:12px;display:none;text-align:center}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;margin-left:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="logo-area">
    <div class="logo-badge">🔐 EduOS</div>
    <div class="title">تغيير كلمة المرور</div>
    <div class="sub" id="userGreet">تحديث كلمة مرور حسابك</div>
  </div>

  <div class="error-msg" id="errMsg"></div>
  <div class="success-msg" id="successMsg">✅ تم تغيير كلمة المرور بنجاح! يُرجى تسجيل الدخول مجدداً.</div>

  <div id="formWrap">
    <div class="form-group">
      <label class="form-label">كلمة المرور الحالية</label>
      <div class="input-wrap">
        <input type="password" id="currentPwd" placeholder="••••••••" autocomplete="current-password"/>
        <button class="eye-btn" type="button" onclick="togglePwd('currentPwd')">👁️</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">كلمة المرور الجديدة</label>
      <div class="input-wrap">
        <input type="password" id="newPwd" placeholder="••••••••" oninput="checkStrength(this.value)" autocomplete="new-password"/>
        <button class="eye-btn" type="button" onclick="togglePwd('newPwd')">👁️</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-label" id="strengthLabel" style="color:#64748b"></div>
    </div>

    <div class="form-group">
      <label class="form-label">تأكيد كلمة المرور الجديدة</label>
      <div class="input-wrap">
        <input type="password" id="confirmPwd" placeholder="••••••••" oninput="checkMatch()" autocomplete="new-password"/>
        <button class="eye-btn" type="button" onclick="togglePwd('confirmPwd')">👁️</button>
      </div>
      <div id="matchMsg" style="font-size:.75rem;font-weight:700;margin-top:4px"></div>
    </div>

    <div class="requirements">
      <div style="font-weight:700;font-size:.78rem;margin-bottom:6px;color:#1e293b">متطلبات كلمة المرور:</div>
      <div class="req-item" id="req-len">8 أحرف على الأقل</div>
      <div class="req-item" id="req-upper">حرف كبير (A-Z)</div>
      <div class="req-item" id="req-num">رقم (0-9)</div>
      <div class="req-item" id="req-special">رمز خاص (!@#$%)</div>
    </div>

    <button class="btn btn-primary" id="submitBtn" onclick="changePwd()">🔐 تغيير كلمة المرور</button>
    <button class="btn btn-outline" onclick="goBack()">إلغاء والعودة</button>
  </div>
</div>

<script>
var SB_URL, SB_ANON, supabase, sessionUser;

// انتظر platform-config
(async function init() {
  var attempts = 0;
  while ((!window.EduOS || !window.EduOS.SB_URL) && attempts < 40) {
    await new Promise(r => setTimeout(r, 100));
    attempts++;
  }
  SB_URL = window.EduOS?.SB_URL;
  SB_ANON = window.EduOS?.SB_ANON;

  if (!SB_URL) { showErr('تعذّر تحميل إعدادات المنصة'); return; }

  var { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  supabase = createClient(SB_URL, SB_ANON);

  // تحقق من الجلسة
  sessionUser = JSON.parse(sessionStorage.getItem('edoos_user') || '{}');
  if (!sessionUser.username) {
    window.location.replace('../eduos-login/');
    return;
  }

  document.getElementById('userGreet').textContent = 'تغيير كلمة مرور: ' + (sessionUser.name_ar || sessionUser.username);
})();

function togglePwd(id) {
  var i = document.getElementById(id);
  i.type = i.type === 'password' ? 'text' : 'password';
}

function checkStrength(v) {
  var checks = { len: v.length >= 8, upper: /[A-Z]/.test(v), num: /[0-9]/.test(v), special: /[!@#$%^&*]/.test(v) };
  var score = Object.values(checks).filter(Boolean).length;
  var colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
  var labels = ['ضعيفة جداً', 'ضعيفة', 'مقبولة', 'قوية'];
  document.getElementById('strengthFill').style.width = (score * 25) + '%';
  document.getElementById('strengthFill').style.background = colors[score - 1] || '#e2e8f0';
  document.getElementById('strengthLabel').textContent = score > 0 ? labels[score - 1] : '';
  document.getElementById('strengthLabel').style.color = colors[score - 1] || '#64748b';
  document.getElementById('req-len').className = 'req-item' + (checks.len ? ' valid' : '');
  document.getElementById('req-upper').className = 'req-item' + (checks.upper ? ' valid' : '');
  document.getElementById('req-num').className = 'req-item' + (checks.num ? ' valid' : '');
  document.getElementById('req-special').className = 'req-item' + (checks.special ? ' valid' : '');
}

function checkMatch() {
  var n = document.getElementById('newPwd').value;
  var c = document.getElementById('confirmPwd').value;
  var el = document.getElementById('matchMsg');
  if (!c) { el.textContent = ''; return; }
  el.textContent = n === c ? '✅ كلمتا المرور متطابقتان' : '❌ غير متطابقتان';
  el.style.color = n === c ? '#16a34a' : '#ef4444';
}

function showErr(msg) {
  var el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('successMsg').style.display = 'none';
}

function hideErr() { document.getElementById('errMsg').style.display = 'none'; }

function goBack() {
  var role = sessionUser.role_key || '';
  var roleRoutes = {
    teacher: '../eduos-teacher/',
    vice_principal: '../eduos-vice-principal/',
    principal: '../eduos-principal/',
    admin: '../eduos-admin/',
    counselor: '../eduos-counselor/',
    financial_coordinator: '../eduos-financial/'
  };
  window.location.replace(roleRoutes[role] || '../eduos-hub/');
}

async function changePwd() {
  hideErr();
  var cur = document.getElementById('currentPwd').value.trim();
  var nw = document.getElementById('newPwd').value;
  var con = document.getElementById('confirmPwd').value;

  if (!cur) { showErr('أدخلي كلمة المرور الحالية'); return; }
  if (!nw) { showErr('أدخلي كلمة المرور الجديدة'); return; }
  if (nw !== con) { showErr('كلمتا المرور الجديدتان غير متطابقتين'); return; }
  if (nw.length < 8) { showErr('كلمة المرور الجديدة قصيرة — 8 أحرف على الأقل'); return; }
  if (!/[A-Z]/.test(nw)) { showErr('يجب أن تحتوي على حرف كبير واحد على الأقل'); return; }
  if (!/[0-9]/.test(nw)) { showErr('يجب أن تحتوي على رقم واحد على الأقل'); return; }
  if (nw === cur) { showErr('كلمة المرور الجديدة يجب أن تختلف عن الحالية'); return; }
  if (!supabase) { showErr('لم يتم تحميل المنصة — أعيدي المحاولة'); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = 'جارٍ التحقق... <span class="spinner"></span>';

  try {
    var username = sessionUser.username;
    var authEmail = username + '@aljood.eduos.ae';

    // الخطوة 1: التحقق من كلمة المرور الحالية
    var { data: signInData, error: signInErr } = await supabase.auth.signInWithPassword({
      email: authEmail,
      password: cur,
    });

    if (signInErr || !signInData?.user) {
      btn.disabled = false;
      btn.textContent = '🔐 تغيير كلمة المرور';
      showErr('كلمة المرور الحالية غير صحيحة');
      return;
    }

    btn.innerHTML = 'جارٍ التحديث... <span class="spinner"></span>';

    // الخطوة 2: تحديث كلمة مرور Supabase Auth
    var { error: updateErr } = await supabase.auth.updateUser({ password: nw });

    if (updateErr) {
      btn.disabled = false;
      btn.textContent = '🔐 تغيير كلمة المرور';
      showErr('فشل تحديث كلمة المرور — ' + updateErr.message);
      return;
    }

    // الخطوة 3: تسجيل التغيير في staff_profiles
    try {
      await supabase.rpc('mark_password_self_changed');
    } catch (rpcErr) {
      console.warn('mark_password_self_changed failed (non-critical):', rpcErr);
    }

    // الخطوة 4: إخراج من الجلسة وإظهار رسالة النجاح
    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';

    await supabase.auth.signOut();
    sessionStorage.removeItem('edoos_user');

    setTimeout(function() { window.location.replace('../eduos-login/'); }, 3000);

  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.textContent = '🔐 تغيير كلمة المرور';
    showErr('خطأ غير متوقع — حاولي مرة أخرى');
  }
}
</script>
</body>
</html>
