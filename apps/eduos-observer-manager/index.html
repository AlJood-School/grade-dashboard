<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المراقبين — بوابة الجود</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<script src="../platform-shield.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',Arial,sans-serif;background:#f0f4f8;color:#1a2332;min-height:100vh;}

/* Header */
.header{background:linear-gradient(135deg,#6C3DD6,#22D3EE);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(108,61,214,0.25);}
.header-brand{display:flex;align-items:center;gap:12px;color:#fff;}
.header-brand .logo{width:36px;height:36px;background:rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.header-brand h1{font-size:18px;font-weight:700;}
.header-brand span{font-size:12px;opacity:0.8;}
.header-actions{display:flex;align-items:center;gap:12px;}
.btn-logout{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:14px;transition:all .2s;}
.btn-logout:hover{background:rgba(255,255,255,0.25);}

/* Live badge */
.live-badge{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:20px;padding:4px 12px;color:#fff;font-size:13px;}
.live-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(1.3);}}

/* Main layout */
.main{max-width:1200px;margin:0 auto;padding:32px 24px;}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
.stat-card{background:#fff;border-radius:16px;padding:20px 24px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border:1px solid #e8edf2;}
.stat-card .val{font-size:36px;font-weight:800;background:linear-gradient(135deg,#6C3DD6,#22D3EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-card .lbl{font-size:13px;color:#64748b;margin-top:4px;}

/* Create form */
.create-section{background:#fff;border-radius:20px;padding:28px 32px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #e8edf2;margin-bottom:32px;}
.section-title{font-size:18px;font-weight:700;color:#1a2332;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
.section-title .icon{width:32px;height:32px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group label{font-size:13px;font-weight:600;color:#374151;}
.form-group input,.form-group select,.form-group textarea{border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-family:'Tajawal',sans-serif;font-size:14px;color:#1a2332;transition:border-color .2s;background:#fafbfc;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#6C3DD6;background:#fff;}

.scope-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.scope-btn{border:1.5px solid #e2e8f0;background:#f8fafc;border-radius:8px;padding:6px 14px;font-family:'Tajawal',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;color:#374151;}
.scope-btn.active{border-color:#6C3DD6;background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;}

.btn-create{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;padding:12px 32px;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(108,61,214,0.3);}
.btn-create:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(108,61,214,0.4);}
.btn-create:disabled{opacity:.6;cursor:not-allowed;transform:none;}

/* Tokens table */
.tokens-section{background:#fff;border-radius:20px;padding:28px 32px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #e8edf2;margin-bottom:32px;}
.token-card{border:1.5px solid #e8edf2;border-radius:14px;padding:20px;margin-bottom:12px;transition:border-color .2s;position:relative;}
.token-card:hover{border-color:#6C3DD6;}
.token-card.expired{opacity:.55;background:#fafafa;}
.token-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.token-label{font-size:16px;font-weight:700;color:#1a2332;}
.token-status{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;}
.token-status.active{background:#dcfce7;color:#16a34a;}
.token-status.active .dot{width:7px;height:7px;background:#16a34a;border-radius:50%;animation:pulse 1.5s infinite;}
.token-status.expired{background:#fee2e2;color:#dc2626;}
.token-status.expired .dot{width:7px;height:7px;background:#dc2626;border-radius:50%;}

.token-meta{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:#64748b;margin-bottom:12px;}
.token-meta span{display:flex;align-items:center;gap:4px;}

.token-link{background:#f0f4f8;border-radius:8px;padding:8px 12px;font-size:12px;color:#6C3DD6;font-family:monospace;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;word-break:break-all;}
.copy-btn{background:#6C3DD6;color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-family:'Tajawal',sans-serif;white-space:nowrap;}

.token-scopes{display:flex;gap:6px;flex-wrap:wrap;}
.scope-tag{background:#ede9fe;color:#6C3DD6;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:600;}

.token-actions{display:flex;gap:8px;margin-top:12px;}
.btn-sm{border:1.5px solid;padding:6px 14px;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;cursor:pointer;font-weight:600;transition:all .2s;}
.btn-deactivate{border-color:#f97316;color:#f97316;background:#fff7ed;}
.btn-deactivate:hover{background:#f97316;color:#fff;}
.btn-delete{border-color:#ef4444;color:#ef4444;background:#fef2f2;}
.btn-delete:hover{background:#ef4444;color:#fff;}
.btn-sessions{border-color:#6C3DD6;color:#6C3DD6;background:#f5f3ff;}
.btn-sessions:hover{background:#6C3DD6;color:#fff;}

/* Active observers panel */
.observers-live{background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:20px;padding:28px 32px;margin-bottom:32px;}
.observers-live .section-title{color:#fff;}
.observer-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 18px;margin-bottom:8px;}
.observer-info{display:flex;align-items:center;gap:12px;}
.observer-avatar{width:36px;height:36px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}
.observer-name{font-size:14px;font-weight:700;color:#fff;}
.observer-meta{font-size:12px;color:#94a3b8;}
.observer-page{font-size:12px;background:rgba(108,61,214,0.3);color:#c4b5fd;border-radius:6px;padding:3px 10px;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2332;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;z-index:9999;pointer-events:none;}
.toast.show{opacity:1;}
.toast.success{background:linear-gradient(135deg,#16a34a,#22D3EE);}
.toast.error{background:linear-gradient(135deg,#dc2626,#f97316);}

/* Empty state */
.empty{text-align:center;padding:48px;color:#94a3b8;}
.empty .icon{font-size:48px;margin-bottom:12px;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:20px;padding:28px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{cursor:pointer;font-size:20px;color:#94a3b8;}
.session-row{border:1px solid #e8edf2;border-radius:10px;padding:12px 16px;margin-bottom:8px;}
.session-row .s-name{font-size:14px;font-weight:700;color:#1a2332;}
.session-row .s-meta{font-size:12px;color:#64748b;margin-top:4px;}
.session-row .s-pages{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.session-row .s-page-tag{background:#ede9fe;color:#6C3DD6;border-radius:4px;padding:2px 8px;font-size:11px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="logo">👁️</div>
    <div>
      <h1>إدارة المراقبين</h1>
      <span>Observer Access Management</span>
    </div>
  </div>
  <div class="header-actions">
    <div class="live-badge">
      <div class="live-dot"></div>
      <span id="liveCount">0 نشط الآن</span>
    </div>
    <button class="btn-logout" onclick="logout()">خروج</button>
  </div>
</div>

<div class="main">

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="val" id="statTotal">—</div>
      <div class="lbl">إجمالي الروابط</div>
    </div>
    <div class="stat-card">
      <div class="val" id="statActive">—</div>
      <div class="lbl">روابط نشطة</div>
    </div>
    <div class="stat-card">
      <div class="val" id="statLiveNow">—</div>
      <div class="lbl">مراقبون متصلون الآن</div>
    </div>
    <div class="stat-card">
      <div class="val" id="statTotal24">—</div>
      <div class="lbl">جلسات خلال 24 ساعة</div>
    </div>
  </div>

  <!-- Create Token -->
  <div class="create-section">
    <div class="section-title">
      <div class="icon">➕</div>
      إنشاء رابط مراقبة جديد
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>الوصف / الغرض</label>
        <input type="text" id="tokenLabel" placeholder="مثال: فريق ADEK — زيارة يوليو 2026">
      </div>
      <div class="form-group">
        <label>المدة</label>
        <select id="tokenDuration">
          <option value="2">ساعتان</option>
          <option value="8">يوم واحد (8 ساعات)</option>
          <option value="24" selected>24 ساعة</option>
          <option value="72">3 أيام</option>
          <option value="168">أسبوع</option>
          <option value="720">شهر</option>
        </select>
      </div>
      <div class="form-group">
        <label>عدد المستخدمين المسموح</label>
        <input type="number" id="tokenMaxSessions" value="10" min="1" max="100">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:16px;">
      <label>نطاق الصلاحيات</label>
      <div class="scope-grid" id="scopeGrid">
        <button class="scope-btn active" data-scope="all" onclick="toggleScope(this)">🌐 كل المنصة</button>
        <button class="scope-btn" data-scope="academic" onclick="toggleScope(this)">📚 الأكاديمي</button>
        <button class="scope-btn" data-scope="analytics" onclick="toggleScope(this)">📊 التحليلات</button>
        <button class="scope-btn" data-scope="attendance" onclick="toggleScope(this)">✅ الحضور</button>
        <button class="scope-btn" data-scope="staff" onclick="toggleScope(this)">👩‍🏫 الكادر</button>
        <button class="scope-btn" data-scope="students" onclick="toggleScope(this)">👩‍🎓 الطلاب</button>
        <button class="scope-btn" data-scope="schedule" onclick="toggleScope(this)">🗓️ الجداول</button>
        <button class="scope-btn" data-scope="finance" onclick="toggleScope(this)">💰 المالية</button>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:20px;">
      <label>ملاحظات (اختياري)</label>
      <input type="text" id="tokenNotes" placeholder="مثال: مفتشو المنهج — زيارة رسمية">
    </div>
    <button class="btn-create" id="createBtn" onclick="createToken()">🔗 إنشاء رابط المراقبة</button>
  </div>

  <!-- Live Observers -->
  <div class="observers-live">
    <div class="section-title">
      <div class="icon" style="background:rgba(255,255,255,0.15);">🟢</div>
      <span style="color:#fff;">المراقبون المتصلون الآن</span>
    </div>
    <div id="liveObservers">
      <div class="empty" style="color:#64748b;padding:24px;">
        <div class="icon">👁️</div>
        لا يوجد مراقبون متصلون الآن
      </div>
    </div>
  </div>

  <!-- Tokens List -->
  <div class="tokens-section">
    <div class="section-title">
      <div class="icon">🔗</div>
      روابط المراقبة
    </div>
    <div id="tokensList">
      <div class="empty"><div class="icon">🔗</div>لا توجد روابط بعد</div>
    </div>
  </div>

</div>

<!-- Sessions Modal -->
<div class="modal-overlay" id="sessionsModal">
  <div class="modal">
    <div class="modal-title">
      <span>📋 سجل الجلسات</span>
      <span class="modal-close" onclick="closeModal()">✕</span>
    </div>
    <div id="sessionsList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://zuyizaiugpmhmeycqton.supabase.co';
let SB_KEY = '';
let sb = null;
let currentUser = null;
let selectedScopes = ['all'];

window.addEventListener('DOMContentLoaded', async () => {
  await waitForConfig();
  SB_KEY = window.EduOS?.SB_KEY || '';
  sb = supabase.createClient(SB_URL, SB_KEY);
  await checkAuth();
  loadData();
  setInterval(loadLive, 10000);
});

async function waitForConfig() {
  return new Promise(r => {
    if (window.EduOS?.SB_KEY) return r();
    const t = setInterval(() => { if (window.EduOS?.SB_KEY) { clearInterval(t); r(); } }, 100);
    setTimeout(() => { clearInterval(t); r(); }, 3000);
  });
}

async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '../eduos-login/'; return; }
  const { data: profile } = await sb.from('staff_profiles').select('role_key,full_name').eq('id', session.user.id).single();
  if (!profile || !['admin','principal'].includes(profile.role_key)) {
    showToast('ليس لديك صلاحية الوصول لهذه الصفحة', 'error');
    setTimeout(() => window.location.href = '../eduos-login/', 2000);
    return;
  }
  currentUser = { ...profile, id: session.user.id };
}

function toggleScope(btn) {
  const scope = btn.dataset.scope;
  if (scope === 'all') {
    selectedScopes = ['all'];
    document.querySelectorAll('.scope-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    return;
  }
  // Remove 'all' if selecting specific
  selectedScopes = selectedScopes.filter(s => s !== 'all');
  document.querySelector('[data-scope="all"]').classList.remove('active');
  if (selectedScopes.includes(scope)) {
    selectedScopes = selectedScopes.filter(s => s !== scope);
    btn.classList.remove('active');
  } else {
    selectedScopes.push(scope);
    btn.classList.add('active');
  }
  if (selectedScopes.length === 0) {
    selectedScopes = ['all'];
    document.querySelector('[data-scope="all"]').classList.add('active');
  }
}

async function createToken() {
  const label = document.getElementById('tokenLabel').value.trim();
  const hours = parseInt(document.getElementById('tokenDuration').value);
  const maxSessions = parseInt(document.getElementById('tokenMaxSessions').value);
  const notes = document.getElementById('tokenNotes').value.trim();
  if (!label) { showToast('أدخل وصف الرابط', 'error'); return; }
  const btn = document.getElementById('createBtn');
  btn.disabled = true; btn.textContent = 'جاري الإنشاء...';
  const expiresAt = new Date(Date.now() + hours * 3600000).toISOString();
  const { data, error } = await sb.from('observer_tokens').insert({
    label, scope: selectedScopes, created_by: currentUser?.full_name || 'admin',
    expires_at: expiresAt, max_sessions: maxSessions, notes: notes || null, is_active: true
  }).select().single();
  btn.disabled = false; btn.textContent = '🔗 إنشاء رابط المراقبة';
  if (error) { showToast('خطأ في الإنشاء: ' + error.message, 'error'); return; }
  showToast('✅ تم إنشاء الرابط بنجاح', 'success');
  document.getElementById('tokenLabel').value = '';
  document.getElementById('tokenNotes').value = '';
  loadData();
}

async function loadData() {
  const { data: tokens } = await sb.from('observer_tokens').select('*').order('created_at', { ascending: false });
  const { count: total24 } = await sb.from('observer_sessions').select('*', { count: 'exact', head: true })
    .gte('started_at', new Date(Date.now() - 86400000).toISOString());
  const active = tokens?.filter(t => t.is_active && new Date(t.expires_at) > new Date()) || [];
  document.getElementById('statTotal').textContent = tokens?.length || 0;
  document.getElementById('statActive').textContent = active.length;
  document.getElementById('statTotal24').textContent = total24 || 0;
  renderTokens(tokens || []);
  loadLive();
}

async function loadLive() {
  const cutoff = new Date(Date.now() - 3 * 60000).toISOString();
  const { data: live } = await sb.from('observer_sessions').select('*').eq('is_active', true).gte('last_seen_at', cutoff);
  const liveDiv = document.getElementById('liveObservers');
  document.getElementById('statLiveNow').textContent = live?.length || 0;
  document.getElementById('liveCount').textContent = `${live?.length || 0} نشط الآن`;
  if (!live || live.length === 0) {
    liveDiv.innerHTML = '<div class="empty" style="color:#64748b;padding:24px;"><div class="icon">👁️</div>لا يوجد مراقبون متصلون الآن</div>';
    return;
  }
  liveDiv.innerHTML = live.map(s => {
    const since = Math.round((Date.now() - new Date(s.started_at)) / 60000);
    const lastPage = s.pages_visited?.slice(-1)[0] || 'غير محدد';
    return `<div class="observer-row">
      <div class="observer-info">
        <div class="observer-avatar">👤</div>
        <div>
          <div class="observer-name">${s.observer_name}</div>
          <div class="observer-meta">متصل منذ ${since} دقيقة · ${s.ip_address || '—'}</div>
        </div>
      </div>
      <div class="observer-page">📍 ${lastPage}</div>
    </div>`;
  }).join('');
}

function renderTokens(tokens) {
  const el = document.getElementById('tokensList');
  if (!tokens.length) {
    el.innerHTML = '<div class="empty"><div class="icon">🔗</div>لا توجد روابط بعد</div>';
    return;
  }
  el.innerHTML = tokens.map(t => {
    const expired = new Date(t.expires_at) < new Date();
    const status = (t.is_active && !expired) ? 'active' : 'expired';
    const statusLabel = status === 'active' ? 'نشط' : (expired ? 'منتهي' : 'موقوف');
    const link = `${location.origin}/apps/eduos-observer/?token=${t.token}`;
    const expiresStr = new Date(t.expires_at).toLocaleString('ar-AE');
    const createdStr = new Date(t.created_at).toLocaleString('ar-AE');
    const scopes = t.scope?.join(', ') || 'all';
    return `<div class="token-card ${expired || !t.is_active ? 'expired' : ''}">
      <div class="token-header">
        <div class="token-label">${t.label}</div>
        <div class="token-status ${status}"><div class="dot"></div>${statusLabel}</div>
      </div>
      <div class="token-meta">
        <span>📅 أُنشئ: ${createdStr}</span>
        <span>⏳ ينتهي: ${expiresStr}</span>
        <span>👤 بواسطة: ${t.created_by}</span>
        <span>👥 الحد: ${t.max_sessions} مستخدم</span>
      </div>
      <div class="token-link">
        <span>${link}</span>
        <button class="copy-btn" onclick="copyLink('${link}')">نسخ</button>
      </div>
      <div class="token-scopes">
        ${t.scope?.map(s => `<span class="scope-tag">${s}</span>`).join('')}
      </div>
      ${t.notes ? `<div style="margin-top:8px;font-size:13px;color:#64748b;">📝 ${t.notes}</div>` : ''}
      <div class="token-actions">
        <button class="btn-sm btn-sessions" onclick="viewSessions('${t.id}','${t.label}')">📋 الجلسات</button>
        ${status === 'active' ? `<button class="btn-sm btn-deactivate" onclick="deactivateToken('${t.id}')">⏸️ إيقاف</button>` : ''}
        <button class="btn-sm btn-delete" onclick="deleteToken('${t.id}')">🗑️ حذف</button>
      </div>
    </div>`;
  }).join('');
}

async function deactivateToken(id) {
  await sb.from('observer_tokens').update({ is_active: false }).eq('id', id);
  showToast('تم إيقاف الرابط', 'success');
  loadData();
}

async function deleteToken(id) {
  if (!confirm('هل تريد حذف هذا الرابط وكل جلساته؟')) return;
  await sb.from('observer_tokens').delete().eq('id', id);
  showToast('تم الحذف', 'success');
  loadData();
}

async function viewSessions(tokenId, label) {
  const { data } = await sb.from('observer_sessions').select('*').eq('token_id', tokenId).order('started_at', { ascending: false });
  const modal = document.getElementById('sessionsModal');
  const list = document.getElementById('sessionsList');
  document.querySelector('.modal-title span').textContent = `📋 جلسات: ${label}`;
  if (!data?.length) {
    list.innerHTML = '<div class="empty"><div class="icon">📋</div>لا توجد جلسات بعد</div>';
  } else {
    list.innerHTML = data.map(s => {
      const started = new Date(s.started_at).toLocaleString('ar-AE');
      const duration = Math.round((new Date(s.last_seen_at) - new Date(s.started_at)) / 60000);
      return `<div class="session-row">
        <div class="s-name">👤 ${s.observer_name}</div>
        <div class="s-meta">🕐 بدأ: ${started} · ⏱️ المدة: ${duration} دقيقة · 🌐 ${s.ip_address || '—'}</div>
        <div class="s-pages">${s.pages_visited?.map(p => `<span class="s-page-tag">${p}</span>`).join('') || '<span class="s-page-tag">لا بيانات</span>'}</div>
      </div>`;
    }).join('');
  }
  modal.classList.add('show');
}

function closeModal() { document.getElementById('sessionsModal').classList.remove('show'); }

function copyLink(link) {
  navigator.clipboard.writeText(link).then(() => showToast('✅ تم نسخ الرابط', 'success'));
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 3000);
}

function logout() { sb.auth.signOut().then(() => window.location.href = '../eduos-login/'); }
</script>
