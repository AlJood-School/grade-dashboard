<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>استعادة الحساب — بوابة الجود الذكية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#1e293b;font:18px/1.7 Tajawal,Arial,sans-serif}.card{width:100%;max-width:460px;padding:30px;background:#fff;border-radius:20px;box-shadow:0 15px 50px #0002}header{text-align:center}.logo{display:grid;place-items:center;margin:auto;width:60px;height:60px;border-radius:15px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);font-size:28px}h1{font-size:22px;margin:10px 0 0}.sub{font-size:13px;color:#64748b;direction:ltr}h2{font-size:20px;margin:24px 0 4px}p{margin:10px 0}label{display:block;margin-top:15px}input,button{font:inherit;width:100%;border-radius:10px;padding:11px;border:1px solid #cbd5e1}input{direction:ltr;color:#1e293b;background:#f8fafc}button{margin-top:20px;border:0;background:#6C3DD6;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.notice{padding:12px;background:#f1f5f9;border-radius:10px}.error{background:#fef2f2;color:#b91c1c}.success{background:#f0fdf4;color:#166534}footer{text-align:center;color:#64748b;font-size:13px;margin-top:24px}footer span{display:block;direction:ltr}a{color:#5b21b6}#recoveryForm[hidden]{display:none}@media(max-width:400px){body{padding:12px}.card{padding:22px}footer{font-size:12px}}</style></head>
<body><main class="card"><header><div class="logo" aria-hidden="true">🎓</div><h1>بوابة الجود الذكية</h1><div class="sub">Powered by EduOS</div></header>
<h2>تعيين كلمة مرور جديدة</h2><p id="notice" class="notice" role="status" aria-live="polite">جارٍ التحقق من رابط الاستعادة…</p>
<form id="recoveryForm" hidden><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" autocomplete="new-password" minlength="12" required>
<label for="confirmation">تأكيد كلمة المرور</label><input id="confirmation" type="password" autocomplete="new-password" minlength="12" required>
<p>استخدم 12 حرفاً على الأقل، تتضمن حرفاً كبيراً وحرفاً صغيراً ورقماً ورمزاً.</p><button id="submit" type="submit">حفظ كلمة المرور</button></form>
<p><a href="../eduos-login/">العودة إلى الدخول</a></p>
<footer><span>NAFAS FOR ARTIFICIAL INTELLIGENCE</span><span>CN-6573712</span>© 2026 جميع الحقوق محفوظة.</footer></main>
<script type="module" src="./recovery.js"></script></body></html>
