<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة المسجّلة — الجود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',Arial,sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh;font-size:16px}
:root{--brand:#6C3DD6;--brand2:#22D3EE;--surface:#fff;--surface2:#f1f5f9;--text:#1e293b;--text2:#475569;--text3:#94a3b8;--border:#e2e8f0;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--radius:12px}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--brand),var(--brand2));padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(108,61,214,.2)}
.hdr-brand{display:flex;align-items:center;gap:12px}
.hdr-logo{width:44px;height:44px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.hdr-title{color:#fff;font-size:18px;font-weight:800}
.hdr-sub{color:rgba(255,255,255,.8);font-size:12px;margin-top:2px}
.hdr-user{display:flex;align-items:center;gap:10px;color:#fff}
.hdr-av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.hdr-nm{font-size:14px;font-weight:700}
.hdr-role{font-size:11px;opacity:.8}
.btn-logout{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px}

/* TABS */
.tabs-wrap{background:#fff;border-bottom:2px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.tab-btn{padding:14px 20px;font-size:14px;font-weight:600;color:var(--text2);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-family:inherit;transition:all .2s}
.tab-btn.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab-btn:hover:not(.active){color:var(--text)}

/* CONTENT */
.main{padding:24px;max-width:1200px;margin:0 auto}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* SEARCH BAR */
.search-bar{background:#fff;border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.search-input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:15px;font-family:inherit;color:var(--text);outline:none;transition:border .2s;background:#f8fafc}
.search-input:focus{border-color:var(--brand);background:#fff}
.search-select{border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;color:var(--text);outline:none;background:#f8fafc;cursor:pointer}
.btn{padding:10px 18px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:#5a32b8}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--brand);color:var(--brand)}

/* TABLE */
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:#f8fafc;padding:12px 14px;font-size:13px;font-weight:700;color:var(--text2);text-align:right;border-bottom:2px solid var(--border)}
.tbl td{padding:12px 14px;font-size:14px;color:var(--text);border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-gray{background:#f1f5f9;color:#475569}

/* STATS CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;align-items:center;gap:16px}
.stat-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.stat-val{font-size:28px;font-weight:800;color:var(--text)}
.stat-lbl{font-size:13px;color:var(--text2);margin-top:2px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:90%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-hdr{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:18px;font-weight:800;color:var(--text)}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);line-height:1}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:13px;font-weight:700;color:var(--text2)}
.form-input{border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--text);outline:none;transition:border .2s;background:#f8fafc}
.form-input:focus{border-color:var(--brand);background:#fff}
.form-select{border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--text);outline:none;background:#f8fafc;cursor:pointer}

/* ACTIVATION BOX */
.activation-box{background:#f0fdf4;border:2px solid #86efac;border-radius:10px;padding:16px;margin-top:12px}
.activation-box .link-text{font-size:12px;word-break:break-all;color:#166534;background:#dcfce7;padding:8px;border-radius:6px;margin-top:8px;display:block}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-txt{font-size:16px}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--text3);font-size:15px}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo">📋</div>
    <div>
      <div class="hdr-title">بوابة المسجّلة</div>
      <div class="hdr-sub" id="hdrSub">بوابة الجود الذكية</div>
    </div>
  </div>
  <div class="hdr-user">
    <div>
      <div class="hdr-nm" id="hdrName">Loading...</div>
      <div class="hdr-role">مسجّلة</div>
    </div>
    <div class="hdr-av" id="hdrAv">م</div>
    <button class="btn-logout" onclick="logout()">خروج</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs-wrap">
  <button class="tab-btn active" onclick="switchTab('students')">👩‍🎓 الطالبات</button>
  <button class="tab-btn" onclick="switchTab('parents')">👨‍👩‍👧 أولياء الأمور</button>
  <button class="tab-btn" onclick="switchTab('register')">➕ تسجيل جديدة</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- ===== STUDENTS TAB ===== -->
  <div id="tab-students" class="tab-panel active">
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-icon" style="background:#ede9fe">📚</div>
        <div><div class="stat-val" id="statTotal">—</div><div class="stat-lbl">إجمالي الطالبات</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#dcfce7">✅</div>
        <div><div class="stat-val" id="statActivated">—</div><div class="stat-lbl">ولي أمر مفعّل</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fef3c7">⏳</div>
        <div><div class="stat-val" id="statPending">—</div><div class="stat-lbl">بانتظار التفعيل</div></div>
      </div>
    </div>

    <div class="search-bar">
      <input class="search-input" id="stuSearch" placeholder="ابحث بالاسم أو رقم الطالبة..." oninput="filterStudents()">
      <select class="search-select" id="stuGrade" onchange="filterStudents()">
        <option value="">كل الصفوف</option>
      </select>
      <button class="btn btn-primary" onclick="loadStudents()">🔄 تحديث</button>
    </div>

    <div class="table-wrap">
      <div id="stuTableWrap">
        <div class="loading"><div class="spinner"></div><br>جارٍ التحميل...</div>
      </div>
    </div>
  </div>

  <!-- ===== PARENTS TAB ===== -->
  <div id="tab-parents" class="tab-panel">
    <div class="search-bar">
      <input class="search-input" id="parSearch" placeholder="ابحث باسم ولي الأمر أو رقم الهاتف..." oninput="filterParents()">
      <select class="search-select" id="parFilter" onchange="filterParents()">
        <option value="">الكل</option>
        <option value="activated">مفعّل</option>
        <option value="pending">غير مفعّل</option>
      </select>
      <button class="btn btn-primary" onclick="loadParents()">🔄 تحديث</button>
    </div>

    <div class="table-wrap">
      <div id="parTableWrap">
        <div class="loading"><div class="spinner"></div><br>جارٍ التحميل...</div>
      </div>
    </div>
  </div>

  <!-- ===== REGISTER TAB ===== -->
  <div id="tab-register" class="tab-panel">
    <div style="background:#fff;border-radius:var(--radius);padding:28px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:700px">
      <div style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:24px;display:flex;align-items:center;gap:10px">
        ➕ تسجيل طالبة جديدة
      </div>

      <div style="font-size:14px;font-weight:700;color:var(--brand);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--border)">بيانات الطالبة</div>
      <div class="form-grid" style="margin-bottom:24px">
        <div class="form-group">
          <label class="form-label">الاسم الكامل *</label>
          <input class="form-input" id="regName" placeholder="اسم الطالبة كاملاً">
        </div>
        <div class="form-group">
          <label class="form-label">رقم الطالبة *</label>
          <input class="form-input" id="regStudentNum" placeholder="مثال: 2001300" type="text">
        </div>
        <div class="form-group">
          <label class="form-label">الصف *</label>
          <select class="form-select" id="regClass">
            <option value="">اختر الصف...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">الجنس</label>
          <select class="form-select" id="regGender">
            <option value="female">أنثى</option>
            <option value="male">ذكر</option>
          </select>
        </div>
          <div class="form-group">
          <label class="form-label">هاتف ولي الأمر</label>
          <input class="form-input" id="regNatId" placeholder="+971XXXXXXXXX">
        </div>
      </div>

      <div style="font-size:14px;font-weight:700;color:var(--brand);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--border)">بيانات ولي الأمر</div>
      <div class="form-grid" style="margin-bottom:24px">
        <div class="form-group">
          <label class="form-label">اسم ولي الأمر *</label>
          <input class="form-input" id="regParentName" placeholder="الاسم الكامل">
        </div>
        <div class="form-group">
          <label class="form-label">رقم الهوية الإماراتية *</label>
          <input class="form-input" id="regParentNatId" placeholder="784-XXXX-XXXXXXX-X">
        </div>
        <div class="form-group">
          <label class="form-label">رقم الموبايل (واتساب) *</label>
          <input class="form-input" id="regParentPhone" placeholder="+971XXXXXXXXX">
        </div>
        <div class="form-group">
          <label class="form-label">صلة القرابة</label>
          <select class="form-select" id="regRelation">
            <option value="أب">أب</option>
            <option value="أم">أم</option>
            <option value="ولي أمر">ولي أمر</option>
          </select>
        </div>
      </div>

      <div style="display:flex;gap:12px;justify-content:flex-end">
        <button class="btn btn-outline" onclick="clearRegForm()">مسح</button>
        <button class="btn btn-primary" onclick="submitRegister()">✅ تسجيل وإرسال رابط التفعيل</button>
      </div>
    </div>
  </div>

</div>

<!-- MODAL: تعديل الطالبة -->
<div class="modal-overlay" id="stuModal">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title">✏️ تعديل بيانات الطالبة</span>
      <button class="modal-close" onclick="closeStuModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editStuId">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">الاسم الكامل</label>
          <input class="form-input" id="editStuName">
        </div>
        <div class="form-group">
          <label class="form-label">رقم الطالبة</label>
          <input class="form-input" id="editStuNum">
        </div>
        <div class="form-group">
          <label class="form-label">الصف</label>
          <select class="form-select" id="editStuClass"></select>
        </div>
        <div class="form-group">
          <label class="form-label">رقم هوية ولي الأمر</label>
          <input class="form-input" id="editStuNatId">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeStuModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveStuEdit()">💾 حفظ التعديلات</button>
    </div>
  </div>
</div>

<!-- MODAL: تعديل ولي الأمر -->
<div class="modal-overlay" id="parModal">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title">✏️ تعديل بيانات ولي الأمر</span>
      <button class="modal-close" onclick="closeParModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editParId">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">اسم ولي الأمر</label>
          <input class="form-input" id="editParName">
        </div>
        <div class="form-group">
          <label class="form-label">رقم الهوية الإماراتية</label>
          <input class="form-input" id="editParNatId">
        </div>
        <div class="form-group full">
          <label class="form-label">رقم الموبايل (واتساب)</label>
          <input class="form-input" id="editParPhone">
        </div>
      </div>

      <div id="activationSection" style="margin-top:16px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeParModal()">إلغاء</button>
      <button class="btn btn-warning btn-sm" id="btnResendLink" onclick="resendActivation()">📲 إرسال رابط التفعيل</button>
      <button class="btn btn-primary" onclick="saveParEdit()">💾 حفظ التعديلات</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="../platform-config.js"></script>
<script src="../platform-week.js"></script>
<script src="../platform-auth-guard.js"></script>
<script>
var SB_URL, SB_ANON, USER, allStudents = [], allParents = [], allClasses = [];

async function init() {
  // انتظار تحميل platform-config
  var waited = 0;
  while ((!window.EduOS || !window.EduOS.SB_URL) && waited < 3000) {
    await new Promise(function(r){ setTimeout(r, 100); });
    waited += 100;
  }
  SB_URL = (window.EduOS && window.EduOS.SB_URL) || '';
  SB_ANON = (window.EduOS && window.EduOS.SB_KEY) || '';
  if (!SB_URL) { document.getElementById('stuTableWrap').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-txt">تعذّر تحميل الإعدادات</div></div>'; return; }

  var s = getSession();
  if (!s || s.role_key !== 'registrar') { window.location.href = '../eduos-login/'; return; }
  USER = s;
  var nm = s.name || 'المسجّلة';
  document.getElementById('hdrName').textContent = nm;
  document.getElementById('hdrAv').textContent = nm.substring(0,2);
  setupWeek(function(info) {
    document.getElementById('hdrSub').textContent = 'بوابة الجود الذكية · ' + (info.label || '');
  });
  await loadStats();
  await loadStudents();
  await loadClasses();
}

function getAuthToken() {
  try { var s = JSON.parse(sessionStorage.getItem('edoos_user') || '{}'); return s.token || SB_ANON; } catch(e) { return SB_ANON; }
}

async function dbGet(table, params) {
  var url = SB_URL + '/rest/v1/' + table + '?' + params;
  var r = await fetch(url, { headers: { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + getAuthToken() } });
  return r.json();
}

async function dbPatch(table, filter, body) {
  var url = SB_URL + '/rest/v1/' + table + '?' + filter;
  var r = await fetch(url, { method: 'PATCH', headers: { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + getAuthToken(), 'Content-Type': 'application/json', 'Prefer': 'return=representation' }, body: JSON.stringify(body) });
  return r.json();
}

async function dbPost(table, body) {
  var url = SB_URL + '/rest/v1/' + table;
  var r = await fetch(url, { method: 'POST', headers: { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + getAuthToken(), 'Content-Type': 'application/json', 'Prefer': 'return=representation' }, body: JSON.stringify(body) });
  return r.json();
}

// ── STATS ──
async function loadStats() {
  var students = await dbGet('students', 'select=id&is_deleted=neq.true&limit=1&count=exact');
  // count parents
  var parents = await dbGet('parent_credentials', 'select=id,activated');
  if (Array.isArray(parents)) {
    var activated = parents.filter(function(p){ return p.activated; }).length;
    document.getElementById('statTotal').textContent = '—';
    document.getElementById('statActivated').textContent = activated;
    document.getElementById('statPending').textContent = parents.length - activated;
  }
}

// ── CLASSES ──
async function loadClasses() {
  var data = await dbGet('students', 'select=class_name&order=class_name');
  if (!Array.isArray(data)) return;
  var unique = [];
  data.forEach(function(r){ if (r.class_name && unique.indexOf(r.class_name) === -1) unique.push(r.class_name); });
  unique.sort();
  allClasses = unique;
  var opts = '<option value="">كل الصفوف</option>';
  unique.forEach(function(c){ opts += '<option value="' + c + '">' + c + '</option>'; });
  document.getElementById('stuGrade').innerHTML = opts;
  // fill register and edit selects
  var regOpts = '<option value="">اختر الصف...</option>';
  unique.forEach(function(c){ regOpts += '<option value="' + c + '">' + c + '</option>'; });
  document.getElementById('regClass').innerHTML = regOpts;
  document.getElementById('editStuClass').innerHTML = regOpts;
}

// ── STUDENTS ──
async function loadStudents() {
  document.getElementById('stuTableWrap').innerHTML = '<div class="loading"><div class="spinner"></div><br>جارٍ التحميل...</div>';
  var data = await dbGet('students', 'select=id,name,class_name,student_number,grade,parent_phone,parent_national_id&order=class_name,name&limit=2000');
  if (!Array.isArray(data)) { document.getElementById('stuTableWrap').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-txt">خطأ في التحميل</div></div>'; return; }
  allStudents = data;
  document.getElementById('statTotal').textContent = data.length;
  renderStudents(data);
}

function renderStudents(list) {
  if (!list.length) { document.getElementById('stuTableWrap').innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-txt">لا نتائج</div></div>'; return; }
  var html = '<table class="tbl"><thead><tr><th>الاسم</th><th>الصف</th><th>رقم الطالبة</th><th>المرحلة</th><th>هاتف ولي الأمر</th><th>إجراء</th></tr></thead><tbody>';
  list.forEach(function(s) {
    html += '<tr>';
    html += '<td style="font-weight:600">' + (s.name || '—') + '</td>';
    html += '<td>' + (s.class_name || '—') + '</td>';
    html += '<td style="font-family:monospace">' + (s.student_number || '—') + '</td>';
    html += '<td style="font-size:13px;color:#64748b">' + (s.grade || '—') + '</td>';
    html += '<td style="font-size:13px;color:#64748b;direction:ltr">' + (s.parent_phone || '—') + '</td>';
    html += '<td><button class="btn btn-outline btn-sm" onclick="openStuEdit(' + JSON.stringify(s).replace(/"/g,'&quot;') + ')">✏️ تعديل</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('stuTableWrap').innerHTML = html;
}

function filterStudents() {
  var q = document.getElementById('stuSearch').value.trim().toLowerCase();
  var grade = document.getElementById('stuGrade').value;
  var list = allStudents.filter(function(s) {
    var match = !q || (s.name || '').toLowerCase().includes(q) || (s.student_number || '').includes(q);
    var gradeMatch = !grade || s.class_name === grade;
    return match && gradeMatch;
  });
  renderStudents(list);
}

function openStuEdit(s) {
  document.getElementById('editStuId').value = s.id;
  document.getElementById('editStuName').value = s.name || '';
  document.getElementById('editStuNum').value = s.student_number || '';
  document.getElementById('editStuNatId').value = s.parent_national_id || '';
  var sel = document.getElementById('editStuClass');
  for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === s.class_name) { sel.selectedIndex = i; break; } }
  document.getElementById('stuModal').classList.add('open');
}
function closeStuModal() { document.getElementById('stuModal').classList.remove('open'); }

async function saveStuEdit() {
  var id = document.getElementById('editStuId').value;
  var body = {
    name: document.getElementById('editStuName').value.trim(),
    student_number: document.getElementById('editStuNum').value.trim(),
    class_name: document.getElementById('editStuClass').value,
    parent_national_id: document.getElementById('editStuNatId').value.trim()
  };
  if (!body.name) { toast('⚠️ الاسم مطلوب'); return; }
  var res = await dbPatch('students', 'id=eq.' + id, body);
  if (Array.isArray(res) && res.length > 0) {
    toast('✅ تم حفظ بيانات الطالبة');
    closeStuModal();
    loadStudents();
  } else { toast('❌ خطأ في الحفظ'); }
}

// ── PARENTS ──
async function loadParents() {
  document.getElementById('parTableWrap').innerHTML = '<div class="loading"><div class="spinner"></div><br>جارٍ التحميل...</div>';
  var data = await dbGet('parent_credentials', 'select=id,parent_name,phone,national_id,activated,activated_at,student_ids&order=parent_name&limit=2000');
  if (!Array.isArray(data)) { document.getElementById('parTableWrap').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-txt">خطأ في التحميل</div></div>'; return; }
  allParents = data;
  renderParents(data);
}

function renderParents(list) {
  if (!list.length) { document.getElementById('parTableWrap').innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-txt">لا نتائج</div></div>'; return; }
  var html = '<table class="tbl"><thead><tr><th>اسم ولي الأمر</th><th>رقم الموبايل</th><th>عدد الأبناء</th><th>حالة التفعيل</th><th>تاريخ التفعيل</th><th>إجراء</th></tr></thead><tbody>';
  list.forEach(function(p) {
    var activated = p.activated;
    var badge = activated ? '<span class="badge badge-green">✅ مفعّل</span>' : '<span class="badge badge-yellow">⏳ غير مفعّل</span>';
    var actDate = p.activated_at ? new Date(p.activated_at).toLocaleDateString('ar-AE') : '—';
    var count = Array.isArray(p.student_ids) ? p.student_ids.length : 0;
    html += '<tr>';
    html += '<td style="font-weight:600">' + (p.parent_name || '—') + '</td>';
    html += '<td style="font-family:monospace;direction:ltr">' + (p.phone || '—') + '</td>';
    html += '<td style="text-align:center">' + count + '</td>';
    html += '<td>' + badge + '</td>';
    html += '<td style="font-size:13px;color:#64748b">' + actDate + '</td>';
    html += '<td style="display:flex;gap:6px">';
    html += '<button class="btn btn-outline btn-sm" onclick="openParEdit(' + JSON.stringify(p).replace(/"/g,'&quot;') + ')">✏️ تعديل</button>';
    if (!activated) { html += '<button class="btn btn-success btn-sm" onclick="sendActivationLink(\'' + p.id + '\',\'' + (p.phone||'') + '\')">📲 رابط التفعيل</button>'; }
    html += '</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('parTableWrap').innerHTML = html;
}

function filterParents() {
  var q = document.getElementById('parSearch').value.trim().toLowerCase();
  var filter = document.getElementById('parFilter').value;
  var list = allParents.filter(function(p) {
    var match = !q || (p.parent_name || '').toLowerCase().includes(q) || (p.phone || '').includes(q);
    var fMatch = !filter || (filter === 'activated' && p.activated) || (filter === 'pending' && !p.activated);
    return match && fMatch;
  });
  renderParents(list);
}

function openParEdit(p) {
  document.getElementById('editParId').value = p.id;
  document.getElementById('editParName').value = p.parent_name || '';
  document.getElementById('editParNatId').value = p.national_id || '';
  document.getElementById('editParPhone').value = p.phone || '';
  document.getElementById('btnResendLink').dataset.parId = p.id;
  document.getElementById('btnResendLink').dataset.parPhone = p.phone || '';
  var actHtml = p.activated
    ? '<div style="background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:10px;font-size:13px;color:#166534">✅ ولي الأمر مفعّل منذ ' + (p.activated_at ? new Date(p.activated_at).toLocaleDateString('ar-AE') : '—') + '</div>'
    : '<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px;font-size:13px;color:#92400e">⏳ لم يُفعَّل بعد — اضغط "إرسال رابط التفعيل"</div>';
  document.getElementById('activationSection').innerHTML = actHtml;
  document.getElementById('parModal').classList.add('open');
}
function closeParModal() { document.getElementById('parModal').classList.remove('open'); }

async function saveParEdit() {
  var id = document.getElementById('editParId').value;
  var body = {
    parent_name: document.getElementById('editParName').value.trim(),
    national_id: document.getElementById('editParNatId').value.trim(),
    phone: document.getElementById('editParPhone').value.trim()
  };
  if (!body.phone) { toast('⚠️ رقم الموبايل مطلوب'); return; }
  var res = await dbPatch('parent_credentials', 'id=eq.' + id, body);
  if (Array.isArray(res) && res.length > 0) {
    toast('✅ تم حفظ بيانات ولي الأمر');
    closeParModal();
    loadParents();
  } else { toast('❌ خطأ في الحفظ'); }
}

// ── ACTIVATION LINK ──
function generateToken() {
  var arr = new Uint8Array(24);
  window.crypto.getRandomValues(arr);
  return Array.from(arr, function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

async function sendActivationLink(parId, phone) {
  var token = generateToken();
  var expires = new Date(Date.now() + 48 * 3600 * 1000).toISOString();
  // save token in DB
  var res = await dbPatch('parent_credentials', 'id=eq.' + parId, { temp_token: token, temp_token_expires: expires });
  var baseUrl = window.location.origin + window.location.pathname.replace('eduos-registrar/', 'eduos-parent-activate/');
  var link = baseUrl + '?token=' + token;
  // Show link to registrar (WhatsApp not connected yet)
  var msg = 'تم إنشاء رابط التفعيل ✅\n\nأرسلي هذا الرابط لولي الأمر عبر واتساب:\n' + link;
  alert(msg);
  toast('✅ الرابط جاهز — انسخيه وأرسليه');
}

async function resendActivation() {
  var btn = document.getElementById('btnResendLink');
  await sendActivationLink(btn.dataset.parId, btn.dataset.parPhone);
}

// ── REGISTER ──
async function submitRegister() {
  var name = document.getElementById('regName').value.trim();
  var stuNum = document.getElementById('regStudentNum').value.trim();
  var cls = document.getElementById('regClass').value;
  var parentPhone2 = document.getElementById('regNatId').value.trim();
  var pName = document.getElementById('regParentName').value.trim();
  var pNatId = document.getElementById('regParentNatId').value.trim();
  var pPhone = document.getElementById('regParentPhone').value.trim();

  if (!name || !stuNum || !cls || !pName || !pNatId || !pPhone) { toast('⚠️ يرجى ملء الحقول الإلزامية'); return; }

  // Insert student
  var stuRes = await dbPost('students', { name: name, student_number: stuNum, class_name: cls, parent_phone: pPhone, parent_national_id: pNatId });
  if (!Array.isArray(stuRes) || !stuRes[0]) { toast('❌ خطأ في تسجيل الطالبة'); return; }

  var stuDbId = stuRes[0].id;
  var token = generateToken();
  var expires = new Date(Date.now() + 48 * 3600 * 1000).toISOString();

  // Insert parent
  var parRes = await dbPost('parent_credentials', {
    parent_name: pName,
    national_id: pNatId,
    phone: pPhone,
    student_ids: [String(stuDbId)],
    activated: false,
    temp_token: token,
    temp_token_expires: expires
  });

  if (!Array.isArray(parRes) || !parRes[0]) { toast('❌ خطأ في تسجيل ولي الأمر'); return; }

  var baseUrl = window.location.origin + window.location.pathname.replace('eduos-registrar/index.html','').replace('eduos-registrar/','') + 'eduos-parent-activate/';
  var link = baseUrl + '?token=' + token;
  toast('✅ تم التسجيل بنجاح!');
  clearRegForm();
  alert('تم تسجيل ' + name + ' بنجاح!\n\nرابط تفعيل ولي الأمر:\n' + link + '\n\nأرسليه لـ ' + pName + ' عبر واتساب');
  loadStudents();
}

function clearRegForm() {
  ['regName','regStudentNum','regNatId','regParentName','regParentNatId','regParentPhone'].forEach(function(id){ document.getElementById(id).value = ''; });
  document.getElementById('regClass').selectedIndex = 0;
  document.getElementById('regGender').selectedIndex = 0;
  document.getElementById('regRelation').selectedIndex = 0;
}

// ── TABS ──
function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'parents' && allParents.length === 0) loadParents();
}

// ── UTILS ──
function getSession() {
  try { return JSON.parse(sessionStorage.getItem('edoos_user')); } catch(e) { return null; }
}
function logout() { sessionStorage.removeItem('edoos_user'); window.location.href = '../eduos-login/'; }
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 3000);
}

init();
</script>
