<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جدول المدرسة الشامل — بوابة الجود</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<script src="../platform-auth-guard.js"></script>
<script src="../platform-week.js"></script>
<script src="../platform-lang.js"></script>
<script src="../platform-shield.js" defer></script>
<style>
:root{
  --bg:#F0F4F8;--surface:#fff;--border:#E2E8F0;
  --brand:#6C3DD6;--brand2:#22D3EE;
  --text:#1E293B;--text2:#64748B;--text3:#94A3B8;
  --green:#059669;--red:#DC2626;--amber:#D97706;
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ─── هيدر ─── */
.hdr{background:linear-gradient(135deg,#6C3DD6,#22D3EE);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(108,61,214,.3)}
.hdr-logo{width:44px;height:44px;background:rgba(255,255,255,.18);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.hdr-title{font-size:18px;font-weight:900;color:#fff}
.hdr-meta{font-size:12px;color:rgba(255,255,255,.75)}
.hdr-time{font-size:20px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.hdr-back{background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700}
.hdr-back:hover{background:rgba(255,255,255,.25)}
#header-tools{display:flex;align-items:center;gap:6px;margin-right:auto}

/* ─── مفتاح ─── */
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border);align-items:center}
.leg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.leg-dot{width:14px;height:14px;border-radius:4px}

/* ─── تبويبات الأيام ─── */
.day-tabs{display:flex;gap:4px;padding:12px 24px 0;background:var(--bg)}
.day-tab{padding:7px 18px;border-radius:20px 20px 0 0;border:1.5px solid var(--border);border-bottom:none;background:var(--surface);color:var(--text2);font-family:inherit;font-size:13px;cursor:pointer;font-weight:600;transition:.15s}
.day-tab:hover{color:var(--brand);border-color:var(--brand)}
.day-tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.day-tab.today-tab{border-color:var(--brand2);color:var(--brand2)}
.day-tab.today-tab.active{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent}

/* ─── شريط الشواغر ─── */
.vacancy-bar{margin:8px 24px;background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 16px;font-size:13px;color:var(--red);font-weight:700;display:none}
.vacancy-bar.show{display:block}

/* ─── فلتر المرحلة ─── */
.filter-bar{padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bg);border-bottom:1px solid var(--border)}
.filter-chip{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-family:inherit;font-size:12px;cursor:pointer;font-weight:600;transition:.15s}
.filter-chip:hover{border-color:var(--brand);color:var(--brand)}
.filter-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.filter-count{font-size:11px;color:var(--text3);margin-right:auto}

/* ─── جدول الجلسة ─── */
.tbl-wrap{overflow-x:auto;padding:16px 24px 60px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.master-tbl{border-collapse:separate;border-spacing:3px;min-width:max-content;width:100%}

/* ─── رؤوس الأعمدة ─── */
.master-tbl th{background:#EDE9FE;color:var(--brand);font-size:11px;font-weight:900;padding:10px 10px;white-space:nowrap;border-radius:8px;text-align:center;position:sticky;top:0;z-index:10;letter-spacing:.3px;border:1px solid rgba(108,61,214,.12)}
.master-tbl th .th-time{display:block;font-size:10px;font-weight:600;color:rgba(108,61,214,.6);margin-top:2px;direction:ltr}
.master-tbl th.col-class{position:sticky;right:0;z-index:20;background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;font-size:13px;min-width:68px;border:none;font-weight:900}
.master-tbl th.now-col{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;box-shadow:0 0 16px rgba(108,61,214,.35);border:none}
.master-tbl th.now-col .th-time{color:rgba(255,255,255,.75)}
.master-tbl th.now-col .th-now-badge{display:inline-block;background:#22d3ee;color:#0f172a;font-size:8px;font-weight:900;padding:1px 6px;border-radius:10px;margin-top:4px}

/* ─── خلايا ─── */
.master-tbl td{background:var(--surface);border-radius:8px;padding:8px 6px;text-align:center;vertical-align:middle;min-width:120px;max-width:140px;transition:.1s;border:1px solid var(--border)}
.master-tbl td:hover{background:#F8F5FF;border-color:rgba(108,61,214,.2)}
.master-tbl td.col-class{position:sticky;right:0;z-index:5;background:linear-gradient(135deg,#EDE9FE,#ddd6fe);color:var(--brand);font-weight:900;font-size:14px;min-width:68px;max-width:68px;border-radius:8px;border:1px solid rgba(108,61,214,.2);letter-spacing:.5px}
.master-tbl td.cell-past{opacity:.45;background:#F8FAFC}
.master-tbl td.cell-now{background:rgba(108,61,214,.07);border:2px solid var(--brand);box-shadow:0 0 12px rgba(108,61,214,.15)}
.master-tbl td.cell-future{background:var(--surface)}
.master-tbl td.cell-vacant{background:#FEF2F2;border:1px dashed #FECACA}
.master-tbl td.cell-break-before{border-right:3px solid #FDE68A !important}

/* ─── محتوى الخلية ─── */
.subject-pill{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800;line-height:1.3;max-width:120px;white-space:normal;word-break:break-word;text-align:center}
.cell-teacher{font-size:10px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:118px;display:block}
.cell-badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:5px;margin-top:2px;background:rgba(108,61,214,.12);color:var(--brand)}
.vacant-pill{display:inline-block;background:#FEF3C7;color:#92400E;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700}
.vacant-lbl{display:block;font-size:10px;color:var(--amber);margin-top:2px}
.now-star{font-size:10px;color:var(--brand);display:block;margin-top:2px}

/* ─── فواصل المرحلة ─── */
.grade-sep td{background:transparent !important;border:none !important;padding:8px 0 2px !important}
.grade-label{font-size:11px;color:var(--brand2);font-weight:900;text-align:right;padding-right:4px;letter-spacing:.5px}
.grade-sep td:not(.grade-label){border-bottom:2px solid rgba(34,211,238,.2) !important;height:14px !important}

/* ─── صف الاستراحات ─── */
.break-sep-row td{background:#FFFBEB;font-size:10px;color:#92400E;padding:4px;text-align:center;font-weight:700;border-top:none;border:1px solid #FDE68A}
.break-sep-row .col-class{background:#FEF3C7 !important;color:var(--amber) !important;font-size:10px;font-weight:700}
.break-time-badge{display:inline-block;background:rgba(251,191,36,.2);border:1px solid rgba(251,191,36,.4);border-radius:5px;padding:1px 6px;font-size:10px;color:#78350F;white-space:nowrap}

/* ─── تحميل ─── */
.loading-overlay{position:fixed;inset:0;background:rgba(240,244,248,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999;backdrop-filter:blur(4px)}
.spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .master-tbl td,.master-tbl th{min-width:90px;max-width:110px;font-size:10px;padding:6px 4px}
  .subject-pill{font-size:10px}
  .cell-teacher{font-size:9px}
}

/* ─── Tooltip ─── */
.master-tbl td[title]:hover::after{content:attr(title);position:fixed;background:#1E293B;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;white-space:pre;z-index:9999;border:1px solid var(--border);pointer-events:none;direction:rtl;max-width:200px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
</style>
</head>
<body>

<div class="loading-overlay" id="loadOverlay">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:14px">جارٍ تحميل جدول المدرسة…</div>
</div>

<div class="hdr">
  <div class="hdr-logo">📅</div>
  <div style="flex:1">
    <div class="hdr-title">جدول المدرسة الشامل</div>
    <div class="hdr-meta" id="hdrMeta">—</div>
  </div>
  <div class="hdr-time" id="hdrTime">—</div>
  <div id="header-tools"></div>
  <button class="hdr-back" onclick="history.back()">↩ رجوع</button>
</div>

<div class="legend">
  <div class="leg"><div class="leg-dot" style="background:rgba(108,61,214,.12);border:2px solid var(--brand)"></div> الحصة الحالية</div>
  <div class="leg"><div class="leg-dot" style="background:#F8FAFC;border:1px solid var(--border);opacity:.55"></div> حصة منتهية</div>
  <div class="leg"><div class="leg-dot" style="background:#FEF2F2;border:1px dashed #FECACA"></div> شاغر</div>
  <div class="leg"><div class="leg-dot" style="background:#FFFBEB;border:1px solid #FDE68A"></div> استراحة</div>
  <span id="vacancyCount" style="margin-right:auto;font-size:12px;color:var(--red);font-weight:700"></span>
</div>

<div class="day-tabs" id="dayTabs"></div>
<div class="vacancy-bar" id="vacancyBar"></div>

<div class="filter-bar">
  <span style="font-size:12px;color:var(--text3)">المرحلة:</span>
  <button class="filter-chip active" onclick="filterGrade('all',this)">الكل</button>
  <button class="filter-chip" onclick="filterGrade('KG',this)">روضة</button>
  <button class="filter-chip" onclick="filterGrade('G1-G2',this)">١–٢</button>
  <button class="filter-chip" onclick="filterGrade('G3-G4',this)">٣–٤</button>
  <button class="filter-chip" onclick="filterGrade('G5-G8',this)">٥–٨</button>
</div>

<div class="tbl-wrap">
  <table class="master-tbl" id="masterTbl">
    <tbody id="masterBody"></tbody>
  </table>
</div>

<script>
const SB_URL = window.EduOS?.SB_URL || 'https://zuyizaiugpmhmeycqton.supabase.co';
const SB_KEY = window.EduOS?.SB_KEY || '';
const DAYS_ORDER = ['الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];

// ─── ألوان المواد ───
const SUBJ_COLORS = [
  {k:['رياضيات'],bg:'#EDE9FE',t:'#5B21B6'},
  {k:['علوم'],bg:'#DCFCE7',t:'#166534'},
  {k:['عربي','لغة عربية','مجال عرب'],bg:'#FEF9C3',t:'#713F12'},
  {k:['إنجليز','english'],bg:'#DBEAFE',t:'#1E3A8A'},
  {k:['إسلام','تربية إسلام'],bg:'#FEF3C7',t:'#78350F'},
  {k:['دراسات','اجتماع'],bg:'#FCE7F3',t:'#831843'},
  {k:['فنون','رسم'],bg:'#FFF7ED',t:'#9A3412'},
  {k:['تربية بدني','بدني'],bg:'#D1FAE5',t:'#065F46'},
  {k:['موسيق'],bg:'#F3E8FF',t:'#6B21A8'},
  {k:['ذكاء اصطناعي','ccdi'],bg:'#E0F2FE',t:'#0C4A6E'},
  {k:['حوسبة','تقني'],bg:'#CFFAFE',t:'#164E63'},
  {k:['جيوجيتسو'],bg:'#FEE2E2',t:'#991B1B'},
  {k:['amt','emt'],bg:'#F3E8FF',t:'#5B21B6'},
];
function getColor(s){
  if(!s) return {bg:'#F1F5F9',t:'#475569'};
  const sl=s.toLowerCase();
  for(const c of SUBJ_COLORS){
    for(const k of c.k){ if(sl.includes(k)) return {bg:c.bg,t:c.t}; }
  }
  return {bg:'#F1F5F9',t:'#475569'};
}

function getPeriodTime(grade, period) {
  const g = parseInt((grade||'').replace(/\D/g,'')) || 1;
  if (g <= 4) {
    const t=[null,{s:430,e:475},{s:480,e:525},{s:530,e:575},{s:600,e:645},{s:650,e:695},{s:710,e:755},{s:760,e:805}];
    return t[period]||null;
  } else {
    const t=[null,{s:480,e:525},{s:530,e:575},{s:600,e:645},{s:650,e:695},{s:695,e:740},{s:740,e:785},{s:795,e:840},{s:840,e:885}];
    return t[period]||null;
  }
}
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function getPeriodStatus(grade,p){ const t=getPeriodTime(grade,p); if(!t) return 'future'; const n=nowMin(); return n<t.s?'future':n>t.e?'past':'now'; }
function minsToTime(m){ const h=Math.floor(m/60),mm=m%60; return h+':'+(mm<10?'0':'')+mm; }
function getBreaks(grade){
  const g=parseInt((grade||'').replace(/\D/g,''))||1;
  if(g<=2) return [{after:2,s:525,e:550},{after:5,s:695,e:710}];
  if(g<=4) return [{after:3,s:575,e:600},{after:5,s:695,e:710}];
  return [{after:2,s:575,e:600},{after:6,s:785,e:795}];
}
function maxPeriods(grade){ const g=parseInt((grade||'').replace(/\D/g,''))||1; return g>=5?8:7; }

function abbrevSubject(s){
  if(!s) return '—';
  if(s.includes('جيوجيتسو')) return 'جيوجيتسو';
  if(s.includes('ذكاء اصطناعي')||s.includes('CCDI')) return 'ذكاء اصطناعي';
  if(s.includes('فنون وموسيقى')) return 'فنون / موسيقى';
  if(s.includes('فنون بصرية')||s==='فنون') return 'فنون';
  if(s.includes('موسيقى')) return 'موسيقى';
  if(s.includes('تربية بدنية')) return 'بدنية';
  if(s.includes('دراسات اجتماعية')) return 'دراسات';
  if(s.includes('تربية إسلامية')&&!s.includes('عربي')) return 'إسلامية';
  if(s.includes('رياضيات')&&s.includes('علوم')&&s.includes('إنجليز')) return 'AMT';
  if(s.includes('رياضيات')&&s.includes('إنجليز')&&!s.includes('علوم')) return 'إنجليزي + رياضيات';
  if(s.includes('عربية')&&s.includes('إسلامية')&&s.includes('دراسات')) return 'عربي + إسلامية + دراسات';
  if(s.includes('عربية')&&s.includes('إسلامية')) return 'عربي + إسلامية';
  if(s.includes('لغة عربية')||s==='عربي') return 'عربي';
  if(s.includes('إنجليز')&&!s.includes('رياضيات')) return 'إنجليزي';
  return s.length>16?s.slice(0,14)+'…':s;
}
function toArabicNum(n){ return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]); }

let allSchedule=[],allClasses=[],activeDay='',gradeFilter='all',todayAr='';

document.addEventListener('DOMContentLoaded',async()=>{
  updateClock(); setInterval(updateClock,30000);
  setTodayAr(); buildDayTabs();
  await loadSchedule();
  render();
  document.getElementById('loadOverlay').style.display='none';
});

function setTodayAr(){
  const d=new Date().getDay();
  const map={0:'الأحد',1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس',5:'الجمعة',6:'السبت'};
  todayAr=map[d]||'';
  activeDay=DAYS_ORDER.includes(todayAr)?todayAr:'الاثنين';
}
function updateClock(){
  const now=new Date();
  const t=now.toLocaleTimeString('ar-AE',{hour:'2-digit',minute:'2-digit'});
  const d=now.toLocaleDateString('ar-AE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('hdrTime').textContent=t;
  document.getElementById('hdrMeta').textContent=d;
}
function buildDayTabs(){
  const tabs=document.getElementById('dayTabs');
  tabs.innerHTML=DAYS_ORDER.map(day=>{
    const isToday=day===todayAr;
    return '<button class="day-tab'+(isToday?' today-tab':'')+' '+(day===activeDay?' active':'')+'" onclick="selectDay(\''+ day +'\',this)">'+ day +(isToday?' 📍':'')+'</button>';
  }).join('');
}
function selectDay(day,btn){
  activeDay=day;
  document.querySelectorAll('.day-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function filterGrade(g,btn){
  gradeFilter=g;
  document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function sortClass(cls){
  if(!cls) return 999;
  if(cls.startsWith('KG')){ const n=cls.startsWith('KG1')?0:10; return n+cls.charCodeAt(cls.length-1); }
  const m=cls.match(/^(\d+)([A-Z])/);
  if(m) return parseInt(m[1])*100+m[2].charCodeAt(0);
  return 999;
}
function gradeNum(grade){
  if(!grade) return 1;
  if(grade==='KG1'||grade==='KG2') return 0;
  return parseInt(grade.replace(/\D/g,''))||1;
}
async function loadSchedule(){
  try{
    const res=await fetch(SB_URL+'/rest/v1/schedules?select=class_name,subject,teacher_name,period,day,grade,vacancy_reason,is_active&is_active=eq.true&order=class_name,period',
      {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    const data=await res.json();
    allSchedule=Array.isArray(data)?data:[];
    const classSet={};
    allSchedule.forEach(r=>{ if(r.class_name) classSet[r.class_name]=r.grade||''; });
    allClasses=Object.entries(classSet).map(([c,g])=>({cls:c,grade:g})).sort((a,b)=>sortClass(a.cls)-sortClass(b.cls));
  }catch(e){ console.error(e); }
}
function render(){
  const tbody=document.getElementById('masterBody');
  const isFriday=(activeDay==='الجمعة');
  const isToday=(activeDay===todayAr);
  let classes=allClasses;
  if(gradeFilter!=='all'){
    classes=classes.filter(c=>{
      const g=gradeNum(c.grade);
      if(gradeFilter==='KG') return g===0;
      if(gradeFilter==='G1-G2') return g===1||g===2;
      if(gradeFilter==='G3-G4') return g===3||g===4;
      if(gradeFilter==='G5-G8') return g>=5&&g<=8;
      return true;
    });
  }
  const idx={};
  allSchedule.forEach(r=>{ const key=(r.class_name||'')+'__'+(r.day||'')+'__'+(r.period||''); idx[key]=r; });
  const maxP=isFriday?4:8;

  // هيدر
  let headerHtml='<tr>';
  headerHtml+='<th class="col-class">الصف</th>';
  for(let p=1;p<=maxP;p++){
    let colClass='',isNow=false;
    if(isToday){ const st=getPeriodStatus('G3',p); if(st==='now'){ colClass=' now-col'; isNow=true; } }
    const t=getPeriodTime('G3',p);
    const timeStr=t?minsToTime(t.s)+'–'+minsToTime(t.e):'';
    headerHtml+='<th class="'+ colClass.trim() +'">ح'+ toArabicNum(p);
    headerHtml+='<span class="th-time">'+ timeStr +'</span>';
    if(isNow) headerHtml+='<span class="th-now-badge">الآن</span>';
    headerHtml+='</th>';
  }
  headerHtml+='</tr>';

  let vacancies=[],rowsHtml='',lastGroup='';
  classes.forEach(({cls,grade})=>{
    const g=gradeNum(grade);
    const group=g===0?'روضة':g<=2?'الصف الأول والثاني':g<=4?'الصف الثالث والرابع':'الصف الخامس إلى الثامن';
    if(group!==lastGroup){
      lastGroup=group;
      rowsHtml+='<tr class="grade-sep"><td class="grade-label col-class">'+ group +'</td>';
      for(let p=1;p<=maxP;p++) rowsHtml+='<td></td>';
      rowsHtml+='</tr>';
      const grpBreaks=getBreaks(grade);
      let brHtml='<tr class="break-sep-row"><td class="col-class">☕ استراحات</td>';
      for(let p=1;p<=maxP;p++){
        const brk=grpBreaks.find(b=>b.after===p);
        if(brk){
          const bs=minsToTime(brk.s),be=minsToTime(brk.e);
          const dur=brk.e-brk.s;
          brHtml+='<td><span class="break-time-badge" dir="ltr">'+(dur>=20?'🕐':'☕')+' '+bs+'–'+be+'</span></td>';
        } else { brHtml+='<td></td>'; }
      }
      rowsHtml+=brHtml+'</tr>';
    }
    rowsHtml+='<tr><td class="col-class">'+cls+'</td>';
    const breaks=getBreaks(grade);
    for(let p=1;p<=maxP;p++){
      const key=cls+'__'+activeDay+'__'+p;
      const cell=idx[key];
      const isBreak=breaks.some(b=>b.after===p-1&&p>1);
      let cellClass='cell-future';
      if(isToday){ const st=getPeriodStatus(grade,p); if(st==='past') cellClass='cell-past'; else if(st==='now') cellClass='cell-now'; }
      const breakCls=isBreak?' cell-break-before':'';
      if(!cell){
        rowsHtml+='<td class="'+cellClass+' cell-vacant'+breakCls+'"><span style="font-size:16px;color:var(--text3)">—</span></td>';
      } else if(cell.vacancy_reason){
        vacancies.push({cls,period:p,reason:cell.vacancy_reason});
        rowsHtml+='<td class="'+cellClass+' cell-vacant'+ breakCls +'"><span class="vacant-pill">⚠️ '+(cell.subject||'شاغر')+'</span><span class="vacant-lbl">منصب شاغر</span></td>';
      } else {
        const subj=cell.subject||'—', tchr=cell.teacher_name||'—';
        const shortSubj=abbrevSubject(subj);
        const shortTchr=tchr.split(' ').slice(0,2).join(' ')||tchr;
        const badgeTxt=subj.includes('(AMT)')?'AMT':subj.includes('(E)')?'EMT':subj.includes('(CCDI)')?'CCDI':'';
        const sc=getColor(subj);
        const tooltip=subj+'\n'+tchr;
        rowsHtml+='<td class="'+cellClass+breakCls+'" title="'+tooltip.replace(/"/g,'')+'">';
        rowsHtml+='<span class="subject-pill" style="background:'+sc.bg+';color:'+sc.t+'">'+shortSubj+(badgeTxt?'<br><span class="cell-badge">'+badgeTxt+'</span>':'') +'</span>';
        rowsHtml+='<span class="cell-teacher">'+shortTchr+'</span>';
        if(isToday&&getPeriodStatus(grade,p)==='now') rowsHtml+='<span class="now-star">⭐ الآن</span>';
        rowsHtml+='</td>';
      }
    }
    rowsHtml+='</tr>';
  });
  tbody.innerHTML=headerHtml+rowsHtml;
  const vCount=document.getElementById('vacancyCount');
  const vBar=document.getElementById('vacancyBar');
  if(vacancies.length>0){
    vCount.textContent='⚠️ '+vacancies.length+' شاغر في هذا اليوم';
    vBar.className='vacancy-bar show';
    vBar.innerHTML='⚠️ <strong>'+vacancies.length+' حصة شاغرة:</strong> '+vacancies.map(v=>v.cls+' ح'+toArabicNum(v.period)).join(' · ');
  } else {
    vCount.textContent=''; vBar.className='vacancy-bar';
  }
}
</script>
</body>
</html>
