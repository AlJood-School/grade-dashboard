<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جدول المدرسة الشامل — بوابة الجود</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<script src="../platform-auth-guard.js"></script>
<script src="../platform-week.js"></script>
<script src="../platform-lang.js"></script>
<script src="../platform-shield.js" defer></script>
<style>
:root{
  --bg:#F0F4F8;--surface:#fff;--border:#E2E8F0;
  --brand:#6C3DD6;--brand2:#22D3EE;
  --text:#1E293B;--text2:#64748B;--text3:#94A3B8;
  --green:#059669;--red:#DC2626;--amber:#D97706;
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* هيدر */
.hdr{background:linear-gradient(135deg,#6C3DD6,#22D3EE);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(108,61,214,.3)}
.hdr-logo{width:44px;height:44px;background:rgba(255,255,255,.18);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.hdr-title{font-size:18px;font-weight:900;color:#fff}
.hdr-meta{font-size:12px;color:rgba(255,255,255,.75)}
.hdr-time{font-size:20px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.hdr-back{background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700}
.hdr-back:hover{background:rgba(255,255,255,.25)}
#header-tools{display:flex;align-items:center;gap:6px;margin-right:auto}

/* تبويبات الأيام */
.day-tabs{display:flex;gap:4px;padding:12px 24px 0;background:var(--bg);overflow-x:auto}
.day-tab{padding:7px 18px;border-radius:20px 20px 0 0;border:1.5px solid var(--border);border-bottom:none;background:var(--surface);color:var(--text2);font-family:inherit;font-size:13px;cursor:pointer;font-weight:600;transition:.15s;white-space:nowrap;flex-shrink:0}
.day-tab:hover{color:var(--brand);border-color:var(--brand)}
.day-tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.day-tab.today-tab{border-color:var(--brand2);color:var(--brand2)}
.day-tab.today-tab.active{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent}

/* شريط الفلاتر */
.filter-wrap{background:var(--surface);border-bottom:2px solid var(--border);padding:12px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search-box{display:flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:6px 12px;flex:1;min-width:180px;max-width:300px}
.search-box input{border:none;background:transparent;font-family:inherit;font-size:13px;color:var(--text);outline:none;width:100%}
.search-box input::placeholder{color:var(--text3)}
.filter-select{border:1.5px solid var(--border);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:12px;color:var(--text2);background:var(--bg);cursor:pointer;font-weight:600;outline:none;min-width:110px}
.filter-select:focus{border-color:var(--brand)}
.view-toggle{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;margin-right:auto}
.view-btn{padding:7px 16px;border:none;background:var(--bg);color:var(--text2);font-family:inherit;font-size:12px;cursor:pointer;font-weight:700;transition:.15s}
.view-btn:hover{background:#EDE9FE;color:var(--brand)}
.view-btn.active{background:var(--brand);color:#fff}
.results-count{font-size:12px;color:var(--text3);white-space:nowrap;font-weight:600}

/* شريط الشواغر */
.vacancy-bar{margin:8px 24px;background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 16px;font-size:13px;color:var(--red);font-weight:700;display:none}
.vacancy-bar.show{display:block}

/* وضع القائمة */
.list-wrap{padding:16px 24px 60px;overflow-x:auto}
.list-tbl{width:100%;border-collapse:separate;border-spacing:0 4px;min-width:600px}
.list-tbl thead th{background:#EDE9FE;color:var(--brand);font-size:12px;font-weight:900;padding:11px 16px;text-align:right;position:sticky;top:0;z-index:10;border-bottom:2px solid rgba(108,61,214,.15)}
.list-tbl thead th:first-child{border-radius:8px 0 0 8px}
.list-tbl thead th:last-child{border-radius:0 8px 8px 0;text-align:center}
.list-tbl tbody tr td{background:var(--surface);padding:11px 16px;font-size:13px;border-bottom:1px solid #F1F5F9;vertical-align:middle;transition:.1s}
.list-tbl tbody tr:hover td{background:#F8F5FF}
.list-tbl tbody tr.now-row td{background:rgba(108,61,214,.05)}
.list-tbl tbody tr.now-row td:first-child{border-right:3px solid var(--brand)}
.list-tbl tbody tr.vacant-row td{background:#FEF9F9}
.list-tbl tbody tr.vacant-row td:first-child{border-right:3px solid var(--red)}
.list-tbl tbody td:first-child{border-radius:8px 0 0 8px;font-weight:900;font-size:15px;color:var(--brand)}
.list-tbl tbody td:last-child{border-radius:0 8px 8px 0;text-align:center}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800}
.s-now{background:#EDE9FE;color:var(--brand)}
.s-ok{background:#DCFCE7;color:#166534}
.s-vacant{background:#FEF2F2;color:var(--red)}
.s-past{background:#F1F5F9;color:var(--text3)}
.s-future{background:#F0F9FF;color:#0369A1}
.period-cell{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.period-num{display:inline-block;background:#EDE9FE;color:var(--brand);border-radius:6px;padding:2px 10px;font-size:13px;font-weight:900}
.period-time{font-size:10px;color:var(--text3)}
.subj-pill{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:800}
.tchr-main{font-size:13px;color:var(--text);font-weight:700}
.tchr-full{font-size:10px;color:var(--text3);display:block;margin-top:1px}
.no-data{text-align:center;padding:56px;color:var(--text3);font-size:14px}
.grade-group-hdr td{background:linear-gradient(to left,#F8F5FF,#F0F4F8);font-weight:900;font-size:11px;color:var(--brand2);padding:6px 16px;border-radius:6px;letter-spacing:.5px}

/* وضع الجدول */
.tbl-wrap{overflow-x:auto;padding:16px 24px 60px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.master-tbl{border-collapse:separate;border-spacing:3px;min-width:max-content}
.master-tbl th{background:#EDE9FE;color:var(--brand);font-size:11px;font-weight:900;padding:10px;white-space:nowrap;border-radius:8px;text-align:center;position:sticky;top:0;z-index:10;letter-spacing:.3px;border:1px solid rgba(108,61,214,.12)}
.master-tbl th.col-class{position:sticky;right:0;z-index:20;background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;font-size:13px;min-width:68px;border:none;font-weight:900}
.master-tbl th.now-col{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;box-shadow:0 0 16px rgba(108,61,214,.35);border:none}
.master-tbl th .th-time{display:block;font-size:9px;color:var(--text3);font-weight:400;margin-top:2px}
.master-tbl th.now-col .th-time{color:rgba(255,255,255,.7)}
.master-tbl th.now-col .th-now-badge{display:inline-block;background:#22d3ee;color:#0f172a;font-size:8px;font-weight:900;padding:1px 6px;border-radius:10px;margin-top:4px}
.master-tbl td{background:var(--surface);border-radius:8px;padding:8px 6px;text-align:center;vertical-align:middle;min-width:120px;max-width:140px;transition:.1s;border:1px solid var(--border)}
.master-tbl td:hover{background:#F8F5FF;border-color:rgba(108,61,214,.2)}
.master-tbl td.col-class{position:sticky;right:0;z-index:5;background:linear-gradient(135deg,#EDE9FE,#ddd6fe);color:var(--brand);font-weight:900;font-size:14px;min-width:68px;max-width:68px;border-radius:8px;border:1px solid rgba(108,61,214,.2);letter-spacing:.5px}
.master-tbl td.cell-past{opacity:.45;background:#F8FAFC}
.master-tbl td.cell-now{background:rgba(108,61,214,.07);border:2px solid var(--brand);box-shadow:0 0 12px rgba(108,61,214,.15)}
.master-tbl td.cell-vacant{background:#FEF2F2;border:1px dashed #FECACA}
.master-tbl td.cell-break-before{border-right:3px solid #FDE68A !important}
.subject-pill{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800;line-height:1.3;max-width:120px;white-space:normal;word-break:break-word;text-align:center}
.cell-teacher{font-size:10px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:118px;display:block}
.vacant-pill{display:inline-block;background:#FEF3C7;color:#92400E;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700}
.vacant-lbl{display:block;font-size:10px;color:var(--amber);margin-top:2px}
.grade-sep td{background:transparent !important;border:none !important;padding:8px 0 2px !important}
.grade-label{font-size:11px;color:var(--brand2);font-weight:900;text-align:right;padding-right:4px;letter-spacing:.5px}
.grade-sep td:not(.grade-label){border-bottom:2px solid rgba(34,211,238,.2) !important;height:14px !important}
.break-sep-row td{background:#FFFBEB;font-size:10px;color:#92400E;padding:4px;text-align:center;font-weight:700;border:1px solid #FDE68A}
.break-sep-row .col-class{background:#FEF3C7 !important;color:var(--amber) !important;font-size:10px;font-weight:700}

/* تحميل */
.loading-overlay{position:fixed;inset:0;background:rgba(240,244,248,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999;backdrop-filter:blur(4px)}
.spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){
  .filter-wrap{padding:10px 12px;gap:6px}
  .list-wrap,.tbl-wrap{padding:10px 8px 60px}
  .search-box{min-width:140px}
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadOverlay">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:14px">جارٍ تحميل جدول المدرسة…</div>
</div>

<div class="hdr">
  <div class="hdr-logo">📅</div>
  <div style="flex:1">
    <div class="hdr-title">جدول المدرسة الشامل</div>
    <div class="hdr-meta" id="hdrMeta">—</div>
  </div>
  <div class="hdr-time" id="hdrTime">—</div>
  <div id="header-tools"></div>
  <button class="hdr-back" onclick="history.back()">↩ رجوع</button>
</div>

<div class="day-tabs" id="dayTabs"></div>

<div class="filter-wrap">
  <div class="search-box">
    <span style="color:var(--text3);font-size:14px">🔍</span>
    <input type="text" id="searchInput" placeholder="ابحث عن معلمة أو مادة أو شعبة…" oninput="applyFilters()">
  </div>
  <select class="filter-select" id="gradeFilter" onchange="applyFilters()">
    <option value="all">كل المراحل</option>
    <option value="KG">روضة</option>
    <option value="G1-G2">١ – ٢</option>
    <option value="G3-G4">٣ – ٤</option>
    <option value="G5-G8">٥ – ٨</option>
  </select>
  <select class="filter-select" id="subjectFilter" onchange="applyFilters()">
    <option value="all">كل المواد</option>
  </select>
  <select class="filter-select" id="statusFilter" onchange="applyFilters()">
    <option value="all">كل الحالات</option>
    <option value="assigned">معيّن</option>
    <option value="vacant">شاغر</option>
    <option value="now">الحصة الحالية</option>
  </select>
  <div class="view-toggle">
    <button class="view-btn" id="btnList" onclick="setView('list')">☰ قائمة</button>
    <button class="view-btn active" id="btnGrid" onclick="setView('grid')">⊞ جدول</button>
  </div>
  <span class="results-count" id="resultsCount"></span>
</div>

<div class="vacancy-bar" id="vacancyBar"></div>

<!-- وضع القائمة -->
<div id="listView" class="list-wrap" style="display:none">
  <table class="list-tbl">
    <thead>
      <tr>
        <th style="min-width:70px">الصف</th>
        <th style="min-width:100px">الحصة</th>
        <th style="min-width:150px">المادة</th>
        <th style="min-width:160px">المعلمة</th>
        <th style="min-width:110px;text-align:center">الحالة</th>
      </tr>
    </thead>
    <tbody id="listBody"></tbody>
  </table>
</div>

<!-- وضع الجدول -->
<div id="gridView" class="tbl-wrap">
  <table class="master-tbl">
    <tbody id="masterBody"></tbody>
  </table>
</div>

<script>
const SB_URL = window.EduOS?.SB_URL || 'https://zuyizaiugpmhmeycqton.supabase.co';
const SB_KEY = window.EduOS?.SB_KEY || '';
const DAYS_ORDER = ['الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];

const SUBJ_COLORS = [
  {k:['رياضيات'],bg:'#EDE9FE',t:'#5B21B6'},
  {k:['علوم'],bg:'#DCFCE7',t:'#166534'},
  {k:['عربي','لغة عربية','مجال عرب'],bg:'#FEF9C3',t:'#713F12'},
  {k:['إنجليز','english'],bg:'#DBEAFE',t:'#1E3A8A'},
  {k:['إسلام','تربية إسلام'],bg:'#FEF3C7',t:'#78350F'},
  {k:['دراسات','اجتماع'],bg:'#FCE7F3',t:'#831843'},
  {k:['فنون','رسم'],bg:'#FFF7ED',t:'#9A3412'},
  {k:['تربية بدني','بدني'],bg:'#D1FAE5',t:'#065F46'},
  {k:['موسيق'],bg:'#F3E8FF',t:'#6B21A8'},
  {k:['ذكاء اصطناعي','ccdi'],bg:'#E0F2FE',t:'#0C4A6E'},
  {k:['حوسبة','تقني'],bg:'#CFFAFE',t:'#164E63'},
  {k:['جيوجيتسو'],bg:'#FEE2E2',t:'#991B1B'},
  {k:['amt','emt'],bg:'#F3E8FF',t:'#5B21B6'},
];
function getColor(s){
  if(!s) return {bg:'#F1F5F9',t:'#475569'};
  const sl=s.toLowerCase();
  for(const c of SUBJ_COLORS){for(const k of c.k){if(sl.includes(k)) return {bg:c.bg,t:c.t};}}
  return {bg:'#F1F5F9',t:'#475569'};
}
function getPeriodTime(grade,period){
  const g=parseInt((grade||'').replace(/\D/g,''))||1;
  if(g<=2){
    const t=[null,{s:430,e:475},{s:480,e:525},{s:550,e:595},{s:600,e:645},{s:650,e:695},{s:710,e:755},{s:760,e:805}];
    return t[period]||null;
  } else if(g<=4){
    const t=[null,{s:430,e:475},{s:480,e:525},{s:530,e:575},{s:600,e:645},{s:650,e:695},{s:710,e:755},{s:760,e:805}];
    return t[period]||null;
  } else {
    const t=[null,{s:480,e:525},{s:530,e:575},{s:600,e:645},{s:650,e:695},{s:695,e:740},{s:740,e:785},{s:795,e:840},{s:840,e:885}];
    return t[period]||null;
  }
}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function getPeriodStatus(grade,p){
  const t=getPeriodTime(grade,p);if(!t) return 'future';
  const n=nowMin();return n<t.s?'future':n>t.e?'past':'now';
}
function minsToTime(m){const h=Math.floor(m/60),mm=m%60;return h+':'+(mm<10?'0':'')+mm;}
function getBreaks(grade){
  const g=parseInt((grade||'').replace(/\D/g,''))||1;
  if(g<=2) return [{after:2,s:525,e:550},{after:5,s:695,e:710}];
  if(g<=4) return [{after:3,s:575,e:600},{after:5,s:695,e:710}];
  return [{after:2,s:575,e:600},{after:6,s:785,e:795}];
}
function abbrevSubject(s){
  if(!s) return '—';
  if(s.includes('جيوجيتسو')) return 'جيوجيتسو';
  if(s.includes('ذكاء اصطناعي')||s.includes('CCDI')) return 'ذكاء اصطناعي';
  if(s.includes('فنون وموسيقى')) return 'فنون / موسيقى';
  if(s.includes('فنون بصرية')||s==='فنون') return 'فنون';
  if(s.includes('موسيقى')) return 'موسيقى';
  if(s.includes('تربية بدنية')) return 'بدنية';
  if(s.includes('دراسات اجتماعية')) return 'دراسات';
  if(s.includes('تربية إسلامية')&&!s.includes('عربي')) return 'إسلامية';
  if(s.includes('رياضيات')&&s.includes('علوم')&&s.includes('إنجليز')) return 'AMT';
  if(s.includes('لغة عربية')||s==='عربي') return 'عربي';
  if(s.includes('إنجليز')&&!s.includes('رياضيات')) return 'إنجليزي';
  return s.length>20?s.slice(0,18)+'…':s;
}
function toArabicNum(n){return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function gradeNum(grade){
  if(!grade) return 1;
  if(grade==='KG1'||grade==='KG2') return 0;
  return parseInt(grade.replace(/\D/g,''))||1;
}
function sortClass(cls){
  if(!cls) return 999;
  if(cls.startsWith('KG')){const n=cls.startsWith('KG1')?0:10;return n+cls.charCodeAt(cls.length-1);}
  const m=cls.match(/^(\d+)([A-Z])/);
  if(m) return parseInt(m[1])*100+m[2].charCodeAt(0);
  return 999;
}
function gradeGroup(g){
  if(g===0) return 'روضة';
  if(g<=2) return 'الصف الأول والثاني';
  if(g<=4) return 'الصف الثالث والرابع';
  return 'الصف الخامس إلى الثامن';
}

let allSchedule=[],allClasses=[],activeDay='',todayAr='',currentView='grid';

document.addEventListener('DOMContentLoaded',async()=>{
  updateClock(); setInterval(updateClock,30000);
  setTodayAr(); buildDayTabs();
  await loadSchedule();
  buildSubjectFilter();
  applyFilters();
  document.getElementById('loadOverlay').style.display='none';
});

function setTodayAr(){
  const d=new Date().getDay();
  const map={0:'الأحد',1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس',5:'الجمعة',6:'السبت'};
  todayAr=map[d]||'';
  activeDay=DAYS_ORDER.includes(todayAr)?todayAr:'الاثنين';
}
function updateClock(){
  const now=new Date();
  document.getElementById('hdrTime').textContent=now.toLocaleTimeString('ar-AE',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('hdrMeta').textContent=now.toLocaleDateString('ar-AE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
function buildDayTabs(){
  const tabs=document.getElementById('dayTabs');
  tabs.innerHTML=DAYS_ORDER.map(day=>{
    const isToday=day===todayAr;
    return '<button class="day-tab'+(isToday?' today-tab':'')+' '+(day===activeDay?' active':'')
      +'" onclick="selectDay(\''+day+'\',this)">'+day+(isToday?' 📍':'')+'</button>';
  }).join('');
}
function selectDay(day,btn){
  activeDay=day;
  document.querySelectorAll('.day-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}
function setView(v){
  currentView=v;
  document.getElementById('listView').style.display=v==='list'?'block':'none';
  document.getElementById('gridView').style.display=v==='grid'?'block':'none';
  document.getElementById('btnList').classList.toggle('active',v==='list');
  document.getElementById('btnGrid').classList.toggle('active',v==='grid');
  applyFilters();
}
async function loadSchedule(){
  try{
    const res=await fetch(SB_URL+'/rest/v1/schedules?select=class_name,subject,teacher_name,period,day,grade,vacancy_reason,is_active&is_active=eq.true&order=class_name,period',
      {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    const data=await res.json();
    allSchedule=Array.isArray(data)?data:[];
    const classSet={};
    allSchedule.forEach(r=>{if(r.class_name) classSet[r.class_name]=r.grade||'';});
    allClasses=Object.entries(classSet).map(([c,g])=>({cls:c,grade:g})).sort((a,b)=>sortClass(a.cls)-sortClass(b.cls));
  }catch(e){console.error(e);}
}
function buildSubjectFilter(){
  const subjects=new Set();
  allSchedule.forEach(r=>{if(r.subject&&r.subject.trim()) subjects.add(r.subject.trim());});
  const sel=document.getElementById('subjectFilter');
  [...subjects].sort().forEach(s=>{
    const opt=document.createElement('option');
    opt.value=s; opt.textContent=abbrevSubject(s);
    sel.appendChild(opt);
  });
}
function getFilteredClasses(){
  const gf=document.getElementById('gradeFilter').value;
  return allClasses.filter(c=>{
    const g=gradeNum(c.grade);
    if(gf==='KG') return g===0;
    if(gf==='G1-G2') return g===1||g===2;
    if(gf==='G3-G4') return g===3||g===4;
    if(gf==='G5-G8') return g>=5&&g<=8;
    return true;
  });
}
function updateVacancyBar(vacancies){
  const vBar=document.getElementById('vacancyBar');
  if(vacancies.length>0){
    vBar.className='vacancy-bar show';
    vBar.innerHTML='⚠️ <strong>'+vacancies.length+' حصة شاغرة اليوم:</strong> '+vacancies.map(v=>v.cls+' ح'+toArabicNum(v.p)).join(' · ');
  } else {
    vBar.className='vacancy-bar';
  }
}

/* وضع القائمة */
function renderList(){
  const tbody=document.getElementById('listBody');
  const isFriday=(activeDay==='الجمعة');
  const isToday=(activeDay===todayAr);
  const search=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  const sf=document.getElementById('subjectFilter').value;
  const statusF=document.getElementById('statusFilter').value;
  const classes=getFilteredClasses();
  const maxP=isFriday?4:8;
  const idx={};
  allSchedule.forEach(r=>{const key=(r.class_name||'')+'__'+(r.day||'')+'__'+(r.period||'');idx[key]=r;});

  let rows=[];
  classes.forEach(({cls,grade})=>{
    for(let p=1;p<=maxP;p++){
      const key=cls+'__'+activeDay+'__'+p;
      const cell=idx[key];
      const subj=cell?(cell.subject||''):'';
      const tchr=cell?(cell.teacher_name||''):'';
      const isVacant=!cell||!!cell.vacancy_reason;
      const status=isToday?getPeriodStatus(grade,p):'assigned';
      if(sf!=='all'&&(!cell||cell.subject!==sf)) continue;
      if(statusF==='assigned'&&isVacant) continue;
      if(statusF==='vacant'&&!isVacant) continue;
      if(statusF==='now'&&status!=='now') continue;
      if(search){
        const hay=(cls+' '+(subj||'')+' '+(tchr||'')).toLowerCase();
        if(!hay.includes(search)) continue;
      }
      const t=getPeriodTime(grade,p);
      const timeStr=t?minsToTime(t.s)+'–'+minsToTime(t.e):'—';
      rows.push({cls,grade,p,subj:subj||'',tchr:tchr||'',isVacant,status,timeStr});
    }
  });

  const vacancies=rows.filter(r=>r.isVacant);
  updateVacancyBar(vacancies);
  document.getElementById('resultsCount').textContent=rows.length+' حصة';

  if(rows.length===0){
    tbody.innerHTML='<tr><td colspan="5" class="no-data">🔍 لا توجد نتائج مطابقة</td></tr>';
    return;
  }

  let html='',lastGroup='';
  rows.forEach(r=>{
    const gn=gradeNum(r.grade);
    const grp=gradeGroup(gn);
    if(grp!==lastGroup){
      lastGroup=grp;
      html+='<tr class="grade-group-hdr"><td colspan="5">'+grp+'</td></tr>';
    }
    const sc=getColor(r.subj);
    const shortSubj=abbrevSubject(r.subj)||'—';
    const nameParts=(r.tchr||'').split(' ');
    const shortTchr=nameParts.slice(0,2).join(' ')||'—';
    const fullTchr=nameParts.length>2?r.tchr:'';
    let statusBadge='';
    if(r.isVacant) statusBadge='<span class="status-badge s-vacant">⚠️ شاغر</span>';
    else if(r.status==='now') statusBadge='<span class="status-badge s-now">⭐ الآن</span>';
    else if(r.status==='past') statusBadge='<span class="status-badge s-past">✓ انتهت</span>';
    else if(r.status==='future') statusBadge='<span class="status-badge s-future">○ قادمة</span>';
    else statusBadge='<span class="status-badge s-ok">✓ معيّن</span>';
    const rowClass=r.isVacant?'vacant-row':r.status==='now'?'now-row':'';
    html+='<tr class="'+rowClass+'">'
      +'<td>'+r.cls+'</td>'
      +'<td><div class="period-cell"><span class="period-num">ح'+toArabicNum(r.p)+'</span><span class="period-time">'+r.timeStr+'</span></div></td>'
      +'<td>'+(r.isVacant?'<span style="color:var(--text3)">—</span>':'<span class="subj-pill" style="background:'+sc.bg+';color:'+sc.t+'">'+shortSubj+'</span>')+'</td>'
      +'<td><span class="tchr-main">'+shortTchr+'</span>'+(fullTchr?'<span class="tchr-full">'+fullTchr+'</span>':'')+'</td>'
      +'<td>'+statusBadge+'</td>'
      +'</tr>';
  });
  tbody.innerHTML=html;
}

/* وضع الجدول */
function renderGrid(){
  const tbody=document.getElementById('masterBody');
  const isFriday=(activeDay==='الجمعة');
  const isToday=(activeDay===todayAr);
  const classes=getFilteredClasses();
  const sf=document.getElementById('subjectFilter').value;
  const idx={};
  allSchedule.forEach(r=>{const key=(r.class_name||'')+'__'+(r.day||'')+'__'+(r.period||'');idx[key]=r;});
  const maxP=isFriday?4:8;

  let headerHtml='<tr><th class="col-class">الصف</th>';
  for(let p=1;p<=maxP;p++){
    let colClass='',isNow=false;
    if(isToday){const st=getPeriodStatus('G3',p);if(st==='now'){colClass=' now-col';isNow=true;}}
    const t=getPeriodTime('G3',p);
    const timeStr=t?minsToTime(t.s)+'–'+minsToTime(t.e):'';
    headerHtml+='<th class="'+colClass.trim()+'">ح'+toArabicNum(p)+'<span class="th-time">'+timeStr+'</span>';
    if(isNow) headerHtml+='<span class="th-now-badge">الآن</span>';
    headerHtml+='</th>';
  }
  headerHtml+='</tr>';

  let rowsHtml='',lastGroup='',vacancies=[];
  classes.forEach(({cls,grade})=>{
    const gn=gradeNum(grade);
    const grp=gradeGroup(gn);
    if(grp!==lastGroup){
      lastGroup=grp;
      rowsHtml+='<tr class="grade-sep"><td class="grade-label col-class">'+grp+'</td>';
      for(let p=1;p<=maxP;p++) rowsHtml+='<td></td>';
      rowsHtml+='</tr>';
      const grpBreaks=getBreaks(grade);
      const breakSummary=grpBreaks.map(b=>{
        const dur=b.e-b.s;
        return (dur>=20?'🕐':'☕')+' ح'+toArabicNum(b.after)+' ← '+minsToTime(b.s)+'–'+minsToTime(b.e)+' ('+dur+'د)';
      }).join('  |  ');
      rowsHtml+='<tr class="break-sep-row"><td class="col-class">☕</td><td colspan="'+maxP+'" style="text-align:right;padding:5px 12px;font-size:.75rem;direction:rtl">'+breakSummary+'</td></tr>';
    }
    rowsHtml+='<tr><td class="col-class">'+cls+'</td>';
    const breaks=getBreaks(grade);
    for(let p=1;p<=maxP;p++){
      const key=cls+'__'+activeDay+'__'+p;
      const cell=idx[key];
      if(sf!=='all'&&(!cell||cell.subject!==sf)){
        rowsHtml+='<td style="background:#F8FAFC;opacity:.4"><span style="color:var(--text3)">—</span></td>';
        continue;
      }
      const isBreak=breaks.some(b=>b.after===p-1&&p>1);
      let cellClass='cell-future';
      if(isToday){const st=getPeriodStatus(grade,p);if(st==='past') cellClass='cell-past';else if(st==='now') cellClass='cell-now';}
      const breakCls=isBreak?' cell-break-before':'';
      if(!cell){
        rowsHtml+='<td class="'+cellClass+' cell-vacant'+breakCls+'"><span style="font-size:16px;color:var(--text3)">—</span></td>';
      } else if(cell.vacancy_reason){
        vacancies.push({cls,p});
        rowsHtml+='<td class="'+cellClass+' cell-vacant'+breakCls+'"><span class="vacant-pill">⚠️ '+(cell.subject||'شاغر')+'</span><span class="vacant-lbl">شاغر</span></td>';
      } else {
        const subj=cell.subject||'—',tchr=cell.teacher_name||'—';
        const shortSubj=abbrevSubject(subj);
        const shortTchr=tchr.split(' ').slice(0,2).join(' ')||tchr;
        const sc=getColor(subj);
        rowsHtml+='<td class="'+cellClass+breakCls+'" title="'+subj+'&#10;'+tchr+'">';
        rowsHtml+='<span class="subject-pill" style="background:'+sc.bg+';color:'+sc.t+'">'+shortSubj+'</span>';
        rowsHtml+='<span class="cell-teacher">'+shortTchr+'</span>';
        if(isToday&&getPeriodStatus(grade,p)==='now') rowsHtml+='<span style="font-size:10px;color:var(--brand);display:block;margin-top:2px">⭐ الآن</span>';
        rowsHtml+='</td>';
      }
    }
    rowsHtml+='</tr>';
  });
  tbody.innerHTML=headerHtml+rowsHtml;
  document.getElementById('resultsCount').textContent=classes.length+' صف';
  updateVacancyBar(vacancies);
}

function applyFilters(){
  if(currentView==='list') renderList();
  else renderGrid();
}
</script>
