<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة المدرسة — بوابة الجود</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../platform-config.js"></script>
<script src="../platform-auth-guard.js"></script>
<script src="../platform-lang.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tajawal,Arial,sans-serif;background:#F1F5F9;color:#1E293B;min-height:100vh;font-size:15px}
.header{background:linear-gradient(135deg,#6C3DD6,#22D3EE);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(108,61,214,0.3)}
.header-icon{width:44px;height:44px;background:rgba(255,255,255,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.header-title{font-size:20px;font-weight:900;color:#fff}
.header-sub{font-size:13px;color:rgba(255,255,255,0.8)}
.header-right{margin-right:auto;display:flex;align-items:center;gap:10px}
.back-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;padding:8px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s}
.back-btn:hover{background:rgba(255,255,255,0.35)}
.nav-tabs{display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:2px solid #E2E8F0;overflow-x:auto;position:sticky;top:72px;z-index:99;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.nav-tab{padding:14px 18px;background:transparent;border:none;color:#64748B;font-family:Tajawal,Arial,sans-serif;font-size:14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;margin-bottom:-2px}
.nav-tab.active{color:#6C3DD6;border-bottom-color:#6C3DD6}
.nav-tab:hover{color:#1E293B}
.main{padding:24px;max-width:1200px;margin:0 auto}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:#fff;border-radius:14px;padding:18px;text-align:center;border:1px solid #E2E8F0;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.kpi-num{font-size:32px;font-weight:900;margin-bottom:4px}
.kpi-label{font-size:13px;color:#64748B;font-weight:600}
.card{background:#fff;border-radius:16px;padding:20px;border:1px solid #E2E8F0;margin-bottom:20px;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.card-title{font-size:16px;font-weight:800;color:#1E293B;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input,.search-bar select{flex:1;min-width:140px;background:#F8FAFC;border:1.5px solid #E2E8F0;color:#1E293B;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px}
.search-bar input:focus,.search-bar select:focus{outline:none;border-color:#6C3DD6}
.btn{padding:10px 20px;border:none;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff}
.btn-success{background:#059669;color:#fff}
.btn-warning{background:#D97706;color:#fff}
.btn-danger{background:#DC2626;color:#fff}
.btn-sm{padding:6px 12px;font-size:13px}
.btn:hover{opacity:.85}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#F8FAFC;padding:10px 12px;text-align:right;color:#64748B;font-weight:700;font-size:13px;border-bottom:2px solid #E2E8F0}
td{padding:10px 12px;border-bottom:1px solid #F1F5F9;color:#1E293B}
tr:hover td{background:#F8FAFC}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-green{background:#ECFDF5;color:#059669}
.badge-red{background:#FEF2F2;color:#DC2626}
.badge-yellow{background:#FFFBEB;color:#D97706}
.badge-blue{background:#EFF6FF;color:#2563EB}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:28px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto;border:1px solid #E2E8F0;box-shadow:0 8px 40px rgba(0,0,0,0.15)}
.modal-title{font-size:18px;font-weight:800;margin-bottom:20px;color:#1E293B}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:700;color:#64748B;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:#F8FAFC;border:1.5px solid #E2E8F0;color:#1E293B;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#6C3DD6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.empty{text-align:center;padding:48px 24px;color:#94A3B8}
.empty .icon{font-size:48px;margin-bottom:12px}
.panel{display:none}
.panel.active{display:block}
.overdue-alert{background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:14px 16px;margin-bottom:16px;color:#DC2626;font-size:14px;font-weight:700}
.field-select{width:100%;background:#F8FAFC;border:1.5px solid #E2E8F0;color:#1E293B;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px}
.field-select:focus{outline:none;border-color:#6C3DD6}
.field-input{width:100%;background:#F8FAFC;border:1.5px solid #E2E8F0;color:#1E293B;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px}
.field-input:focus{outline:none;border-color:#6C3DD6}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">📚</div>
  <div>
    <div class="header-title">مكتبة المدرسة</div>
    <div class="header-sub">بوابة الجود الذكية</div>
  </div>
  <div class="header-right">
    <span id="headerUser" style="font-size:13px;color:rgba(255,255,255,0.9);font-weight:600"></span>
    <button class="back-btn" onclick="goBack()">← رجوع</button>
  </div>
</div>

<div class="nav-tabs">
  <button class="nav-tab active" onclick="showPanel('dashboard')">🏠 لوحة التحكم</button>
  <button class="nav-tab" onclick="showPanel('catalog')">📖 كتالوج الكتب</button>
  <button class="nav-tab" onclick="showPanel('borrow')">📤 استعارة جديدة</button>
  <button class="nav-tab" onclick="showPanel('history')">📋 سجل الإعارات</button>
  <button class="nav-tab" onclick="showPanel('overdue')">⚠️ المتأخرات</button>
</div>

<div class="main">

  <!-- لوحة التحكم -->
  <div class="panel active" id="panel-dashboard">
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-num" style="color:#6C3DD6" id="kpi-books">—</div><div class="kpi-label">📚 إجمالي الكتب</div></div>
      <div class="kpi-card"><div class="kpi-num" style="color:#059669" id="kpi-available">—</div><div class="kpi-label">✅ متاح للإعارة</div></div>
      <div class="kpi-card"><div class="kpi-num" style="color:#D97706" id="kpi-borrowed">—</div><div class="kpi-label">📤 مُعار الآن</div></div>
      <div class="kpi-card"><div class="kpi-num" style="color:#DC2626" id="kpi-overdue">—</div><div class="kpi-label">⚠️ متأخر الإرجاع</div></div>
    </div>
    <div class="card">
      <div class="card-title">📋 آخر الإعارات</div>
      <div id="recentBorrowings"><div class="empty"><div class="icon">⏳</div><p>جارٍ التحميل...</p></div></div>
    </div>
  </div>

  <!-- كتالوج الكتب -->
  <div class="panel" id="panel-catalog">
    <div class="card">
      <div class="card-title">📖 كتالوج الكتب</div>
      <div class="search-bar">
        <input type="text" id="bookSearch" placeholder="🔍 ابحث عن كتاب أو مؤلف..." oninput="filterBooks()">
        <select id="bookCatFilter" onchange="filterBooks()">
          <option value="">كل الفئات</option>
          <option>إسلامية</option><option>عربي</option><option>علوم</option>
          <option>رياضيات</option><option>قصص أطفال</option><option>تاريخ</option><option>أخرى</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="openAddBookModal()">+ إضافة كتاب</button>
      </div>
      <div id="catalogList"><div class="empty"><div class="icon">⏳</div><p>جارٍ التحميل...</p></div></div>
    </div>
  </div>

  <!-- استعارة جديدة -->
  <div class="panel" id="panel-borrow">
    <div class="card">
      <div class="card-title">📤 تسجيل استعارة جديدة</div>
      <div class="form-row" style="margin-bottom:14px">
        <div class="form-group">
          <label>الصف</label>
          <select id="borrowClass" onchange="loadClassStudents()" class="field-select">
            <option value="">-- اختر الصف --</option>
          </select>
        </div>
        <div class="form-group">
          <label>اسم الطالبة</label>
          <select id="borrowStudent" class="field-select">
            <option value="">-- اختر الصف أولاً --</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>عنوان الكتاب</label>
        <select id="borrowBook" class="field-select">
          <option value="">-- اختر الكتاب --</option>
        </select>
      </div>
      <div id="borrowBookManualWrap" style="display:none;margin-top:8px">
        <input type="text" id="borrowBookManual" class="field-input" placeholder="أدخل عنوان الكتاب يدوياً...">
      </div>
      <div class="form-row" style="margin-top:14px;margin-bottom:14px">
        <div class="form-group">
          <label>تاريخ الاستعارة</label>
          <input type="date" id="borrowDate" class="field-input">
        </div>
        <div class="form-group">
          <label>تاريخ الإرجاع المتوقع</label>
          <input type="date" id="dueDate" class="field-input">
        </div>
      </div>
      <div class="form-group">
        <label>ملاحظات (اختياري)</label>
        <textarea id="borrowNotes" rows="2" class="field-input" style="resize:vertical"></textarea>
      </div>
      <button class="btn btn-primary" onclick="saveBorrowing()">📤 تسجيل الاستعارة</button>
    </div>
  </div>

  <!-- سجل الإعارات -->
  <div class="panel" id="panel-history">
    <div class="card">
      <div class="card-title">📋 سجل الإعارات</div>
      <div class="search-bar">
        <input type="text" id="historySearch" placeholder="🔍 ابحث باسم الطالبة أو الكتاب..." oninput="filterHistory()">
        <select id="historyStatus" onchange="filterHistory()">
          <option value="">كل الحالات</option>
          <option value="borrowed">مُعار</option>
          <option value="returned">مُرجَع</option>
          <option value="overdue">متأخر</option>
        </select>
      </div>
      <div id="historyList"><div class="empty"><div class="icon">⏳</div><p>جارٍ التحميل...</p></div></div>
    </div>
  </div>

  <!-- المتأخرات -->
  <div class="panel" id="panel-overdue">
    <div class="card">
      <div class="card-title">⚠️ الإعارات المتأخرة</div>
      <div id="overdueList"><div class="empty"><div class="icon">⏳</div><p>جارٍ التحميل...</p></div></div>
    </div>
  </div>

</div>

<!-- Modal إضافة كتاب -->
<div class="modal-overlay" id="addBookModal">
  <div class="modal">
    <div class="modal-title">📚 إضافة كتاب جديد</div>
    <div class="form-group"><label>عنوان الكتاب *</label><input type="text" id="ab-title" class="field-input" placeholder="عنوان الكتاب"></div>
    <div class="form-group"><label>المؤلف</label><input type="text" id="ab-author" class="field-input" placeholder="اسم المؤلف"></div>
    <div class="form-row">
      <div class="form-group"><label>الفئة</label>
        <select id="ab-category" class="field-select">
          <option>إسلامية</option><option>عربي</option><option>علوم</option>
          <option>رياضيات</option><option>قصص أطفال</option><option>تاريخ</option><option>أخرى</option>
        </select>
      </div>
      <div class="form-group"><label>المرحلة</label>
        <select id="ab-grade" class="field-select">
          <option value="">كل المراحل</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>عدد النسخ الإجمالي</label><input type="number" id="ab-total" class="field-input" value="1" min="1"></div>
      <div class="form-group"><label>النسخ المتاحة</label><input type="number" id="ab-available" class="field-input" value="1" min="0"></div>
    </div>
    <div class="modal-btns">
      <button class="btn" style="background:#F1F5F9;color:#475569" onclick="closeModal('addBookModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveBook()">💾 حفظ</button>
    </div>
  </div>
</div>

<script>
var sb = null;
var allBooks = [];
var allBorrowings = [];

function goBack() {
  var u = JSON.parse(sessionStorage.getItem('edoos_user') || '{}');
  var map = { principal:'../eduos-principal/', vice_principal:'../eduos-vice-principal/', admin:'../eduos-admin/', teacher:'../eduos-teacher/' };
  window.location.href = map[u.role_key] || '../';
}

function showPanel(name) {
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('panel-' + name).classList.add('active');
  var order = ['dashboard','catalog','borrow','history','overdue'];
  var idx = order.indexOf(name);
  document.querySelectorAll('.nav-tab')[idx] && document.querySelectorAll('.nav-tab')[idx].classList.add('active');
  if (name === 'dashboard') loadDashboard();
  if (name === 'catalog') loadCatalog();
  if (name === 'borrow') initBorrowForm();
  if (name === 'history') loadHistory();
  if (name === 'overdue') loadOverdue();
}

function initSb() {
  var cfg = window.EduOS;
  if (!cfg || !cfg.SB_URL || !cfg.SB_KEY) return false;
  if (!sb) sb = window.supabase.createClient(cfg.SB_URL, cfg.SB_KEY);
  return true;
}

function init() {
  var ready = initSb();
  if (!ready) { setTimeout(init, 200); return; }
  var u = JSON.parse(sessionStorage.getItem('edoos_user') || '{}');
  document.getElementById('headerUser').textContent = u.name_ar || u.name || '';
  loadDashboard();
  loadClasses();
}

async function loadClasses() {
  if (!initSb()) return;
  try {
    var res = await sb.from('students').select('class_name').order('class_name');
    var classes = [...new Set((res.data||[]).map(function(r){return r.class_name;}).filter(Boolean))].sort();
    var sel = document.getElementById('borrowClass');
    if (!sel) return;
    classes.forEach(function(c){ var o=document.createElement('option');o.value=o.textContent=c;sel.appendChild(o); });
  } catch(e) {}
}

async function loadDashboard() {
  if (!initSb()) { setTimeout(loadDashboard, 300); return; }
  try {
    var rB = await sb.from('library_books').select('total_copies,available_copies');
    var books = rB.data || [];
    var totalBooks = books.reduce(function(s,r){return s+(r.total_copies||0);},0) || books.length;
    var availBooks = books.reduce(function(s,r){return s+(r.available_copies||0);},0);
    var rBr = await sb.from('library_borrowings').select('*').order('created_at',{ascending:false}).limit(100);
    allBorrowings = rBr.data || [];
    var today = new Date().toISOString().slice(0,10);
    var borrowed = allBorrowings.filter(function(r){return r.status==='borrowed';}).length;
    var overdue = allBorrowings.filter(function(r){return r.status==='borrowed'&&r.due_date&&r.due_date<today;}).length;
    document.getElementById('kpi-books').textContent = totalBooks;
    document.getElementById('kpi-available').textContent = availBooks;
    document.getElementById('kpi-borrowed').textContent = borrowed;
    document.getElementById('kpi-overdue').textContent = overdue;
    var recent = allBorrowings.slice(0,10);
    if (!recent.length) {
      document.getElementById('recentBorrowings').innerHTML = '<div class="empty"><div class="icon">📚</div><p>لا إعارات مسجَّلة بعد</p></div>';
      return;
    }
    document.getElementById('recentBorrowings').innerHTML = '<div class="table-wrap"><table><thead><tr><th>الطالبة</th><th>الصف</th><th>الكتاب</th><th>الاستعارة</th><th>الإرجاع</th><th>الحالة</th></tr></thead><tbody>'
      + recent.map(function(r){return '<tr><td>'+esc(r.student_name)+'</td><td>'+esc(r.class_name)+'</td><td style="font-weight:700">'+esc(r.resource_title)+'</td><td>'+(r.borrow_date||'—')+'</td><td>'+(r.due_date||'—')+'</td><td>'+statusBadge(r)+'</td></tr>';}).join('')
      + '</tbody></table></div>';
  } catch(e) { console.error(e); }
}

function statusBadge(r) {
  var today = new Date().toISOString().slice(0,10);
  if (r.status==='returned') return '<span class="badge badge-green">مُرجَع</span>';
  if (r.status==='borrowed'&&r.due_date&&r.due_date<today) return '<span class="badge badge-red">متأخر</span>';
  return '<span class="badge badge-yellow">مُعار</span>';
}

function esc(s){ return String(s||'—').replace(/</g,'&lt;'); }

async function loadCatalog() {
  if (!initSb()) { setTimeout(loadCatalog,300); return; }
  try {
    var res = await sb.from('library_books').select('*').order('title');
    allBooks = res.data || [];
    renderCatalog(allBooks);
  } catch(e) {}
}

function filterBooks() {
  var q = (document.getElementById('bookSearch').value||'').toLowerCase();
  var cat = document.getElementById('bookCatFilter').value;
  renderCatalog(allBooks.filter(function(b){
    return (!q||(b.title||'').toLowerCase().includes(q)||(b.author||'').toLowerCase().includes(q))
      && (!cat||b.category===cat);
  }));
}

function renderCatalog(books) {
  var el = document.getElementById('catalogList');
  if (!books.length) { el.innerHTML='<div class="empty"><div class="icon">📚</div><p>لا كتب مسجَّلة — أضف كتاباً للبدء</p></div>'; return; }
  el.innerHTML='<div class="table-wrap"><table><thead><tr><th>العنوان</th><th>المؤلف</th><th>الفئة</th><th>المرحلة</th><th>الإجمالي</th><th>المتاح</th></tr></thead><tbody>'
    +books.map(function(b){return '<tr><td style="font-weight:700">'+esc(b.title)+'</td><td>'+esc(b.author)+'</td><td>'+esc(b.category)+'</td><td>'+(b.grade_level?'الصف '+b.grade_level:'عام')+'</td><td>'+(b.total_copies||1)+'</td><td><span class="badge '+(b.available_copies>0?'badge-green':'badge-red')+'">'+(b.available_copies||0)+'</span></td></tr>';}).join('')
    +'</tbody></table></div>';
}

function openAddBookModal(){ document.getElementById('addBookModal').classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

async function saveBook() {
  var title=(document.getElementById('ab-title').value||'').trim();
  if (!title){alert('يرجى إدخال عنوان الكتاب');return;}
  try {
    var res=await sb.from('library_books').insert({title,author:document.getElementById('ab-author').value.trim()||null,category:document.getElementById('ab-category').value,grade_level:document.getElementById('ab-grade').value||null,total_copies:parseInt(document.getElementById('ab-total').value)||1,available_copies:parseInt(document.getElementById('ab-available').value)||1});
    if (res.error) throw res.error;
    closeModal('addBookModal');
    document.getElementById('ab-title').value='';document.getElementById('ab-author').value='';
    showToast('✅ تم إضافة الكتاب');
    loadCatalog();
  } catch(e){alert('خطأ: '+e.message);}
}

async function loadClassStudents() {
  var cls=document.getElementById('borrowClass').value;
  var sel=document.getElementById('borrowStudent');
  sel.innerHTML='<option value="">-- جارٍ التحميل... --</option>';
  if (!cls){sel.innerHTML='<option value="">-- اختر الصف أولاً --</option>';return;}
  try {
    var res=await sb.from('students').select('id,name,student_number').eq('class_name',cls).order('name');
    sel.innerHTML='<option value="">-- اختر الطالبة --</option>';
    (res.data||[]).forEach(function(s){var o=document.createElement('option');o.value=s.id;o.textContent=s.name+' ('+s.student_number+')';sel.appendChild(o);});
  } catch(e){}
}

async function initBorrowForm() {
  if (!initSb()){setTimeout(initBorrowForm,300);return;}
  var today=new Date().toISOString().slice(0,10);
  var due=new Date();due.setDate(due.getDate()+7);
  document.getElementById('borrowDate').value=today;
  document.getElementById('dueDate').value=due.toISOString().slice(0,10);
  var bookSel=document.getElementById('borrowBook');
  bookSel.innerHTML='<option value="">-- اختر الكتاب --</option>';
  try {
    var res=await sb.from('library_books').select('id,title,available_copies').order('title');
    var data=res.data||[];
    if (data.length) {
      data.forEach(function(b){var o=document.createElement('option');o.value=b.title;o.textContent=b.title+(b.available_copies>0?'':' (غير متاح)');o.disabled=(b.available_copies===0);bookSel.appendChild(o);});
      document.getElementById('borrowBookManualWrap').style.display='none';
    } else {
      bookSel.innerHTML='<option value="__manual__">أدخل عنوان الكتاب يدوياً</option>';
      document.getElementById('borrowBookManualWrap').style.display='block';
    }
  } catch(e){}
}

async function saveBorrowing() {
  var studentSel=document.getElementById('borrowStudent');
  var studentName=(studentSel.options[studentSel.selectedIndex]||{}).textContent||'';
  studentName=studentName.replace(/ \(.*\)$/,'');
  var className=document.getElementById('borrowClass').value;
  var bookVal=document.getElementById('borrowBook').value;
  var bookTitle=bookVal==='__manual__'?document.getElementById('borrowBookManual').value.trim():bookVal;
  var borrowDate=document.getElementById('borrowDate').value;
  var dueDate=document.getElementById('dueDate').value;
  var notes=document.getElementById('borrowNotes').value.trim();
  if (!studentName||studentName.includes('--')||!className||!bookTitle||!borrowDate||!dueDate){alert('يرجى إكمال جميع الحقول المطلوبة');return;}
  try {
    var res=await sb.from('library_borrowings').insert({student_name:studentName,class_name:className,resource_title:bookTitle,borrow_date:borrowDate,due_date:dueDate,notes:notes||null,status:'borrowed'});
    if (res.error) throw res.error;
    showToast('✅ تم تسجيل الاستعارة');
    document.getElementById('borrowStudent').value='';
    document.getElementById('borrowClass').value='';
    document.getElementById('borrowBook').value='';
    document.getElementById('borrowNotes').value='';
    showPanel('history');
  } catch(e){alert('خطأ: '+e.message);}
}

async function loadHistory() {
  if (!initSb()){setTimeout(loadHistory,300);return;}
  try {
    var res=await sb.from('library_borrowings').select('*').order('created_at',{ascending:false}).limit(200);
    allBorrowings=res.data||[];
    renderHistory(allBorrowings);
  } catch(e){}
}

function filterHistory() {
  var q=(document.getElementById('historySearch').value||'').toLowerCase();
  var status=document.getElementById('historyStatus').value;
  var today=new Date().toISOString().slice(0,10);
  renderHistory(allBorrowings.filter(function(r){
    var txt=!q||(r.student_name||'').toLowerCase().includes(q)||(r.resource_title||'').toLowerCase().includes(q);
    var st=true;
    if (status==='returned') st=r.status==='returned';
    else if (status==='borrowed') st=r.status==='borrowed'&&(!r.due_date||r.due_date>=today);
    else if (status==='overdue') st=r.status==='borrowed'&&r.due_date&&r.due_date<today;
    return txt&&st;
  }));
}

function renderHistory(rows) {
  var el=document.getElementById('historyList');
  if (!rows.length){el.innerHTML='<div class="empty"><div class="icon">📋</div><p>لا سجلات</p></div>';return;}
  el.innerHTML='<div class="table-wrap"><table><thead><tr><th>الطالبة</th><th>الصف</th><th>الكتاب</th><th>الاستعارة</th><th>الإرجاع المتوقع</th><th>الإرجاع الفعلي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>'
    +rows.map(function(r){return '<tr><td>'+esc(r.student_name)+'</td><td>'+esc(r.class_name)+'</td><td style="font-weight:700">'+esc(r.resource_title)+'</td><td>'+(r.borrow_date||'—')+'</td><td>'+(r.due_date||'—')+'</td><td>'+(r.return_date||'—')+'</td><td>'+statusBadge(r)+'</td><td>'+(r.status==='borrowed'?'<button class="btn btn-success btn-sm" onclick="returnBook('+r.id+')">إرجاع</button>':'—')+'</td></tr>';}).join('')
    +'</tbody></table></div>';
}

async function returnBook(id) {
  if (!confirm('تأكيد إرجاع الكتاب؟')) return;
  var today=new Date().toISOString().slice(0,10);
  try {
    var res=await sb.from('library_borrowings').update({status:'returned',return_date:today}).eq('id',id);
    if (res.error) throw res.error;
    showToast('✅ تم تسجيل الإرجاع');
    loadHistory();
  } catch(e){alert('خطأ: '+e.message);}
}

async function loadOverdue() {
  if (!initSb()){setTimeout(loadOverdue,300);return;}
  try {
    var today=new Date().toISOString().slice(0,10);
    var res=await sb.from('library_borrowings').select('*').eq('status','borrowed').lt('due_date',today).order('due_date');
    var rows=res.data||[];
    var el=document.getElementById('overdueList');
    if (!rows.length){el.innerHTML='<div class="empty"><div class="icon">✅</div><p>لا متأخرات — كل الإعارات في وقتها</p></div>';return;}
    el.innerHTML='<div class="overdue-alert">⚠️ يوجد '+rows.length+' إعارة متأخرة الإرجاع</div><div class="table-wrap"><table><thead><tr><th>الطالبة</th><th>الصف</th><th>الكتاب</th><th>تاريخ الإرجاع المتوقع</th><th>الأيام المتأخرة</th><th>إجراء</th></tr></thead><tbody>'
      +rows.map(function(r){var days=Math.floor((new Date(today)-new Date(r.due_date))/(864e5));return '<tr><td>'+esc(r.student_name)+'</td><td>'+esc(r.class_name)+'</td><td style="font-weight:700">'+esc(r.resource_title)+'</td><td style="color:#DC2626">'+r.due_date+'</td><td><span class="badge badge-red">'+days+' يوم</span></td><td><button class="btn btn-success btn-sm" onclick="returnBook('+r.id+')">إرجاع</button></td></tr>';}).join('')
      +'</tbody></table></div>';
  } catch(e){}
}

function showToast(msg) {
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E293B;color:#F8FAFC;padding:12px 24px;border-radius:12px;font-family:Tajawal,Arial,sans-serif;font-size:14px;font-weight:700;z-index:999;box-shadow:0 4px 24px rgba(0,0,0,0.2)';
  t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},3000);
}

window.addEventListener('load', init);
</script>
</body>
</html>
