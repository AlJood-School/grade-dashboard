<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة المدرسة — بوابة الجود</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<script src="../platform-auth-guard.js"></script>
<script src="../platform-lang.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tajawal,Arial,sans-serif;background:#0f172a;color:#F8FAFC;min-height:100vh;font-size:15px}
.header{background:linear-gradient(135deg,#6C3DD6,#22D3EE);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.header-icon{width:44px;height:44px;background:rgba(255,255,255,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.header-title{font-size:20px;font-weight:900;color:#fff}
.header-sub{font-size:13px;color:rgba(255,255,255,0.8)}
.header-right{margin-right:auto;display:flex;align-items:center;gap:10px}
.back-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;padding:8px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s}
.back-btn:hover{background:rgba(255,255,255,0.3)}
.nav-tabs{display:flex;gap:4px;padding:16px 24px 0;background:#0f172a;border-bottom:1px solid #1E293B;overflow-x:auto;position:sticky;top:72px;z-index:99}
.nav-tab{padding:10px 18px;background:transparent;border:none;color:#94A3B8;font-family:Tajawal,Arial,sans-serif;font-size:14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s}
.nav-tab.active{color:#22D3EE;border-bottom-color:#22D3EE}
.nav-tab:hover{color:#F8FAFC}
.main{padding:24px;max-width:1200px;margin:0 auto}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:#1E293B;border-radius:14px;padding:18px;text-align:center;border:1px solid #334155}
.kpi-num{font-size:32px;font-weight:900;margin-bottom:4px}
.kpi-label{font-size:13px;color:#94A3B8;font-weight:600}
.card{background:#1E293B;border-radius:16px;padding:20px;border:1px solid #334155;margin-bottom:20px}
.card-title{font-size:16px;font-weight:800;color:#F8FAFC;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input,.search-bar select{flex:1;min-width:140px;background:#0f172a;border:1.5px solid #334155;color:#F8FAFC;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px}
.search-bar input:focus,.search-bar select:focus{outline:none;border-color:#22D3EE}
.btn{padding:10px 20px;border:none;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff}
.btn-success{background:#059669;color:#fff}
.btn-warning{background:#D97706;color:#fff}
.btn-danger{background:#DC2626;color:#fff}
.btn-sm{padding:6px 12px;font-size:13px}
.btn:hover{opacity:.85}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#0f172a;padding:10px 12px;text-align:right;color:#94A3B8;font-weight:700;font-size:13px;border-bottom:1px solid #334155}
td{padding:10px 12px;border-bottom:1px solid #1E293B;color:#F1F5F9}
tr:hover td{background:rgba(34,211,238,0.04)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-green{background:#064E3B;color:#34D399}
.badge-red{background:#450A0A;color:#FCA5A5}
.badge-yellow{background:#451A03;color:#FCD34D}
.badge-blue{background:#0C1A4E;color:#93C5FD}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#1E293B;border-radius:16px;padding:28px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto;border:1px solid #334155}
.modal-title{font-size:18px;font-weight:800;margin-bottom:20px;color:#F8FAFC}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:700;color:#94A3B8;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:#0f172a;border:1.5px solid #334155;color:#F8FAFC;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#22D3EE}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.empty{text-align:center;padding:48px 24px;color:#64748B}
.empty .icon{font-size:48px;margin-bottom:12px}
.panel{display:none}
.panel.active{display:block}
.overdue-alert{background:#450A0A;border:1px solid #7F1D1D;border-radius:12px;padding:14px 16px;margin-bottom:16px;color:#FCA5A5;font-size:14px;font-weight:700}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">📚</div>
  <div>
    <div class="header-title">مكتبة المدرسة</div>
    <div class="header-sub" id="headerSub">بوابة الجود الذكية</div>
  </div>
  <div class="header-right">
    <span id="headerUser" style="font-size:13px;color:rgba(255,255,255,0.85);font-weight:600"></span>
    <button class="back-btn" onclick="goBack()">← رجوع</button>
  </div>
</div>

<div class="nav-tabs">
  <button class="nav-tab active" onclick="showPanel('dashboard')">🏠 لوحة التحكم</button>
  <button class="nav-tab" onclick="showPanel('catalog')">📖 كتالوج الكتب</button>
  <button class="nav-tab" onclick="showPanel('borrow')">📤 استعارة جديدة</button>
  <button class="nav-tab" onclick="showPanel('history')">📋 سجل الإعارات</button>
  <button class="nav-tab" onclick="showPanel('overdue')">⚠️ المتأخرات</button>
</div>

<div class="main">

  <!-- لوحة التحكم -->
  <div class="panel active" id="panel-dashboard">
    <div class="kpi-grid" id="kpiGrid">
      <div class="kpi-card"><div class="kpi-num" style="color:#22D3EE" id="kpi-books">—</div><div class="kpi-label">📚 إجمالي الكتب</div></div>
      <div class="kpi-card"><div class="kpi-num" style="color:#34D399" id="kpi-available">—</div><div class="kpi-label">✅ متاح للإعارة</div></div>
      <div class="kpi-card"><div class="kpi-num" style="color:#FBBF24" id="kpi-borrowed">—</div><div class="kpi-label">📤 مُعار الآن</div></div>
      <div class="kpi-card"><div class="kpi-num" style="color:#F87171" id="kpi-overdue">—</div><div class="kpi-label">⚠️ متأخر الإرجاع</div></div>
    </div>
    <div class="card">
      <div class="card-title">📋 آخر الإعارات</div>
      <div id="recentBorrowings"><div class="empty"><div class="icon">⏳</div><p>جارٍ التحميل...</p></div></div>
    </div>
  </div>

  <!-- كتالوج الكتب -->
  <div class="panel" id="panel-catalog">
    <div class="card">
      <div class="card-title">📖 كتالوج الكتب</div>
      <div class="search-bar">
        <input type="text" id="bookSearch" placeholder="🔍 ابحث عن كتاب..." oninput="filterBooks()">
        <select id="bookCatFilter" onchange="filterBooks()">
          <option value="">كل الفئات</option>
          <option>إسلامية</option>
          <option>عربي</option>
          <option>علوم</option>
          <option>رياضيات</option>
          <option>قصص أطفال</option>
          <option>تاريخ</option>
          <option>أخرى</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="openAddBookModal()">+ إضافة كتاب</button>
      </div>
      <div id="catalogList"><div class="empty"><div class="icon">⏳</div><p>جارٍ التحميل...</p></div></div>
    </div>
  </div>

  <!-- استعارة جديدة -->
  <div class="panel" id="panel-borrow">
    <div class="card">
      <div class="card-title">📤 تسجيل استعارة جديدة</div>
      <div class="form-row" style="margin-bottom:14px">
        <div class="form-group">
          <label>اسم الطالبة</label>
          <select id="borrowStudent" style="width:100%;background:#0f172a;border:1.5px solid #334155;color:#F8FAFC;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px">
            <option value="">-- اختر الصف أولاً --</option>
          </select>
        </div>
        <div class="form-group">
          <label>الصف</label>
          <select id="borrowClass" onchange="loadClassStudents()" style="width:100%;background:#0f172a;border:1.5px solid #334155;color:#F8FAFC;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px">
            <option value="">-- اختر الصف --</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>عنوان الكتاب</label>
        <select id="borrowBook" style="width:100%;background:#0f172a;border:1.5px solid #334155;color:#F8FAFC;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px">
          <option value="">-- اختر الكتاب --</option>
        </select>
      </div>
      <div class="form-row" style="margin-bottom:14px">
        <div class="form-group">
          <label>تاريخ الاستعارة</label>
          <input type="date" id="borrowDate" style="width:100%;background:#0f172a;border:1.5px solid #334155;color:#F8FAFC;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px">
        </div>
        <div class="form-group">
          <label>تاريخ الإرجاع المتوقع</label>
          <input type="date" id="dueDate" style="width:100%;background:#0f172a;border:1.5px solid #334155;color:#F8FAFC;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px">
        </div>
      </div>
      <div class="form-group">
        <label>ملاحظات (اختياري)</label>
        <textarea id="borrowNotes" rows="2" style="width:100%;background:#0f172a;border:1.5px solid #334155;color:#F8FAFC;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px;resize:vertical"></textarea>
      </div>
      <button class="btn btn-primary" onclick="saveBorrowing()">📤 تسجيل الاستعارة</button>
    </div>
  </div>

  <!-- سجل الإعارات -->
  <div class="panel" id="panel-history">
    <div class="card">
      <div class="card-title">📋 سجل الإعارات</div>
      <div class="search-bar">
        <input type="text" id="historySearch" placeholder="🔍 ابحث باسم الطالبة أو الكتاب..." oninput="filterHistory()">
        <select id="historyStatus" onchange="filterHistory()">
          <option value="">كل الحالات</option>
          <option value="borrowed">مُعار</option>
          <option value="returned">مُرجَع</option>
          <option value="overdue">متأخر</option>
        </select>
      </div>
      <div id="historyList"><div class="empty"><div class="icon">⏳</div><p>جارٍ التحميل...</p></div></div>
    </div>
  </div>

  <!-- المتأخرات -->
  <div class="panel" id="panel-overdue">
    <div class="card">
      <div class="card-title">⚠️ الإعارات المتأخرة</div>
      <div id="overdueList"><div class="empty"><div class="icon">⏳</div><p>جارٍ التحميل...</p></div></div>
    </div>
  </div>

</div>

<!-- Modal إضافة كتاب -->
<div class="modal-overlay" id="addBookModal">
  <div class="modal">
    <div class="modal-title">📚 إضافة كتاب جديد</div>
    <div class="form-group"><label>عنوان الكتاب</label><input type="text" id="ab-title" placeholder="عنوان الكتاب"></div>
    <div class="form-group"><label>المؤلف</label><input type="text" id="ab-author" placeholder="اسم المؤلف"></div>
    <div class="form-row">
      <div class="form-group"><label>الفئة</label>
        <select id="ab-category">
          <option>إسلامية</option><option>عربي</option><option>علوم</option>
          <option>رياضيات</option><option>قصص أطفال</option><option>تاريخ</option><option>أخرى</option>
        </select>
      </div>
      <div class="form-group"><label>المرحلة</label>
        <select id="ab-grade">
          <option value="">كل المراحل</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>عدد النسخ الإجمالي</label><input type="number" id="ab-total" value="1" min="1"></div>
      <div class="form-group"><label>النسخ المتاحة</label><input type="number" id="ab-available" value="1" min="0"></div>
    </div>
    <div class="modal-btns">
      <button class="btn" style="background:#334155;color:#F8FAFC" onclick="closeModal('addBookModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveBook()">💾 حفظ</button>
    </div>
  </div>
</div>

<script>
let sb = null;
let _jwt = '';
let allBooks = [];
let allBorrowings = [];
let allClasses = [];

function goBack() {
  const u = JSON.parse(sessionStorage.getItem('edoos_user') || '{}');
  const roleKey = u.role_key || '';
  const roleToPortal = {
    principal: '../eduos-principal/', vice_principal: '../eduos-vice-principal/',
    admin: '../eduos-admin/', librarian: '../', teacher: '../eduos-teacher/'
  };
  window.location.href = roleToPortal[roleKey] || '../';
}

function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  const tabs = document.querySelectorAll('.nav-tab');
  const order = ['dashboard','catalog','borrow','history','overdue'];
  const idx = order.indexOf(name);
  if (tabs[idx]) tabs[idx].classList.add('active');
  if (name === 'dashboard') loadDashboard();
  if (name === 'catalog') loadCatalog();
  if (name === 'borrow') initBorrowForm();
  if (name === 'history') loadHistory();
  if (name === 'overdue') loadOverdue();
}

function _getJWT() {
  const u = JSON.parse(sessionStorage.getItem('edoos_user') || '{}');
  return u.access_token || u.jwt || '';
}

async function init() {
  const cfg = window.EduOS;
  if (!cfg) return;
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  sb = createClient(cfg.SB_URL, cfg.SB_KEY);
  const u = JSON.parse(sessionStorage.getItem('edoos_user') || '{}');
  document.getElementById('headerUser').textContent = u.name_ar || u.name || '';
  loadDashboard();
  loadClasses();
}

async function loadClasses() {
  if (!sb) return;
  try {
    const { data } = await sb.from('students').select('class_name').order('class_name');
    const classes = [...new Set((data||[]).map(r=>r.class_name).filter(Boolean))].sort();
    allClasses = classes;
    const sel = document.getElementById('borrowClass');
    classes.forEach(c => { const o = document.createElement('option'); o.value=o.textContent=c; sel.appendChild(o); });
  } catch(e) {}
}

async function loadDashboard() {
  if (!sb) { setTimeout(loadDashboard, 300); return; }
  try {
    const { data: books } = await sb.from('library_books').select('total_copies,available_copies');
    const totalBooks = (books||[]).reduce((s,r)=>s+(r.total_copies||0),0) || (books||[]).length;
    const availBooks = (books||[]).reduce((s,r)=>s+(r.available_copies||0),0);
    const { data: brows } = await sb.from('library_borrowings').select('*').order('created_at',{ascending:false});
    allBorrowings = brows || [];
    const today = new Date().toISOString().slice(0,10);
    const borrowed = allBorrowings.filter(r=>r.status==='borrowed').length;
    const overdue = allBorrowings.filter(r=>r.status==='borrowed'&&r.due_date&&r.due_date<today).length;
    document.getElementById('kpi-books').textContent = totalBooks || books?.length || 0;
    document.getElementById('kpi-available').textContent = availBooks;
    document.getElementById('kpi-borrowed').textContent = borrowed;
    document.getElementById('kpi-overdue').textContent = overdue;
    const recent = allBorrowings.slice(0,10);
    if (!recent.length) { document.getElementById('recentBorrowings').innerHTML = '<div class="empty"><div class="icon">📚</div><p>لا إعارات مسجَّلة بعد</p></div>'; return; }
    document.getElementById('recentBorrowings').innerHTML = '<div class="table-wrap"><table><thead><tr><th>الطالبة</th><th>الصف</th><th>الكتاب</th><th>الاستعارة</th><th>الإرجاع</th><th>الحالة</th></tr></thead><tbody>'
      + recent.map(r => '<tr><td>'+escape(r.student_name||'—')+'</td><td>'+escape(r.class_name||'—')+'</td><td>'+escape(r.resource_title||'—')+'</td><td>'+(r.borrow_date||'—')+'</td><td>'+(r.due_date||'—')+'</td><td>'+statusBadge(r)+'</td></tr>').join('')
      + '</tbody></table></div>';
  } catch(e) {}
}

function statusBadge(r) {
  const today = new Date().toISOString().slice(0,10);
  if (r.status === 'returned') return '<span class="badge badge-green">مُرجَع</span>';
  if (r.status === 'borrowed' && r.due_date && r.due_date < today) return '<span class="badge badge-red">متأخر</span>';
  return '<span class="badge badge-yellow">مُعار</span>';
}

function escape(s) { return String(s||'').replace(/</g,'&lt;'); }

async function loadCatalog() {
  if (!sb) { setTimeout(loadCatalog, 300); return; }
  try {
    const { data } = await sb.from('library_books').select('*').order('title');
    allBooks = data || [];
    renderCatalog(allBooks);
  } catch(e) {}
}

function filterBooks() {
  const q = (document.getElementById('bookSearch').value||'').toLowerCase();
  const cat = document.getElementById('bookCatFilter').value;
  const filtered = allBooks.filter(b => {
    const match = !q || (b.title||'').toLowerCase().includes(q) || (b.author||'').toLowerCase().includes(q);
    const catMatch = !cat || b.category === cat;
    return match && catMatch;
  });
  renderCatalog(filtered);
}

function renderCatalog(books) {
  if (!books.length) { document.getElementById('catalogList').innerHTML = '<div class="empty"><div class="icon">📚</div><p>لا كتب مسجَّلة — أضف كتاباً للبدء</p></div>'; return; }
  document.getElementById('catalogList').innerHTML = '<div class="table-wrap"><table><thead><tr><th>العنوان</th><th>المؤلف</th><th>الفئة</th><th>المرحلة</th><th>الإجمالي</th><th>المتاح</th></tr></thead><tbody>'
    + books.map(b => '<tr><td style="font-weight:700">'+escape(b.title||'—')+'</td><td>'+escape(b.author||'—')+'</td><td>'+escape(b.category||'—')+'</td><td>'+(b.grade_level?'الصف '+b.grade_level:'عام')+'</td><td>'+( b.total_copies||1)+'</td><td><span class="badge '+(b.available_copies>0?'badge-green':'badge-red')+'">'+(b.available_copies||0)+'</span></td></tr>').join('')
    + '</tbody></table></div>';
}

function openAddBookModal() {
  document.getElementById('addBookModal').classList.add('open');
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function saveBook() {
  const title = document.getElementById('ab-title').value.trim();
  const author = document.getElementById('ab-author').value.trim();
  const category = document.getElementById('ab-category').value;
  const grade = document.getElementById('ab-grade').value;
  const total = parseInt(document.getElementById('ab-total').value)||1;
  const available = parseInt(document.getElementById('ab-available').value)||1;
  if (!title) { alert('يرجى إدخال عنوان الكتاب'); return; }
  try {
    const { error } = await sb.from('library_books').insert({ title, author, category, grade_level: grade||null, total_copies: total, available_copies: available });
    if (error) throw error;
    closeModal('addBookModal');
    document.getElementById('ab-title').value=''; document.getElementById('ab-author').value='';
    showToast('✅ تم إضافة الكتاب');
    loadCatalog();
  } catch(e) { alert('خطأ: ' + e.message); }
}

async function loadClassStudents() {
  const cls = document.getElementById('borrowClass').value;
  const sel = document.getElementById('borrowStudent');
  sel.innerHTML = '<option value="">-- جارٍ التحميل... --</option>';
  if (!cls) { sel.innerHTML = '<option value="">-- اختر الصف أولاً --</option>'; return; }
  try {
    const { data } = await sb.from('students').select('id,name,student_number').eq('class_name',cls).order('name');
    sel.innerHTML = '<option value="">-- اختر الطالبة --</option>';
    (data||[]).forEach(s => { const o = document.createElement('option'); o.value=s.id; o.textContent=s.name+' ('+s.student_number+')'; sel.appendChild(o); });
  } catch(e) {}
}

async function initBorrowForm() {
  if (!sb) { setTimeout(initBorrowForm, 300); return; }
  const today = new Date().toISOString().slice(0,10);
  const due = new Date(); due.setDate(due.getDate()+7);
  document.getElementById('borrowDate').value = today;
  document.getElementById('dueDate').value = due.toISOString().slice(0,10);
  const bookSel = document.getElementById('borrowBook');
  bookSel.innerHTML = '<option value="">-- اختر الكتاب --</option>';
  try {
    const { data } = await sb.from('library_books').select('id,title,available_copies').order('title');
    (data||[]).forEach(b => {
      const o = document.createElement('option');
      o.value = b.title;
      o.textContent = b.title + (b.available_copies > 0 ? '' : ' (غير متاح)');
      o.disabled = b.available_copies === 0;
      bookSel.appendChild(o);
    });
    if (!data || !data.length) {
      const o = document.createElement('option'); o.value=''; o.textContent='— أدخل عنوان الكتاب يدوياً —'; o.disabled=true; bookSel.appendChild(o);
      const inp = document.createElement('input'); inp.type='text'; inp.id='borrowBookManual';
      inp.placeholder='عنوان الكتاب...';
      inp.style.cssText='width:100%;background:#0f172a;border:1.5px solid #334155;color:#F8FAFC;padding:10px 14px;border-radius:10px;font-family:Tajawal,Arial,sans-serif;font-size:14px;margin-top:8px';
      bookSel.parentNode.appendChild(inp);
    }
  } catch(e) {}
}

async function saveBorrowing() {
  const studentId = document.getElementById('borrowStudent').value;
  const studentName = document.getElementById('borrowStudent').options[document.getElementById('borrowStudent').selectedIndex]?.textContent?.split(' (')[0] || '';
  const className = document.getElementById('borrowClass').value;
  const bookTitle = document.getElementById('borrowBook').value || (document.getElementById('borrowBookManual')?.value||'');
  const borrowDate = document.getElementById('borrowDate').value;
  const dueDate = document.getElementById('dueDate').value;
  const notes = document.getElementById('borrowNotes').value.trim();
  if (!studentName || !className || !bookTitle || !borrowDate || !dueDate) { alert('يرجى إكمال جميع الحقول المطلوبة'); return; }
  try {
    const { error } = await sb.from('library_borrowings').insert({
      student_name: studentName, class_name: className, resource_title: bookTitle,
      borrow_date: borrowDate, due_date: dueDate, notes: notes||null, status: 'borrowed'
    });
    if (error) throw error;
    // تقليل المتاح في library_books
    await sb.from('library_books').update({ available_copies: sb.rpc ? undefined : undefined }).eq('title', bookTitle);
    await sb.rpc('decrement_book_copies', { book_title: bookTitle }).catch(()=>{});
    showToast('✅ تم تسجيل الاستعارة');
    document.getElementById('borrowStudent').value=''; document.getElementById('borrowClass').value='';
    document.getElementById('borrowBook').value=''; document.getElementById('borrowNotes').value='';
    showPanel('history');
  } catch(e) { alert('خطأ: ' + e.message); }
}

async function loadHistory() {
  if (!sb) { setTimeout(loadHistory, 300); return; }
  try {
    const { data } = await sb.from('library_borrowings').select('*').order('created_at',{ascending:false}).limit(100);
    allBorrowings = data || [];
    renderHistory(allBorrowings);
  } catch(e) {}
}

function filterHistory() {
  const q = (document.getElementById('historySearch').value||'').toLowerCase();
  const status = document.getElementById('historyStatus').value;
  const today = new Date().toISOString().slice(0,10);
  const filtered = allBorrowings.filter(r => {
    const textMatch = !q || (r.student_name||'').toLowerCase().includes(q) || (r.resource_title||'').toLowerCase().includes(q);
    let statusMatch = true;
    if (status === 'returned') statusMatch = r.status === 'returned';
    else if (status === 'borrowed') statusMatch = r.status === 'borrowed' && (!r.due_date || r.due_date >= today);
    else if (status === 'overdue') statusMatch = r.status === 'borrowed' && r.due_date && r.due_date < today;
    return textMatch && statusMatch;
  });
  renderHistory(filtered);
}

function renderHistory(rows) {
  if (!rows.length) { document.getElementById('historyList').innerHTML = '<div class="empty"><div class="icon">📋</div><p>لا سجلات</p></div>'; return; }
  document.getElementById('historyList').innerHTML = '<div class="table-wrap"><table><thead><tr><th>الطالبة</th><th>الصف</th><th>الكتاب</th><th>الاستعارة</th><th>الإرجاع المتوقع</th><th>الإرجاع الفعلي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>'
    + rows.map(r => '<tr><td>'+escape(r.student_name||'—')+'</td><td>'+escape(r.class_name||'—')+'</td><td style="font-weight:700">'+escape(r.resource_title||'—')+'</td><td>'+(r.borrow_date||'—')+'</td><td>'+(r.due_date||'—')+'</td><td>'+(r.return_date||'—')+'</td><td>'+statusBadge(r)+'</td><td>'+(r.status==='borrowed'?'<button class="btn btn-success btn-sm" onclick="returnBook('+r.id+')">إرجاع</button>':'—')+'</td></tr>').join('')
    + '</tbody></table></div>';
}

async function returnBook(id) {
  if (!confirm('تأكيد إرجاع الكتاب؟')) return;
  const today = new Date().toISOString().slice(0,10);
  try {
    const { data: row } = await sb.from('library_borrowings').select('resource_title').eq('id',id).single();
    const { error } = await sb.from('library_borrowings').update({ status: 'returned', return_date: today }).eq('id',id);
    if (error) throw error;
    // زيادة المتاح
    if (row?.resource_title) {
      await sb.rpc('increment_book_copies', { book_title: row.resource_title }).catch(()=>{});
    }
    showToast('✅ تم تسجيل الإرجاع');
    loadHistory();
  } catch(e) { alert('خطأ: ' + e.message); }
}

async function loadOverdue() {
  if (!sb) { setTimeout(loadOverdue, 300); return; }
  try {
    const today = new Date().toISOString().slice(0,10);
    const { data } = await sb.from('library_borrowings').select('*').eq('status','borrowed').lt('due_date',today).order('due_date');
    const rows = data || [];
    if (!rows.length) { document.getElementById('overdueList').innerHTML = '<div class="empty"><div class="icon">✅</div><p>لا متأخرات — كل الإعارات في وقتها</p></div>'; return; }
    document.getElementById('overdueList').innerHTML = '<div class="overdue-alert">⚠️ يوجد ' + rows.length + ' إعارة متأخرة الإرجاع — يرجى متابعة أولياء الأمور</div><div class="table-wrap"><table><thead><tr><th>الطالبة</th><th>الصف</th><th>الكتاب</th><th>تاريخ الإرجاع المتوقع</th><th>الأيام المتأخرة</th><th>إجراء</th></tr></thead><tbody>'
      + rows.map(r => {
          const days = Math.floor((new Date(today)-new Date(r.due_date))/(1000*60*60*24));
          return '<tr><td>'+escape(r.student_name||'—')+'</td><td>'+escape(r.class_name||'—')+'</td><td style="font-weight:700">'+escape(r.resource_title||'—')+'</td><td style="color:#FCA5A5">'+r.due_date+'</td><td><span class="badge badge-red">'+days+' يوم</span></td><td><button class="btn btn-success btn-sm" onclick="returnBook('+r.id+')">إرجاع</button></td></tr>';
        }).join('')
      + '</tbody></table></div>';
  } catch(e) {}
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E293B;border:1px solid #334155;color:#F8FAFC;padding:12px 24px;border-radius:12px;font-family:Tajawal,Arial,sans-serif;font-size:14px;font-weight:700;z-index:999;box-shadow:0 4px 24px rgba(0,0,0,0.4)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

window.addEventListener('load', init);
</script>
</body>
</html>
