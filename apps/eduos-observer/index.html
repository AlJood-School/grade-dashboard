<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة المراقب — بوابة الجود الذكية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',Arial,sans-serif;background:#f0f4f8;color:#1a2332;min-height:100vh;}

/* Auth screen */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);}
.auth-card{background:#fff;border-radius:24px;padding:48px 40px;width:90%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;}
.auth-logo{width:80px;height:80px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px;}
.auth-title{font-size:22px;font-weight:800;color:#1a2332;margin-bottom:6px;}
.auth-sub{font-size:14px;color:#64748b;margin-bottom:28px;}
.auth-badge{background:#fef9c3;border:1px solid #fde047;color:#854d0e;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;margin-bottom:24px;display:flex;align-items:center;gap:8px;}
.auth-input{width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:13px 16px;font-family:'Tajawal',sans-serif;font-size:15px;text-align:center;margin-bottom:16px;transition:border-color .2s;}
.auth-input:focus{outline:none;border-color:#6C3DD6;}
.auth-btn{width:100%;background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;padding:14px;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(108,61,214,0.3);}
.auth-btn:hover{transform:translateY(-1px);}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.error-msg{color:#dc2626;font-size:13px;margin-top:-8px;margin-bottom:12px;}

/* Main portal */
.portal{display:none;}
.header{background:linear-gradient(135deg,#0f172a,#1e1b4b);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 16px rgba(0,0,0,0.3);}
.header-brand{display:flex;align-items:center;gap:12px;color:#fff;}
.header-logo{width:36px;height:36px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.header-title{font-size:17px;font-weight:700;color:#fff;}
.header-sub{font-size:12px;color:#94a3b8;}
.header-right{display:flex;align-items:center;gap:12px;}
.observer-pill{background:rgba(108,61,214,0.3);border:1px solid rgba(108,61,214,0.5);color:#c4b5fd;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600;}
.readonly-badge{background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;border-radius:20px;padding:6px 12px;font-size:12px;}
.timer-badge{background:rgba(251,191,36,0.2);border:1px solid rgba(251,191,36,0.4);color:#fcd34d;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;}

/* Nav tabs */
.nav-tabs{background:#fff;border-bottom:1px solid #e8edf2;padding:0 32px;display:flex;gap:0;overflow-x:auto;}
.nav-tab{padding:14px 20px;font-size:14px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;}
.nav-tab.active{color:#6C3DD6;border-bottom-color:#6C3DD6;}
.nav-tab:hover{color:#6C3DD6;}

/* Content */
.content{max-width:1200px;margin:0 auto;padding:28px 24px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px;}
.kpi-card{background:#fff;border-radius:16px;padding:20px 24px;box-shadow:0 2px 8px rgba(0,0,0,0.05);border:1px solid #e8edf2;}
.kpi-val{font-size:32px;font-weight:800;background:linear-gradient(135deg,#6C3DD6,#22D3EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.kpi-lbl{font-size:13px;color:#64748b;margin-top:4px;}
.kpi-trend{font-size:12px;margin-top:6px;font-weight:600;}
.kpi-trend.up{color:#16a34a;}
.kpi-trend.down{color:#dc2626;}

/* Section cards */
.section-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.05);border:1px solid #e8edf2;margin-bottom:20px;}
.section-card h3{font-size:16px;font-weight:700;color:#1a2332;margin-bottom:16px;display:flex;align-items:center;gap:8px;}

/* Table */
.data-table{width:100%;border-collapse:collapse;}
.data-table th{background:#f8fafc;padding:10px 14px;text-align:right;font-size:13px;color:#64748b;font-weight:600;border-bottom:1px solid #e8edf2;}
.data-table td{padding:12px 14px;font-size:14px;border-bottom:1px solid #f1f5f9;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:#fafbfc;}

/* Role badge */
.role-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.role-teacher{background:#ede9fe;color:#6C3DD6;}
.role-admin{background:#dcfce7;color:#16a34a;}
.role-principal{background:#fef9c3;color:#854d0e;}
.role-other{background:#f1f5f9;color:#475569;}

/* Chart placeholder */
.chart-area{background:#f8fafc;border-radius:12px;padding:20px;text-align:center;color:#94a3b8;height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:120px;justify-content:center;}
.bar{width:32px;background:linear-gradient(to top,#6C3DD6,#22D3EE);border-radius:4px 4px 0 0;transition:height .6s ease;}

/* Watermark */
.watermark{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:#94a3b8;background:#fff;border:1px solid #e8edf2;border-radius:20px;padding:5px 16px;pointer-events:none;z-index:999;}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:48px;gap:12px;color:#64748b;}
.spinner{width:24px;height:24px;border:3px solid #e8edf2;border-top-color:#6C3DD6;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Empty */
.empty{text-align:center;padding:32px;color:#94a3b8;}
.empty .icon{font-size:40px;margin-bottom:8px;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2332;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;z-index:9999;pointer-events:none;}
.toast.show{opacity:1;}
.toast.error{background:#dc2626;}
.toast.success{background:#16a34a;}
</style>
</head>
<body>

<!-- Auth Screen -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">👁️</div>
    <div class="auth-title">بوابة المراقب</div>
    <div class="auth-sub">Observer Portal — Al-Jood Smart Platform</div>
    <div class="auth-badge">🔒 وصول للقراءة فقط · Read-Only Access</div>
    <div id="errorMsg" class="error-msg" style="display:none;"></div>
    <input class="auth-input" type="text" id="observerName" placeholder="اكتب اسمك / Enter your name" maxlength="80">
    <button class="auth-btn" id="enterBtn" onclick="enterPortal()">دخول المنصة</button>
  </div>
</div>

<!-- Main Portal -->
<div class="portal" id="portal">
  <div class="header">
    <div class="header-brand">
      <div class="header-logo">🎓</div>
      <div>
        <div class="header-title">بوابة الجود الذكية</div>
        <div class="header-sub">Al-Jood Smart Portal · Observer View</div>
      </div>
    </div>
    <div class="header-right">
      <div class="observer-pill">👁️ <span id="obsName">مراقب</span></div>
      <div class="readonly-badge">🔒 قراءة فقط</div>
      <div class="timer-badge">⏳ <span id="timerDisplay">--:--</span></div>
    </div>
  </div>

  <div class="nav-tabs" id="navTabs">
    <!-- Tabs injected dynamically based on scope -->
  </div>

  <div class="content" id="tabContent">
    <!-- Content injected dynamically -->
  </div>
</div>

<div class="watermark">👁️ وضع المراقبة — للقراءة فقط · NAFAS FOR ARTIFICIAL INTELLIGENCE</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://zuyizaiugpmhmeycqton.supabase.co';
let SB_KEY = '';
let sb = null;
let tokenData = null;
let sessionId = null;
let observerName = '';
let expiresAt = null;
let timerInterval = null;
let heartbeatInterval = null;
let currentTab = '';

const SCOPE_TABS = {
  all:        ['overview','academic','attendance','staff','students','schedule','analytics'],
  academic:   ['academic'],
  analytics:  ['analytics'],
  attendance: ['attendance'],
  staff:      ['staff'],
  students:   ['students'],
  schedule:   ['schedule'],
  finance:    ['finance'],
};

const TAB_LABELS = {
  overview:   { ar:'نظرة عامة', icon:'📊' },
  academic:   { ar:'الأكاديمي', icon:'📚' },
  attendance: { ar:'الحضور', icon:'✅' },
  staff:      { ar:'الكادر', icon:'👩‍🏫' },
  students:   { ar:'الطلاب', icon:'👩‍🎓' },
  schedule:   { ar:'الجداول', icon:'🗓️' },
  analytics:  { ar:'التحليلات', icon:'📈' },
  finance:    { ar:'المالية', icon:'💰' },
};

window.addEventListener('DOMContentLoaded', async () => {
  await waitForConfig();
  SB_KEY = window.EduOS?.SB_KEY || '';
  sb = supabase.createClient(SB_URL, SB_KEY);
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if (!token) { showError('رابط غير صالح — Invalid link'); return; }
  const { data, error } = await sb.from('observer_tokens').select('*').eq('token', token).single();
  if (error || !data) { showError('الرابط غير موجود أو انتهت صلاحيته'); return; }
  if (!data.is_active) { showError('هذا الرابط موقوف من قِبل الإدارة'); return; }
  if (new Date(data.expires_at) < new Date()) { showError('انتهت صلاحية هذا الرابط'); return; }
  tokenData = data;
  expiresAt = new Date(data.expires_at);
  document.getElementById('observerName').focus();
});

function showError(msg) {
  document.getElementById('authScreen').innerHTML = `
    <div style="text-align:center;color:#fff;padding:40px;">
      <div style="font-size:64px;margin-bottom:16px;">🔒</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:8px;">${msg}</div>
      <div style="font-size:14px;color:#94a3b8;">تواصل مع إدارة المدرسة للحصول على رابط جديد</div>
    </div>`;
}

async function enterPortal() {
  observerName = document.getElementById('observerName').value.trim();
  if (!observerName) { document.getElementById('errorMsg').textContent = 'أدخل اسمك'; document.getElementById('errorMsg').style.display='block'; return; }
  document.getElementById('enterBtn').disabled = true;
  document.getElementById('enterBtn').textContent = 'جاري الدخول...';
  // Create session
  const { data: sess, error } = await sb.from('observer_sessions').insert({
    token_id: tokenData.id,
    observer_name: observerName,
    pages_visited: ['دخول المنصة'],
    is_active: true,
  }).select().single();
  if (error) { document.getElementById('errorMsg').textContent = 'خطأ في إنشاء الجلسة'; document.getElementById('errorMsg').style.display='block'; document.getElementById('enterBtn').disabled=false; document.getElementById('enterBtn').textContent='دخول المنصة'; return; }
  sessionId = sess.id;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('portal').style.display = 'block';
  document.getElementById('obsName').textContent = observerName;
  buildNav();
  startTimer();
  startHeartbeat();
}

function buildNav() {
  const scopes = tokenData.scope || ['all'];
  let tabs = new Set();
  scopes.forEach(s => (SCOPE_TABS[s] || []).forEach(t => tabs.add(t)));
  const navEl = document.getElementById('navTabs');
  navEl.innerHTML = [...tabs].map((t,i) => `
    <div class="nav-tab ${i===0?'active':''}" onclick="switchTab('${t}',this)">${TAB_LABELS[t]?.icon} ${TAB_LABELS[t]?.ar}</div>
  `).join('');
  currentTab = [...tabs][0];
  loadTab(currentTab);
}

function switchTab(tab, el) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentTab = tab;
  loadTab(tab);
  recordPage(TAB_LABELS[tab]?.ar || tab);
}

async function recordPage(page) {
  if (!sessionId) return;
  const { data: curr } = await sb.from('observer_sessions').select('pages_visited').eq('id', sessionId).single();
  const pages = [...(curr?.pages_visited || []), page];
  await sb.from('observer_sessions').update({ pages_visited: pages, last_seen_at: new Date().toISOString() }).eq('id', sessionId);
}

async function loadTab(tab) {
  const el = document.getElementById('tabContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> جاري التحميل...</div>';
  if (tab === 'overview') await loadOverview();
  else if (tab === 'students') await loadStudents();
  else if (tab === 'staff') await loadStaff();
  else if (tab === 'attendance') await loadAttendance();
  else if (tab === 'academic') await loadAcademic();
  else if (tab === 'schedule') await loadSchedule();
  else if (tab === 'analytics') await loadAnalytics();
  else el.innerHTML = '<div class="empty"><div class="icon">🚧</div>قريباً</div>';
}

async function loadOverview() {
  const [students, staff, parents] = await Promise.all([
    sb.from('students').select('*', {count:'exact',head:true}),
    sb.from('staff_profiles').select('*', {count:'exact',head:true}),
    sb.from('parents').select('*', {count:'exact',head:true}),
  ]);
  const { data: roles } = await sb.from('staff_profiles').select('role_key').order('role_key');
  const roleCount = {};
  roles?.forEach(r => roleCount[r.role_key] = (roleCount[r.role_key]||0)+1);

  document.getElementById('tabContent').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-val">${students.count||0}</div><div class="kpi-lbl">👩‍🎓 طالب/ة</div></div>
      <div class="kpi-card"><div class="kpi-val">${staff.count||0}</div><div class="kpi-lbl">👩‍🏫 كادر وظيفي</div></div>
      <div class="kpi-card"><div class="kpi-val">${parents.count||0}</div><div class="kpi-lbl">👨‍👩‍👧 أولياء أمور</div></div>
      <div class="kpi-card"><div class="kpi-val">12</div><div class="kpi-lbl">🎭 أدوار في المنصة</div></div>
    </div>
    <div class="section-card">
      <h3>🎭 توزيع الكادر على الأدوار</h3>
      <table class="data-table">
        <thead><tr><th>الدور</th><th>العدد</th><th>النسبة</th></tr></thead>
        <tbody>${Object.entries(roleCount).map(([role,count]) => `
          <tr>
            <td><span class="role-badge role-${role==='teacher'?'teacher':role==='admin'?'admin':role==='principal'?'principal':'other'}">${role}</span></td>
            <td><strong>${count}</strong></td>
            <td>${Math.round(count/(staff.count||1)*100)}%</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="section-card">
      <h3>🏫 عن المنصة</h3>
      <table class="data-table">
        <tbody>
          <tr><td>اسم المنصة</td><td><strong>بوابة الجود الذكية</strong></td></tr>
          <tr><td>المطوِّر</td><td>NAFAS FOR ARTIFICIAL INTELLIGENCE · CN-6573712 · أبوظبي</td></tr>
          <tr><td>المنهج</td><td>المناهج الوطنية الإماراتية — MOE</td></tr>
          <tr><td>العام الدراسي</td><td>2025 / 2026</td></tr>
          <tr><td>بنية الذكاء الاصطناعي</td><td>EduOS · Agent Brain · A–D Framework</td></tr>
        </tbody>
      </table>
    </div>`;
}

async function loadStudents() {
  const { data } = await sb.from('students').select('name,grade,class_name,gender').order('grade').order('class_name').limit(100);
  if (!data?.length) { document.getElementById('tabContent').innerHTML='<div class="empty"><div class="icon">👩‍🎓</div>لا بيانات</div>'; return; }
  document.getElementById('tabContent').innerHTML = `
    <div class="section-card">
      <h3>👩‍🎓 قائمة الطلاب (أول 100 سجل)</h3>
      <table class="data-table">
        <thead><tr><th>الاسم</th><th>الصف</th><th>الفصل</th><th>الجنس</th></tr></thead>
        <tbody>${data.map(s=>`<tr><td>${s.name||'—'}</td><td>${s.grade||'—'}</td><td>${s.class_name||'—'}</td><td>${s.gender==='female'?'أنثى':s.gender==='male'?'ذكر':'—'}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;
}

async function loadStaff() {
  const { data } = await sb.from('staff_profiles').select('full_name,role_key,subject,nationality').order('role_key').limit(200);
  if (!data?.length) { document.getElementById('tabContent').innerHTML='<div class="empty"><div class="icon">👩‍🏫</div>لا بيانات</div>'; return; }
  document.getElementById('tabContent').innerHTML = `
    <div class="section-card">
      <h3>👩‍🏫 الكادر الوظيفي</h3>
      <table class="data-table">
        <thead><tr><th>الاسم</th><th>الدور</th><th>التخصص</th><th>الجنسية</th></tr></thead>
        <tbody>${data.map(s=>`<tr>
          <td>${s.full_name||'—'}</td>
          <td><span class="role-badge role-${s.role_key==='teacher'?'teacher':s.role_key==='admin'?'admin':s.role_key==='principal'?'principal':'other'}">${s.role_key}</span></td>
          <td>${s.subject||'—'}</td>
          <td>${s.nationality||'—'}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
}

async function loadAttendance() {
  const today = new Date().toISOString().split('T')[0];
  const { data } = await sb.from('attendance').select('status,count').eq('date', today).limit(5);
  document.getElementById('tabContent').innerHTML = `
    <div class="section-card">
      <h3>✅ الحضور اليوم — ${today}</h3>
      ${data?.length ? `<table class="data-table"><thead><tr><th>الحالة</th><th>العدد</th></tr></thead><tbody>${data.map(r=>`<tr><td>${r.status}</td><td>${r.count}</td></tr>`).join('')}</tbody></table>` : '<div class="empty"><div class="icon">📋</div>لا بيانات حضور اليوم</div>'}
    </div>`;
}

async function loadAcademic() {
  const { data: defs } = await sb.from('grade_assessment_defs').select('*').limit(50);
  document.getElementById('tabContent').innerHTML = `
    <div class="section-card">
      <h3>📚 تعريفات التقييم الأكاديمي</h3>
      ${defs?.length ? `<table class="data-table"><thead><tr><th>المادة</th><th>نوع التقييم</th><th>الدرجة القصوى</th></tr></thead><tbody>${defs.map(d=>`<tr><td>${d.subject||'—'}</td><td>${d.assessment_type||'—'}</td><td>${d.max_score||'—'}</td></tr>`).join('')}</tbody></table>` : '<div class="empty"><div class="icon">📚</div>لا بيانات</div>'}
    </div>`;
}

async function loadSchedule() {
  const { data } = await sb.from('schedules').select('grade,class_name,day_of_week,period_number,subject').order('grade').order('class_name').order('day_of_week').limit(100);
  if (!data?.length) { document.getElementById('tabContent').innerHTML='<div class="empty"><div class="icon">🗓️</div>لا بيانات</div>'; return; }
  document.getElementById('tabContent').innerHTML = `
    <div class="section-card">
      <h3>🗓️ الجدول الدراسي (أول 100 صف)</h3>
      <table class="data-table">
        <thead><tr><th>الصف</th><th>الفصل</th><th>اليوم</th><th>الحصة</th><th>المادة</th></tr></thead>
        <tbody>${data.map(r=>`<tr><td>${r.grade||'—'}</td><td>${r.class_name||'—'}</td><td>${r.day_of_week||'—'}</td><td>${r.period_number||'—'}</td><td>${r.subject||'—'}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;
}

async function loadAnalytics() {
  const [stCount, stfCount, parCount] = await Promise.all([
    sb.from('students').select('*',{count:'exact',head:true}),
    sb.from('staff_profiles').select('*',{count:'exact',head:true}),
    sb.from('parents').select('*',{count:'exact',head:true}),
  ]);
  const { data: gradeBreakdown } = await sb.from('students').select('grade').order('grade');
  const grades = {};
  gradeBreakdown?.forEach(s => grades[s.grade]=(grades[s.grade]||0)+1);
  const maxVal = Math.max(...Object.values(grades), 1);

  document.getElementById('tabContent').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-val">${stCount.count||0}</div><div class="kpi-lbl">إجمالي الطلاب</div></div>
      <div class="kpi-card"><div class="kpi-val">${stfCount.count||0}</div><div class="kpi-lbl">إجمالي الكادر</div></div>
      <div class="kpi-card"><div class="kpi-val">${parCount.count||0}</div><div class="kpi-lbl">أولياء الأمور</div></div>
      <div class="kpi-card"><div class="kpi-val">${Object.keys(grades).length}</div><div class="kpi-lbl">صفوف دراسية</div></div>
    </div>
    <div class="section-card">
      <h3>📊 توزيع الطلاب على الصفوف</h3>
      <div class="chart-bars">
        ${Object.entries(grades).map(([g,c])=>`
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="font-size:12px;color:#6C3DD6;font-weight:700;">${c}</div>
            <div class="bar" style="height:${Math.round(c/maxVal*100)}px;"></div>
            <div style="font-size:11px;color:#64748b;white-space:nowrap;">${g}</div>
          </div>`).join('')}
      </div>
    </div>`;
}

function startTimer() {
  timerInterval = setInterval(() => {
    const remaining = expiresAt - Date.now();
    if (remaining <= 0) {
      clearInterval(timerInterval);
      document.getElementById('timerDisplay').textContent = 'انتهت الجلسة';
      showToast('انتهت مدة الجلسة', 'error');
      setTimeout(() => location.reload(), 3000);
      return;
    }
    const h = Math.floor(remaining/3600000);
    const m = Math.floor((remaining%3600000)/60000);
    const s = Math.floor((remaining%60000)/1000);
    document.getElementById('timerDisplay').textContent =
      h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  }, 1000);
}

function startHeartbeat() {
  heartbeatInterval = setInterval(async () => {
    if (!sessionId) return;
    await sb.from('observer_sessions').update({ last_seen_at: new Date().toISOString() }).eq('id', sessionId);
  }, 30000);
}

function waitForConfig() {
  return new Promise(r => {
    if (window.EduOS?.SB_KEY) return r();
    const t = setInterval(() => { if (window.EduOS?.SB_KEY) { clearInterval(t); r(); } }, 100);
    setTimeout(() => { clearInterval(t); r(); }, 3000);
  });
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent=msg; t.className=`toast ${type} show`;
  setTimeout(()=>t.className='toast', 3000);
}
</script>
</body>
</html>
