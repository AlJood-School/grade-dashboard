<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرحلات الميدانية — EduOS</title>
<script src="../platform-config.js">
  // Show user info
  (function() {
    try {
      var u = JSON.parse(sessionStorage.getItem('edoos_user') || '{}');
      var el = document.getElementById('ftUserInfo');
      if (el && u && u.name) {
        var roleLabels = {principal:'مديرة',vice_principal:'نائبة المديرة',teacher:'معلم/ة',admin:'أدمن'};
        el.innerHTML = '<span>' + (u.name||u.username||'') + '</span><span style="color:#94A3B8;margin:0 4px">·</span><span style="color:#6C3DD6">' + (roleLabels[u.role_key]||u.role_key||'') + '</span>';
      }
    } catch(e){}
  })();

function ftGoBack() {
  try {
    var u = JSON.parse(sessionStorage.getItem('edoos_user') || '{}');
    var portalMap = {principal:'../eduos-principal/',vice_principal:'../eduos-vice-principal/',admin:'../eduos-admin/',teacher:'../eduos-teacher/'};
    var t = portalMap[u.role_key] || '../eduos-principal/';
    if (document.referrer) history.back(); else window.location.href = t;
  } catch(e) { history.back(); }
}
</script>
<script src="../platform-auth-guard.js" defer></script>
<script src="../platform-lang.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',Arial,sans-serif;background:#F1F5F9;color:#1E293B;min-height:100vh;font-size:16px}
.header{background:#fff;border-bottom:1px solid #E2E8F0;box-shadow:0 1px 4px rgba(0,0,0,0.08);padding:0 20px;position:sticky;top:0;z-index:200}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:42px;height:42px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.brand-info h1{font-size:1.05rem;font-weight:900;color:#0F172A}
.brand-info p{font-size:.78rem;color:#94A3B8}
.header-actions{display:flex;align-items:center;gap:10px}
.btn-back{background:#F1F5F9;border:1px solid #E2E8F0;color:#475569;border-radius:10px;padding:8px 16px;font-family:'Tajawal',Arial,sans-serif;font-size:.85rem;font-weight:700;cursor:pointer}
.btn-new{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid #E2E8F0;box-shadow:0 2px 8px rgba(0,0,0,0.06);border-radius:14px;padding:16px 18px;text-align:center}
.stat-val{font-size:1.6rem;font-weight:900;color:#6C3DD6}
.stat-lbl{font-size:.78rem;color:#94A3B8;margin-top:4px}
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.trip-card{background:#fff;border:1px solid #E2E8F0;box-shadow:0 2px 8px rgba(0,0,0,0.06);border-radius:14px;padding:20px;transition:.15s}
.trip-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.1)}
.trip-title{font-size:1.05rem;font-weight:800;color:#0F172A;margin-bottom:4px}
.trip-dest{font-size:.85rem;color:#6C3DD6;font-weight:700;margin-bottom:10px}
.trip-row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:#475569;margin-bottom:6px}
.trip-row .ic{width:18px;text-align:center;flex-shrink:0}
.badge{display:inline-block;padding:4px 12px;border-radius:10px;font-size:.75rem;font-weight:800}
.trip-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #F1F5F9;gap:8px;flex-wrap:wrap}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{background:#F5F3FF;color:#6C3DD6;border-radius:8px;padding:2px 9px;font-size:.72rem;font-weight:700}
.btn-sm{border:none;border-radius:8px;padding:6px 12px;font-family:'Tajawal',Arial,sans-serif;font-size:.78rem;font-weight:700;cursor:pointer}
.btn-status{background:#F1F5F9;color:#475569;border:1px solid #E2E8F0}
.btn-del{background:#FEE2E2;color:#DC2626}
.empty-state{text-align:center;padding:60px 20px;color:#94A3B8}
.empty-icon{font-size:2.6rem;margin-bottom:10px}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border:1px solid #E2E8F0;border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #F1F5F9}
.modal-header h2{font-size:1.1rem;font-weight:900;color:#0F172A}
.modal-close{background:none;border:none;font-size:1.2rem;color:#94A3B8;cursor:pointer;width:32px;height:32px;border-radius:8px}
.modal-close:hover{background:#F1F5F9;color:#0F172A}
.modal-body{padding:20px 22px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.82rem;font-weight:700;color:#475569;margin-bottom:6px}
.form-input,.form-select,.form-textarea{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#0F172A;font-family:'Tajawal',Arial,sans-serif;font-size:.9rem;padding:10px 14px;width:100%;outline:none}
.form-textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid #F1F5F9}
.btn-cancel{background:#F1F5F9;border:none;border-radius:10px;padding:10px 20px;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;color:#475569}
.btn-save{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:10px;padding:10px 22px;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#0F172A;border:1px solid #334155;color:#F1F5F9;border-radius:12px;padding:12px 24px;font-size:.9rem;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;max-width:320px;text-align:center}
@media(max-width:640px){.stats-row{grid-template-columns:repeat(2,1fr)}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">🚌</div>
      <div class="brand-info">
        <h1>الرحلات الميدانية</h1>
        <p id="schoolName">بوابة الجود الذكية · Powered by EduOS</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="ftUserInfo" style="display:flex;align-items:center;gap:8px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:5px 12px;font-size:12px;color:#475569;font-weight:700"></div><button class="btn-back" onclick="ftGoBack()">&#8594; رجوع</button>
      <button class="btn-new" id="btnNew" onclick="openNewTrip()" style="display:none">+ رحلة جديدة</button>
      <button class="btn-back" onclick="doLogout()">خروج / Logout</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="statTotal">—</div><div class="stat-lbl">إجمالي الرحلات النشطة</div></div>
    <div class="stat-card"><div class="stat-val" id="statPending">—</div><div class="stat-lbl">بانتظار تأكيد الحافلة</div></div>
    <div class="stat-card"><div class="stat-val" id="statConfirmed">—</div><div class="stat-lbl">حافلات مؤكَّدة</div></div>
    <div class="stat-val" id="statUpcoming" style="display:none"></div>
  </div>

  <div class="trips-grid" id="tripsGrid">
    <div class="empty-state"><div class="empty-icon">🔄</div><div>جارٍ التحميل...</div></div>
  </div>
</div>

<!-- MODAL: NEW/EDIT TRIP -->
<div class="modal-overlay" id="modalNew">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">رحلة ميدانية جديدة</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">عنوان الرحلة *</label>
        <input type="text" class="form-input" id="fTitle" placeholder="مثال: رحلة مركز العلوم">
      </div>
      <div class="form-group">
        <label class="form-label">الوجهة</label>
        <input type="text" class="form-input" id="fDestination" placeholder="مثال: مركز سفانا العلمي">
      </div>
      <div class="form-group">
        <label class="form-label">الصفوف المشاركة (مفصولة بفاصلة)</label>
        <input type="text" class="form-input" id="fClasses" placeholder="مثال: 3A,3B,3C">
      </div>
      <div class="form-group">
        <label class="form-label">أسماء المشرفات (مفصولة بفاصلة)</label>
        <input type="text" class="form-input" id="fSupNames" placeholder="مثال: مريم أحمد، فاطمة سالم">
      </div>
      <div class="form-group">
        <label class="form-label">أرقام تواصل المشرفات (مفصولة بفاصلة)</label>
        <input type="text" class="form-input" id="fSupContacts" placeholder="مثال: 0501234567، 0509876543">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">تاريخ الرحلة</label>
          <input type="date" class="form-input" id="fDate">
        </div>
        <div class="form-group">
          <label class="form-label">حالة الحافلة</label>
          <select class="form-select" id="fBusStatus">
            <option value="pending">قيد الانتظار</option>
            <option value="confirmed">مؤكدة</option>
            <option value="departed">في الطريق</option>
            <option value="returned">عادت</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">موعد الانطلاق</label>
          <input type="time" class="form-input" id="fDeparture">
        </div>
        <div class="form-group">
          <label class="form-label">موعد العودة</label>
          <input type="time" class="form-input" id="fReturn">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">ملاحظات</label>
        <textarea class="form-textarea" id="fNotes" placeholder="أي ملاحظات إضافية..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
      <button class="btn-save" onclick="saveTrip()">💾 حفظ الرحلة</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL, SB_KEY, session, canEdit, SCHOOL_ID;
var BUS_STATUS_MAP = {
  pending:   {label:'قيد الانتظار', color:'#D97706', bg:'#FEF3C7'},
  confirmed: {label:'مؤكدة',        color:'#0284C7', bg:'#DBEAFE'},
  departed:  {label:'في الطريق',    color:'#7C3AED', bg:'#EDE9FE'},
  returned:  {label:'عادت',         color:'#059669', bg:'#D1FAE5'}
};
var allTrips = [];
var editingId = null;

document.addEventListener('DOMContentLoaded', function () {
  var tries = 0;
  var interval = setInterval(function () {
    tries++;
    if (window.EduOS && window.EduOS.SB_URL) {
      clearInterval(interval);
      SB_URL = window.EduOS.SB_URL;
      SB_KEY = window.EduOS.SB_KEY;
      init();
    } else if (tries > 40) {
      clearInterval(interval);
      showToast('خطأ في الاتصال بالمنصة');
    }
  }, 100);
});

function init () {
  try { session = JSON.parse(sessionStorage.getItem('edoos_user') || 'null'); } catch (e) { session = null; }
  if (!session || !session.id) { window.location.href = '../eduos-login/'; return; }

  SCHOOL_ID = session.school_id || (window.EduOS && window.EduOS.school ? window.EduOS.school.id : 'aljood');

  canEdit = ['principal','vice_principal','admin'].indexOf(session.role_key) >= 0;
  if (canEdit) document.getElementById('btnNew').style.display = 'flex';

  if (window.EduOS && window.EduOS.school) {
    var el = document.getElementById('schoolName');
    if (el) el.textContent = (window.EduOS.school.shortNameAr || 'الجود') + ' · Powered by EduOS';
  }

  loadTrips();
}

function authHeaders (json) {
  var h = { apikey: SB_KEY, Authorization: 'Bearer ' + (session && session.token ? session.token : SB_KEY) };
  if (json) h['Content-Type'] = 'application/json';
  return h;
}

async function loadTrips () {
  var grid = document.getElementById('tripsGrid');
  try {
    var url = SB_URL + '/rest/v1/field_trips?is_active=eq.true&order=trip_date.asc&select=*';
    var res = await fetch(url, { headers: authHeaders() });
    var rows = await res.json();
    allTrips = Array.isArray(rows) ? rows : [];
    renderStats();
    renderTrips();
  } catch (e) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div>خطأ في تحميل الرحلات</div></div>';
  }
}

function renderStats () {
  document.getElementById('statTotal').textContent = allTrips.length;
  document.getElementById('statPending').textContent = allTrips.filter(function(t){return t.bus_status === 'pending';}).length;
  document.getElementById('statConfirmed').textContent = allTrips.filter(function(t){return t.bus_status === 'confirmed' || t.bus_status === 'departed';}).length;
}

function esc (s) {
  return (s === null || s === undefined) ? '' : String(s).replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function formatDate (d) {
  if (!d) return '—';
  var parts = d.split('-');
  return parts.length === 3 ? (parts[2] + '/' + parts[1] + '/' + parts[0]) : d;
}

function renderTrips () {
  var grid = document.getElementById('tripsGrid');
  if (!allTrips.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🚌</div><div>لا توجد رحلات ميدانية مسجَّلة حالياً</div></div>';
    return;
  }
  grid.innerHTML = allTrips.map(function (t) {
    var s = BUS_STATUS_MAP[t.bus_status] || BUS_STATUS_MAP.pending;
    var classes = Array.isArray(t.classes) ? t.classes : [];
    var supNames = Array.isArray(t.supervisor_names) ? t.supervisor_names : [];
    var supContacts = Array.isArray(t.supervisor_contacts) ? t.supervisor_contacts : [];
    return '<div class="trip-card">'
      + '<div class="trip-title">' + esc(t.title) + '</div>'
      + (t.destination ? '<div class="trip-dest">📍 ' + esc(t.destination) + '</div>' : '')
      + (classes.length ? '<div class="chip-row">' + classes.map(function(c){return '<span class="chip">' + esc(c) + '</span>';}).join('') + '</div>' : '')
      + '<div class="trip-row"><span class="ic">📅</span><span>' + formatDate(t.trip_date) + '</span></div>'
      + (t.departure_time ? '<div class="trip-row"><span class="ic">🕐</span><span>انطلاق: ' + t.departure_time.slice(0,5) + (t.return_time ? ' — عودة: ' + t.return_time.slice(0,5) : '') + '</span></div>' : '')
      + (supNames.length ? '<div class="trip-row"><span class="ic">👩‍🏫</span><span>' + supNames.map(esc).join('، ') + '</span></div>' : '')
      + (supContacts.length ? '<div class="trip-row"><span class="ic">📞</span><span>' + supContacts.map(esc).join('، ') + '</span></div>' : '')
      + (t.notes ? '<div class="trip-row"><span class="ic">📝</span><span>' + esc(t.notes) + '</span></div>' : '')
      + '<div class="trip-footer">'
      + '<span class="badge" style="background:' + s.bg + ';color:' + s.color + '">🚌 ' + s.label + '</span>'
      + (canEdit ? '<div style="display:flex;gap:6px">'
          + '<button class="btn-sm btn-status" onclick="cycleBusStatus(\'' + t.id + '\')">🔄 تحديث الحالة</button>'
          + '<button class="btn-sm btn-status" onclick="editTrip(\'' + t.id + '\')">✏️ تعديل</button>'
          + '<button class="btn-sm btn-del" onclick="deleteTrip(\'' + t.id + '\')">🗑️</button>'
          + '</div>' : '')
      + '</div>'
      + '</div>';
  }).join('');
}

var BUS_CYCLE = ['pending','confirmed','departed','returned'];
async function cycleBusStatus (id) {
  var trip = allTrips.find(function(t){return t.id === id;});
  if (!trip) return;
  var idx = BUS_CYCLE.indexOf(trip.bus_status);
  var next = BUS_CYCLE[(idx + 1) % BUS_CYCLE.length];
  try {
    await fetch(SB_URL + '/rest/v1/field_trips?id=eq.' + id, {
      method: 'PATCH',
      headers: Object.assign({}, authHeaders(true), {'Prefer':'return=minimal'}),
      body: JSON.stringify({ bus_status: next })
    });
    showToast('✓ تم تحديث حالة الحافلة');
    loadTrips();
  } catch (e) { showToast('خطأ في التحديث'); }
}

function openNewTrip () {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'رحلة ميدانية جديدة';
  ['fTitle','fDestination','fClasses','fSupNames','fSupContacts','fDate','fDeparture','fReturn','fNotes'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  document.getElementById('fBusStatus').value = 'pending';
  document.getElementById('modalNew').classList.add('show');
}

function editTrip (id) {
  var t = allTrips.find(function(x){return x.id === id;});
  if (!t) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'تعديل الرحلة';
  document.getElementById('fTitle').value = t.title || '';
  document.getElementById('fDestination').value = t.destination || '';
  document.getElementById('fClasses').value = (t.classes||[]).join(',');
  document.getElementById('fSupNames').value = (t.supervisor_names||[]).join(',');
  document.getElementById('fSupContacts').value = (t.supervisor_contacts||[]).join(',');
  document.getElementById('fDate').value = t.trip_date || '';
  document.getElementById('fDeparture').value = t.departure_time ? t.departure_time.slice(0,5) : '';
  document.getElementById('fReturn').value = t.return_time ? t.return_time.slice(0,5) : '';
  document.getElementById('fBusStatus').value = t.bus_status || 'pending';
  document.getElementById('fNotes').value = t.notes || '';
  document.getElementById('modalNew').classList.add('show');
}

function closeModal () {
  document.getElementById('modalNew').classList.remove('show');
}

function splitCsv (v) {
  return (v || '').split(',').map(function(s){return s.trim();}).filter(Boolean);
}

async function saveTrip () {
  var title = document.getElementById('fTitle').value.trim();
  if (!title) { showToast('يرجى إدخال عنوان الرحلة'); return; }
  var body = {
    title: title,
    destination: document.getElementById('fDestination').value.trim() || null,
    classes: splitCsv(document.getElementById('fClasses').value),
    supervisor_names: splitCsv(document.getElementById('fSupNames').value),
    supervisor_contacts: splitCsv(document.getElementById('fSupContacts').value),
    trip_date: document.getElementById('fDate').value || null,
    departure_time: document.getElementById('fDeparture').value || null,
    return_time: document.getElementById('fReturn').value || null,
    bus_status: document.getElementById('fBusStatus').value,
    notes: document.getElementById('fNotes').value.trim() || null,
    school_id: SCHOOL_ID,
    academic_year: '2026-2027'
  };
  try {
    if (editingId) {
      await fetch(SB_URL + '/rest/v1/field_trips?id=eq.' + editingId, {
        method: 'PATCH',
        headers: Object.assign({}, authHeaders(true), {'Prefer':'return=minimal'}),
        body: JSON.stringify(body)
      });
    } else {
      body.created_by = session.name_ar || session.username || '';
      await fetch(SB_URL + '/rest/v1/field_trips', {
        method: 'POST',
        headers: Object.assign({}, authHeaders(true), {'Prefer':'return=minimal'}),
        body: JSON.stringify(body)
      });
    }
    closeModal();
    showToast('✓ تم حفظ الرحلة');
    loadTrips();
  } catch (e) { showToast('خطأ في الحفظ'); }
}

async function deleteTrip (id) {
  if (!confirm('هل تريدين حذف هذه الرحلة؟')) return;
  try {
    await fetch(SB_URL + '/rest/v1/field_trips?id=eq.' + id, {
      method: 'PATCH',
      headers: Object.assign({}, authHeaders(true), {'Prefer':'return=minimal'}),
      body: JSON.stringify({ is_active: false })
    });
    showToast('✓ تم حذف الرحلة');
    loadTrips();
  } catch (e) { showToast('خطأ في الحذف'); }
}

function showToast (msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 3000);
}

function doLogout () {
  sessionStorage.removeItem('edoos_user');
  window.location.href = '../eduos-login/';
}
</script>
</body>
</html>
