<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة ولي الأمر — بوابة الجود الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<script src="../platform-auth-guard.js"></script>
<script src="../platform-lang.js" defer></script>
<script src="../platform-shield.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:18px}
body{font-family:'Tajawal',sans-serif;font-size:18px;background:#F8FAFC;color:#111827;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
.app-header{background:#fff;border-bottom:1px solid #E5E7EB;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}
.logo-pill{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem;color:#1F2937}
.logo-sq{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff}
main{flex:1;width:100%}
.section{max-width:900px;margin:0 auto;padding:0 20px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:20px;margin-top:20px}
.card h2{font-size:1.15rem;font-weight:800;color:#1F2937;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.page-title{max-width:900px;margin:24px auto 0;padding:0 20px;font-size:1.3rem;font-weight:800;color:#1F2937}
.muted{color:#6B7280;font-size:.9rem}
.empty{color:#6B7280;background:#F9FAFB;border:1px dashed #D1D5DB;border-radius:12px;padding:16px;text-align:center}
.err{color:#B91C1C;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:14px;text-align:center}
.spinner{width:34px;height:34px;border:4px solid #E5E7EB;border-top-color:#6C3DD6;border-radius:50%;margin:18px auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.85rem;font-weight:700;white-space:nowrap}
.b-green{background:#DCFCE7;color:#166534}
.b-red{background:#FEE2E2;color:#991B1B}
.b-yellow{background:#FEF9C3;color:#854D0E}
.b-blue{background:#DBEAFE;color:#1E40AF}
.b-gray{background:#F3F4F6;color:#374151}
.btn{font-family:inherit;font-size:.95rem;font-weight:700;border:none;border-radius:12px;padding:10px 18px;cursor:pointer;background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-ghost{background:#fff;color:#374151;border:1px solid #D1D5DB}
.btn-red{background:#DC2626}
.btn-green{background:#16A34A}
select,textarea{font-family:inherit;font-size:1rem;border:1px solid #D1D5DB;border-radius:12px;padding:10px 12px;width:100%;background:#fff;color:#111827}
textarea{min-height:110px;resize:vertical}
label.lbl{display:block;font-weight:700;margin:12px 0 6px;font-size:.95rem}
.stu-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.stu-name{font-size:1.4rem;font-weight:800}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.info-box{background:#F9FAFB;border:1px solid #E5E7EB;border-radius:12px;padding:12px}
.info-box .k{color:#6B7280;font-size:.8rem}
.info-box .v{font-weight:800;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.item{border:1px solid #E5E7EB;border-radius:12px;padding:14px;margin-top:10px;background:#fff}
.grades-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.g-card{border-radius:14px;padding:14px;border:1px solid transparent}
.g-card .sub{font-weight:800}
.g-card .sc{font-size:1.4rem;font-weight:800;margin-top:4px}
.g-card .pc{font-size:.9rem;font-weight:700}
.g-green{background:#F0FDF4;border-color:#BBF7D0;color:#166534}
.g-blue{background:#EFF6FF;border-color:#BFDBFE;color:#1E40AF}
.g-yellow{background:#FEFCE8;border-color:#FEF08A;color:#854D0E}
.g-red{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.modal h3{font-size:1.15rem;font-weight:800;margin-bottom:12px}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0;font-weight:500}
.chk input{width:20px;height:20px}
.radio-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.radio-row label{flex:1;min-width:150px;border:2px solid #E5E7EB;border-radius:12px;padding:12px;cursor:pointer;font-weight:700;text-align:center}
.radio-row input{display:none}
.radio-row input:checked+span{color:#6C3DD6}
.radio-row label.sel{border-color:#6C3DD6;background:#F5F3FF}
.modal-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:14px}
.msg-ok{color:#166534;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;padding:10px;margin-top:10px}
.reply{background:#F5F3FF;border-right:4px solid #6C3DD6;border-radius:8px;padding:10px;margin-top:8px}
.num{direction:ltr;unicode-bidi:embed;display:inline-block}
footer{text-align:center;color:#6B7280;font-size:.8rem;padding:28px 16px;margin-top:28px;border-top:1px solid #E5E7EB;background:#fff}
@media(max-width:600px){html,body{font-size:17px}.card{padding:16px}}
</style>
</head>
<body>
<header class="app-header">
  <div class="logo-pill">
    <div class="logo-sq" style="background:linear-gradient(135deg,#6C3DD6,#22D3EE)">🎓</div>
    <span>بوابة الجود الذكية</span>
  </div>
  <div id="header-tools" style="display:flex;align-items:center;gap:8px">
    <!-- platform-lang.js يحقن هنا تلقائياً -->
  </div>
</header>

<h1 class="page-title">👨‍👩‍👧 بوابة ولي الأمر</h1>

<main>
  <!-- 1. بطاقة الطالبة -->
  <div class="section"><div class="card" id="sec-student"><div class="spinner"></div></div></div>

  <!-- 2. موافقة التصوير الإعلامي -->
  <div class="section"><div class="card"><h2>📸 موافقة التصوير الإعلامي</h2><div id="sec-media"><div class="spinner"></div></div></div></div>

  <!-- 3. الرحلات القادمة -->
  <div class="section"><div class="card"><h2>🚌 الرحلات القادمة</h2><div id="sec-trips"><div class="spinner"></div></div></div></div>

  <!-- 4. النتائج الدراسية -->
  <div class="section"><div class="card"><h2>📊 آخر النتائج الدراسية</h2><div id="sec-grades"><div class="spinner"></div></div></div></div>

  <!-- 5. ملف السلوك -->
  <div class="section"><div class="card"><h2>🧭 ملف السلوك</h2><div id="sec-behavior"><div class="spinner"></div></div></div></div>

  <!-- 6. خطط التعليم المتمايز -->
  <div class="section"><div class="card"><h2>🧩 خطط التعليم المتمايز</h2><div id="sec-plans"><div class="spinner"></div></div></div></div>

  <!-- 7. الفعاليات والتقويم -->
  <div class="section"><div class="card"><h2>📅 الفعاليات والتقويم</h2><div id="sec-calendar"><div class="spinner"></div></div></div></div>

  <!-- 8. التنبيهات -->
  <div class="section"><div class="card"><h2>🔔 التنبيهات</h2><div id="sec-notifs"><div class="spinner"></div></div></div></div>

  <!-- 9. رسالة للمدرسة -->
  <div class="section"><div class="card"><h2>✉️ رسالة للمدرسة</h2>
    <label class="lbl" for="msg-target">إرسال إلى</label>
    <select id="msg-target">
      <option value="teacher">المعلمة</option>
      <option value="principal">المديرة</option>
      <option value="counselor">الأخصائية</option>
      <option value="admin">الإدارة</option>
    </select>
    <label class="lbl" for="msg-text">نص الرسالة</label>
    <textarea id="msg-text" placeholder="اكتبي رسالتك هنا"></textarea>
    <div style="margin-top:12px"><button class="btn" id="msg-send" type="button">إرسال الرسالة</button></div>
    <div id="msg-status"></div>
    <h2 style="margin-top:22px;font-size:1rem">💬 آخر الردود</h2>
    <div id="sec-replies"><div class="spinner"></div></div>
  </div></div>
</main>

<!-- نافذة منبثقة عامة -->
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<footer>NAFAS FOR ARTIFICIAL INTELLIGENCE · CN-6573712 · أبوظبي</footer>

<script>
(function () {
  'use strict';

  var user = null;
  var students = [];
  var current = null;        // الطالبة المختارة
  var approvals = [];        // موافقات ولي الأمر للطالبة المختارة
  var tripsCache = [];
  var mediaConsentData = null; // إذن التصوير الإعلامي العام من parent_credentials
  var loadToken = 0;

  var $ = function (id) { return document.getElementById(id); };

  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function todayStr() {
    var d = new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function fmtDate(v) {
    if (!v) return '—';
    var d = new Date(v);
    if (isNaN(d.getTime())) return esc(v);
    var m = d.getMonth() + 1, day = d.getDate();
    return (day < 10 ? '0' : '') + day + '/' + (m < 10 ? '0' : '') + m + '/' + d.getFullYear();
  }
  function num(n) { return '<span class="num">' + esc(n) + '</span>'; }
  function spinner() { return '<div class="spinner"></div>'; }
  function emptyBox(t) { return '<div class="empty">' + esc(t) + '</div>'; }
  function errBox(t) { return '<div class="err">⚠️ ' + esc(t || 'تعذّر تحميل البيانات، حاولي مرة أخرى لاحقاً') + '</div>'; }

  function hdrs(extra) {
    var h = { apikey: window.EduOS.SB_KEY, Authorization: 'Bearer ' + window.EduOS.SB_KEY };
    if (extra) { for (var k in extra) { h[k] = extra[k]; } }
    return h;
  }
  // يرمي خطأ عند الفشل ليظهر في القسم المعني
  async function dbFetch(path) {
    var r = await fetch(window.EduOS.SB_URL + '/rest/v1/' + path, { headers: hdrs() });
    if (!r.ok) { throw new Error('HTTP ' + r.status); }
    return r.json();
  }
  async function dbWrite(method, path, body) {
    var r = await fetch(window.EduOS.SB_URL + '/rest/v1/' + path, {
      method: method,
      headers: hdrs({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
      body: JSON.stringify(body)
    });
    if (!r.ok) { throw new Error('HTTP ' + r.status); }
    return true;
  }

  // ---------- النافذة المنبثقة ----------
  function openModal(html) { $('modal').innerHTML = html; $('overlay').classList.add('open'); }
  function closeModal() { $('overlay').classList.remove('open'); $('modal').innerHTML = ''; }

  // ---------- تحميل الطالبات ----------
  async function loadStudents() {
    // استخدام RPC لتجاوز RLS (parent بدون JWT لا يستطيع قراءة parent_credentials مباشرة)
    var SB_URL = window.EduOS.SB_URL;
    var SB_KEY = window.EduOS.SB_KEY;
    var r = await fetch(SB_URL + '/rest/v1/rpc/get_parent_students', {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_national_id: user.national_id })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var result = await r.json();
    // RPC تعيد JSONB — قد تكون مصفوفة مباشرة أو مغلفة في Supabase
    var rows = Array.isArray(result) ? result : (Array.isArray(result[0]) ? result[0] : (result[0] || []));
    if (typeof rows === 'string') { try { rows = JSON.parse(rows); } catch(e) { rows = []; } }
    if (!Array.isArray(rows) || !rows.length) return [];
    return rows;
  }

  // ---------- 1. بطاقة الطالبة ----------
  async function fetchAttendance(s) {
    // student_attendance: student_id = student_number (TEXT)
    try {
      var rows = await dbFetch('student_attendance?student_id=eq.' + encodeURIComponent(s.student_number) + '&select=date,status,attendance_type&limit=2000');
      if (!rows || !rows.length) { return null; }
      var present = 0, total = 0;
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var st = r.status !== undefined ? r.status : (r.attendance_status !== undefined ? r.attendance_status : null);
        if (st === null || st === undefined) {
          if (typeof r.is_present === 'boolean') { st = r.is_present ? 'present' : 'absent'; }
          else if (typeof r.present === 'boolean') { st = r.present ? 'present' : 'absent'; }
        }
        if (st === null || st === undefined) { continue; }
        total++;
        var v = String(st).toLowerCase();
        if (v === 'present' || v === 'حاضر' || v === 'حاضرة' || v === 'p') { present++; }
      }
      if (!total) { return null; }
      return { present: present, total: total, pct: Math.round(present * 100 / total) };
    } catch (e) { return null; }
  }

  function generalConsent() {
    return mediaConsentData; // من parent_credentials مباشرة
  }
  function mediaBadge() {
    var g = generalConsent();
    if (!g || g.media_consent === null || g.media_consent === undefined) {
      return '<span class="badge b-gray">لم يُحدَّد الإذن بعد</span>';
    }
    return g.media_consent ? '<span class="badge b-green">✅ موافق على التصوير</span>' : '<span class="badge b-red">❌ غير موافق</span>';
  }

  async function renderStudentCard(token) {
    var s = current;
    var att = await fetchAttendance(s);
    if (token !== loadToken) { return; }
    var h = '';
    if (students.length > 1) {
      h += '<label class="lbl" for="stu-select">اختيار الطالبة</label><select id="stu-select">';
      for (var i = 0; i < students.length; i++) {
        h += '<option value="' + esc(students[i].id) + '"' + (students[i].id === s.id ? ' selected' : '') + '>' + esc(students[i].name) + '</option>';
      }
      h += '</select><div style="height:14px"></div>';
    }
    h += '<div class="stu-head"><div class="stu-name">👩‍🎓 ' + esc(s.name) + '</div><div id="card-media">' + mediaBadge() + '</div></div>';
    h += '<div class="info-grid">';
    h += '<div class="info-box"><div class="k">الصف</div><div class="v">' + (s.grade !== null && s.grade !== undefined && s.grade !== '' ? num(s.grade) : '—') + '</div></div>';
    h += '<div class="info-box"><div class="k">الشعبة</div><div class="v">' + (s.class_name ? esc(s.class_name) : '—') + '</div></div>';
    h += '<div class="info-box"><div class="k">رقم الطالبة</div><div class="v">' + (s.student_number ? num(s.student_number) : '—') + '</div></div>';
    if (att) {
      var cls = att.pct >= 90 ? 'b-green' : (att.pct >= 75 ? 'b-yellow' : 'b-red');
      h += '<div class="info-box"><div class="k">نسبة الحضور</div><div class="v"><span class="badge ' + cls + '">' + num(att.pct + '%') + '</span> <span class="muted">(' + num(att.present + '/' + att.total) + ')</span></div></div>';
    } else {
      h += '<div class="info-box"><div class="k">نسبة الحضور</div><div class="v muted" style="font-size:.95rem">البيانات قيد التحديث</div></div>';
    }
    h += '</div>';
    $('sec-student').innerHTML = h;
    var sel = $('stu-select');
    if (sel) {
      sel.addEventListener('change', function () {
        var id = Number(sel.value);
        for (var k = 0; k < students.length; k++) { if (students[k].id === id) { current = students[k]; break; } }
        loadAll();
      });
    }
  }

  // ---------- 2. موافقة التصوير ----------
  function renderMedia() {
    var g = generalConsent();
    var h = '<div class="row"><div>' + mediaBadge();
    if (g && (g.media_consent_at || g.consent_at)) { h += ' <span class="muted">آخر تحديث: ' + fmtDate(g.media_consent_at || g.consent_at) + '</span>'; }
    h += '</div><button class="btn" type="button" data-act="media-edit">تحديث الإذن</button></div>';
    $('sec-media').innerHTML = h;
    var cm = $('card-media'); if (cm) { cm.innerHTML = mediaBadge(); }
  }
  function openMediaModal() {
    var g = generalConsent();
    var val = g ? (g.media_consent ? 'yes' : 'no') : 'yes';
    var h = '<h3>📸 تحديث إذن التصوير الإعلامي</h3>';
    h += '<p class="muted">يسمح هذا الإذن للمدرسة بتصوير ' + esc(current.name) + ' في الأنشطة ونشر الصور إعلامياً.</p>';
    h += '<div class="radio-row" id="media-radios">';
    h += '<label class="' + (val === 'yes' ? 'sel' : '') + '"><input type="radio" name="media-val" value="yes"' + (val === 'yes' ? ' checked' : '') + '><span>✅ موافقة</span></label>';
    h += '<label class="' + (val === 'no' ? 'sel' : '') + '"><input type="radio" name="media-val" value="no"' + (val === 'no' ? ' checked' : '') + '><span>❌ رفض</span></label>';
    h += '</div><div id="modal-status"></div>';
    h += '<div class="modal-actions"><button class="btn" type="button" data-act="media-save">حفظ</button><button class="btn btn-ghost" type="button" data-act="close">إلغاء</button></div>';
    openModal(h);
  }
  async function saveApproval(tripId, parentConsent, mediaConsent) {
    var base = 'field_trip_approvals?trip_id=eq.' + encodeURIComponent(tripId) +
      '&national_id=eq.' + encodeURIComponent(user.national_id) +
      '&student_number=eq.' + encodeURIComponent(current.student_number);
    var existing = await dbFetch(base + '&select=trip_id');
    var body = { parent_consent: parentConsent, media_consent: mediaConsent, consent_at: new Date().toISOString() };
    if (existing.length) {
      await dbWrite('PATCH', base, body);
    } else {
      body.trip_id = tripId;
      body.national_id = user.national_id;
      body.student_number = current.student_number;
      await dbWrite('POST', 'field_trip_approvals', body);
    }
  }
  async function saveMedia(btn) {
    var chosen = document.querySelector('input[name="media-val"]:checked');
    var yes = chosen && chosen.value === 'yes';
    btn.disabled = true;
    $('modal-status').innerHTML = spinner();
    try {
      // حفظ إذن التصوير العام في parent_credentials مباشرة
      await dbWrite('PATCH', 'parent_credentials?national_id=eq.' + encodeURIComponent(user.national_id),
        { media_consent: yes, media_consent_at: new Date().toISOString() });
      mediaConsentData = { media_consent: yes, media_consent_at: new Date().toISOString() };
      closeModal();
      renderMedia();
    } catch (e) {
      btn.disabled = false;
      $('modal-status').innerHTML = errBox('تعذّر حفظ الإذن، حاولي مرة أخرى');
    }
  }

  async function reloadApprovals() {
    approvals = await dbFetch('field_trip_approvals?national_id=eq.' + encodeURIComponent(user.national_id) +
      '&student_number=eq.' + encodeURIComponent(current.student_number) + '&select=trip_id,national_id,student_number,parent_consent,media_consent,consent_at&order=consent_at.desc');
  }

  // ---------- 3. الرحلات ----------
  function tripApproval(tripId) {
    for (var i = 0; i < approvals.length; i++) {
      if (Number(approvals[i].trip_id) === Number(tripId) && Number(tripId) !== 0) { return approvals[i]; }
    }
    return null;
  }
  function renderTrips() {
    if (!tripsCache.length) { $('sec-trips').innerHTML = emptyBox('لا توجد رحلات قادمة حالياً'); return; }
    var h = '';
    for (var i = 0; i < tripsCache.length; i++) {
      var t = tripsCache[i];
      var ap = tripApproval(t.id);
      var ok = ap && ap.parent_consent;
      h += '<div class="item"><div class="row"><div><div style="font-weight:800">' + esc(t.title) + '</div>';
      h += '<div class="muted">📅 ' + fmtDate(t.trip_date) + ' · ' + (t.trip_type || t.type ? esc(t.trip_type || t.type) : 'رحلة مدرسية') + '</div>';
      if (t.classes && t.classes.length) { h += '<div class="muted">الصفوف: ' + esc(t.classes.join('، ')) + '</div>'; }
      h += '</div><div>';
      if (ok) {
        h += '<span class="badge b-green">✅ تمت الموافقة</span>';
        h += ' <span class="badge ' + (ap.media_consent ? 'b-blue' : 'b-gray') + '">' + (ap.media_consent ? 'مع التصوير' : 'بدون تصوير') + '</span>';
      } else {
        h += '<button class="btn btn-green" type="button" data-act="trip-open" data-trip="' + esc(t.id) + '">موافقة على الرحلة</button>';
      }
      h += '</div></div></div>';
    }
    $('sec-trips').innerHTML = h;
  }
  function openTripModal(tripId) {
    var t = null;
    for (var i = 0; i < tripsCache.length; i++) { if (Number(tripsCache[i].id) === Number(tripId)) { t = tripsCache[i]; break; } }
    if (!t) { return; }
    var g = generalConsent();
    var h = '<h3>🚌 الموافقة على الرحلة</h3>';
    h += '<div class="item" style="margin-top:0"><div style="font-weight:800">' + esc(t.title) + '</div>';
    h += '<div class="muted">📅 ' + fmtDate(t.trip_date) + '</div>';
    h += '<div class="muted">النوع: ' + (t.trip_type || t.type || '—') + '</div>';
    if (t.classes && t.classes.length) { h += '<div class="muted">الصفوف: ' + esc(t.classes.join('، ')) + '</div>'; }
    h += '<div class="muted">الطالبة: ' + esc(current.name) + '</div></div>';
    h += '<label class="chk"><input type="checkbox" id="trip-media"' + (g && g.media_consent ? ' checked' : '') + '> <span>أوافق على التصوير الإعلامي خلال هذه الرحلة</span></label>';
    h += '<div id="modal-status"></div>';
    h += '<div class="modal-actions"><button class="btn btn-green" type="button" data-act="trip-confirm" data-trip="' + esc(t.id) + '">تأكيد الموافقة</button><button class="btn btn-ghost" type="button" data-act="close">إلغاء</button></div>';
    openModal(h);
  }
  async function confirmTrip(btn, tripId) {
    var media = $('trip-media').checked;
    btn.disabled = true;
    $('modal-status').innerHTML = spinner();
    try {
      await saveApproval(tripId, true, media);
      await reloadApprovals();
      closeModal();
      renderTrips();
    } catch (e) {
      btn.disabled = false;
      $('modal-status').innerHTML = errBox('تعذّر حفظ الموافقة، حاولي مرة أخرى');
    }
  }

  // ---------- 4. الدرجات ----------
  function gradeClass(p) { return p >= 90 ? 'g-green' : (p >= 75 ? 'g-blue' : (p >= 60 ? 'g-yellow' : 'g-red')); }
  function renderGrades(rows) {
    var seen = {}, list = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!r.subject || seen[r.subject]) { continue; }
      seen[r.subject] = true; list.push(r);
    }
    if (!list.length) { $('sec-grades').innerHTML = emptyBox('لا توجد نتائج دراسية مسجَّلة حالياً'); return; }
    var h = '<div class="grades-grid">';
    for (var j = 0; j < list.length; j++) {
      var g = list[j];
      var sc = Number(g.term_total !== undefined ? g.term_total : (g.score !== undefined ? g.score : g.summative || 0));
    var mx = Number(g.max_score || 100);
      var pct = mx > 0 ? Math.round(sc * 100 / mx) : null;
      h += '<div class="g-card ' + (pct === null ? 'g-blue' : gradeClass(pct)) + '"><div class="sub">' + esc(g.subject) + '</div>';
      h += '<div class="sc">' + num(sc + ' / ' + mx) + '</div>';
      h += '<div class="pc">' + (pct === null ? '—' : num(pct + '%')) + '</div>';
      h += '<div class="muted" style="color:inherit;opacity:.8">' + (g.term ? esc(g.term) : '') + (g.academic_year ? ' · ' + num(g.academic_year) : '') + '</div></div>';
    }
    h += '</div>';
    $('sec-grades').innerHTML = h;
  }

  // ---------- 5. السلوك ----------
  var DEGREES = { 1: ['خفيف', 'b-yellow'], 2: ['متوسط', 'b-yellow'], 3: ['شديد', 'b-red'] };
  function renderBehavior(rows) {
    if (!rows.length) { $('sec-behavior').innerHTML = '<div class="empty" style="background:#F0FDF4;border-color:#BBF7D0;color:#166534">✅ لا حوادث سلوكية مفتوحة</div>'; return; }
    var h = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var d = DEGREES[r.degree] || ['غير محدّدة', 'b-gray'];
      h += '<div class="item"><div class="row"><span class="badge ' + d[1] + '">الدرجة: ' + esc(d[0]) + '</span><span class="muted">' + fmtDate(r.created_at) + '</span></div>';
      h += '<div style="margin-top:8px"><b>الوصف:</b> ' + (r.description ? esc(r.description) : '—') + '</div>';
      h += '<div><b>الإجراء المتخذ:</b> ' + (r.action_taken ? esc(r.action_taken) : 'لم يُسجَّل إجراء بعد') + '</div></div>';
    }
    $('sec-behavior').innerHTML = h;
  }

  // ---------- 6. الخطط ----------
  var PLAN_STATUS = { active: ['نشطة', 'b-green'], draft: ['مسودة', 'b-gray'], completed: ['مكتملة', 'b-blue'], closed: ['مغلقة', 'b-gray'], pending: ['قيد الانتظار', 'b-yellow'] };
  function renderPlans(rows) {
    if (!rows.length) { $('sec-plans').innerHTML = emptyBox('لا خطط مسجَّلة حالياً'); return; }
    var h = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var st = PLAN_STATUS[String(r.status || '').toLowerCase()] || [r.status || '—', 'b-gray'];
      h += '<div class="item"><div class="row"><div><div style="font-weight:800">' + esc(r.plan_type || 'خطة') + '</div>';
      h += '<div class="muted">المادة: ' + (r.subject ? esc(r.subject) : '—') + ' · ' + fmtDate(r.created_at) + '</div></div>';
      h += '<span class="badge ' + st[1] + '">' + esc(st[0]) + '</span></div></div>';
    }
    $('sec-plans').innerHTML = h;
  }

  // ---------- 7. التقويم ----------
  function renderCalendar(rows) {
    if (!rows.length) { $('sec-calendar').innerHTML = emptyBox('لا فعاليات قادمة في التقويم'); return; }
    var h = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      h += '<div class="item"><div class="row"><div><div style="font-weight:800">' + esc(r.event_name || r.title || '—') + '</div>';
      h += '<div class="muted">📅 ' + fmtDate(r.event_date) + '</div></div>';
      h += '<span class="badge b-blue">' + (r.event_type ? esc(r.event_type) : 'فعالية') + '</span></div></div>';
    }
    $('sec-calendar').innerHTML = h;
  }

  // ---------- 8. التنبيهات ----------
  function renderNotifs(rows) {
    if (!rows.length) { $('sec-notifs').innerHTML = emptyBox('لا توجد تنبيهات حالياً'); return; }
    var h = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      h += '<div class="item"><div class="row"><div style="font-weight:800">' + esc(r.title) + '</div><span class="muted">' + fmtDate(r.created_at) + '</span></div>';
      if (r.body) { h += '<div style="margin-top:6px">' + esc(r.body) + '</div>'; }
      var ntype = r.notification_type || r.type;
      if (ntype) { h += '<div style="margin-top:6px"><span class="badge b-gray">' + esc(ntype) + '</span></div>'; }
      h += '</div>';
    }
    $('sec-notifs').innerHTML = h;
  }

  // ---------- 9. الرسائل ----------
  var ROLE_LABEL = { teacher: 'المعلمة', principal: 'المديرة', counselor: 'الأخصائية', admin: 'الإدارة' };
  function renderReplies(rows) {
    if (!rows.length) { $('sec-replies').innerHTML = emptyBox('لا توجد ردود بعد'); return; }
    var h = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      h += '<div class="item"><div class="muted">رسالتك · ' + fmtDate(r.created_at || r.sent_at) + '</div>';
      h += '<div style="margin-top:4px">' + esc(r.body || r.message || '') + '</div>';
      h += '<div class="reply"><b>الرد</b> <span class="muted">(' + fmtDate(r.replied_at) + ')</span><div>' + esc(r.reply) + '</div></div></div>';
    }
    $('sec-replies').innerHTML = h;
  }
  async function sendMessage() {
    var txt = $('msg-text').value.trim();
    var st = $('msg-status');
    if (!txt) { st.innerHTML = errBox('اكتبي نص الرسالة أولاً'); return; }
    var btn = $('msg-send');
    btn.disabled = true;
    st.innerHTML = spinner();
    try {
      // parent_messages: يستخدم student_id = student_number, body, message_type, direction
      await dbWrite('POST', 'parent_messages', {
        student_id: current.student_number,
        student_name: current.name,
        body: txt,
        message_type: $('msg-target').value,
        direction: 'parent_to_school',
        status: 'unread',
        created_at: new Date().toISOString()
      });
      $('msg-text').value = '';
      st.innerHTML = '<div class="msg-ok">✅ تم إرسال الرسالة بنجاح</div>';
    } catch (e) {
      st.innerHTML = errBox('تعذّر إرسال الرسالة، حاولي مرة أخرى');
    }
    btn.disabled = false;
  }

  // ---------- تحميل كل الأقسام ----------
  async function section(id, fn) {
    $(id).innerHTML = spinner();
    try { await fn(); } catch (e) { $(id).innerHTML = errBox(); }
  }

  async function loadAll() {
    var token = ++loadToken;
    var s = current;
    var sid = encodeURIComponent(s.id);
    $('sec-student').innerHTML = spinner();
    $('msg-status').innerHTML = '';

    // تحميل إذن التصوير العام من parent_credentials
    var pMediaConsent = dbFetch('parent_credentials?national_id=eq.' + encodeURIComponent(user.national_id) + '&select=media_consent,media_consent_at')
      .then(function(rows) { mediaConsentData = (rows && rows.length) ? rows[0] : null; })
      .catch(function() { mediaConsentData = null; });

    var pApprovals = reloadApprovals().then(function () { return true; }, function () { return false; });

    section('sec-media', async function () {
      await pMediaConsent; // انتظر تحميل إذن التصوير
      if (!(await pApprovals)) { throw new Error('approvals'); }
      if (token !== loadToken) { return; }
      renderMedia();
    });
    section('sec-trips', async function () {
      var today = todayStr();
      // field_trips: جلب كل الرحلات القادمة بغض النظر عن الحالة (DB قد يكون فارغاً)
      // field_trips: استخدام trip_type بدلاً من type
      var trips = await dbFetch('field_trips?trip_date=gte.' + today + '&is_active=eq.true&select=id,title,trip_date,trip_type,status,classes,grades&order=trip_date.asc&limit=10');
      if (!(await pApprovals)) { throw new Error('approvals'); }
      if (token !== loadToken) { return; }
      tripsCache = trips;
      renderTrips();
    });
    section('sec-grades', async function () {
      // student_grades يستخدم student_no (رقم الطالبة) وليس student_id
      var rows = await dbFetch('student_grades?student_no=eq.' + encodeURIComponent(current.student_number) + '&select=subject,term_total,formative,summative,term,academic_year&order=academic_year.desc,term.desc');
      if (token === loadToken) { renderGrades(rows); }
    });
    section('sec-behavior', async function () {
      // behavior_incidents: student_id=TEXT(student_number), status يعوض resolved
      var rows = await dbFetch('behavior_incidents?student_id=eq.' + encodeURIComponent(current.student_number) + '&status=neq.resolved&select=degree,violation_type,description,action_taken,created_at,status&order=created_at.desc');
      if (token === loadToken) { renderBehavior(rows); }
    });
    section('sec-plans', async function () {
      // student_diff_plans: student_db_id قد يكون TEXT أو INT — نحاول برقم الطالبة أولاً
      var rows = await dbFetch('student_diff_plans?student_db_id=eq.' + encodeURIComponent(current.student_number) + '&select=plan_type,subject,status,created_at&order=created_at.desc');
      if (token === loadToken) { renderPlans(rows); }
    });
    section('sec-calendar', async function () {
      // academic_calendar: event_name (not title)
      var rows = await dbFetch('academic_calendar?event_date=gte.' + todayStr() + '&select=id,event_name,event_date,event_type&order=event_date.asc&limit=5');
      if (token === loadToken) { renderCalendar(rows); }
    });
    section('sec-notifs', async function () {
      var nid = encodeURIComponent(user.national_id);
      // parent_notifications: يستخدم parent_phone أو student_id — نجلب الأحدث عاماً
      var rows = await dbFetch('parent_notifications?select=id,title,body,notification_type,created_at&order=created_at.desc&limit=10');
      if (token === loadToken) { renderNotifs(rows); }
    });
    section('sec-replies', async function () {
      // parent_messages: يستخدم student_id وbody وdirection — لا parent_id ولا target_role
      var rows = await dbFetch('parent_messages?student_id=eq.' + encodeURIComponent(current.student_number) + '&direction=eq.parent_to_school&reply=not.is.null&select=id,body,message_type,created_at,reply,replied_at&order=replied_at.desc&limit=3');
      if (token === loadToken) { renderReplies(rows); }
    });

    await pApprovals;
    if (token === loadToken) { await renderStudentCard(token); }
  }

  // ---------- التهيئة ----------
  async function init() {
    var tries = 0;
    while ((!window.EduOS || !window.EduOS.SB_URL) && tries < 20) {
      await new Promise(function (r) { setTimeout(r, 100); });
      tries++;
    }
    if (!window.EduOS || !window.EduOS.SB_URL) {
      $('sec-student').innerHTML = errBox('تعذّر تحميل إعدادات المنصة');
      return;
    }
    try { user = JSON.parse(sessionStorage.getItem('edoos_user') || '{}'); } catch (e) { user = {}; }
    if (!user || !user.national_id || (user.role_key && user.role_key !== 'parent')) {
      window.location.href = '../eduos-login/';
      return;
    }

    document.addEventListener('click', function (ev) {
      var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
      if (!el) { if (ev.target === $('overlay')) { closeModal(); } return; }
      var act = el.getAttribute('data-act');
      if (act === 'close') { closeModal(); }
      else if (act === 'media-edit') { openMediaModal(); }
      else if (act === 'media-save') { saveMedia(el); }
      else if (act === 'trip-open') { openTripModal(el.getAttribute('data-trip')); }
      else if (act === 'trip-confirm') { confirmTrip(el, el.getAttribute('data-trip')); }
    });
    document.addEventListener('change', function (ev) {
      if (ev.target && ev.target.name === 'media-val') {
        var labels = document.querySelectorAll('#media-radios label');
        for (var i = 0; i < labels.length; i++) {
          var inp = labels[i].querySelector('input');
          if (inp.checked) { labels[i].classList.add('sel'); } else { labels[i].classList.remove('sel'); }
        }
      }
    });
    $('msg-send').addEventListener('click', sendMessage);

    try {
      students = await loadStudents();
    } catch (e) {
      $('sec-student').innerHTML = errBox('تعذّر تحميل بيانات الطالبات');
      return;
    }
    if (!students.length) {
      $('sec-student').innerHTML = emptyBox('لا توجد طالبات مرتبطات بحسابك حالياً');
      var ids = ['sec-media', 'sec-trips', 'sec-grades', 'sec-behavior', 'sec-plans', 'sec-calendar', 'sec-notifs', 'sec-replies'];
      for (var i = 0; i < ids.length; i++) { $(ids[i]).innerHTML = emptyBox('لا بيانات'); }
      return;
    }
    current = students[0];
    loadAll();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
