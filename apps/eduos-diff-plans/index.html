<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خطط التعليم المتمايز — EduOS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<script src="../platform-auth-guard.js" defer></script>
<script src="../platform-lang.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',Arial,sans-serif;background:#F1F5F9;color:#1E293B;min-height:100vh;font-size:16px}
.header{background:#fff;border-bottom:1px solid #E2E8F0;box-shadow:0 1px 4px rgba(0,0,0,0.08);padding:0 20px;position:sticky;top:0;z-index:200}
.header-inner{max-width:1300px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:42px;height:42px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.brand-info h1{font-size:1.05rem;font-weight:900;color:#0F172A}
.brand-info p{font-size:.78rem;color:#94A3B8}
.header-actions{display:flex;align-items:center;gap:8px}
.btn-back{background:#F1F5F9;border:1px solid #E2E8F0;color:#475569;border-radius:10px;padding:7px 14px;font-family:'Tajawal',Arial,sans-serif;font-size:.82rem;font-weight:700;cursor:pointer}
.btn-new{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-family:'Tajawal',Arial,sans-serif;font-size:.85rem;font-weight:700;cursor:pointer}
.main{max-width:1300px;margin:0 auto;padding:22px 20px 60px}
/* FILTERS */
.filters-bar{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:16px 20px;margin-bottom:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.form-select,.form-input{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#0F172A;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;padding:8px 12px;outline:none}
.form-select:focus,.form-input:focus{border-color:#6C3DD6}
.filter-label{font-size:.8rem;font-weight:700;color:#64748B;white-space:nowrap}
/* TABS */
.tabs{display:flex;gap:4px;background:#F1F5F9;border-radius:12px;padding:4px;margin-bottom:18px;width:fit-content}
.tab{border:none;border-radius:9px;padding:8px 20px;font-family:'Tajawal',Arial,sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;color:#64748B;background:none;transition:.15s}
.tab.active{background:#fff;color:#6C3DD6;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
/* PLAN CARDS */
.plans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.plan-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:18px 20px;transition:.15s}
.plan-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.plan-type-gifted{border-right:4px solid #F59E0B}
.plan-type-struggling{border-right:4px solid #EF4444}
.plan-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.plan-student{font-size:1rem;font-weight:800;color:#0F172A}
.plan-class{font-size:.78rem;color:#94A3B8;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:.75rem;font-weight:700}
.badge-gifted{background:#FEF3C7;color:#92400E}
.badge-struggling{background:#FEE2E2;color:#DC2626}
.badge-purple{background:#F5F3FF;color:#6C3DD6}
.badge-green{background:#DCFCE7;color:#166534}
.badge-gray{background:#F1F5F9;color:#475569}
.plan-subject{font-size:.85rem;color:#6C3DD6;font-weight:700;margin-bottom:8px}
.plan-goals{font-size:.82rem;color:#475569;line-height:1.5;margin-bottom:10px}
.plan-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px solid #F1F5F9;flex-wrap:wrap}
.btn-sm{border:none;border-radius:8px;padding:6px 12px;font-family:'Tajawal',Arial,sans-serif;font-size:.78rem;font-weight:700;cursor:pointer}
.btn-edit{background:#F5F3FF;color:#6C3DD6}
.btn-del{background:#FEE2E2;color:#DC2626}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #F1F5F9}
.modal-header h2{font-size:1.05rem;font-weight:900;color:#0F172A}
.modal-close{background:#F1F5F9;border:none;border-radius:8px;width:30px;height:30px;font-size:1rem;cursor:pointer;color:#475569}
.modal-body{padding:20px 22px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.82rem;font-weight:700;color:#475569;margin-bottom:5px}
.form-input2,.form-select2,.form-textarea{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#0F172A;font-family:'Tajawal',Arial,sans-serif;font-size:.9rem;padding:9px 13px;width:100%;outline:none}
.form-input2:focus,.form-select2:focus,.form-textarea:focus{border-color:#6C3DD6}
.form-textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid #F1F5F9}
.btn-cancel{background:#F1F5F9;border:none;border-radius:10px;padding:9px 18px;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;color:#475569}
.btn-save{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer}
/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:14px 16px;text-align:center}
.stat-val{font-size:1.8rem;font-weight:900}
.stat-lbl{font-size:.75rem;color:#94A3B8;margin-top:2px}
.empty{text-align:center;padding:60px 20px;color:#94A3B8}
.empty .icon{font-size:2.6rem;margin-bottom:10px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#0F172A;color:#F8FAFC;border-radius:12px;padding:11px 22px;font-size:.88rem;z-index:9999;display:none;max-width:300px;text-align:center}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:1rem;font-weight:900;color:#0F172A}
@media(max-width:640px){.stats-row{grid-template-columns:repeat(2,1fr)}.form-row{grid-template-columns:1fr}.plans-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">🎯</div>
      <div class="brand-info">
        <h1>خطط التعليم المتمايز</h1>
        <p id="schoolHdr">بوابة الجود الذكية · Powered by EduOS</p>
      </div>
    </div>
    <div class="header-actions">
      <div id="header-tools"></div>
      <button class="btn-back" onclick="goBack()">&#8594; رجوع</button>
      <button class="btn-new" onclick="openCreate()">+ خطة جديدة</button>
    </div>
  </div>
</div>

<div class="main">
  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" style="color:#F59E0B" id="stGifted">—</div><div class="stat-lbl">⭐ خطط الموهوبات</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#EF4444" id="stStruggling">—</div><div class="stat-lbl">🔴 خطط التعزيز</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#6C3DD6" id="stActive">—</div><div class="stat-lbl">📋 نشطة</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#059669" id="stDone">—</div><div class="stat-lbl">✅ مكتملة</div></div>
  </div>

  <!-- FILTERS -->
  <div class="filters-bar">
    <span class="filter-label">تصفية:</span>
    <select class="form-select" id="filterClass" onchange="renderPlans()">
      <option value="">كل الصفوف</option>
    </select>
    <select class="form-select" id="filterSubject" onchange="renderPlans()">
      <option value="">كل المواد</option>
    </select>
    <select class="form-select" id="filterStatus" onchange="renderPlans()">
      <option value="">كل الحالات</option>
      <option value="active">نشطة</option>
      <option value="completed">مكتملة</option>
      <option value="paused">متوقفة</option>
    </select>
    <input class="form-input" type="text" id="searchPlan" placeholder="بحث بالاسم..." oninput="renderPlans()" style="flex:1;min-width:160px">
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" id="tabAll" onclick="setTab('all')">الكل</button>
    <button class="tab" id="tabGifted" onclick="setTab('gifted')">⭐ الموهوبات</button>
    <button class="tab" id="tabStruggling" onclick="setTab('struggling')">🔴 التعزيز</button>
  </div>

  <div class="section-header">
    <div class="section-title" id="sectionTitle">جميع الخطط</div>
    <span id="planCount" style="font-size:.82rem;color:#94A3B8"></span>
  </div>
  <div class="plans-grid" id="plansContainer">
    <div class="empty"><div class="icon">🔄</div><div>جارٍ التحميل...</div></div>
  </div>
</div>

<!-- MODAL: Create/Edit -->
<div class="modal-overlay" id="modalCreate">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">خطة تعليم متمايز جديدة</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">نوع الخطة *</label>
          <select class="form-select2" id="fType">
            <option value="gifted">⭐ خطة الموهوبة</option>
            <option value="struggling">🔴 خطة التعزيز</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">الحالة</label>
          <select class="form-select2" id="fStatus">
            <option value="active">نشطة</option>
            <option value="completed">مكتملة</option>
            <option value="paused">متوقفة</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">اسم الطالبة/الطالب *</label>
        <input class="form-input2" id="fStudent" placeholder="ابحث عن الاسم...">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">الصف والشعبة</label>
          <input class="form-input2" id="fClass" placeholder="مثال: 3A">
        </div>
        <div class="form-group">
          <label class="form-label">المادة</label>
          <input class="form-input2" id="fSubject" placeholder="مثال: الرياضيات">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">مستوى التقدير الحالي</label>
          <select class="form-select2" id="fLevel">
            <option value="4">🟢 متقدم (4)</option>
            <option value="3">🔵 متقن (3)</option>
            <option value="2">🟡 قيد التطور (2)</option>
            <option value="1">🔴 ناشئ (1)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">المستهدف بنهاية الفترة</label>
          <select class="form-select2" id="fTarget">
            <option value="4">🟢 متقدم (4)</option>
            <option value="3">🔵 متقن (3)</option>
            <option value="2">🟡 قيد التطور (2)</option>
            <option value="1">🔴 ناشئ (1)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">الأهداف الفردية</label>
        <textarea class="form-textarea" id="fGoals" placeholder="اذكري الأهداف التعليمية المحددة لهذه الخطة..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">استراتيجيات التدخل</label>
        <textarea class="form-textarea" id="fStrategies" placeholder="مثال: تمارين إثرائية إضافية، مجموعات صغيرة، برنامج تدريبي مكثف..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">الموارد والأدوات</label>
        <textarea class="form-textarea" id="fResources" placeholder="مثال: كتاب إثرائي، أوراق عمل خاصة، برنامج رقمي..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">تاريخ البدء</label>
          <input class="form-input2" type="date" id="fStart">
        </div>
        <div class="form-group">
          <label class="form-label">تاريخ المراجعة</label>
          <input class="form-input2" type="date" id="fReview">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">ملاحظات التقدم</label>
        <textarea class="form-textarea" id="fNotes" placeholder="ملاحظات المتابعة والتقدم..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
      <button class="btn-save" onclick="savePlan()">💾 حفظ الخطة</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL, SB_KEY, session, allPlans = [], currentId = null, currentTab = 'all';
var RUBRIC = {4:{label:'متقدم',color:'#059669',bg:'#DCFCE7'},3:{label:'متقن',color:'#0284C7',bg:'#DBEAFE'},2:{label:'قيد التطور',color:'#D97706',bg:'#FEF3C7'},1:{label:'ناشئ',color:'#DC2626',bg:'#FEE2E2'}};

function goBack(){
  try{ var u=JSON.parse(sessionStorage.getItem('edoos_user')||'{}'); var m={principal:'../eduos-principal/',vice_principal:'../eduos-vice-principal/',admin:'../eduos-admin/',teacher:'../eduos-teacher/',department_head:'../eduos-teacher/'}; window.location.href=m[u.role_key]||'../'; }catch(e){history.back();}
}

document.addEventListener('DOMContentLoaded', function() {
  var tries=0,iv=setInterval(function(){tries++;if(window.EduOS&&window.EduOS.SB_URL){clearInterval(iv);SB_URL=window.EduOS.SB_URL;SB_KEY=window.EduOS.SB_KEY;init();}else if(tries>40){clearInterval(iv);showToast('خطأ في الاتصال');}},100);
});

function init(){
  try{session=JSON.parse(sessionStorage.getItem('edoos_user')||'null');}catch(e){session=null;}
  if(!session||!session.id){window.location.href='../eduos-login/';return;}
  if(window.EduOS&&window.EduOS.school) document.getElementById('schoolHdr').textContent=(window.EduOS.school.shortNameAr||'الجود')+' · Powered by EduOS';
  loadPlans();
}

function authH(json){var h={apikey:SB_KEY,Authorization:'Bearer '+(session&&session.token?session.token:SB_KEY)};if(json)h['Content-Type']='application/json';return h;}

async function loadPlans(){
  try{
    // Filter by teacher if teacher role
    var url=SB_URL+'/rest/v1/student_diff_plans?is_active=eq.true&order=created_at.desc&select=*';
    if(session.role_key==='teacher') url+='&teacher_id=eq.'+String(session.staff_db_id||session.id);
    var res=await fetch(url,{headers:authH()});
    allPlans=await res.json();
    if(!Array.isArray(allPlans))allPlans=[];
    populateFilters();
    updateStats();
    renderPlans();
  }catch(e){
    document.getElementById('plansContainer').innerHTML='<div class="empty"><div class="icon">⚠️</div><div>الجدول غير موجود بعد — سيُنشأ تلقائياً</div><div style="margin-top:10px;font-size:.82rem">ابدئي بإضافة خطة جديدة</div></div>';
    document.getElementById('stGifted').textContent='0';
    document.getElementById('stStruggling').textContent='0';
    document.getElementById('stActive').textContent='0';
    document.getElementById('stDone').textContent='0';
  }
}

function populateFilters(){
  var classes=[...new Set(allPlans.map(function(p){return p.class_name;}).filter(Boolean))].sort();
  var subjects=[...new Set(allPlans.map(function(p){return p.subject;}).filter(Boolean))].sort();
  var cSel=document.getElementById('filterClass'),sSel=document.getElementById('filterSubject');
  cSel.innerHTML='<option value="">كل الصفوف</option>'+classes.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('');
  sSel.innerHTML='<option value="">كل المواد</option>'+subjects.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>';}).join('');
}

function updateStats(){
  document.getElementById('stGifted').textContent=allPlans.filter(function(p){return p.plan_type==='gifted';}).length;
  document.getElementById('stStruggling').textContent=allPlans.filter(function(p){return p.plan_type==='struggling';}).length;
  document.getElementById('stActive').textContent=allPlans.filter(function(p){return p.status==='active';}).length;
  document.getElementById('stDone').textContent=allPlans.filter(function(p){return p.status==='completed';}).length;
}

function setTab(t){
  currentTab=t;
  ['All','Gifted','Struggling'].forEach(function(x){document.getElementById('tab'+x).classList.remove('active');});
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
  var titles={all:'جميع الخطط',gifted:'خطط الموهوبات ⭐',struggling:'خطط التعزيز 🔴'};
  document.getElementById('sectionTitle').textContent=titles[t]||'جميع الخطط';
  renderPlans();
}

function renderPlans(){
  var cls=document.getElementById('filterClass').value;
  var sub=document.getElementById('filterSubject').value;
  var sts=document.getElementById('filterStatus').value;
  var srch=(document.getElementById('searchPlan').value||'').toLowerCase();
  var plans=allPlans.filter(function(p){
    if(currentTab!=='all'&&p.plan_type!==currentTab)return false;
    if(cls&&p.class_name!==cls)return false;
    if(sub&&p.subject!==sub)return false;
    if(sts&&p.status!==sts)return false;
    if(srch&&!(p.student_name||'').toLowerCase().includes(srch))return false;
    return true;
  });
  document.getElementById('planCount').textContent='('+plans.length+' خطة)';
  var container=document.getElementById('plansContainer');
  if(!plans.length){container.innerHTML='<div class="empty"><div class="icon">🎯</div><div>لا توجد خطط في هذا القسم</div><div style="margin-top:8px;font-size:.82rem">اضغط "+ خطة جديدة" لإنشاء خطة</div></div>';return;}
  container.innerHTML=plans.map(function(p){
    var isGifted=p.plan_type==='gifted';
    var currRubric=RUBRIC[p.current_level]||RUBRIC[2];
    var targRubric=RUBRIC[p.target_level]||RUBRIC[3];
    var statusLabel={active:'نشطة',completed:'مكتملة',paused:'متوقفة'}[p.status]||p.status;
    var statusColor={active:'badge-purple',completed:'badge-green',paused:'badge-gray'}[p.status]||'badge-gray';
    return '<div class="plan-card plan-type-'+p.plan_type+'">'
      +'<div class="plan-header">'
      +'<div>'
      +'<div class="plan-student">'+esc(p.student_name)+'</div>'
      +'<div class="plan-class">'+esc(p.class_name||'')+(p.teacher_name?'  ·  '+esc(p.teacher_name):'')+'</div>'
      +'</div>'
      +'<span class="badge '+(isGifted?'badge-gifted':'badge-struggling')+'">'+( isGifted?'⭐ موهوبة':'🔴 تعزيز')+'</span>'
      +'</div>'
      +(p.subject?'<div class="plan-subject">📚 '+esc(p.subject)+'</div>':'')
      +'<div style="display:flex;gap:6px;margin-bottom:8px">'
      +'<span class="badge" style="background:'+currRubric.bg+';color:'+currRubric.color+'">المستوى: '+currRubric.label+'</span>'
      +'<span style="color:#94A3B8;line-height:1.8">←</span>'
      +'<span class="badge" style="background:'+targRubric.bg+';color:'+targRubric.color+'">الهدف: '+targRubric.label+'</span>'
      +'</div>'
      +(p.goals?'<div class="plan-goals">'+esc(p.goals).slice(0,100)+(p.goals.length>100?'...':'')+'</div>':'')
      +'<div class="plan-footer">'
      +'<span class="badge '+statusColor+'">'+statusLabel+'</span>'
      +(p.review_date?'<span class="badge badge-gray">📅 مراجعة: '+formatDate(p.review_date)+'</span>':'')
      +'<div style="display:flex;gap:6px">'
      +'<button class="btn-sm btn-edit" onclick="editPlan(\''+p.id+'\')">✏️ تعديل</button>'
      +'<button class="btn-sm btn-del" onclick="deletePlan(\''+p.id+'\')">🗑️</button>'
      +'</div>'
      +'</div>'
      +'</div>';
  }).join('');
}

function openCreate(){currentId=null;document.getElementById('modalTitle').textContent='خطة تعليم متمايز جديدة';['fStudent','fClass','fSubject','fGoals','fStrategies','fResources','fNotes'].forEach(function(i){document.getElementById(i).value='';});document.getElementById('fType').value='gifted';document.getElementById('fStatus').value='active';document.getElementById('fLevel').value='3';document.getElementById('fTarget').value='4';document.getElementById('fStart').value=new Date().toISOString().slice(0,10);document.getElementById('fReview').value='';document.getElementById('modalCreate').classList.add('show');}

function editPlan(id){
  var p=allPlans.find(function(x){return x.id===id;});if(!p)return;currentId=id;
  document.getElementById('modalTitle').textContent='تعديل الخطة';
  document.getElementById('fType').value=p.plan_type||'gifted';
  document.getElementById('fStatus').value=p.status||'active';
  document.getElementById('fStudent').value=p.student_name||'';
  document.getElementById('fClass').value=p.class_name||'';
  document.getElementById('fSubject').value=p.subject||'';
  document.getElementById('fLevel').value=p.current_level||3;
  document.getElementById('fTarget').value=p.target_level||4;
  document.getElementById('fGoals').value=p.goals||'';
  document.getElementById('fStrategies').value=p.strategies||'';
  document.getElementById('fResources').value=p.resources||'';
  document.getElementById('fNotes').value=p.progress_notes||'';
  document.getElementById('fStart').value=p.start_date||'';
  document.getElementById('fReview').value=p.review_date||'';
  document.getElementById('modalCreate').classList.add('show');
}

async function savePlan(){
  var student=document.getElementById('fStudent').value.trim();
  if(!student){showToast('يرجى إدخال اسم الطالبة/الطالب');return;}
  var body={
    plan_type:document.getElementById('fType').value,
    status:document.getElementById('fStatus').value,
    student_name:student,
    class_name:document.getElementById('fClass').value.trim()||null,
    subject:document.getElementById('fSubject').value.trim()||null,
    current_level:parseInt(document.getElementById('fLevel').value)||3,
    target_level:parseInt(document.getElementById('fTarget').value)||4,
    goals:document.getElementById('fGoals').value.trim()||null,
    strategies:document.getElementById('fStrategies').value.trim()||null,
    resources:document.getElementById('fResources').value.trim()||null,
    progress_notes:document.getElementById('fNotes').value.trim()||null,
    start_date:document.getElementById('fStart').value||null,
    review_date:document.getElementById('fReview').value||null,
    teacher_id:String(session.staff_db_id||session.id),
    teacher_name:session.full_name||session.name||session.username||'',
    academic_year:'2026-2027',
    is_active:true
  };
  try{
    if(currentId){
      await fetch(SB_URL+'/rest/v1/student_diff_plans?id=eq.'+currentId,{method:'PATCH',headers:Object.assign({},authH(true),{'Prefer':'return=minimal'}),body:JSON.stringify(body)});
    }else{
      await fetch(SB_URL+'/rest/v1/student_diff_plans',{method:'POST',headers:Object.assign({},authH(true),{'Prefer':'return=minimal'}),body:JSON.stringify(body)});
    }
    closeModal();showToast('✓ تم حفظ الخطة');loadPlans();
  }catch(e){showToast('خطأ في الحفظ — تأكدي من وجود الجدول في DB');}
}

async function deletePlan(id){
  if(!confirm('حذف الخطة؟'))return;
  await fetch(SB_URL+'/rest/v1/student_diff_plans?id=eq.'+id,{method:'PATCH',headers:Object.assign({},authH(true),{'Prefer':'return=minimal'}),body:JSON.stringify({is_active:false})});
  showToast('✓ تم الحذف');loadPlans();
}

function closeModal(){document.getElementById('modalCreate').classList.remove('show');}
function formatDate(d){if(!d)return'—';var p=d.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d;}
function esc(s){return(s||'').toString().replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},3000);}
</script>
