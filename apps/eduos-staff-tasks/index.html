<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المهام والواجبات — EduOS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<script src="../platform-auth-guard.js" defer></script>
<script src="../platform-lang.js" defer></script>
<script src="../platform-agent-brain.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',Arial,sans-serif;background:#F1F5F9;color:#1E293B;min-height:100vh;font-size:16px}
.header{background:#fff;border-bottom:1px solid #E2E8F0;box-shadow:0 1px 4px rgba(0,0,0,0.08);padding:0 20px;position:sticky;top:0;z-index:200}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:42px;height:42px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.brand-info h1{font-size:1.05rem;font-weight:900;color:#0F172A}
.brand-info p{font-size:.78rem;color:#94A3B8}
.header-actions{display:flex;align-items:center;gap:8px}
.btn-back{background:#F1F5F9;border:1px solid #E2E8F0;color:#475569;border-radius:10px;padding:7px 14px;font-family:'Tajawal',Arial,sans-serif;font-size:.82rem;font-weight:700;cursor:pointer}
.btn-new{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-family:'Tajawal',Arial,sans-serif;font-size:.85rem;font-weight:700;cursor:pointer}
.layout{max-width:1400px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:220px 1fr;gap:20px}
/* SIDEBAR */
.sidebar{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:16px;height:fit-content;position:sticky;top:80px}
.sidebar-title{font-size:.8rem;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #F1F5F9}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:.88rem;font-weight:700;color:#475569;margin-bottom:4px;transition:.15s;border:none;background:none;width:100%;text-align:right}
.nav-item:hover{background:#F5F3FF;color:#6C3DD6}
.nav-item.active{background:#F5F3FF;color:#6C3DD6}
.nav-badge{background:#6C3DD6;color:#fff;border-radius:20px;padding:2px 8px;font-size:.7rem;font-weight:800}
.nav-badge.amber{background:#D97706}
.nav-badge.red{background:#DC2626}
/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:14px 16px;text-align:center}
.stat-val{font-size:1.8rem;font-weight:900;color:#6C3DD6}
.stat-lbl{font-size:.75rem;color:#94A3B8;margin-top:2px}
/* TASKS */
.task-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:18px 20px;margin-bottom:12px;transition:.15s}
.task-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.task-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.task-title{font-size:1rem;font-weight:800;color:#0F172A}
.task-desc{font-size:.85rem;color:#64748B;margin-bottom:10px;line-height:1.5}
.task-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:.75rem;font-weight:700}
.badge-purple{background:#F5F3FF;color:#6C3DD6}
.badge-amber{background:#FEF3C7;color:#92400E}
.badge-red{background:#FEE2E2;color:#DC2626}
.badge-green{background:#DCFCE7;color:#166534}
.badge-blue{background:#DBEAFE;color:#1E40AF}
.badge-gray{background:#F1F5F9;color:#475569}
.task-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid #F1F5F9;flex-wrap:wrap}
.progress-bar-wrap{flex:1;min-width:120px}
.progress-label{font-size:.72rem;color:#94A3B8;margin-bottom:4px;display:flex;justify-content:space-between}
.progress-bar{background:#E2E8F0;border-radius:10px;height:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#6C3DD6,#22D3EE);border-radius:10px;transition:.3s}
.btn-sm{border:none;border-radius:8px;padding:6px 12px;font-family:'Tajawal',Arial,sans-serif;font-size:.78rem;font-weight:700;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff}
.btn-outline{background:#F1F5F9;color:#475569;border:1px solid #E2E8F0}
.btn-danger{background:#FEE2E2;color:#DC2626}
/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:#94A3B8}
.empty .icon{font-size:2.6rem;margin-bottom:10px}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #F1F5F9}
.modal-header h2{font-size:1.05rem;font-weight:900;color:#0F172A}
.modal-close{background:#F1F5F9;border:none;border-radius:8px;width:30px;height:30px;font-size:1rem;cursor:pointer;color:#475569}
.modal-body{padding:20px 22px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.82rem;font-weight:700;color:#475569;margin-bottom:5px}
.form-input,.form-select,.form-textarea{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#0F172A;font-family:'Tajawal',Arial,sans-serif;font-size:.9rem;padding:9px 13px;width:100%;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#6C3DD6}
.form-textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid #F1F5F9}
.btn-cancel{background:#F1F5F9;border:none;border-radius:10px;padding:9px 18px;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;color:#475569}
.btn-save{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer}
/* SUBMISSIONS MODAL */
.sub-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid #E2E8F0;border-radius:10px;margin-bottom:8px}
.sub-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6C3DD6,#22D3EE);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.85rem;flex-shrink:0}
.sub-info{flex:1}
.sub-name{font-size:.88rem;font-weight:700;color:#0F172A}
.sub-content{font-size:.82rem;color:#64748B;margin-top:2px}
.sub-actions{display:flex;gap:6px;margin-top:6px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#0F172A;color:#F8FAFC;border-radius:12px;padding:11px 22px;font-size:.88rem;z-index:9999;display:none;max-width:300px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* MY TASK VIEW */
.my-task-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:18px 20px;margin-bottom:12px}
.my-task-status{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.submit-form{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:14px;margin-top:10px}
@media(max-width:768px){.layout{grid-template-columns:1fr}.sidebar{position:static}.stats-row{grid-template-columns:repeat(2,1fr)}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">📋</div>
      <div class="brand-info">
        <h1>المهام والواجبات</h1>
        <p id="schoolNameHdr">بوابة الجود الذكية · Powered by EduOS</p>
      </div>
    </div>
    <div class="header-actions">
      <div id="header-tools"></div>
      <button class="btn-back" onclick="goBack()">&#8594; رجوع</button>
      <button class="btn-new" id="btnCreateTask" style="display:none" onclick="openCreateModal()">+ مهمة جديدة</button>
    </div>
  </div>
</div>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-title">عرض</div>
    <button class="nav-item active" id="navAll" onclick="setView('all')">📋 كل المهام <span class="nav-badge" id="badgeAll">—</span></button>
    <button class="nav-item" id="navMine" onclick="setView('mine')">🙋 مهامي <span class="nav-badge amber" id="badgeMine">—</span></button>
    <button class="nav-item" id="navPending" onclick="setView('pending')">⏳ بانتظار التسليم <span class="nav-badge red" id="badgePending">—</span></button>
    <button class="nav-item" id="navDone" onclick="setView('done')">✅ مكتملة <span class="nav-badge" id="badgeDone">—</span></button>

    <div class="sidebar-title" style="margin-top:14px">تصفية</div>
    <select class="form-select" id="filterCycle" onchange="renderTasks()" style="margin-bottom:8px;font-size:.82rem">
      <option value="">كل الحلقات</option>
      <option value="kg">KG</option>
      <option value="cycle1">الحلقة الأولى</option>
      <option value="cycle2">الحلقة الثانية</option>
    </select>
    <input class="form-input" type="text" id="searchTask" placeholder="بحث..." oninput="renderTasks()" style="font-size:.82rem">
  </div>

  <!-- MAIN -->
  <div>
    <!-- STATS (managers only) -->
    <div class="stats-row" id="statsRow" style="display:none">
      <div class="stat-card"><div class="stat-val" id="stTotal">—</div><div class="stat-lbl">إجمالي المهام</div></div>
      <div class="stat-card"><div class="stat-val" id="stPending">—</div><div class="stat-lbl">تسليمات منتظَرة</div></div>
      <div class="stat-card"><div class="stat-val" id="stDone">—</div><div class="stat-lbl">مكتملة</div></div>
      <div class="stat-card"><div class="stat-val" id="stOverdue">—</div><div class="stat-lbl">متأخرة</div></div>
    </div>
    <div id="tasksContainer"></div>
  </div>
</div>

<!-- MODAL: Create/Edit Task -->
<div class="modal-overlay" id="modalCreate">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalCreateTitle">مهمة جديدة</h2>
      <button class="modal-close" onclick="closeModal('modalCreate')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">عنوان المهمة *</label>
        <input class="form-input" id="fTitle" placeholder="مثال: رفع خطة الأسبوع الأول">
      </div>
      <div class="form-group">
        <label class="form-label">الوصف</label>
        <textarea class="form-textarea" id="fDesc" placeholder="تفاصيل المهمة والمتطلبات..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">نوع التسليم</label>
          <select class="form-select" id="fSubType">
            <option value="text">نص مكتوب</option>
            <option value="link">رابط</option>
            <option value="portal">عبر البوابة</option>
            <option value="none">إقرار فقط</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">آخر موعد للتسليم</label>
          <input class="form-input" type="date" id="fDue">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">الحلقة المستهدفة</label>
          <select class="form-select" id="fCycle">
            <option value="all">الجميع</option>
            <option value="kg">KG</option>
            <option value="cycle1">الحلقة الأولى</option>
            <option value="cycle2">الحلقة الثانية</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">النقاط</label>
          <input class="form-input" type="number" id="fPoints" value="5" min="0" max="100">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">رابط البوابة (اختياري)</label>
        <input class="form-input" id="fPortalLink" placeholder="https://...">
      </div>
      <div class="form-group">
        <label class="form-label">تفويض المراجعة إلى (اختياري)</label>
        <select class="form-select" id="fDelegate">
          <option value="">لا تفويض — أراجع بنفسي</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('modalCreate')">إلغاء</button>
      <button class="btn-save" onclick="saveTask()">💾 حفظ المهمة</button>
    </div>
  </div>
</div>

<!-- MODAL: Submissions -->
<div class="modal-overlay" id="modalSubs">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalSubsTitle">التسليمات</h2>
      <button class="modal-close" onclick="closeModal('modalSubs')">✕</button>
    </div>
    <div class="modal-body" id="subsContent">
      <div class="empty"><div class="icon">⏳</div><div>جارٍ التحميل...</div></div>
    </div>
  </div>
</div>

<!-- MODAL: Submit Task -->
<div class="modal-overlay" id="modalSubmit">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalSubmitTitle">تسليم المهمة</h2>
      <button class="modal-close" onclick="closeModal('modalSubmit')">✕</button>
    </div>
    <div class="modal-body">
      <div id="submitFormContent"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('modalSubmit')">إلغاء</button>
      <button class="btn-save" onclick="submitTask()">✅ تسليم</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL, SB_KEY, session, isManager, currentView = 'all', allTasks = [], allSubs = [], currentTaskId = null;

function goBack() {
  try {
    var u = JSON.parse(sessionStorage.getItem('edoos_user') || '{}');
    var map = {principal:'../eduos-principal/',vice_principal:'../eduos-vice-principal/',admin:'../eduos-admin/',teacher:'../eduos-teacher/',department_head:'../eduos-teacher/'};
    window.location.href = map[u.role_key] || '../';
  } catch(e){ history.back(); }
}

document.addEventListener('DOMContentLoaded', function() {
  var tries = 0;
  var iv = setInterval(function() {
    tries++;
    if (window.EduOS && window.EduOS.SB_URL) {
      clearInterval(iv);
      SB_URL = window.EduOS.SB_URL;
      SB_KEY = window.EduOS.SB_KEY;
      init();
    } else if (tries > 40) { clearInterval(iv); showToast('خطأ في الاتصال'); }
  }, 100);
});

function init() {
  try { session = JSON.parse(sessionStorage.getItem('edoos_user') || 'null'); } catch(e){ session = null; }
  if (!session || !session.id) { window.location.href = '../eduos-login/'; return; }

  isManager = ['principal','vice_principal','admin','department_head'].indexOf(session.role_key) >= 0;
  if (isManager) {
    document.getElementById('btnCreateTask').style.display = 'flex';
    document.getElementById('statsRow').style.display = 'grid';
    loadVPs();
  }

  if (window.EduOS && window.EduOS.school) {
    document.getElementById('schoolNameHdr').textContent = (window.EduOS.school.shortNameAr||'الجود') + ' · Powered by EduOS';
  }

  loadTasks();
}

function authH(json) {
  var h = { apikey: SB_KEY, Authorization: 'Bearer ' + (session && session.token ? session.token : SB_KEY) };
  if (json) h['Content-Type'] = 'application/json';
  return h;
}

async function loadVPs() {
  try {
    var res = await fetch(SB_URL + '/rest/v1/staff_profiles?role_key=in.(vice_principal,department_head)&is_active=eq.true&select=staff_db_id,name_ar', { headers: authH() });
    var rows = await res.json();
    var sel = document.getElementById('fDelegate');
    if (Array.isArray(rows)) rows.forEach(function(r) {
      var o = document.createElement('option');
      o.value = r.staff_db_id;
      o.textContent = r.name_ar;
      sel.appendChild(o);
    });
  } catch(e){}
}

async function loadTasks() {
  try {
    var url = SB_URL + '/rest/v1/staff_tasks?is_active=eq.true&order=due_date.asc&select=*';
    var res = await fetch(url, { headers: authH() });
    var rows = await res.json();
    allTasks = Array.isArray(rows) ? rows : [];

    // Load submissions
    var sUrl = SB_URL + '/rest/v1/staff_task_submissions?select=*';
    var sRes = await fetch(sUrl, { headers: authH() });
    allSubs = Array.isArray(await sRes.json()) ? await (await fetch(sUrl, { headers: authH() })).json() : [];
    try { allSubs = await sRes.json(); if (!Array.isArray(allSubs)) allSubs = []; } catch(e){ allSubs = []; }

    updateBadges();
    renderTasks();
  } catch(e) {
    document.getElementById('tasksContainer').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>خطأ في التحميل</div></div>';
  }
}

function getTaskSubs(taskId) { return allSubs.filter(function(s){ return s.task_id === taskId; }); }
function mySubForTask(taskId) { return allSubs.find(function(s){ return s.task_id === taskId && s.staff_db_id === String(session.staff_db_id || session.id); }); }

function isOverdue(task) { return task.due_date && new Date(task.due_date) < new Date() && task.due_date !== new Date().toISOString().slice(0,10); }

function isAssignedToMe(task) {
  var myId = String(session.staff_db_id || session.id);
  if (Array.isArray(task.assigned_to) && task.assigned_to.length) return task.assigned_to.indexOf(myId) >= 0;
  if (Array.isArray(task.assigned_cycles) && task.assigned_cycles.length) {
    var myCycle = session.vp_cycle || session.coord_cycle || '';
    return task.assigned_cycles.indexOf('all') >= 0 || task.assigned_cycles.indexOf(myCycle) >= 0 || task.assigned_cycles.indexOf('all') >= 0;
  }
  return true; // default: all staff
}

function updateBadges() {
  var mine = allTasks.filter(isAssignedToMe);
  var pending = mine.filter(function(t){ return !mySubForTask(t.id); });
  var done = mine.filter(function(t){ return !!mySubForTask(t.id); });
  document.getElementById('badgeAll').textContent = allTasks.length;
  document.getElementById('badgeMine').textContent = mine.length;
  document.getElementById('badgePending').textContent = pending.length;
  document.getElementById('badgeDone').textContent = done.length;

  if (isManager) {
    var overdue = allTasks.filter(isOverdue).length;
    document.getElementById('stTotal').textContent = allTasks.length;
    document.getElementById('stPending').textContent = allSubs.filter(function(s){ return s.status === 'pending'; }).length;
    document.getElementById('stDone').textContent = allSubs.filter(function(s){ return s.status === 'approved'; }).length;
    document.getElementById('stOverdue').textContent = overdue;
  }
}

function setView(v) {
  currentView = v;
  ['all','mine','pending','done'].forEach(function(x){ document.getElementById('nav'+cap(x)).classList.remove('active'); });
  document.getElementById('nav'+cap(v)).classList.add('active');
  renderTasks();
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function renderTasks() {
  var search = (document.getElementById('searchTask').value||'').toLowerCase();
  var cycle = document.getElementById('filterCycle').value;
  var container = document.getElementById('tasksContainer');

  var tasks = allTasks.filter(function(t) {
    if (currentView === 'mine' && !isAssignedToMe(t)) return false;
    if (currentView === 'pending' && (mySubForTask(t.id) || !isAssignedToMe(t))) return false;
    if (currentView === 'done' && !mySubForTask(t.id)) return false;
    if (cycle && Array.isArray(t.assigned_cycles) && t.assigned_cycles.indexOf('all') < 0 && t.assigned_cycles.indexOf(cycle) < 0) return false;
    if (search && t.title.toLowerCase().indexOf(search) < 0) return false;
    return true;
  });

  if (!tasks.length) {
    container.innerHTML = '<div class="empty"><div class="icon">📋</div><div>لا توجد مهام في هذا القسم</div></div>';
    return;
  }

  container.innerHTML = tasks.map(function(t) {
    var subs = getTaskSubs(t.id);
    var mySub = mySubForTask(t.id);
    var overdue = isOverdue(t);
    var dueStr = t.due_date ? formatDate(t.due_date) : '—';
    var cyclesStr = Array.isArray(t.assigned_cycles) ? t.assigned_cycles.map(function(c){ return cycleLabel(c); }).join(' · ') : 'الجميع';

    var statusBadge = '';
    if (mySub) {
      if (mySub.status === 'approved') statusBadge = '<span class="badge badge-green">✅ مقبول</span>';
      else if (mySub.status === 'rejected') statusBadge = '<span class="badge badge-red">❌ مرفوض</span>';
      else statusBadge = '<span class="badge badge-amber">⏳ تحت المراجعة</span>';
    } else if (overdue) {
      statusBadge = '<span class="badge badge-red">⚠️ متأخرة</span>';
    } else {
      statusBadge = '<span class="badge badge-blue">🔔 بانتظار تسليمك</span>';
    }

    var pct = 0;
    if (isManager && subs.length) { pct = Math.round(subs.filter(function(s){return s.status==='approved';}).length / subs.length * 100); }

    return '<div class="task-card">'
      + '<div class="task-header">'
      + '<div>'
      + '<div class="task-title">' + esc(t.title) + '</div>'
      + (t.description ? '<div class="task-desc" style="margin-top:4px">' + esc(t.description) + '</div>' : '')
      + '</div>'
      + '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">'
      + statusBadge
      + (t.points ? '<span class="badge badge-purple">⭐ ' + t.points + ' نقطة</span>' : '')
      + '</div>'
      + '</div>'
      + '<div class="task-meta">'
      + '<span class="badge badge-gray">📅 ' + dueStr + '</span>'
      + '<span class="badge badge-gray">👥 ' + cyclesStr + '</span>'
      + '<span class="badge badge-gray">📤 ' + subTypeLabel(t.submission_type) + '</span>'
      + '</div>'
      + (isManager ? '<div class="progress-bar-wrap" style="margin-bottom:10px">'
          + '<div class="progress-label"><span>التسليمات: ' + subs.length + '</span><span>' + pct + '%</span></div>'
          + '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>'
          + '</div>' : '')
      + '<div class="task-footer">'
      + (isManager ? '<div style="display:flex;gap:6px"><button class="btn-sm btn-primary" onclick="openSubs(\'' + t.id + '\',\'' + esc(t.title) + '\')">👁 التسليمات (' + subs.length + ')</button>'
          + '<button class="btn-sm btn-outline" onclick="editTask(\'' + t.id + '\')">✏️</button>'
          + '<button class="btn-sm btn-danger" onclick="deleteTask(\'' + t.id + '\')">🗑️</button>'
          + '</div>' : '')
      + (!mySub && isAssignedToMe(t) ? '<button class="btn-sm btn-primary" onclick="openSubmit(\'' + t.id + '\',\'' + esc(t.title) + '\',\'' + (t.submission_type||'text') + '\')">📤 تسليم</button>' : '')
      + (mySub && mySub.status === 'rejected' ? '<button class="btn-sm btn-outline" onclick="openSubmit(\'' + t.id + '\',\'' + esc(t.title) + '\',\'' + (t.submission_type||'text') + '\')">🔄 إعادة تسليم</button>' : '')
      + (t.portal_link ? '<a href="' + esc(t.portal_link) + '" target="_blank" class="btn-sm btn-outline" style="text-decoration:none">🔗 البوابة</a>' : '')
      + '</div>'
      + '</div>';
  }).join('');
}

function subTypeLabel(t) {
  var m = { text:'نص', link:'رابط', portal:'عبر البوابة', none:'إقرار' };
  return m[t] || t || '—';
}
function cycleLabel(c) {
  var m = { all:'الجميع', kg:'KG', cycle1:'ح1', cycle2:'ح2' };
  return m[c] || c;
}
function formatDate(d) {
  if (!d) return '—';
  var p = d.split('-');
  return p.length === 3 ? p[2]+'/'+p[1]+'/'+p[0] : d;
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function openCreateModal() {
  currentTaskId = null;
  document.getElementById('modalCreateTitle').textContent = 'مهمة جديدة';
  ['fTitle','fDesc','fPortalLink'].forEach(function(id){ document.getElementById(id).value = ''; });
  document.getElementById('fSubType').value = 'text';
  document.getElementById('fCycle').value = 'all';
  document.getElementById('fPoints').value = '5';
  document.getElementById('fDelegate').value = '';
  document.getElementById('fDue').value = '';
  document.getElementById('modalCreate').classList.add('show');
}

function editTask(id) {
  var t = allTasks.find(function(x){ return x.id === id; });
  if (!t) return;
  currentTaskId = id;
  document.getElementById('modalCreateTitle').textContent = 'تعديل المهمة';
  document.getElementById('fTitle').value = t.title||'';
  document.getElementById('fDesc').value = t.description||'';
  document.getElementById('fSubType').value = t.submission_type||'text';
  document.getElementById('fCycle').value = (Array.isArray(t.assigned_cycles)&&t.assigned_cycles[0])||'all';
  document.getElementById('fPoints').value = t.points||5;
  document.getElementById('fPortalLink').value = t.portal_link||'';
  document.getElementById('fDelegate').value = t.delegated_approval_to||'';
  document.getElementById('fDue').value = t.due_date||'';
  document.getElementById('modalCreate').classList.add('show');
}

async function saveTask() {
  var title = document.getElementById('fTitle').value.trim();
  if (!title) { showToast('يرجى إدخال العنوان'); return; }
  var cycle = document.getElementById('fCycle').value;
  var body = {
    title: title,
    description: document.getElementById('fDesc').value.trim()||null,
    submission_type: document.getElementById('fSubType').value,
    due_date: document.getElementById('fDue').value||null,
    points: parseInt(document.getElementById('fPoints').value)||5,
    portal_link: document.getElementById('fPortalLink').value.trim()||null,
    assigned_cycles: [cycle],
    assigned_by_id: String(session.staff_db_id||session.id),
    assigned_by_name: session.full_name||session.name||session.username||'',
    assigned_by_role: session.role_key||'',
    delegated_approval_to: document.getElementById('fDelegate').value||null,
    is_active: true
  };
  try {
    if (currentTaskId) {
      await fetch(SB_URL+'/rest/v1/staff_tasks?id=eq.'+currentTaskId, { method:'PATCH', headers:Object.assign({},authH(true),{'Prefer':'return=minimal'}), body:JSON.stringify(body) });
    } else {
      await fetch(SB_URL+'/rest/v1/staff_tasks', { method:'POST', headers:Object.assign({},authH(true),{'Prefer':'return=minimal'}), body:JSON.stringify(body) });
    }
    closeModal('modalCreate');
    showToast('✓ تم حفظ المهمة');
    loadTasks();
  } catch(e){ showToast('خطأ في الحفظ'); }
}

async function deleteTask(id) {
  if (!confirm('حذف المهمة؟')) return;
  await fetch(SB_URL+'/rest/v1/staff_tasks?id=eq.'+id, { method:'PATCH', headers:Object.assign({},authH(true),{'Prefer':'return=minimal'}), body:JSON.stringify({is_active:false}) });
  showToast('✓ تم الحذف');
  loadTasks();
}

async function openSubs(taskId, title) {
  currentTaskId = taskId;
  document.getElementById('modalSubsTitle').textContent = 'تسليمات: ' + title;
  document.getElementById('subsContent').innerHTML = '<div class="empty"><div class="icon">⏳</div><div>جارٍ التحميل...</div></div>';
  document.getElementById('modalSubs').classList.add('show');

  try {
    var res = await fetch(SB_URL+'/rest/v1/staff_task_submissions?task_id=eq.'+taskId+'&select=*&order=submitted_at.desc', { headers: authH() });
    var rows = await res.json();
    if (!Array.isArray(rows)||!rows.length) {
      document.getElementById('subsContent').innerHTML = '<div class="empty"><div class="icon">📭</div><div>لا تسليمات بعد</div></div>';
      return;
    }
    document.getElementById('subsContent').innerHTML = rows.map(function(s) {
      var statusBadge = s.status==='approved' ? '<span class="badge badge-green">✅ مقبول</span>'
        : s.status==='rejected' ? '<span class="badge badge-red">❌ مرفوض</span>'
        : '<span class="badge badge-amber">⏳ انتظار</span>';
      return '<div class="sub-item">'
        + '<div class="sub-avatar">' + (s.staff_name||'?').charAt(0) + '</div>'
        + '<div class="sub-info">'
        + '<div class="sub-name">' + esc(s.staff_name) + ' ' + statusBadge + '</div>'
        + (s.content ? '<div class="sub-content">' + esc(s.content) + '</div>' : '')
        + (s.review_note ? '<div class="sub-content" style="color:#DC2626">ملاحظة: ' + esc(s.review_note) + '</div>' : '')
        + '<div class="sub-actions">'
        + (s.status!=='approved' ? '<button class="btn-sm btn-primary" onclick="reviewSub(\'' + s.id + '\',\'approved\',\'' + taskId + '\')">✅ قبول</button>' : '')
        + (s.status!=='rejected' ? '<button class="btn-sm btn-danger" onclick="reviewSub(\'' + s.id + '\',\'rejected\',\'' + taskId + '\')">❌ رفض</button>' : '')
        + '</div>'
        + '</div>'
        + '</div>';
    }).join('');
  } catch(e) { document.getElementById('subsContent').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>خطأ في التحميل</div></div>'; }
}

async function reviewSub(subId, status, taskId) {
  var note = status==='rejected' ? prompt('سبب الرفض:') : null;
  await fetch(SB_URL+'/rest/v1/staff_task_submissions?id=eq.'+subId, {
    method:'PATCH', headers:Object.assign({},authH(true),{'Prefer':'return=minimal'}),
    body:JSON.stringify({ status: status, reviewed_by: String(session.staff_db_id||session.id), reviewed_by_name: session.full_name||session.username||'', review_note: note, reviewed_at: new Date().toISOString(), points_awarded: status==='approved'?(allTasks.find(function(t){return t.id===taskId;})||{}).points||0:0 })
  });
  showToast(status==='approved'?'✓ تم القبول':'تم الرفض');
  openSubs(taskId, document.getElementById('modalSubsTitle').textContent.replace('تسليمات: ',''));
  loadTasks();
}

function openSubmit(taskId, title, subType) {
  currentTaskId = taskId;
  document.getElementById('modalSubmitTitle').textContent = 'تسليم: ' + title;
  var content = '';
  if (subType === 'text') {
    content = '<div class="form-group"><label class="form-label">نص التسليم</label><textarea class="form-textarea" id="subContent" rows="4" placeholder="اكتب هنا..."></textarea></div>';
  } else if (subType === 'link') {
    content = '<div class="form-group"><label class="form-label">الرابط</label><input class="form-input" id="subContent" placeholder="https://..."></div>';
  } else {
    content = '<div style="text-align:center;padding:20px;color:#64748B">سيتم تسجيل إقرارك بإتمام المهمة.</div>';
  }
  document.getElementById('submitFormContent').innerHTML = content;
  document.getElementById('modalSubmit').classList.add('show');
}

async function submitTask() {
  var el = document.getElementById('subContent');
  var content = el ? el.value.trim() : '';
  try {
    var existing = allSubs.find(function(s){ return s.task_id===currentTaskId && s.staff_db_id===String(session.staff_db_id||session.id); });
    var body = { task_id: currentTaskId, staff_db_id: String(session.staff_db_id||session.id), staff_name: session.full_name||session.name||session.username||'', content: content||null, status: 'pending', submitted_at: new Date().toISOString() };
    if (existing) {
      await fetch(SB_URL+'/rest/v1/staff_task_submissions?id=eq.'+existing.id, { method:'PATCH', headers:Object.assign({},authH(true),{'Prefer':'return=minimal'}), body:JSON.stringify(body) });
    } else {
      await fetch(SB_URL+'/rest/v1/staff_task_submissions', { method:'POST', headers:Object.assign({},authH(true),{'Prefer':'return=minimal'}), body:JSON.stringify(body) });
    }
    closeModal('modalSubmit');
    showToast('✓ تم التسليم بنجاح');
    loadTasks();
  } catch(e){ showToast('خطأ في التسليم'); }
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function showToast(msg) { var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(function(){ t.style.display='none'; },3000); }
</script>
</body>
</html>
