<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>المقصف المدرسي — EduOS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<script src="../platform-auth-guard.js"></script>
<script src="../platform-lang.js" defer></script>
<script src="/apps/platform-shield.js" defer></script>
<style>
:root{--bg:#F8FAFC;--card:#FFFFFF;--border:#E2E8F0;--brand:#6C3DD6;--brand2:#22D3EE;--text:#1E293B;--text2:#475569;--muted:#64748B;--green:#059669;--green-bg:#ECFDF5;--yellow:#B45309;--yellow-bg:#FFFBEB;--red:#DC2626;--red-bg:#FEF2F2;--blue:#2563EB;--blue-bg:#EFF6FF}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:18px}
body{font-family:'Tajawal',Arial,sans-serif;background:#F8FAFC;color:var(--text);min-height:100vh;direction:rtl;padding-top:60px;font-size:18px;line-height:1.6}
.hdr{position:fixed;top:0;right:0;left:0;height:60px;background:#FFFFFF;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:100}
.hdr-title{font-size:1.15rem;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-spacer{flex:1}
#header-tools{display:flex;align-items:center;gap:8px}
.back-btn{width:32px;height:32px;min-width:32px;border-radius:50%;background:#DC2626;color:#FFFFFF;border:none;cursor:pointer;font-size:16px;line-height:32px;text-align:center;font-family:inherit;padding:0}
.back-btn:hover{background:#B91C1C}
.tabs{background:#FFFFFF;border-bottom:1px solid var(--border);display:flex;gap:4px;padding:0 20px;overflow-x:auto}
.tab-btn{background:none;border:none;border-bottom:3px solid transparent;padding:12px 18px;font-family:inherit;font-size:1rem;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab-btn:hover{color:var(--brand)}
.tab-btn.active{color:var(--brand);border-bottom-color:var(--brand)}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
.tab-panel{display:none}
.tab-panel.active{display:block}
.card{background:#FFFFFF;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px}
.card-title{font-size:1.1rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-sub{font-size:.8rem;color:var(--muted);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#FFFFFF;border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.kpi-val{font-size:2rem;font-weight:900;color:var(--brand);line-height:1.2;direction:ltr;unicode-bidi:plaintext}
.kpi-lbl{font-size:.85rem;color:var(--muted);font-weight:600;margin-top:4px}
.kpi.warn .kpi-val{color:var(--red)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:#F1F5F9;color:var(--text2);font-weight:800;text-align:right;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.num{direction:ltr;unicode-bidi:plaintext;text-align:right}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;margin:2px}
.b-green{background:var(--green-bg);color:var(--green)}
.b-yellow{background:var(--yellow-bg);color:var(--yellow)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-gray{background:#F1F5F9;color:var(--text2)}
.row-green td{background:var(--green-bg)}
.row-yellow td{background:var(--yellow-bg)}
.row-red td{background:var(--red-bg)}
.btn{font-family:inherit;font-size:.9rem;font-weight:700;border:1px solid var(--border);background:#FFFFFF;color:var(--text);border-radius:10px;padding:8px 16px;cursor:pointer}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#FFFFFF}
.btn-primary:hover{background:#5B32B8;color:#FFFFFF}
.btn-sm{padding:4px 12px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:.85rem;font-weight:700;color:var(--text2)}
.toolbar .field{margin-bottom:0}
input,select,textarea{font-family:inherit;font-size:.95rem;padding:8px 12px;border:1px solid #CBD5E1;border-radius:10px;background:#FFFFFF;color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);border-color:var(--brand2)}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.hdr select{width:auto;min-width:120px;padding:4px 10px;font-size:.85rem}
.spinner{width:34px;height:34px;border:4px solid #E2E8F0;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;color:var(--muted);padding:10px}
.empty{text-align:center;color:var(--muted);padding:24px 12px;font-weight:600}
.err{text-align:center;color:var(--red);background:var(--red-bg);border-radius:10px;padding:14px;font-weight:600}
.notice{background:var(--yellow-bg);color:var(--yellow);border-radius:10px;padding:10px 14px;font-size:.85rem;font-weight:600;margin-bottom:12px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#FFFFFF;border-radius:16px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:1.15rem;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:8px}
.modal-msg{font-size:.85rem;color:var(--red);min-height:1.2em;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:#1E293B;color:#FFFFFF;padding:10px 20px;border-radius:10px;font-size:.9rem;z-index:300;display:none}
.toast.show{display:block}
.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:24px 12px;border-top:1px solid var(--border);margin-top:20px;direction:ltr}
@media(max-width:640px){.wrap{padding:12px}.hdr{padding:0 10px}.grid2{grid-template-columns:1fr}.kpi-val{font-size:1.6rem}}

.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.menu-card{background:#FFFFFF;border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.menu-emoji{font-size:2.6rem;line-height:1.2}
.menu-name{font-weight:800;margin-top:6px}
.menu-cat{font-size:.8rem;color:var(--muted)}
.menu-price{font-size:1.2rem;font-weight:900;color:var(--brand);margin:6px 0;direction:ltr}
.menu-meta{font-size:.82rem;color:var(--text2)}
.stu-results{border:1px solid var(--border);border-radius:10px;max-height:220px;overflow-y:auto;margin-top:4px}
.stu-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.9rem}
.stu-item:last-child{border-bottom:none}
.stu-item:hover{background:#F1F5F9}
.stu-picked{margin-top:8px;font-weight:700;color:var(--green)}
.order-form{max-width:560px}
.total-row td{font-weight:900;background:#F1F5F9}
</style>
</head>
<body>
<header class="hdr">
  <button class="back-btn" id="backBtn" title="رجوع" aria-label="رجوع">←</button>
  <div class="hdr-title">🍽️ المقصف المدرسي</div>
  <div class="hdr-spacer"></div>
  <div id="header-tools"></div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn active" data-tab="menu">🍴 قائمة اليوم</button>
  <button class="tab-btn" data-tab="order">🧾 تسجيل طلب</button>
  <button class="tab-btn" data-tab="sales">💰 مبيعات اليوم</button>
  <button class="tab-btn" data-tab="manage" id="manageTabBtn" style="display:none">⚙️ إدارة القائمة</button>
</nav>

<main class="wrap">
  <section class="tab-panel active" id="tab-menu">
    <div class="card">
      <div class="card-title">🍴 قائمة اليوم</div>
      <div id="menuBox"></div>
    </div>
  </section>

  <section class="tab-panel" id="tab-order">
    <div class="card order-form">
      <div class="card-title">🧾 تسجيل طلب جديد</div>
      <div id="orderNotice"></div>
      <div class="field">
        <label for="stuSearch">الطالبة (اكتب 3 أحرف فأكثر من الاسم)</label>
        <input type="text" id="stuSearch" autocomplete="off" placeholder="ابحثي بالاسم">
        <div class="stu-results" id="stuResults" style="display:none"></div>
        <div class="stu-picked" id="stuPicked"></div>
      </div>
      <div class="field">
        <label for="oItem">العنصر</label>
        <select id="oItem"><option value="">جارٍ التحميل...</option></select>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="oQty">الكمية</label>
          <select id="oQty">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
          </select>
        </div>
        <div class="field">
          <label for="oDate">التاريخ</label>
          <input type="text" id="oDate" readonly>
        </div>
      </div>
      <div class="field"><label>الإجمالي</label><div id="oTotal" style="font-size:1.3rem;font-weight:900;color:var(--brand);direction:ltr;text-align:right">0.00</div></div>
      <div class="modal-msg" id="oMsg"></div>
      <button class="btn btn-primary" id="oSave">حفظ الطلب</button>
    </div>
  </section>

  <section class="tab-panel" id="tab-sales">
    <div class="card">
      <div class="card-title">💰 مبيعات اليوم <button class="btn btn-sm" id="salesRefresh">تحديث</button></div>
      <div id="salesBox"></div>
    </div>
  </section>

  <section class="tab-panel" id="tab-manage">
    <div class="card">
      <div class="card-title">⚙️ إدارة قائمة المقصف <button class="btn btn-primary btn-sm" id="addMenuBtn">+ إضافة عنصر</button></div>
      <div id="manageBox"></div>
    </div>
  </section>
</main>

<div class="footer">NAFAS FOR ARTIFICIAL INTELLIGENCE · CN-6573712 · أبوظبي</div>

<!-- modal: عنصر القائمة -->
<div class="modal-bg" id="mMenu">
  <div class="modal">
    <h3 id="mMenuTitle">عنصر القائمة</h3>
    <div class="grid2">
      <div class="field"><label for="mName">الاسم *</label><input type="text" id="mName"></div>
      <div class="field"><label for="mEmoji">الرمز (Emoji)</label><input type="text" id="mEmoji" maxlength="4"></div>
      <div class="field"><label for="mCat">الفئة</label><input type="text" id="mCat" list="mCatList"><datalist id="mCatList"></datalist></div>
      <div class="field"><label for="mPrice">السعر *</label><input type="number" id="mPrice" min="0" step="0.5"></div>
      <div class="field"><label for="mStock">الكمية في المخزون</label><input type="number" id="mStock" min="0"></div>
      <div class="field"><label for="mMin">الحد الأدنى للمخزون</label><input type="number" id="mMin" min="0"></div>
    </div>
    <div class="field" id="mAllergWrap"><label for="mAllerg">مسببات الحساسية (افصلي بفاصلة)</label><input type="text" id="mAllerg"></div>
    <div class="field" id="mHealthyWrap"><label><input type="checkbox" id="mHealthy" style="width:auto"> عنصر صحي</label></div>
    <div class="field"><label><input type="checkbox" id="mActive" style="width:auto"> مفعّل في القائمة</label></div>
    <div class="modal-msg" id="mMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="mSave">حفظ</button>
      <button class="btn" data-close="mMenu">إلغاء</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
async function dbFetch(path) {
  var SB_URL = window.EduOS.SB_URL;
  var SB_KEY = window.EduOS.SB_KEY;
  var r = await fetch(SB_URL + '/rest/v1/' + path, {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function dbWrite(method, path, body) {
  var SB_URL = window.EduOS.SB_URL;
  var SB_KEY = window.EduOS.SB_KEY;
  var r = await fetch(SB_URL + '/rest/v1/' + path, {
    method: method,
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}
async function initWait() {
  var t = 0;
  while ((!window.EduOS || !window.EduOS.SB_URL) && t < 30) {
    await new Promise(function (r) { setTimeout(r, 100); });
    t++;
  }
}
/* جلب كل الصفوف بالصفحات (حد PostgREST الافتراضي 1000 صف) */
async function dbFetchAll(path) {
  var out = [];
  var sep = path.indexOf('?') >= 0 ? '&' : '?';
  for (var page = 0; page < 100; page++) {
    var rows = await dbFetch(path + sep + 'limit=1000&offset=' + (page * 1000));
    out = out.concat(rows);
    if (rows.length < 1000) break;
  }
  return out;
}
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function dateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return dateStr(new Date()); }
function mondayStr() {
  var d = new Date();
  var diff = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - diff);
  return dateStr(d);
}
function sundayStr() {
  var d = new Date();
  var diff = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - diff + 6);
  return dateStr(d);
}
function fmtNum(n, dec) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
function getSess() {
  try { return JSON.parse(sessionStorage.getItem('edoos_user') || '{}'); } catch (e) { return {}; }
}
function goHomePortal() {
  var sess = getSess();
  var role = sess.role_key || '';
  var map = {'principal':'../eduos-principal/','vice_principal':'../eduos-vice-principal/','teacher':'../eduos-teacher/','admin':'../eduos-admin/','specialist':'../eduos-specialist/','nurse':'../eduos-nurse/','security':'../eduos-security/','technician':'../eduos-technician/','secretary':'../eduos-secretary/','coach':'../eduos-coach/'};
  window.location.href = map[role] || '../eduos-hub/';
}
function spinnerHtml() { return '<div class="spinner"></div><div class="loading">جارٍ التحميل...</div>'; }
function setLoading(id) { var el = document.getElementById(id); if (el) el.innerHTML = spinnerHtml(); }
function emptyHtml(msg) { return '<div class="empty">' + esc(msg || 'لا بيانات') + '</div>'; }
function errHtml(msg) { return '<div class="err">تعذّر تحميل البيانات — ' + esc(msg) + '</div>'; }
function toast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(function () { t.className = 'toast'; }, 2800);
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function writeErrMsg(e) {
  var m = String(e && e.message || e);
  if (m.indexOf('401') >= 0 || m.indexOf('403') >= 0) return 'لا توجد صلاحية كتابة على هذا الجدول (' + m + ')';
  return 'تعذّر الحفظ — ' + m;
}


var menuRows = [];
var pickedStudent = null;
var hasStudentNameCol = false;
var dateCol = 'transaction_date';
var editingId = null;
var sess = getSess();
var isAdmin = (sess.role_key === 'admin');

function has(col) { return menuRows.length === 0 || (col in menuRows[0]); }
function activeKey() {
  if (menuRows.length && ('is_active' in menuRows[0])) return 'is_active';
  return 'is_available';
}
function isActive(r) {
  if ('is_active' in r) return !!r.is_active;
  if ('is_available' in r) return !!r.is_available;
  return true;
}
function allergList(r) {
  var a = r.allergens;
  if (!a) return [];
  if (Object.prototype.toString.call(a) === '[object Array]') return a;
  return String(a).split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x; });
}
function priceOf(r) { var p = parseFloat(r.price); return isNaN(p) ? 0 : p; }
function fmtPrice(p) { return fmtNum(p, 2) + ' د.إ'; }

async function probeColumns() {
  try { await dbFetch('cafeteria_orders?select=student_name&limit=1'); hasStudentNameCol = true; } catch (e) { hasStudentNameCol = false; }
  try { await dbFetch('cafeteria_orders?select=transaction_date&limit=1'); dateCol = 'transaction_date'; }
  catch (e) {
    try { await dbFetch('cafeteria_orders?select=order_date&limit=1'); dateCol = 'order_date'; } catch (e2) { dateCol = 'transaction_date'; }
  }
  if (!hasStudentNameCol) {
    document.getElementById('orderNotice').innerHTML = '<div class="notice">تنبيه: جدول الطلبات لا يحتوي عمود اسم الطالبة، لذلك يُسجَّل الطلب بدون الاسم.</div>';
  }
}

async function loadMenu() {
  setLoading('menuBox');
  try {
    menuRows = await dbFetch('cafeteria_menu?select=*&order=sort_order.asc,name.asc');
    var active = menuRows.filter(isActive);
    if (!active.length) { document.getElementById('menuBox').innerHTML = emptyHtml('لا بيانات — لا توجد عناصر متاحة في القائمة'); }
    else {
      var h = '<div class="menu-grid">';
      active.forEach(function (r) {
        var al = allergList(r);
        var em = r.image_emoji || r.emoji || '🍽️';
        h += '<div class="menu-card"><div class="menu-emoji">' + esc(em) + '</div>';
        h += '<div class="menu-name">' + esc(r.name) + '</div>';
        if (r.category) h += '<div class="menu-cat">' + esc(r.category) + '</div>';
        h += '<div class="menu-price">' + esc(fmtPrice(priceOf(r))) + '</div>';
        if (r.calories !== undefined && r.calories !== null) h += '<div class="menu-meta">🔥 ' + esc(r.calories) + ' سعرة</div>';
        h += '<div>';
        if (r.is_halal === true) h += '<span class="badge b-green">حلال</span>';
        if (r.is_healthy === true) h += '<span class="badge b-blue">صحي</span>';
        if (al.length) h += '<span class="badge b-yellow">⚠️ تحذير: ' + esc(al.join('، ')) + '</span>';
        if (r.stock_quantity !== undefined && r.stock_quantity !== null) {
          if (r.stock_quantity <= 0) h += '<span class="badge b-red">نفد المخزون</span>';
          else if (r.min_stock !== undefined && r.stock_quantity <= r.min_stock) h += '<span class="badge b-red">مخزون منخفض</span>';
        }
        h += '</div></div>';
      });
      h += '</div>';
      document.getElementById('menuBox').innerHTML = h;
    }
    fillOrderItems();
  } catch (e) {
    document.getElementById('menuBox').innerHTML = errHtml(e.message);
    document.getElementById('oItem').innerHTML = '<option value="">تعذّر تحميل القائمة</option>';
  }
}

/* ---------- تسجيل طلب ---------- */
function fillOrderItems() {
  var sel = document.getElementById('oItem');
  var active = menuRows.filter(isActive);
  if (!active.length) { sel.innerHTML = '<option value="">لا توجد عناصر</option>'; return; }
  var h = '<option value="">اختاري العنصر</option>';
  active.forEach(function (r) {
    var out = (r.stock_quantity !== undefined && r.stock_quantity !== null && r.stock_quantity <= 0);
    h += '<option value="' + esc(r.id) + '"' + (out ? ' disabled' : '') + '>' + esc((r.image_emoji || '') + ' ' + r.name + ' — ' + fmtPrice(priceOf(r)) + (out ? ' (نفد)' : '')) + '</option>';
  });
  sel.innerHTML = h;
}
function findMenu(id) {
  var f = null;
  menuRows.forEach(function (r) { if (String(r.id) === String(id)) f = r; });
  return f;
}
function updateTotal() {
  var it = findMenu(document.getElementById('oItem').value);
  var q = parseInt(document.getElementById('oQty').value, 10) || 1;
  document.getElementById('oTotal').textContent = it ? fmtPrice(priceOf(it) * q) : '0.00';
}

var searchTimer = null;
function onStuInput() {
  var v = document.getElementById('stuSearch').value.trim();
  pickedStudent = null;
  document.getElementById('stuPicked').textContent = '';
  var box = document.getElementById('stuResults');
  if (searchTimer) clearTimeout(searchTimer);
  if (v.length < 3) { box.style.display = 'none'; box.innerHTML = ''; return; }
  searchTimer = setTimeout(function () { searchStudents(v); }, 300);
}
async function searchStudents(v) {
  var box = document.getElementById('stuResults');
  box.style.display = 'block';
  box.innerHTML = '<div class="loading">جارٍ البحث...</div>';
  try {
    var rows = await dbFetch('students?select=id,name,class_name&name=ilike.' + encodeURIComponent('*' + v + '*') + '&order=name.asc&limit=10');
    if (!rows.length) { box.innerHTML = '<div class="empty">لا بيانات — لا توجد نتائج</div>'; return; }
    box.innerHTML = rows.map(function (r, i) {
      return '<div class="stu-item" data-i="' + i + '">' + esc(r.name) + ' <span class="badge b-gray">' + esc(r.class_name || '') + '</span></div>';
    }).join('');
    box._rows = rows;
  } catch (e) {
    box.innerHTML = errHtml(e.message);
  }
}
function pickStudent(i) {
  var box = document.getElementById('stuResults');
  var r = box._rows && box._rows[i];
  if (!r) return;
  pickedStudent = r;
  document.getElementById('stuSearch').value = r.name;
  document.getElementById('stuPicked').textContent = '✔ تم اختيار: ' + r.name + (r.class_name ? ' (' + r.class_name + ')' : '');
  box.style.display = 'none';
}

async function saveOrder() {
  var msg = document.getElementById('oMsg');
  msg.style.color = '';
  var it = findMenu(document.getElementById('oItem').value);
  var q = parseInt(document.getElementById('oQty').value, 10);
  if (!pickedStudent) { msg.textContent = 'اختاري الطالبة من نتائج البحث'; return; }
  if (!it) { msg.textContent = 'اختاري العنصر'; return; }
  if (!(q >= 1 && q <= 5)) { msg.textContent = 'الكمية من 1 إلى 5'; return; }
  var up = priceOf(it);
  var body = { item_name: it.name, quantity: q, unit_price: up, total_price: up * q };
  body[dateCol] = todayStr();
  if (hasStudentNameCol) body.student_name = pickedStudent.name;
  var btn = document.getElementById('oSave');
  btn.disabled = true;
  try {
    await dbWrite('POST', 'cafeteria_orders', body);
    msg.textContent = '';
    toast('تم حفظ الطلب');
    document.getElementById('stuSearch').value = '';
    document.getElementById('stuPicked').textContent = '';
    pickedStudent = null;
    document.getElementById('oItem').value = '';
    document.getElementById('oQty').value = '1';
    updateTotal();
  } catch (e) {
    msg.textContent = writeErrMsg(e);
  }
  btn.disabled = false;
}

/* ---------- مبيعات اليوم ---------- */
async function loadSales() {
  setLoading('salesBox');
  try {
    var rows = await dbFetch('cafeteria_orders?select=*&' + dateCol + '=eq.' + todayStr() + '&limit=1000');
    rows = rows.filter(function (r) { return !r.status || (r.status !== 'ملغي' && r.status !== 'cancelled'); });
    if (!rows.length) { document.getElementById('salesBox').innerHTML = emptyHtml('لا بيانات — لا توجد مبيعات اليوم'); return; }
    var agg = {};
    var order = [];
    var totQty = 0;
    var totRev = 0;
    rows.forEach(function (r) {
      var k = r.item_name || '—';
      var q = r.quantity || 0;
      var rev = (r.total_price !== undefined && r.total_price !== null) ? parseFloat(r.total_price) : (parseFloat(r.unit_price) || 0) * q;
      if (isNaN(rev)) rev = 0;
      if (!agg[k]) { agg[k] = { qty: 0, rev: 0 }; order.push(k); }
      agg[k].qty += q;
      agg[k].rev += rev;
      totQty += q;
      totRev += rev;
    });
    order.sort(function (a, b) { return agg[b].rev - agg[a].rev; });
    var h = '<div class="tbl-wrap"><table><thead><tr><th>العنصر</th><th>المباع</th><th>الإيراد</th></tr></thead><tbody>';
    order.forEach(function (k) {
      h += '<tr><td>' + esc(k) + '</td><td class="num">' + esc(agg[k].qty) + '</td><td class="num">' + esc(fmtPrice(agg[k].rev)) + '</td></tr>';
    });
    h += '<tr class="total-row"><td>المجموع</td><td class="num">' + esc(totQty) + '</td><td class="num">' + esc(fmtPrice(totRev)) + '</td></tr>';
    h += '</tbody></table></div>';
    document.getElementById('salesBox').innerHTML = h;
  } catch (e) {
    document.getElementById('salesBox').innerHTML = errHtml(e.message);
  }
}

/* ---------- إدارة القائمة ---------- */
async function loadManage() {
  if (!isAdmin) { document.getElementById('manageBox').innerHTML = errHtml('هذه الصفحة لمدير/ة النظام فقط'); return; }
  setLoading('manageBox');
  try {
    menuRows = await dbFetch('cafeteria_menu?select=*&order=sort_order.asc,name.asc');
    fillOrderItems();
    if (!menuRows.length) { document.getElementById('manageBox').innerHTML = emptyHtml('لا بيانات — القائمة فارغة'); return; }
    var h = '<div class="tbl-wrap"><table><thead><tr><th></th><th>الاسم</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th>الحد الأدنى</th><th>صحي</th><th>الحالة</th><th></th></tr></thead><tbody>';
    menuRows.forEach(function (r) {
      var on = isActive(r);
      h += '<tr>';
      h += '<td style="font-size:1.5rem">' + esc(r.image_emoji || r.emoji || '🍽️') + '</td>';
      h += '<td><b>' + esc(r.name) + '</b></td>';
      h += '<td>' + esc(r.category || '—') + '</td>';
      h += '<td class="num">' + esc(fmtPrice(priceOf(r))) + '</td>';
      h += '<td class="num">' + esc(r.stock_quantity === undefined || r.stock_quantity === null ? '—' : r.stock_quantity) + '</td>';
      h += '<td class="num">' + esc(r.min_stock === undefined || r.min_stock === null ? '—' : r.min_stock) + '</td>';
      h += '<td>' + (r.is_healthy ? '<span class="badge b-blue">صحي</span>' : '—') + '</td>';
      h += '<td>' + (on ? '<span class="badge b-green">مفعّل</span>' : '<span class="badge b-gray">موقوف</span>') + '</td>';
      h += '<td><button class="btn btn-sm" data-act="edit" data-id="' + esc(r.id) + '">تعديل</button> ';
      h += '<button class="btn btn-sm" data-act="toggle" data-id="' + esc(r.id) + '">' + (on ? 'إيقاف' : 'تفعيل') + '</button></td></tr>';
    });
    h += '</tbody></table></div>';
    document.getElementById('manageBox').innerHTML = h;
    var cats = {};
    menuRows.forEach(function (r) { if (r.category) cats[r.category] = true; });
    document.getElementById('mCatList').innerHTML = Object.keys(cats).map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
  } catch (e) {
    document.getElementById('manageBox').innerHTML = errHtml(e.message);
  }
}

function openMenuModal(id) {
  editingId = id || null;
  var r = id ? findMenu(id) : null;
  document.getElementById('mMenuTitle').textContent = r ? 'تعديل عنصر' : '+ إضافة عنصر';
  document.getElementById('mName').value = r ? r.name : '';
  document.getElementById('mEmoji').value = r ? (r.image_emoji || '') : '';
  document.getElementById('mCat').value = r ? (r.category || '') : '';
  document.getElementById('mPrice').value = r ? priceOf(r) : '';
  document.getElementById('mStock').value = r && r.stock_quantity !== null && r.stock_quantity !== undefined ? r.stock_quantity : 0;
  document.getElementById('mMin').value = r && r.min_stock !== null && r.min_stock !== undefined ? r.min_stock : 10;
  document.getElementById('mAllerg').value = r ? allergList(r).join('، ') : '';
  document.getElementById('mHealthy').checked = r ? !!r.is_healthy : false;
  document.getElementById('mActive').checked = r ? isActive(r) : true;
  document.getElementById('mAllergWrap').style.display = has('allergens') ? '' : 'none';
  document.getElementById('mHealthyWrap').style.display = has('is_healthy') ? '' : 'none';
  document.getElementById('mMsg').textContent = '';
  openModal('mMenu');
}

async function saveMenu() {
  var msg = document.getElementById('mMsg');
  var name = document.getElementById('mName').value.trim();
  var price = parseFloat(document.getElementById('mPrice').value);
  if (!name || isNaN(price) || price < 0) { msg.textContent = 'الاسم والسعر (رقم صحيح) مطلوبان'; return; }
  var body = { name: name, price: price };
  var v = document.getElementById('mCat').value.trim();
  if (v) body.category = v;
  v = document.getElementById('mEmoji').value.trim();
  if (v && has('image_emoji')) body.image_emoji = v;
  if (has('stock_quantity')) { var s = parseInt(document.getElementById('mStock').value, 10); if (!isNaN(s)) body.stock_quantity = s; }
  if (has('min_stock')) { var m = parseInt(document.getElementById('mMin').value, 10); if (!isNaN(m)) body.min_stock = m; }
  if (has('allergens')) {
    body.allergens = document.getElementById('mAllerg').value.split(/[,،]/).map(function (x) { return x.trim(); }).filter(function (x) { return x; });
  }
  if (has('is_healthy')) body.is_healthy = document.getElementById('mHealthy').checked;
  body[activeKey()] = document.getElementById('mActive').checked;
  var btn = document.getElementById('mSave');
  btn.disabled = true;
  try {
    if (editingId) await dbWrite('PATCH', 'cafeteria_menu?id=eq.' + encodeURIComponent(editingId), body);
    else await dbWrite('POST', 'cafeteria_menu', body);
    closeModal('mMenu');
    toast('تم الحفظ');
    loadManage();
    loadMenu();
  } catch (e) {
    msg.textContent = writeErrMsg(e);
  }
  btn.disabled = false;
}

async function toggleMenu(id) {
  var r = findMenu(id);
  if (!r) return;
  var body = {};
  body[activeKey()] = !isActive(r);
  try {
    await dbWrite('PATCH', 'cafeteria_menu?id=eq.' + encodeURIComponent(id), body);
    toast('تم تحديث الحالة');
    loadManage();
    loadMenu();
  } catch (e) {
    toast(writeErrMsg(e));
  }
}

/* ---------- التبويبات والأحداث ---------- */
function showTab(name) {
  if (name === 'manage' && !isAdmin) return;
  var btns = document.querySelectorAll('.tab-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === name);
  var panels = document.querySelectorAll('.tab-panel');
  for (var j = 0; j < panels.length; j++) panels[j].classList.toggle('active', panels[j].id === 'tab-' + name);
  if (name === 'menu') loadMenu();
  if (name === 'sales') loadSales();
  if (name === 'manage') loadManage();
}

function bind() {
  document.getElementById('backBtn').addEventListener('click', goHomePortal);
  document.getElementById('tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('.tab-btn');
    if (b) showTab(b.getAttribute('data-tab'));
  });
  document.getElementById('stuSearch').addEventListener('input', onStuInput);
  document.getElementById('stuResults').addEventListener('click', function (ev) {
    var it = ev.target.closest('.stu-item');
    if (it) pickStudent(parseInt(it.getAttribute('data-i'), 10));
  });
  document.getElementById('oItem').addEventListener('change', updateTotal);
  document.getElementById('oQty').addEventListener('change', updateTotal);
  document.getElementById('oSave').addEventListener('click', saveOrder);
  document.getElementById('salesRefresh').addEventListener('click', loadSales);
  document.getElementById('addMenuBtn').addEventListener('click', function () { openMenuModal(null); });
  document.getElementById('mSave').addEventListener('click', saveMenu);
  document.getElementById('manageBox').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    if (b.getAttribute('data-act') === 'edit') openMenuModal(b.getAttribute('data-id'));
    if (b.getAttribute('data-act') === 'toggle') toggleMenu(b.getAttribute('data-id'));
  });
  document.addEventListener('click', function (ev) {
    var c = ev.target.closest('[data-close]');
    if (c) closeModal(c.getAttribute('data-close'));
  });
}

(async function init() {
  bind();
  document.getElementById('oDate').value = todayStr();
  if (isAdmin) document.getElementById('manageTabBtn').style.display = '';
  setLoading('menuBox');
  await initWait();
  if (!window.EduOS || !window.EduOS.SB_URL) {
    document.getElementById('menuBox').innerHTML = errHtml('إعدادات المنصة غير متوفرة');
    return;
  }
  probeColumns();
  loadMenu();
})();
</script>
</body>
