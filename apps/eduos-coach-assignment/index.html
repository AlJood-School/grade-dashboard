<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعيين مدربي الجيوجيتسو — بوابة الجود</title>
<script src="../platform-config.js"></script>
<script src="../platform-auth-guard.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F2F4F7;--surface:#fff;--border:#E2E8F0;
  --brand:#6C3DD6;--brand2:#22D3EE;
  --green:#059669;--amber:#D97706;--red:#E11D48;
  --text:#1E293B;--text2:#475569;--text3:#94A3B8;
  --shadow:0 1px 4px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);
}
body{font-family:'Tajawal',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:18px;min-height:100vh;}

/* ── Header ── */
.header{background:linear-gradient(135deg,var(--brand),var(--brand2));padding:0 20px;box-shadow:0 2px 12px rgba(108,61,214,0.3);}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;height:68px;gap:14px;}
.back-btn{width:36px;height:36px;border-radius:50%;background:rgba(239,68,68,0.85);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;transition:background 0.2s;}
.back-btn:hover{background:#dc2626;}
.h-logo{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:22px;}
.h-title{font-size:19px;font-weight:900;color:#fff;}
.h-sub{font-size:12px;color:rgba(255,255,255,0.75);}
#header-tools{display:flex;align-items:center;gap:6px;margin-right:auto;}

/* ── Main ── */
.main{max-width:1200px;margin:0 auto;padding:24px;}

/* ── Info bar ── */
.info-bar{background:var(--surface);border:1px solid var(--border);border-right:4px solid var(--brand);border-radius:12px;padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow);}
.info-badge{background:rgba(108,61,214,0.1);color:var(--brand);border:1px solid rgba(108,61,214,0.3);border-radius:8px;padding:4px 14px;font-size:14px;font-weight:700;}

/* ── Legend ── */
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.legend-item{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:14px;box-shadow:var(--shadow);}
.legend-dot{width:10px;height:10px;border-radius:50%;}

/* ── Controls ── */
.controls{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.filter-btn{background:var(--surface);color:var(--text2);border:1.5px solid var(--border);border-radius:8px;padding:7px 16px;font-family:'Tajawal',sans-serif;font-size:14px;cursor:pointer;transition:all 0.2s;}
.filter-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.filter-btn:hover:not(.active){border-color:var(--brand);color:var(--brand);}
.btn-save-all{margin-right:auto;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;border-radius:10px;padding:9px 24px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:opacity 0.2s;}
.btn-save-all:hover{opacity:0.9;}
.btn-save-all:disabled{opacity:0.45;cursor:not-allowed;}

/* ── Grade section ── */
.grade-section{margin-bottom:28px;}
.grade-header{background:var(--surface);border-right:4px solid var(--brand);border-radius:0 12px 12px 0;padding:12px 18px;margin-bottom:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.grade-title{font-size:17px;font-weight:900;color:var(--text);}
.grade-badge{border-radius:6px;padding:3px 10px;font-size:13px;font-weight:700;}
.mixed-badge{background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe;}
.girls-badge{background:#fce7f3;color:#9d174d;border:1px solid #fbcfe8;}

/* ── Classes grid ── */
.classes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.class-card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow);transition:border-color 0.2s;}
.class-card.modified{border-color:var(--amber);background:#fffbeb;}
.class-name{font-size:18px;font-weight:800;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.modified-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);display:none;}
.class-card.modified .modified-dot{display:block;}

/* ── Coach row ── */
.coach-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.coach-label{font-size:13px;color:var(--text3);width:56px;flex-shrink:0;}
.coach-select{flex:1;background:#f8fafc;color:var(--text);border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-family:'Tajawal',sans-serif;font-size:14px;cursor:pointer;transition:border 0.2s;}
.coach-select:focus{outline:none;border-color:var(--brand);}
.coach-fixed{flex:1;background:#f0fdf4;border:1.5px solid #a7f3d0;border-radius:8px;padding:7px 10px;font-size:14px;color:var(--green);display:flex;align-items:center;gap:6px;}

/* ── Status bar ── */
.status-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1.5px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:14px;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,0.06);}
.status-text{color:var(--text3);font-size:14px;}
.status-text.success{color:var(--green);}
.status-text.error{color:var(--red);}
.status-text.saving{color:var(--amber);}
.pending-count{background:rgba(217,119,6,0.1);color:var(--amber);border:1px solid rgba(217,119,6,0.3);border-radius:6px;padding:4px 12px;font-size:14px;font-weight:700;}

/* ── Loading ── */
.loading{text-align:center;padding:60px;color:var(--text3);font-size:16px;}
.spinner{display:inline-block;width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}

.pb-20{padding-bottom:60px;}
@media(max-width:600px){.classes-grid{grid-template-columns:1fr;}.controls{flex-direction:column;align-items:stretch;}.btn-save-all{margin-right:0;}}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="../eduos-admin/" class="back-btn">←</a>
    <div class="h-logo">🥋</div>
    <div>
      <div class="h-title">تعيين مدربي/ات الجيوجيتسو</div>
      <div class="h-sub">توزيع المدربين/ات على الشعب — مدرسة الجود</div>
    </div>
    <div id="header-tools"></div>
  </div>
</header>

<div class="main pb-20">
  <div class="info-bar">
    <span class="info-badge">🥋 الجيوجيتسو</span>
    <span style="color:var(--text2);font-size:15px;">
      G1–G4 مختلطة: ماكس ثابت للأولاد + مدرب/ة للبنات يُختار |
      G5–G8 بنات فقط: مدرب/ة يُختار
    </span>
  </div>

  <div class="legend" id="coachLegend">
    <div class="legend-item"><div class="legend-dot" style="background:#059669;"></div>ماكس — ثابت (أولاد G1–G4)</div>
  </div>

  <div class="controls">
    <button class="filter-btn active" onclick="filterGrade('all',this)">جميع الصفوف</button>
    <button class="filter-btn" onclick="filterGrade('1',this)">1</button>
    <button class="filter-btn" onclick="filterGrade('2',this)">2</button>
    <button class="filter-btn" onclick="filterGrade('3',this)">3</button>
    <button class="filter-btn" onclick="filterGrade('4',this)">4</button>
    <button class="filter-btn" onclick="filterGrade('5',this)">5</button>
    <button class="filter-btn" onclick="filterGrade('6',this)">6</button>
    <button class="filter-btn" onclick="filterGrade('7',this)">7</button>
    <button class="filter-btn" onclick="filterGrade('8',this)">8</button>
    <button class="btn-save-all" id="btnSaveAll" onclick="saveAll()" disabled>💾 حفظ التغييرات</button>
  </div>

  <div id="mainContent">
    <div class="loading"><div class="spinner"></div><div>جاري تحميل البيانات...</div></div>
  </div>
</div>

<div class="status-bar">
  <span id="statusText" class="status-text">جاهز</span>
  <span id="pendingCount" class="pending-count" style="display:none;">0 تعديل معلّق</span>
</div>

<script src="/apps/platform-lang.js" defer></script>
<script>
const SB = window.EduOS?.SB_URL || 'https://zuyizaiugpmhmeycqton.supabase.co';
const KEY = window.EduOS?.SB_KEY || '';
const h = () => ({'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'});

const MIXED_GRADES = ['1','2','3','4'];
const COACH_MALE_ID = 'COACH005';

let COACHES = []; // تُجلب من DB
let assignments = {};
let pendingChanges = {};
let currentFilter = 'all';
const PALETTE = ['#7c3aed','#db2777','#0284c7','#ea580c','#0891b2','#65a30d'];

async function init() {
  const s = JSON.parse(sessionStorage.getItem('edoos_user') || '{}');
  if (!['admin','principal','vice_principal'].includes(s.role_key)) {
    document.getElementById('mainContent').innerHTML =
      '<div class="loading" style="color:var(--red);">⛔ غير مصرح بالوصول</div>';
    return;
  }
  await loadCoaches();
  await loadAssignments();
}

async function loadCoaches() {
  const res = await fetch(`${SB}/rest/v1/staff_profiles?role_key=eq.coach&select=staff_db_id,name_ar&order=name_ar`, {headers: h()});
  const data = await res.json();
  COACHES = Array.isArray(data) ? data.map((c,i) => ({
    id: c.staff_db_id,
    name: c.name_ar.replace(/\s*—.*$/,'').trim(),
    color: PALETTE[i % PALETTE.length]
  })) : [];

  // بناء legend
  const legend = document.getElementById('coachLegend');
  COACHES.filter(c => c.id !== COACH_MALE_ID).forEach(c => {
    const el = document.createElement('div');
    el.className = 'legend-item';
    el.innerHTML = `<div class="legend-dot" style="background:${c.color};"></div>${c.name}`;
    legend.appendChild(el);
  });
}

async function loadAssignments() {
  const res = await fetch(`${SB}/rest/v1/schedules?subject=ilike.*%D8%AC%D9%8A%D9%88*&select=class_name,teacher_id,grade&is_active=eq.true`, {headers: h()});
  const data = await res.json();
  assignments = {};
  (Array.isArray(data) ? data : []).forEach(row => {
    if (!assignments[row.class_name]) assignments[row.class_name] = {female:null, hasMale:false, grade:row.grade};
    if (row.teacher_id === COACH_MALE_ID) assignments[row.class_name].hasMale = true;
    else assignments[row.class_name].female = row.teacher_id;
  });

  // إذا لم تكن هناك بيانات من schedules، اجلب الشعب من students
  const classes = Object.keys(assignments);
  if (classes.length === 0) {
    const res2 = await fetch(`${SB}/rest/v1/students?select=class_name,grade&order=grade,class_name`, {headers: h()});
    const students = await res2.json();
    const seen = new Set();
    (Array.isArray(students) ? students : []).forEach(s => {
      if (!seen.has(s.class_name)) {
        seen.add(s.class_name);
        assignments[s.class_name] = {female: null, hasMale: false, grade: s.grade};
      }
    });
  }

  renderAll();
  setStatus('تم تحميل ' + Object.keys(assignments).length + ' شعبة', '');
}

function renderAll() {
  const byGrade = {};
  Object.entries(assignments).forEach(([cls, asgn]) => {
    const g = (asgn.grade || cls.replace(/[A-Za-z]/g,'')).toString();
    if (!byGrade[g]) byGrade[g] = [];
    byGrade[g].push(cls);
  });
  Object.values(byGrade).forEach(arr => arr.sort());

  const container = document.getElementById('mainContent');
  container.innerHTML = '';
  Object.keys(byGrade).sort((a,b) => parseInt(a)-parseInt(b)).forEach(grade => {
    const isMixed = MIXED_GRADES.includes(grade);
    const section = document.createElement('div');
    section.className = 'grade-section'; section.dataset.grade = grade;
    section.innerHTML = `
      <div class="grade-header">
        <span class="grade-title">الصف ${grade}</span>
        <span class="grade-badge ${isMixed?'mixed-badge':'girls-badge'}">${isMixed?'🔵 مختلط':'🌸 بنات فقط'}</span>
        <span style="color:var(--text3);font-size:13px;">${byGrade[grade].length} شعب</span>
      </div>
      <div class="classes-grid" id="grid-${grade}"></div>`;
    container.appendChild(section);
    const grid = section.querySelector('.classes-grid');
    byGrade[grade].forEach(cls => grid.appendChild(renderCard(cls, isMixed)));
  });
  applyFilter();
}

function renderCard(cls, isMixed) {
  const asgn = assignments[cls] || {female:null, hasMale:false};
  const card = document.createElement('div');
  card.className = 'class-card'; card.id = 'card-'+cls;

  const femaleOpts = `<option value="">— غير مُعيَّن —</option>` +
    COACHES.filter(c => c.id !== COACH_MALE_ID)
      .map(c => `<option value="${c.id}" ${asgn.female===c.id?'selected':''}>${c.name}</option>`)
      .join('');

  card.innerHTML = `
    <div class="class-name"><span>شعبة ${cls}</span><div class="modified-dot"></div></div>
    ${isMixed ? `<div class="coach-row">
      <span class="coach-label">أولاد:</span>
      <div class="coach-fixed">✅ ماكس (ثابت)</div>
    </div>` : ''}
    <div class="coach-row">
      <span class="coach-label">${isMixed?'بنات:':'مدرب/ة:'}</span>
      <select class="coach-select" id="sel-${cls}" onchange="onChange('${cls}',this.value)">
        ${femaleOpts}
      </select>
    </div>`;
  return card;
}

function onChange(cls, newId) {
  const orig = assignments[cls]?.female || '';
  if (newId !== orig) { pendingChanges[cls] = newId; document.getElementById('card-'+cls).classList.add('modified'); }
  else { delete pendingChanges[cls]; document.getElementById('card-'+cls).classList.remove('modified'); }
  updatePendingUI();
}

function updatePendingUI() {
  const n = Object.keys(pendingChanges).length;
  document.getElementById('btnSaveAll').disabled = n === 0;
  const badge = document.getElementById('pendingCount');
  badge.style.display = n > 0 ? 'inline-flex' : 'none';
  badge.textContent = n + ' تعديل معلّق';
}

function filterGrade(grade, btn) {
  currentFilter = grade;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('.grade-section').forEach(s => {
    s.style.display = (currentFilter === 'all' || s.dataset.grade === currentFilter) ? '' : 'none';
  });
}

async function saveAll() {
  if (!Object.keys(pendingChanges).length) return;
  document.getElementById('btnSaveAll').disabled = true;
  setStatus('جاري الحفظ...', 'saving');
  let saved = 0, errors = 0;

  for (const [cls, coachId] of Object.entries(pendingChanges)) {
    const coach = COACHES.find(c => c.id === coachId);
    const coachName = coach ? coach.name + ' — مدرب/ة جيوجيتسو' : '';
    try {
      // إذا فارغ، امسح التعيين؛ وإلا حدِّث أو أضف
      if (!coachId) {
        await fetch(`${SB}/rest/v1/schedules?class_name=eq.${cls}&subject=ilike.*%D8%AC%D9%8A%D9%88*&teacher_id=neq.${COACH_MALE_ID}`,
          {method:'DELETE', headers: h()});
      } else {
        // حاول PATCH أولاً
        const r = await fetch(`${SB}/rest/v1/schedules?class_name=eq.${cls}&subject=ilike.*%D8%AC%D9%8A%D9%88*&teacher_id=neq.${COACH_MALE_ID}`,
          {method:'PATCH', headers:{...h(),'Prefer':'return=minimal'}, body: JSON.stringify({teacher_id:coachId, teacher_name:coachName})});
        if (r.status === 204 || r.ok) { /* ok */ }
      }
      assignments[cls] = {...(assignments[cls]||{}), female: coachId||null};
      document.getElementById('card-'+cls)?.classList.remove('modified');
      saved++;
    } catch(e) { errors++; }
  }

  pendingChanges = {}; updatePendingUI();
  setStatus(errors===0 ? `✅ تم حفظ ${saved} تعديل` : `⚠️ تم ${saved} — فشل ${errors}`, errors===0?'success':'error');
}

function setStatus(msg, type) {
  const el = document.getElementById('statusText');
  el.textContent = msg; el.className = 'status-text ' + (type||'');
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
