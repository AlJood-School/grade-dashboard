<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيت كلمة المرور — بوابة الجود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font: 'Tajawal', Arial, sans-serif;
  --radius: 18px;
  --dim: rgba(255,255,255,0.45);
  --accent: #6C3DD6;
  --cyan: #22D3EE;
  --gold: rgba(212,168,75,0.92);
  --gold-bg: rgba(212,168,75,0.055);
  --gold-border: rgba(212,168,75,0.2);
}
body {
  font-family: var(--font);
  font-size: 18px;
  background: #07091a;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background-image: radial-gradient(ellipse at 20% 50%, rgba(108,61,214,0.12) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(34,211,238,0.08) 0%, transparent 50%);
}

/* ── شعار ── */
.brand { text-align: center; margin-bottom: 36px; }
.logo-box {
  width: 64px; height: 64px;
  border-radius: 16px;
  background: linear-gradient(135deg, #6C3DD6 0%, #22D3EE 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; margin: 0 auto 12px;
}
.brand-name { font-size: 26px; font-weight: 900; }
.brand-tagline { font-size: 13px; color: var(--dim); }

/* ── البطاقة ── */
.card {
  background: rgba(255,255,255,0.045);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  padding: 36px;
  width: 100%;
  max-width: 460px;
  backdrop-filter: blur(20px);
}
.card-title {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 8px;
  text-align: center;
}
.card-desc {
  font-size: 14px;
  color: var(--dim);
  text-align: center;
  margin-bottom: 28px;
  line-height: 1.6;
}

/* ── حقل الإدخال ── */
.field { margin-bottom: 20px; }
.field label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  color: rgba(255,255,255,0.78);
  margin-bottom: 8px;
}
.field input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.07);
  border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  color: #fff;
  font-family: var(--font);
  font-size: 16px;
  transition: border-color 0.2s;
  outline: none;
  direction: ltr;
  text-align: right;
}
.field input:focus {
  border-color: var(--accent);
  background: rgba(108,61,214,0.1);
}
.field input::placeholder { color: rgba(255,255,255,0.3); }

/* ── زر الإرسال ── */
.btn-send {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #6C3DD6, #22D3EE);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-family: var(--font);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  margin-top: 4px;
}
.btn-send:hover { opacity: 0.9; }
.btn-send:active { transform: scale(0.98); }
.btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── رابط الرجوع ── */
.back-link {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: var(--dim);
  font-size: 14px;
  text-decoration: none;
  transition: color 0.2s;
}
.back-link:hover { color: #fff; }

/* ── رسائل الحالة ── */
.msg {
  padding: 14px 16px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  margin-top: 16px;
  display: none;
}
.msg.success {
  background: rgba(34,211,150,0.12);
  border: 1px solid rgba(34,211,150,0.3);
  color: #22d396;
  display: block;
}
.msg.error {
  background: rgba(239,68,68,0.12);
  border: 1px solid rgba(239,68,68,0.3);
  color: #f87171;
  display: block;
}
.msg.info {
  background: var(--gold-bg);
  border: 1px solid var(--gold-border);
  color: var(--gold);
  display: block;
}

/* ── NAFAS ── */
.nafas-footer {
  margin-top: 32px;
  font-size: 11px;
  color: rgba(255,255,255,0.25);
  text-align: center;
}
</style>
</head>
<body>

<div class="brand">
  <div class="logo-box">🎓</div>
  <div class="brand-name">بوابة الجود</div>
  <div class="brand-tagline">Powered by EduOS</div>
</div>

<div class="card">
  <div class="card-title">🔑 نسيت كلمة المرور؟</div>
  <div class="card-desc">
    أدخلي اسم المستخدم وسيصل رابط إعادة التعيين<br>
    إلى بريدك الوزاري خلال دقائق
  </div>

  <div class="field">
    <label>اسم المستخدم</label>
    <input type="text" id="usernameInput" placeholder="مثال: fatima.alshamsi" autocomplete="username" />
  </div>

  <button class="btn-send" id="sendBtn" onclick="sendReset()">
    إرسال رابط إعادة التعيين
  </button>

  <div class="msg" id="statusMsg"></div>

  <a class="back-link" href="../eduos-login/">← العودة لتسجيل الدخول</a>
</div>

<div class="nafas-footer">NAFAS FOR ARTIFICIAL INTELLIGENCE · CN-6573712 · أبوظبي</div>

<script src="../platform-config.js"></script>
<script>
async function sendReset() {
  const username = document.getElementById('usernameInput').value.trim();
  const btn = document.getElementById('sendBtn');
  const msg = document.getElementById('statusMsg');

  msg.className = 'msg';
  msg.style.display = 'none';

  if (!username) {
    msg.className = 'msg error';
    msg.style.display = 'block';
    msg.textContent = 'الرجاء إدخال اسم المستخدم';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جارٍ الإرسال...';

  try {
    const cfg = window.EduOS || {};
    const SB_URL = cfg.SB_URL;
    const SB_KEY = cfg.SB_KEY;

    // استخدام RPC مباشرة عبر DB (أكثر موثوقية من EF)
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    const supabase = createClient(SB_URL, SB_KEY);
    const { data, error } = await supabase.rpc('request_password_reset', { p_username: username });

    if (!error && data && data.success) {
      msg.className = 'msg success';
      msg.style.display = 'block';
      msg.textContent = '✅ تم الإرسال! تفقدي بريدك الوزاري خلال دقائق.';
      document.getElementById('usernameInput').value = '';
    } else if (error || (data && data.error)) {
      const errCode = data && data.error;
      if (errCode === 'not_found') {
        msg.className = 'msg error';
        msg.style.display = 'block';
        msg.textContent = 'اسم المستخدم غير موجود — تواصلي مع مدير النظام';
      } else if (errCode === 'no_email') {
        msg.className = 'msg error';
        msg.style.display = 'block';
        msg.textContent = 'لا يوجد بريد إلكتروني — تواصلي مع مدير النظام';
      } else {
        msg.className = 'msg error';
        msg.style.display = 'block';
        msg.textContent = (error && error.message) || 'حدث خطأ، حاولي مجدداً';
      }
    }
  } catch (e) {
    msg.className = 'msg error';
    msg.style.display = 'block';
    msg.textContent = 'تعذّر الاتصال بالخادم، حاولي مجدداً';
  }

  btn.disabled = false;
  btn.textContent = 'إرسال رابط إعادة التعيين';
}

document.getElementById('usernameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendReset();
});
</script>
</body>
</html>
