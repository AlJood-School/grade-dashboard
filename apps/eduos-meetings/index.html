<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاجتماعات المدرسية | EduOS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<script src="../platform-shield.js" defer></script>
<script src="../platform-auth-guard.js" defer></script>
<script src="../platform-lang.js" defer></script>
<script src="../platform-messages.js" defer></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',Arial,sans-serif;background:#0F172A;color:#E2E8F0;min-height:100vh;font-size:17px}

/* ── HEADER ── */
.header{background:#1E293B;border-bottom:2px solid #334155;padding:0 20px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,0.4)}
.header-inner{max-width:1300px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:42px;height:42px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.brand-info h1{font-size:1.05rem;font-weight:900;color:#F1F5F9}
.brand-info p{font-size:.72rem;color:#94A3B8}
.header-actions{display:flex;align-items:center;gap:8px}
.week-pill{background:#1E3A5F;color:#60A5FA;border-radius:20px;padding:5px 14px;font-size:.82rem;font-weight:700}
.btn-back{background:#334155;color:#CBD5E1;border:none;border-radius:10px;padding:8px 16px;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-back:hover{background:#475569}
.btn-new{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-new:hover{opacity:.9}

/* ── TABS ── */
.tabs{display:flex;gap:4px;background:#1E293B;border-bottom:1px solid #334155;padding:0 20px}
.tab{padding:14px 20px;font-family:'Tajawal',Arial,sans-serif;font-size:.9rem;font-weight:700;color:#94A3B8;background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:#22D3EE;border-bottom-color:#22D3EE}
.tab:hover:not(.active){color:#CBD5E1}

/* ── MAIN ── */
.main{max-width:1300px;margin:0 auto;padding:24px 20px}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:#1E293B;border:1px solid #334155;border-radius:14px;padding:16px 20px;text-align:center}
.stat-val{font-size:2rem;font-weight:900;color:#22D3EE}
.stat-lbl{font-size:.82rem;color:#94A3B8;margin-top:4px}

/* ── FILTERS ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filter-btn{background:#1E293B;border:1px solid #334155;border-radius:20px;padding:6px 16px;font-family:'Tajawal',Arial,sans-serif;font-size:.83rem;color:#94A3B8;cursor:pointer;transition:.2s}
.filter-btn.active{background:#6C3DD6;border-color:#6C3DD6;color:#fff}
.filter-btn:hover:not(.active){border-color:#475569;color:#CBD5E1}

/* ── MEETINGS LIST ── */
.meetings-grid{display:flex;flex-direction:column;gap:12px}
.meeting-card{background:#1E293B;border:1px solid #334155;border-radius:14px;padding:18px 20px;cursor:pointer;transition:.15s}
.meeting-card:hover{border-color:#475569;background:#253347}
.meeting-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.meeting-title{font-size:1.05rem;font-weight:700;color:#F1F5F9}
.meeting-type-badge{padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700;flex-shrink:0}
.type-general{background:#1E3A5F;color:#60A5FA}
.type-pedagogical{background:#14532D;color:#4ADE80}
.type-emergency{background:#7F1D1D;color:#FCA5A5}
.type-parent{background:#713F12;color:#FCD34D}
.type-department{background:#4C1D95;color:#C4B5FD}
.meeting-meta{display:flex;gap:16px;flex-wrap:wrap}
.meta-item{display:flex;align-items:center;gap:5px;font-size:.83rem;color:#94A3B8}
.meta-item span{color:#CBD5E1}
.meeting-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid #334155}
.status-badge{padding:3px 12px;border-radius:20px;font-size:.78rem;font-weight:700}
.status-upcoming{background:#1E3A5F;color:#60A5FA}
.status-done{background:#14532D;color:#4ADE80}
.status-cancelled{background:#374151;color:#9CA3AF}
.rsvp-row{display:flex;gap:6px}
.rsvp-btn{padding:5px 14px;border-radius:8px;font-family:'Tajawal',Arial,sans-serif;font-size:.8rem;font-weight:700;border:none;cursor:pointer}
.rsvp-confirm{background:#4ADE80;color:#052e16}
.rsvp-confirm:hover{background:#22c55e}
.rsvp-decline{background:#F87171;color:#450a0a}
.rsvp-decline:hover{background:#ef4444}
.rsvp-pending{background:#FCD34D;color:#451a03}
.rsvp-pending:hover{background:#fbbf24}
.rsvp-done{background:#374151;color:#9CA3AF;cursor:default}

/* ── MY MEETINGS ── */
.my-timeline{display:flex;flex-direction:column;gap:10px}
.my-card{background:#1E293B;border:1px solid #334155;border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.my-card-info{flex:1}
.my-card-title{font-weight:700;color:#F1F5F9;font-size:.95rem}
.my-card-date{font-size:.82rem;color:#94A3B8;margin-top:3px}
.my-card-response{padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:700}
.resp-confirmed{background:#14532D;color:#4ADE80}
.resp-declined{background:#7F1D1D;color:#FCA5A5}
.resp-pending{background:#713F12;color:#FCD34D}
.resp-none{background:#1E293B;color:#94A3B8;border:1px solid #334155}

/* ── CALENDAR ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-title{font-size:1.1rem;font-weight:900;color:#F1F5F9}
.cal-nav{background:#334155;color:#CBD5E1;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:1rem}
.cal-nav:hover{background:#475569}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day-header{text-align:center;font-size:.75rem;color:#64748B;padding:6px 0;font-weight:700}
.cal-day{min-height:80px;background:#1E293B;border:1px solid #334155;border-radius:8px;padding:6px;cursor:pointer;transition:.15s}
.cal-day:hover{border-color:#475569}
.cal-day.today{border-color:#6C3DD6;background:#1e1535}
.cal-day.other-month{opacity:.4}
.cal-day-num{font-size:.8rem;color:#64748B;font-weight:700;margin-bottom:4px}
.cal-day.today .cal-day-num{color:#A78BFA}
.cal-event-dot{font-size:.7rem;background:#6C3DD6;color:#fff;border-radius:4px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#1E293B;border:1px solid #334155;border-radius:18px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-header{padding:20px 24px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#1E293B;z-index:1}
.modal-header h2{font-size:1.1rem;font-weight:900;color:#F1F5F9}
.modal-close{background:#334155;color:#94A3B8;border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1.1rem}
.modal-close:hover{background:#475569;color:#F1F5F9}
.modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:.85rem;color:#94A3B8;font-weight:700}
.form-input,.form-select,.form-textarea{background:#0F172A;border:1px solid #334155;border-radius:10px;color:#F1F5F9;font-family:'Tajawal',Arial,sans-serif;font-size:.95rem;padding:10px 14px;width:100%;outline:none;transition:.2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#6C3DD6;box-shadow:0 0 0 2px rgba(108,61,214,.2)}
.form-textarea{min-height:90px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{padding:16px 24px;border-top:1px solid #334155;display:flex;justify-content:flex-end;gap:10px}
.btn-cancel-modal{background:#334155;color:#CBD5E1;border:none;border-radius:10px;padding:10px 20px;font-family:'Tajawal',Arial,sans-serif;font-size:.9rem;cursor:pointer}
.btn-save{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-family:'Tajawal',Arial,sans-serif;font-size:.9rem;font-weight:700;cursor:pointer}

/* ── DETAIL ── */
.detail-section{margin-bottom:16px}
.detail-section-title{font-size:.8rem;text-transform:uppercase;color:#64748B;letter-spacing:.5px;margin-bottom:8px;font-weight:700}
.detail-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-info-item{background:#0F172A;border-radius:10px;padding:10px 14px}
.detail-info-label{font-size:.75rem;color:#64748B;margin-bottom:2px}
.detail-info-value{font-size:.9rem;color:#F1F5F9;font-weight:600}
.agenda-box{background:#0F172A;border-radius:10px;padding:14px;color:#CBD5E1;font-size:.9rem;line-height:1.7;white-space:pre-wrap}
.attendees-list{display:flex;flex-direction:column;gap:6px}
.attendee-row{display:flex;align-items:center;justify-content:space-between;background:#0F172A;border-radius:8px;padding:8px 12px}
.attendee-name{font-size:.88rem;color:#CBD5E1}

/* ── MINUTES ── */
.minutes-box{background:#0F172A;border:1px solid #334155;border-radius:10px;padding:14px;min-height:100px;color:#CBD5E1;font-size:.9rem;resize:vertical;width:100%;font-family:'Tajawal',Arial,sans-serif;outline:none}
.minutes-box:focus{border-color:#6C3DD6}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:60px 20px;color:#475569}
.empty-icon{font-size:3.5rem;margin-bottom:16px}
.empty-title{font-size:1.1rem;font-weight:700;color:#64748B;margin-bottom:8px}
.empty-sub{font-size:.88rem;color:#475569}

/* ── TOAST ── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1E293B;border:1px solid #334155;color:#F1F5F9;border-radius:12px;padding:12px 24px;font-size:.9rem;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;max-width:320px;text-align:center}
.toast.show{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── PANEL ── */
.panel{display:none}
.panel.active{display:block}

@media(max-width:600px){
  .form-row{grid-template-columns:1fr}
  .detail-info-grid{grid-template-columns:1fr}
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">🤝</div>
      <div class="brand-info">
        <h1>الاجتماعات المدرسية</h1>
        <p id="schoolName">بوابة الجود الذكية · EduOS</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="week-pill" id="weekLabel">الأسبوع —</div>
      <button class="btn-back" onclick="history.back()">&#8594; رجوع</button>
      <button class="btn-new" id="btnNew" onclick="openNewMeeting()" style="display:none">+ اجتماع جديد</button>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-panel="all" onclick="switchTab(this,'all')">📋 جميع الاجتماعات</button>
  <button class="tab" data-panel="mine" onclick="switchTab(this,'mine')">👤 اجتماعاتي</button>
  <button class="tab" data-panel="calendar" onclick="switchTab(this,'calendar')">📅 التقويم</button>
</div>

<div class="main">

  <!-- STATS -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-val" id="statTotal">—</div><div class="stat-lbl">إجمالي الاجتماعات</div></div>
    <div class="stat-card"><div class="stat-val" id="statUpcoming">—</div><div class="stat-lbl">قادمة</div></div>
    <div class="stat-card"><div class="stat-val" id="statDone">—</div><div class="stat-lbl">منتهية</div></div>
    <div class="stat-card"><div class="stat-val" id="statMine">—</div><div class="stat-lbl">اجتماعاتي</div></div>
  </div>

  <!-- PANEL: ALL -->
  <div class="panel active" id="panel-all">
    <div class="filters" id="filtersRow">
      <button class="filter-btn active" onclick="setTypeFilter('all',this)">الكل</button>
      <button class="filter-btn" onclick="setTypeFilter('general',this)">عام</button>
      <button class="filter-btn" onclick="setTypeFilter('pedagogical',this)">تربوي</button>
      <button class="filter-btn" onclick="setTypeFilter('department',this)">قسم</button>
      <button class="filter-btn" onclick="setTypeFilter('parent',this)">أولياء أمور</button>
      <button class="filter-btn" onclick="setTypeFilter('emergency',this)">طارئ</button>
    </div>
    <div class="meetings-grid" id="allList">
      <div class="empty-state"><div class="empty-icon">🔄</div><div class="empty-title">جارٍ التحميل...</div></div>
    </div>
  </div>

  <!-- PANEL: MINE -->
  <div class="panel" id="panel-mine">
    <div class="my-timeline" id="mineList">
      <div class="empty-state"><div class="empty-icon">🔄</div><div class="empty-title">جارٍ التحميل...</div></div>
    </div>
  </div>

  <!-- PANEL: CALENDAR -->
  <div class="panel" id="panel-calendar">
    <div class="cal-header">
      <button class="cal-nav" onclick="changeMonth(-1)">&#8250;</button>
      <div class="cal-title" id="calTitle">—</div>
      <button class="cal-nav" onclick="changeMonth(1)">&#8249;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

</div>

<!-- MODAL: NEW/EDIT MEETING -->
<div class="modal-overlay" id="modalNew">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalNewTitle">اجتماع جديد</h2>
      <button class="modal-close" onclick="closeModal('modalNew')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">عنوان الاجتماع *</label>
        <input class="form-input" id="fTitle" placeholder="مثال: اجتماع مجلس المعلمين الشهري">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">نوع الاجتماع *</label>
          <select class="form-select" id="fType">
            <option value="general">اجتماع عام</option>
            <option value="pedagogical">اجتماع تربوي</option>
            <option value="department">اجتماع قسم</option>
            <option value="parent">اجتماع أولياء أمور</option>
            <option value="emergency">اجتماع طارئ</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">المستهدفون</label>
          <select class="form-select" id="fTargetType">
            <option value="all_staff">كل الموظفين</option>
            <option value="teachers">المعلمات</option>
            <option value="admin_staff">الإداريون</option>
            <option value="specific">أفراد محددون</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">تاريخ الاجتماع *</label>
          <input class="form-input" type="date" id="fDate">
        </div>
        <div class="form-group">
          <label class="form-label">وقت الاجتماع *</label>
          <input class="form-input" type="time" id="fTime">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">المكان</label>
        <input class="form-input" id="fLocation" placeholder="مثال: قاعة الاجتماعات — الطابق الأول">
      </div>
      <div class="form-group">
        <label class="form-label">جدول الأعمال</label>
        <textarea class="form-textarea" id="fAgenda" placeholder="اكتبي نقاط جدول الأعمال..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel-modal" onclick="closeModal('modalNew')">إلغاء</button>
      <button class="btn-save" onclick="saveMeeting()">💾 حفظ</button>
    </div>
  </div>
</div>

<!-- MODAL: DETAIL -->
<div class="modal-overlay" id="modalDetail">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">تفاصيل الاجتماع</h2>
      <button class="modal-close" onclick="closeModal('modalDetail')">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer" id="detailFooter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════
   INIT — انتظر EduOS
═══════════════════════════════════════ */
var SB_URL, SB_KEY, user, canCreate;

document.addEventListener('DOMContentLoaded', function () {
  // انتظار platform-config
  var tries = 0;
  var interval = setInterval(function () {
    tries++;
    if (window.EduOS && window.EduOS.SB_URL) {
      clearInterval(interval);
      SB_URL = window.EduOS.SB_URL;
      SB_KEY  = window.EduOS.SB_KEY;
      init();
    } else if (tries > 40) {
      clearInterval(interval);
      showToast('خطأ في الاتصال بالمنصة');
    }
  }, 100);
});

function init () {
  try { user = JSON.parse(sessionStorage.getItem('edoos_user') || 'null'); } catch (e) {}
  if (!user || !user.id) { window.location.href = '../eduos-login/'; return; }

  // من يحق له إنشاء اجتماع
  canCreate = ['admin','principal','vice_principal','secretary'].indexOf(user.role_key) >= 0;
  if (canCreate) document.getElementById('btnNew').style.display = 'flex';

  if (window.getPlatformWeek) {
    document.getElementById('weekLabel').textContent = 'الأسبوع ' + getPlatformWeek();
  }

  loadAll();
  renderCalendar();
}

/* ═══════════════════════════════════════
   DATA
═══════════════════════════════════════ */
var allMeetings = [];
var myResponses = {};
var typeFilter = 'all';
var currentMonth = new Date();
var editingId = null;

async function loadAll () {
  try {
    var [mRes, rRes] = await Promise.all([
      fetch(SB_URL + '/rest/v1/meetings?order=meeting_date.asc,meeting_time.asc&limit=500', {
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
      }),
      fetch(SB_URL + '/rest/v1/meeting_responses?staff_id=eq.' + encodeURIComponent(user.id) + '&select=meeting_id,response', {
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
      })
    ]);

    var meetings = await mRes.json();
    var responses = await rRes.json();

    allMeetings = Array.isArray(meetings) ? meetings : [];

    myResponses = {};
    if (Array.isArray(responses)) {
      responses.forEach(function (r) { myResponses[r.meeting_id] = r.response; });
    }

    renderStats();
    renderAll();
    renderMine();
    renderCalendar();
  } catch (e) {
    allMeetings = [];
    renderStats();
    renderAll();
    renderMine();
  }
}

/* ═══════════════════════════════════════
   STATS
═══════════════════════════════════════ */
function renderStats () {
  var today = new Date().toISOString().slice(0,10);
  var upcoming = allMeetings.filter(function (m) { return m.meeting_date >= today && m.status !== 'cancelled'; });
  var done = allMeetings.filter(function (m) { return m.status === 'done' || m.meeting_date < today; });
  var mine = allMeetings.filter(function (m) { return isForMe(m); });

  document.getElementById('statTotal').textContent = allMeetings.length;
  document.getElementById('statUpcoming').textContent = upcoming.length;
  document.getElementById('statDone').textContent = done.length;
  document.getElementById('statMine').textContent = mine.length;
}

function isForMe (m) {
  if (!m.target_type || m.target_type === 'all_staff') return true;
  if (m.target_type === 'teachers' && user.role_key === 'teacher') return true;
  if (m.target_type === 'admin_staff' && ['admin','secretary','principal','vice_principal'].indexOf(user.role_key) >= 0) return true;
  if (Array.isArray(m.target_ids) && m.target_ids.indexOf(user.id) >= 0) return true;
  if (m.creator_id === user.id) return true;
  return false;
}

/* ═══════════════════════════════════════
   ALL MEETINGS
═══════════════════════════════════════ */
function setTypeFilter (type, el) {
  typeFilter = type;
  document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
  if (el) el.classList.add('active');
  renderAll();
}

function renderAll () {
  var list = document.getElementById('allList');
  var filtered = allMeetings.filter(function (m) {
    return typeFilter === 'all' || m.type === typeFilter;
  });

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🤝</div><div class="empty-title">لا توجد اجتماعات</div><div class="empty-sub">اضغطي على "+ اجتماع جديد" لإنشاء أول اجتماع</div></div>';
    return;
  }

  list.innerHTML = filtered.map(function (m) { return renderMeetingCard(m); }).join('');
}

function renderMeetingCard (m) {
  var today = new Date().toISOString().slice(0,10);
  var isPast = m.meeting_date < today;
  var statusClass = m.status === 'done' ? 'status-done' : (m.status === 'cancelled' ? 'status-cancelled' : (isPast ? 'status-done' : 'status-upcoming'));
  var statusLabel = m.status === 'done' ? '✓ منتهي' : (m.status === 'cancelled' ? '✗ ملغي' : (isPast ? '✓ منتهي' : '🕐 قادم'));
  var myResp = myResponses[m.id];
  var rsvpHtml = '';

  if (isForMe(m) && m.status !== 'cancelled' && !isPast && m.creator_id !== user.id) {
    if (myResp === 'confirmed') {
      rsvpHtml = '<button class="rsvp-btn rsvp-done">✓ تأكدت حضوري</button>';
    } else if (myResp === 'declined') {
      rsvpHtml = '<button class="rsvp-btn rsvp-done">✗ اعتذرت</button>';
    } else {
      rsvpHtml = '<button class="rsvp-btn rsvp-confirm" onclick="event.stopPropagation();rsvp(\'' + m.id + '\',\'confirmed\')">✓ حضور</button>' +
                 '<button class="rsvp-btn rsvp-pending" onclick="event.stopPropagation();rsvp(\'' + m.id + '\',\'pending\')">؟ ربما</button>' +
                 '<button class="rsvp-btn rsvp-decline" onclick="event.stopPropagation();rsvp(\'' + m.id + '\',\'declined\')">✗ اعتذار</button>';
    }
  }

  return '<div class="meeting-card" onclick="showDetail(\'' + m.id + '\')">' +
    '<div class="meeting-card-header">' +
      '<div class="meeting-title">' + esc(m.title) + '</div>' +
      '<span class="meeting-type-badge type-' + (m.type||'general') + '">' + typeLabel(m.type) + '</span>' +
    '</div>' +
    '<div class="meeting-meta">' +
      '<div class="meta-item">📅 <span>' + formatDate(m.meeting_date) + '</span></div>' +
      '<div class="meta-item">🕐 <span>' + (m.meeting_time ? m.meeting_time.slice(0,5) : '—') + '</span></div>' +
      (m.location ? '<div class="meta-item">📍 <span>' + esc(m.location) + '</span></div>' : '') +
      '<div class="meta-item">👤 <span>' + esc(m.creator_name || '—') + '</span></div>' +
    '</div>' +
    '<div class="meeting-card-footer">' +
      '<span class="status-badge ' + statusClass + '">' + statusLabel + '</span>' +
      '<div class="rsvp-row">' + rsvpHtml + '</div>' +
    '</div>' +
  '</div>';
}

/* ═══════════════════════════════════════
   MY MEETINGS
═══════════════════════════════════════ */
function renderMine () {
  var list = document.getElementById('mineList');
  var mine = allMeetings.filter(function (m) { return isForMe(m); });

  if (!mine.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">لا توجد اجتماعات مخصصة لك</div></div>';
    return;
  }

  list.innerHTML = mine.map(function (m) {
    var resp = myResponses[m.id];
    var respClass = resp === 'confirmed' ? 'resp-confirmed' : (resp === 'declined' ? 'resp-declined' : (resp === 'pending' ? 'resp-pending' : 'resp-none'));
    var respLabel = resp === 'confirmed' ? '✓ حضور مؤكد' : (resp === 'declined' ? '✗ اعتذرت' : (resp === 'pending' ? '؟ ربما' : 'لم تُحدد'));

    return '<div class="my-card" onclick="showDetail(\'' + m.id + '\')">' +
      '<div class="my-card-info">' +
        '<div class="my-card-title">' + esc(m.title) + '</div>' +
        '<div class="my-card-date">📅 ' + formatDate(m.meeting_date) + ' &nbsp; 🕐 ' + (m.meeting_time ? m.meeting_time.slice(0,5) : '—') + (m.location ? ' &nbsp; 📍 ' + esc(m.location) : '') + '</div>' +
      '</div>' +
      '<span class="my-card-response ' + respClass + '">' + respLabel + '</span>' +
    '</div>';
  }).join('');
}

/* ═══════════════════════════════════════
   CALENDAR
═══════════════════════════════════════ */
function changeMonth (dir) { currentMonth.setMonth(currentMonth.getMonth() + dir); renderCalendar(); }

function renderCalendar () {
  var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var days = ['أح','إث','ثل','أر','خم','جم','سب'];
  document.getElementById('calTitle').textContent = months[currentMonth.getMonth()] + ' ' + currentMonth.getFullYear();

  var grid = document.getElementById('calGrid');
  var year = currentMonth.getFullYear();
  var month = currentMonth.getMonth();
  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var todayStr = new Date().toISOString().slice(0,10);

  var html = days.map(function (d) { return '<div class="cal-day-header">' + d + '</div>'; }).join('');

  // خلايا فارغة قبل أول يوم
  for (var i = 0; i < firstDay; i++) html += '<div class="cal-day other-month"></div>';

  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var isToday = dateStr === todayStr;
    var dayMeetings = allMeetings.filter(function (m) { return m.meeting_date === dateStr; });
    var dotsHtml = dayMeetings.slice(0,3).map(function (m) {
      return '<div class="cal-event-dot" onclick="event.stopPropagation();showDetail(\'' + m.id + '\')">' + esc(m.title.slice(0,12)) + '</div>';
    }).join('');

    html += '<div class="cal-day' + (isToday ? ' today' : '') + '">' +
      '<div class="cal-day-num">' + d + '</div>' + dotsHtml + '</div>';
  }

  grid.innerHTML = html;
}

/* ═══════════════════════════════════════
   DETAIL
═══════════════════════════════════════ */
async function showDetail (id) {
  var m = allMeetings.find(function (x) { return x.id === id; });
  if (!m) return;

  // جلب الردود
  var respData = [];
  try {
    var r = await fetch(SB_URL + '/rest/v1/meeting_responses?meeting_id=eq.' + id + '&select=staff_name,response', {
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
    });
    respData = await r.json();
    if (!Array.isArray(respData)) respData = [];
  } catch (e) {}

  var today = new Date().toISOString().slice(0,10);
  var isPast = m.meeting_date < today;

  document.getElementById('detailTitle').textContent = m.title;

  var respCounts = { confirmed: 0, declined: 0, pending: 0 };
  respData.forEach(function (r) { if (respCounts[r.response] !== undefined) respCounts[r.response]++; });

  var body = '<div class="detail-section">' +
    '<div class="detail-section-title">معلومات الاجتماع</div>' +
    '<div class="detail-info-grid">' +
      '<div class="detail-info-item"><div class="detail-info-label">النوع</div><div class="detail-info-value">' + typeLabel(m.type) + '</div></div>' +
      '<div class="detail-info-item"><div class="detail-info-label">التاريخ</div><div class="detail-info-value">' + formatDate(m.meeting_date) + '</div></div>' +
      '<div class="detail-info-item"><div class="detail-info-label">الوقت</div><div class="detail-info-value">' + (m.meeting_time ? m.meeting_time.slice(0,5) : '—') + '</div></div>' +
      '<div class="detail-info-item"><div class="detail-info-label">المكان</div><div class="detail-info-value">' + esc(m.location || '—') + '</div></div>' +
      '<div class="detail-info-item"><div class="detail-info-label">المُنشئ</div><div class="detail-info-value">' + esc(m.creator_name || '—') + '</div></div>' +
      '<div class="detail-info-item"><div class="detail-info-label">الحالة</div><div class="detail-info-value">' + statusLabel(m.status) + '</div></div>' +
    '</div>' +
  '</div>';

  if (m.agenda) {
    body += '<div class="detail-section"><div class="detail-section-title">جدول الأعمال</div><div class="agenda-box">' + esc(m.agenda) + '</div></div>';
  }

  if (respData.length) {
    body += '<div class="detail-section"><div class="detail-section-title">الردود (' + respData.length + '): ✓ ' + respCounts.confirmed + ' &nbsp; ؟ ' + respCounts.pending + ' &nbsp; ✗ ' + respCounts.declined + '</div>' +
      '<div class="attendees-list">' +
      respData.map(function (r) {
        var cls = r.response === 'confirmed' ? 'resp-confirmed' : (r.response === 'declined' ? 'resp-declined' : 'resp-pending');
        var lbl = r.response === 'confirmed' ? '✓ حضور' : (r.response === 'declined' ? '✗ اعتذار' : '؟ ربما');
        return '<div class="attendee-row"><span class="attendee-name">' + esc(r.staff_name || '—') + '</span><span class="my-card-response ' + cls + '" style="font-size:.75rem;padding:3px 10px">' + lbl + '</span></div>';
      }).join('') +
    '</div></div>';
  }

  document.getElementById('detailBody').innerHTML = body;

  var footer = '';
  // أزرار RSVP إذا لم يُرد بعد
  var myResp = myResponses[id];
  if (isForMe(m) && !isPast && m.status !== 'cancelled' && m.creator_id !== user.id) {
    if (!myResp) {
      footer += '<button class="rsvp-btn rsvp-confirm" onclick="rsvp(\'' + id + '\',\'confirmed\')">✓ تأكيد حضور</button>' +
                '<button class="rsvp-btn rsvp-pending" onclick="rsvp(\'' + id + '\',\'pending\')">؟ ربما</button>' +
                '<button class="rsvp-btn rsvp-decline" onclick="rsvp(\'' + id + '\',\'declined\')">✗ اعتذار</button>';
    }
  }

  if (canCreate && m.creator_id === user.id) {
    if (m.status === 'upcoming') {
      footer += '<button class="btn-save" onclick="markDone(\'' + id + '\')">✓ إنهاء الاجتماع</button>';
    }
  }
  if (!footer) footer = '<button class="btn-cancel-modal" onclick="closeModal(\'modalDetail\')">إغلاق</button>';
  else footer = '<button class="btn-cancel-modal" onclick="closeModal(\'modalDetail\')" style="margin-left:auto">إغلاق</button>' + footer;

  document.getElementById('detailFooter').innerHTML = footer;
  document.getElementById('modalDetail').classList.add('open');
}

/* ═══════════════════════════════════════
   RSVP
═══════════════════════════════════════ */
async function rsvp (meetingId, response) {
  var m = allMeetings.find(function (x) { return x.id === meetingId; });
  try {
    var existing = await fetch(SB_URL + '/rest/v1/meeting_responses?meeting_id=eq.' + meetingId + '&staff_id=eq.' + encodeURIComponent(user.id), {
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
    });
    var rows = await existing.json();

    if (Array.isArray(rows) && rows.length > 0) {
      await fetch(SB_URL + '/rest/v1/meeting_responses?meeting_id=eq.' + meetingId + '&staff_id=eq.' + encodeURIComponent(user.id), {
        method: 'PATCH',
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ response: response, responded_at: new Date().toISOString() })
      });
    } else {
      await fetch(SB_URL + '/rest/v1/meeting_responses', {
        method: 'POST',
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ meeting_id: meetingId, staff_id: user.id, staff_name: user.name || user.name_ar || user.id, response: response })
      });
    }

    myResponses[meetingId] = response;
    var lbl = response === 'confirmed' ? 'تم تأكيد حضورك ✓' : (response === 'declined' ? 'تم تسجيل اعتذارك' : 'تم تسجيل ردك');
    showToast(lbl);
    closeModal('modalDetail');
    renderAll();
    renderMine();
  } catch (e) {
    showToast('خطأ — حاولي مرة أخرى');
  }
}

/* ═══════════════════════════════════════
   MARK DONE
═══════════════════════════════════════ */
async function markDone (id) {
  try {
    await fetch(SB_URL + '/rest/v1/meetings?id=eq.' + id, {
      method: 'PATCH',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ status: 'done', updated_at: new Date().toISOString() })
    });
    showToast('تم إنهاء الاجتماع ✓');
    closeModal('modalDetail');
    loadAll();
  } catch (e) {
    showToast('خطأ — حاولي مرة أخرى');
  }
}

/* ═══════════════════════════════════════
   NEW / SAVE
═══════════════════════════════════════ */
function openNewMeeting () {
  editingId = null;
  document.getElementById('modalNewTitle').textContent = 'اجتماع جديد';
  document.getElementById('fTitle').value = '';
  document.getElementById('fType').value = 'general';
  document.getElementById('fTargetType').value = 'all_staff';
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('fTime').value = '08:00';
  document.getElementById('fLocation').value = '';
  document.getElementById('fAgenda').value = '';
  document.getElementById('modalNew').classList.add('open');
}

async function saveMeeting () {
  var title = document.getElementById('fTitle').value.trim();
  var date  = document.getElementById('fDate').value;
  var time  = document.getElementById('fTime').value;
  if (!title || !date || !time) { showToast('يرجى ملء الحقول الإلزامية'); return; }

  var payload = {
    title: title,
    type: document.getElementById('fType').value,
    target_type: document.getElementById('fTargetType').value,
    creator_id: user.id,
    creator_name: user.name || user.name_ar || user.id,
    meeting_date: date,
    meeting_time: time,
    location: document.getElementById('fLocation').value.trim() || null,
    agenda: document.getElementById('fAgenda').value.trim() || null,
    status: 'upcoming',
    school_id: (window.EduOS && window.EduOS.school) ? window.EduOS.school.id : null,
    updated_at: new Date().toISOString()
  };

  try {
    var method, url;
    if (editingId) {
      method = 'PATCH';
      url = SB_URL + '/rest/v1/meetings?id=eq.' + editingId;
    } else {
      method = 'POST';
      url = SB_URL + '/rest/v1/meetings';
    }

    var res = await fetch(url, {
      method: method,
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error('save failed');
    showToast(editingId ? 'تم تحديث الاجتماع ✓' : 'تم إنشاء الاجتماع ✓');
    closeModal('modalNew');
    loadAll();
  } catch (e) {
    showToast('خطأ في الحفظ — حاولي مرة أخرى');
  }
}

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function switchTab (el, panel) {
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
  document.getElementById('panel-' + panel).classList.add('active');
}

function closeModal (id) { document.getElementById(id).classList.remove('open'); }

function showToast (msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 3000);
}

function esc (s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function formatDate (ds) {
  if (!ds) return '—';
  var d = new Date(ds);
  var days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
}

function typeLabel (t) {
  var map = { general:'عام', pedagogical:'تربوي', department:'قسم', parent:'أولياء أمور', emergency:'طارئ' };
  return map[t] || t;
}

function statusLabel (s) {
  var map = { upcoming:'قادم 🕐', done:'منتهي ✓', cancelled:'ملغي ✗' };
  return map[s] || s;
}
