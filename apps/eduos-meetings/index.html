<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاجتماعات المدرسية | EduOS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="../platform-config.js"></script>
<script src="../platform-shield.js" defer></script>
<script src="../platform-auth-guard.js" defer></script>
<script src="../platform-lang.js" defer></script>
<script src="../platform-messages.js" defer></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',Arial,sans-serif;background:#F1F5F9;color:#1E293B;min-height:100vh;font-size:17px}

/* ── HEADER ── */
.header{background:#fff;border-bottom:1px solid #E2E8F0;box-shadow:0 1px 4px rgba(0,0,0,0.08);padding:0 20px;position:sticky;top:0;z-index:200}
.header-inner{max-width:1300px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:42px;height:42px;background:linear-gradient(135deg,#6C3DD6,#22D3EE);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.brand-info h1{font-size:1.05rem;font-weight:900;color:#0F172A}
.brand-info p{font-size:.72rem;color:#64748B}
.header-actions{display:flex;align-items:center;gap:8px}
.week-pill{background:#EDE9FE;color:#6C3DD6;border-radius:20px;padding:5px 14px;font-size:.82rem;font-weight:700}
.btn-back{background:#F1F5F9;color:#475569;border:1px solid #E2E8F0;border-radius:10px;padding:8px 16px;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-back:hover{background:#E2E8F0}
.btn-new{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-family:'Tajawal',Arial,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn-new:hover{opacity:.9}

/* ── TABS ── */
.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid #E2E8F0;padding:0 20px}
.tab{padding:14px 20px;font-family:'Tajawal',Arial,sans-serif;font-size:.9rem;font-weight:700;color:#64748B;background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:#6C3DD6;border-bottom-color:#6C3DD6;background:#EDE9FE}
.tab:hover:not(.active){color:#334155}

/* ── MAIN ── */
.main{max-width:1300px;margin:0 auto;padding:24px 20px}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:#fff;border:1px solid #E2E8F0;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-radius:14px;padding:16px 20px;text-align:center}
.stat-val{font-size:2rem;font-weight:900;color:#6C3DD6}
.stat-lbl{font-size:.82rem;color:#64748B;margin-top:4px}

/* ── FILTERS ── */
.filters-bar{background:#fff;border:1px solid #E2E8F0;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-radius:14px;padding:14px 16px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search-input{flex:1;min-width:180px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#1E293B;font-family:'Tajawal',Arial,sans-serif;font-size:.9rem;padding:9px 14px;outline:none}
.search-input:focus{border-color:#6C3DD6}
.filter-select{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#1E293B;font-family:'Tajawal',Arial,sans-serif;font-size:.85rem;padding:9px 12px;outline:none;cursor:pointer}
.filter-btn{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:20px;padding:6px 16px;font-family:'Tajawal',Arial,sans-serif;font-size:.83rem;color:#64748B;cursor:pointer;transition:.2s}
.filter-btn.active{background:#6C3DD6;border-color:#6C3DD6;color:#fff}
.filter-btn:hover:not(.active){border-color:#94A3B8;color:#334155}

/* ── MEETINGS GRID ── */
.meetings-grid{display:flex;flex-direction:column;gap:12px}
.meeting-card{background:#fff;border:1px solid #E2E8F0;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-radius:14px;padding:18px 20px;transition:.15s;position:relative}
.meeting-card:hover{box-shadow:0 4px 14px rgba(0,0,0,0.12)}
.meeting-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;cursor:pointer}
.meeting-title{font-size:1.05rem;font-weight:700;color:#0F172A}
.badges-row{display:flex;gap:6px;flex-shrink:0;align-items:center}
.today-badge{background:#FEE2E2;color:#DC2626;padding:4px 12px;border-radius:20px;font-size:.76rem;font-weight:900}
.type-badge,.status-badge{padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700;white-space:nowrap}
.meeting-meta{display:flex;gap:16px;flex-wrap:wrap;cursor:pointer}
.meta-item{display:flex;align-items:center;gap:5px;font-size:.83rem;color:#64748B}
.meta-item span{color:#334155}
.meeting-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid #F1F5F9;flex-wrap:wrap;gap:8px}
.rsvp-count{font-size:.8rem;color:#64748B}
.actions-row{display:flex;gap:6px;flex-wrap:wrap}
.rsvp-btn,.card-btn{padding:5px 14px;border-radius:8px;font-family:'Tajawal',Arial,sans-serif;font-size:.8rem;font-weight:700;border:none;cursor:pointer}
.rsvp-confirm{background:#D1FAE5;color:#059669}
.rsvp-confirm:hover{background:#A7F3D0}
.rsvp-decline{background:#FEE2E2;color:#DC2626}
.rsvp-decline:hover{background:#FECACA}
.rsvp-pending{background:#FEF3C7;color:#D97706}
.rsvp-pending:hover{background:#FDE68A}
.rsvp-done{background:#F1F5F9;color:#94A3B8;cursor:default}
.card-btn-edit{background:#EDE9FE;color:#6C3DD6}
.card-btn-edit:hover{background:#DDD6FE}
.card-btn-delete{background:#FEE2E2;color:#DC2626}
.card-btn-delete:hover{background:#FECACA}
.card-btn-ack{background:#E0F2FE;color:#0284C7}
.card-btn-ack:hover{background:#BAE6FD}

/* ── MY MEETINGS ── */
.my-timeline{display:flex;flex-direction:column;gap:10px}
.my-card{background:#fff;border:1px solid #E2E8F0;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.my-card:hover{box-shadow:0 4px 14px rgba(0,0,0,0.12)}
.my-card-info{flex:1}
.my-card-title{font-weight:700;color:#0F172A;font-size:.95rem}
.my-card-date{font-size:.82rem;color:#64748B;margin-top:3px}
.my-card-response{padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:700;white-space:nowrap}
.resp-confirmed{background:#D1FAE5;color:#059669}
.resp-declined{background:#FEE2E2;color:#DC2626}
.resp-pending{background:#FEF3C7;color:#D97706}
.resp-none{background:#F1F5F9;color:#64748B;border:1px solid #E2E8F0}

/* ── CALENDAR ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;background:#fff;border:1px solid #E2E8F0;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-radius:14px;padding:12px 18px}
.cal-title{font-size:1.1rem;font-weight:900;color:#0F172A}
.cal-nav{background:#F1F5F9;color:#475569;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:1rem}
.cal-nav:hover{background:#E2E8F0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day-header{text-align:center;font-size:.75rem;color:#94A3B8;padding:6px 0;font-weight:700}
.cal-day{min-height:80px;background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:6px;cursor:pointer;transition:.15s}
.cal-day:hover{border-color:#94A3B8}
.cal-day.today{border-color:#6C3DD6;background:#F5F3FF}
.cal-day.other-month{opacity:.35}
.cal-day-num{font-size:.8rem;color:#94A3B8;font-weight:700;margin-bottom:4px}
.cal-day.today .cal-day-num{color:#6C3DD6}
.cal-event-dot{font-size:.7rem;background:#6C3DD6;color:#fff;border-radius:4px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border:1px solid #E2E8F0;border-radius:18px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-header{padding:20px 24px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-header h2{font-size:1.1rem;font-weight:900;color:#0F172A}
.modal-close{background:#F1F5F9;color:#64748B;border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1.1rem}
.modal-close:hover{background:#E2E8F0;color:#0F172A}
.modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:.85rem;color:#475569;font-weight:700}
.form-input,.form-select,.form-textarea{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#0F172A;font-family:'Tajawal',Arial,sans-serif;font-size:.95rem;padding:10px 14px;width:100%;outline:none;transition:.2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#6C3DD6;box-shadow:0 0 0 2px rgba(108,61,214,.15)}
.form-textarea{min-height:90px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-footer{padding:16px 24px;border-top:1px solid #E2E8F0;display:flex;justify-content:flex-end;gap:10px}
.btn-cancel-modal{background:#F1F5F9;color:#475569;border:1px solid #E2E8F0;border-radius:10px;padding:10px 20px;font-family:'Tajawal',Arial,sans-serif;font-size:.9rem;cursor:pointer}
.btn-cancel-modal:hover{background:#E2E8F0}
.btn-save{background:linear-gradient(135deg,#6C3DD6,#22D3EE);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-family:'Tajawal',Arial,sans-serif;font-size:.9rem;font-weight:700;cursor:pointer}
.btn-save:hover{opacity:.9}

/* ── DETAIL ── */
.detail-section{margin-bottom:16px}
.detail-section-title{font-size:.8rem;text-transform:uppercase;color:#94A3B8;letter-spacing:.5px;margin-bottom:8px;font-weight:700}
.detail-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-info-item{background:#F8FAFC;border-radius:10px;padding:10px 14px}
.detail-info-label{font-size:.75rem;color:#94A3B8;margin-bottom:2px}
.detail-info-value{font-size:.9rem;color:#0F172A;font-weight:600}
.agenda-box{background:#F8FAFC;border-radius:10px;padding:14px;color:#334155;font-size:.9rem;line-height:1.7;white-space:pre-wrap}
.attendees-list{display:flex;flex-direction:column;gap:6px}
.attendee-row{display:flex;align-items:center;justify-content:space-between;background:#F8FAFC;border-radius:8px;padding:8px 12px}
.attendee-name{font-size:.88rem;color:#334155}

/* ── MINUTES ── */
.minutes-box{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:14px;min-height:100px;color:#334155;font-size:.9rem;resize:vertical;width:100%;font-family:'Tajawal',Arial,sans-serif;outline:none}
.minutes-box:focus{border-color:#6C3DD6}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:60px 20px;color:#94A3B8}
.empty-icon{font-size:3.5rem;margin-bottom:16px}
.empty-title{font-size:1.1rem;font-weight:700;color:#64748B;margin-bottom:8px}
.empty-sub{font-size:.88rem;color:#94A3B8}

/* ── TOAST ── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0F172A;border:1px solid #334155;color:#F1F5F9;border-radius:12px;padding:12px 24px;font-size:.9rem;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;max-width:320px;text-align:center}
.toast.show{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── PANEL ── */
.panel{display:none}
.panel.active{display:block}

@media(max-width:600px){
  .form-row,.form-row-3{grid-template-columns:1fr}
  .detail-info-grid{grid-template-columns:1fr}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .filters-bar{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">🤝</div>
      <div class="brand-info">
        <h1>الاجتماعات المدرسية</h1>
        <p id="schoolName">بوابة الجود الذكية · EduOS</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="week-pill" id="weekLabel">الأسبوع —</div>
      <button class="btn-back" onclick="history.back()">&#8594; رجوع</button>
      <button class="btn-new" id="btnNew" onclick="openNewMeeting()" style="display:none">+ اجتماع جديد</button>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-panel="all" onclick="switchTab(this,'all')">📋 جميع الاجتماعات</button>
  <button class="tab" data-panel="mine" onclick="switchTab(this,'mine')">👤 اجتماعاتي</button>
  <button class="tab" data-panel="calendar" onclick="switchTab(this,'calendar')">📅 التقويم</button>
</div>

<div class="main">

  <!-- STATS -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-val" id="statTotal">—</div><div class="stat-lbl">إجمالي الاجتماعات</div></div>
    <div class="stat-card"><div class="stat-val" id="statUpcoming">—</div><div class="stat-lbl">قادمة</div></div>
    <div class="stat-card"><div class="stat-val" id="statDone">—</div><div class="stat-lbl">منتهية</div></div>
    <div class="stat-card"><div class="stat-val" id="statMonth">—</div><div class="stat-lbl">هذا الشهر</div></div>
  </div>

  <!-- PANEL: ALL -->
  <div class="panel active" id="panel-all">
    <div class="filters-bar">
      <input class="search-input" id="searchInput" placeholder="🔍 ابحثي عن اجتماع بالعنوان..." oninput="renderAll()">
      <select class="filter-select" id="typeFilterSelect" onchange="renderAll()">
        <option value="all">كل الأنواع</option>
        <option value="general">عام</option>
        <option value="pedagogical">تربوي</option>
        <option value="emergency">طارئ</option>
        <option value="parent">أولياء أمور</option>
        <option value="department">قسم</option>
        <option value="admin">إداري</option>
        <option value="other">أخرى</option>
      </select>
      <select class="filter-select" id="monthFilterSelect" onchange="renderAll()">
        <option value="all">كل الأشهر</option>
      </select>
    </div>
    <div class="meetings-grid" id="allList">
      <div class="empty-state"><div class="empty-icon">🔄</div><div class="empty-title">جارٍ التحميل...</div></div>
    </div>
  </div>

  <!-- PANEL: MINE -->
  <div class="panel" id="panel-mine">
    <div class="my-timeline" id="mineList">
      <div class="empty-state"><div class="empty-icon">🔄</div><div class="empty-title">جارٍ التحميل...</div></div>
    </div>
  </div>

  <!-- PANEL: CALENDAR -->
  <div class="panel" id="panel-calendar">
    <div class="cal-header">
      <button class="cal-nav" onclick="changeMonth(-1)">&#8250;</button>
      <div class="cal-title" id="calTitle">—</div>
      <button class="cal-nav" onclick="changeMonth(1)">&#8249;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

</div>

<!-- MODAL: NEW/EDIT MEETING -->
<div class="modal-overlay" id="modalNew">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalNewTitle">اجتماع جديد</h2>
      <button class="modal-close" onclick="closeModal('modalNew')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">عنوان الاجتماع *</label>
        <input class="form-input" id="fTitle" placeholder="مثال: اجتماع مجلس المعلمين الشهري">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">نوع الاجتماع *</label>
          <select class="form-select" id="fType">
            <option value="general">عام</option>
            <option value="pedagogical">تربوي</option>
            <option value="emergency">طارئ</option>
            <option value="parent">أولياء أمور</option>
            <option value="department">قسم</option>
            <option value="admin">إداري</option>
            <option value="other">أخرى</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">الحالة</label>
          <select class="form-select" id="fStatus">
            <option value="upcoming">قادم</option>
            <option value="ongoing">جارٍ</option>
            <option value="completed">منتهي</option>
            <option value="cancelled">ملغي</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">تاريخ الاجتماع *</label>
          <input class="form-input" type="date" id="fDate">
        </div>
        <div class="form-group">
          <label class="form-label">وقت الاجتماع *</label>
          <input class="form-input" type="time" id="fTime">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">المكان</label>
          <input class="form-input" id="fLocation" placeholder="مثال: قاعة الاجتماعات — الطابق الأول">
        </div>
        <div class="form-group">
          <label class="form-label">المدة (دقائق)</label>
          <input class="form-input" type="number" id="fDuration" placeholder="60">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">المستهدفون</label>
        <select class="form-select" id="fTargetType" onchange="handleTargetTypeChange()">
          <option value="all">كل الموظفين</option>
          <option value="teachers">المعلمات</option>
          <option value="admin_staff">الإداريون</option>
          <option value="specific">أفراد محددون</option>
        </select>
      </div>
      <div class="form-group" id="specificStaffGroup" style="display:none">
        <label class="form-label">اختاري الموظفين المستهدفين</label>
        <input type="text" class="form-input" id="staffSearchInput" placeholder="ابحث بالاسم..." oninput="filterStaffList()" style="margin-bottom:8px">
        <div id="staffCheckList" style="max-height:200px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:10px;padding:8px;background:#F8FAFC">
          <div style="text-align:center;color:#94A3B8;padding:20px">جاري التحميل...</div>
        </div>
        <div id="selectedStaffCount" style="margin-top:6px;font-size:12px;color:#6C3DD6;font-weight:700">لم يُختر أحد</div>
      </div>
      <div class="form-group">
        <label class="form-label">جدول الأعمال</label>
        <textarea class="form-textarea" id="fAgenda" placeholder="اكتبي نقاط جدول الأعمال..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">ملاحظات</label>
        <textarea class="form-textarea" id="fNotes" placeholder="ملاحظات إضافية..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel-modal" onclick="closeModal('modalNew')">إلغاء</button>
      <button class="btn-save" onclick="saveMeeting()">💾 حفظ</button>
    </div>
  </div>
</div>

<!-- MODAL: DETAIL -->
<div class="modal-overlay" id="modalDetail">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">تفاصيل الاجتماع</h2>
      <button class="modal-close" onclick="closeModal('modalDetail')">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer" id="detailFooter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════ */
var MEET_TYPES = {
  'general':     {label:'عام',              color:'#0284C7', bg:'#E0F2FE'},
  'pedagogical': {label:'تربوي',            color:'#059669', bg:'#D1FAE5'},
  'emergency':   {label:'طارئ',             color:'#DC2626', bg:'#FEE2E2'},
  'parent':      {label:'أولياء أمور',       color:'#D97706', bg:'#FEF3C7'},
  'department':  {label:'قسم',              color:'#7C3AED', bg:'#EDE9FE'},
  'admin':       {label:'إداري',            color:'#475569', bg:'#F1F5F9'},
  'other':       {label:'أخرى',             color:'#64748B', bg:'#F8FAFC'}
};

var _allStaffList = [];
var _selectedStaff = [];

var MEET_STATUS = {
  'upcoming':   {label:'قادم',    color:'#0284C7', bg:'#DBEAFE'},
  'completed':  {label:'منتهي',   color:'#059669', bg:'#D1FAE5'},
  'cancelled':  {label:'ملغي',   color:'#DC2626', bg:'#FEE2E2'},
  'ongoing':    {label:'جارٍ',    color:'#D97706', bg:'#FEF3C7'}
};

/* ═══════════════════════════════════════
   INIT — انتظر EduOS
═══════════════════════════════════════ */
var SB_URL, SB_KEY, session, canCreate, SCHOOL_ID;

document.addEventListener('DOMContentLoaded', function () {
  var tries = 0;
  var interval = setInterval(function () {
    tries++;
    if (window.EduOS && window.EduOS.SB_URL) {
      clearInterval(interval);
      SB_URL = window.EduOS.SB_URL;
      SB_KEY = window.EduOS.SB_KEY;
      init();
    } else if (tries > 40) {
      clearInterval(interval);
      showToast('خطأ في الاتصال بالمنصة');
    }
  }, 100);
});

function init () {
  try { session = JSON.parse(sessionStorage.getItem('edoos_user') || 'null'); } catch (e) { session = null; }
  if (!session || !session.id) { window.location.href = '../eduos-login/'; return; }

  SCHOOL_ID = session.school_id || (window.EduOS && window.EduOS.school ? window.EduOS.school.id : 'aljood');

  canCreate = ['admin','principal','vice_principal','secretary'].indexOf(session.role_key) >= 0;
  if (canCreate) document.getElementById('btnNew').style.display = 'flex';

  if (window.getPlatformWeek) {
    document.getElementById('weekLabel').textContent = 'الأسبوع ' + getPlatformWeek();
  }

  buildMonthFilter();
  loadAll();
  renderCalendar();
}

function authHeaders (json) {
  var h = { apikey: SB_KEY, Authorization: 'Bearer ' + (session && session.token ? session.token : SB_KEY) };
  if (json) h['Content-Type'] = 'application/json';
  return h;
}

/* ═══════════════════════════════════════
   DATA
═══════════════════════════════════════ */
var allMeetings = [];
var myResponses = {};
var myAcks = {};
var currentMonth = new Date();
var editingId = null;

async function loadAll () {
  try {
    var mUrl = SB_URL + '/rest/v1/meetings?school_id=eq.' + encodeURIComponent(SCHOOL_ID) + '&order=meeting_date.asc,meeting_time.asc&limit=500';
    var rUrl = SB_URL + '/rest/v1/meeting_responses?staff_id=eq.' + encodeURIComponent(session.id) + '&select=meeting_id,response';

    var mRes = await fetch(mUrl, { headers: authHeaders(false) });
    var rRes = await fetch(rUrl, { headers: authHeaders(false) });

    var meetings = await mRes.json();
    var responses = await rRes.json();

    allMeetings = Array.isArray(meetings) ? meetings : [];

    myResponses = {};
    if (Array.isArray(responses)) {
      responses.forEach(function (r) { myResponses[r.meeting_id] = r.response; });
    }

    buildMonthFilter();
    renderStats();
    renderAll();
    renderMine();
    renderCalendar();
  } catch (e) {
    allMeetings = [];
    renderStats();
    renderAll();
    renderMine();
  }
}

/* ═══════════════════════════════════════
   STATS
═══════════════════════════════════════ */
function renderStats () {
  var today = new Date().toISOString().slice(0,10);
  var curMonth = today.slice(0,7);
  var upcoming = allMeetings.filter(function (m) { return m.meeting_date >= today && m.status !== 'cancelled' && m.status !== 'completed'; });
  var done = allMeetings.filter(function (m) { return m.status === 'completed' || (m.meeting_date < today && m.status !== 'cancelled'); });
  var thisMonth = allMeetings.filter(function (m) { return (m.meeting_date || '').slice(0,7) === curMonth; });

  document.getElementById('statTotal').textContent = allMeetings.length;
  document.getElementById('statUpcoming').textContent = upcoming.length;
  document.getElementById('statDone').textContent = done.length;
  document.getElementById('statMonth').textContent = thisMonth.length;
}

function isForMe (m) {
  if (!m.target_type || m.target_type === 'all') return true;
  if (m.target_type === 'teachers' && session.role_key === 'teacher') return true;
  if (m.target_type === 'admin_staff' && ['admin','secretary','principal','vice_principal'].indexOf(session.role_key) >= 0) return true;
  if (Array.isArray(m.target_roles) && m.target_roles.indexOf(session.role_key) >= 0) return true;
  if (m.creator_id === session.id) return true;
  return false;
}

/* ═══════════════════════════════════════
   MONTH FILTER BUILD
═══════════════════════════════════════ */
function buildMonthFilter () {
  var sel = document.getElementById('monthFilterSelect');
  var current = sel.value || 'all';
  var monthsSet = {};
  allMeetings.forEach(function (m) {
    if (m.meeting_date) monthsSet[m.meeting_date.slice(0,7)] = true;
  });
  var monthsArr = Object.keys(monthsSet).sort();
  var monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

  var html = '<option value="all">كل الأشهر</option>';
  monthsArr.forEach(function (ym) {
    var parts = ym.split('-');
    var label = monthNames[parseInt(parts[1],10)-1] + ' ' + parts[0];
    html += '<option value="' + ym + '">' + label + '</option>';
  });
  sel.innerHTML = html;
  sel.value = monthsSet[current] ? current : 'all';
}

/* ═══════════════════════════════════════
   ALL MEETINGS
═══════════════════════════════════════ */
function renderAll () {
  var list = document.getElementById('allList');
  var typeVal = document.getElementById('typeFilterSelect').value;
  var monthVal = document.getElementById('monthFilterSelect').value;
  var searchVal = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  var filtered = allMeetings.filter(function (m) {
    if (typeVal !== 'all' && m.type !== typeVal) return false;
    if (monthVal !== 'all' && (m.meeting_date || '').slice(0,7) !== monthVal) return false;
    if (searchVal && (m.title || '').toLowerCase().indexOf(searchVal) === -1) return false;
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🤝</div><div class="empty-title">لا توجد اجتماعات</div><div class="empty-sub">اضغطي على "+ اجتماع جديد" لإنشاء أول اجتماع</div></div>';
    return;
  }

  list.innerHTML = filtered.map(function (m) { return renderMeetingCard(m); }).join('');
}

function renderMeetingCard (m) {
  var today = new Date().toISOString().slice(0,10);
  var isToday = m.meeting_date === today;
  var isPast = m.meeting_date < today;
  var typeInfo = MEET_TYPES[m.type] || MEET_TYPES.other;
  var statusKey = m.status || 'upcoming';
  var statusInfo = MEET_STATUS[statusKey] || MEET_STATUS.upcoming;
  var myResp = myResponses[m.id];

  var badgesHtml = '';
  if (isToday) badgesHtml += '<span class="today-badge">اليوم!</span>';
  badgesHtml += '<span class="type-badge" style="background:' + typeInfo.bg + ';color:' + typeInfo.color + '">' + typeInfo.label + '</span>';
  badgesHtml += '<span class="status-badge" style="background:' + statusInfo.bg + ';color:' + statusInfo.color + '">' + statusInfo.label + '</span>';

  var rsvpHtml = '';
  if (isForMe(m) && statusKey !== 'cancelled' && statusKey !== 'completed' && m.creator_id !== session.id) {
    if (myResp === 'attending') {
      rsvpHtml = '<button class="rsvp-btn rsvp-done">✅ مؤكد حضورك</button>';
    } else if (myResp === 'declined') {
      rsvpHtml = '<button class="rsvp-btn rsvp-done">❌ اعتذرت</button>';
    } else if (myResp === 'maybe') {
      rsvpHtml = '<button class="rsvp-btn rsvp-done">⏳ ربما</button>';
    } else {
      rsvpHtml = '<button class="rsvp-btn rsvp-confirm" onclick="event.stopPropagation();rsvp(\'' + m.id + '\',\'attending\')">✅ حضور</button>' +
                 '<button class="rsvp-btn rsvp-pending" onclick="event.stopPropagation();rsvp(\'' + m.id + '\',\'maybe\')">⏳ ربما</button>' +
                 '<button class="rsvp-btn rsvp-decline" onclick="event.stopPropagation();rsvp(\'' + m.id + '\',\'declined\')">❌ اعتذار</button>';
    }
  }

  var actionsHtml = '<button class="card-btn card-btn-ack" onclick="event.stopPropagation();showDetail(\'' + m.id + '\')">👁️ عرض</button>';
  if (canCreate && (m.creator_id === session.id)) {
    actionsHtml += '<button class="card-btn card-btn-edit" onclick="event.stopPropagation();openEditMeeting(\'' + m.id + '\')">✏️ تعديل</button>';
    actionsHtml += '<button class="card-btn card-btn-delete" onclick="event.stopPropagation();deleteMeeting(\'' + m.id + '\')">🗑️ حذف</button>';
  }

  var respCountHtml = '<span class="rsvp-count">👥 ' + (m.responses_count != null ? m.responses_count : '—') + ' استجابة</span>';

  return '<div class="meeting-card">' +
    '<div class="meeting-card-header" onclick="showDetail(\'' + m.id + '\')">' +
      '<div class="meeting-title">' + esc(m.title) + '</div>' +
      '<div class="badges-row">' + badgesHtml + '</div>' +
    '</div>' +
    '<div class="meeting-meta" onclick="showDetail(\'' + m.id + '\')">' +
      '<div class="meta-item">📅 <span>' + formatDate(m.meeting_date) + '</span></div>' +
      '<div class="meta-item">🕐 <span>' + (m.meeting_time ? m.meeting_time.slice(0,5) : '—') + '</span></div>' +
      (m.location ? '<div class="meta-item">📍 <span>' + esc(m.location) + '</span></div>' : '') +
      '<div class="meta-item">👤 <span>' + esc(m.creator_name || '—') + '</span></div>' +
    '</div>' +
    '<div class="meeting-card-footer">' +
      '<div class="rsvp-row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' + rsvpHtml + '</div>' +
      '<div class="actions-row">' + actionsHtml + '</div>' +
    '</div>' +
  '</div>';
}

/* ═══════════════════════════════════════
   MY MEETINGS
═══════════════════════════════════════ */
function renderMine () {
  var list = document.getElementById('mineList');
  var mine = allMeetings.filter(function (m) { return isForMe(m); });

  if (!mine.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">لا توجد اجتماعات مخصصة لك</div></div>';
    return;
  }

  list.innerHTML = mine.map(function (m) {
    var resp = myResponses[m.id];
    var respClass = resp === 'attending' ? 'resp-confirmed' : (resp === 'declined' ? 'resp-declined' : (resp === 'maybe' ? 'resp-pending' : 'resp-none'));
    var respLabel = resp === 'attending' ? '✅ حضور مؤكد' : (resp === 'declined' ? '❌ اعتذرت' : (resp === 'maybe' ? '⏳ ربما' : 'لم تُحدد'));

    return '<div class="my-card" onclick="showDetail(\'' + m.id + '\')">' +
      '<div class="my-card-info">' +
        '<div class="my-card-title">' + esc(m.title) + '</div>' +
        '<div class="my-card-date">📅 ' + formatDate(m.meeting_date) + ' &nbsp; 🕐 ' + (m.meeting_time ? m.meeting_time.slice(0,5) : '—') + (m.location ? ' &nbsp; 📍 ' + esc(m.location) : '') + '</div>' +
      '</div>' +
      '<span class="my-card-response ' + respClass + '">' + respLabel + '</span>' +
    '</div>';
  }).join('');
}

/* ═══════════════════════════════════════
   CALENDAR
═══════════════════════════════════════ */
function changeMonth (dir) { currentMonth.setMonth(currentMonth.getMonth() + dir); renderCalendar(); }

function renderCalendar () {
  var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var days = ['أح','إث','ثل','أر','خم','جم','سب'];
  document.getElementById('calTitle').textContent = months[currentMonth.getMonth()] + ' ' + currentMonth.getFullYear();

  var grid = document.getElementById('calGrid');
  var year = currentMonth.getFullYear();
  var month = currentMonth.getMonth();
  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var todayStr = new Date().toISOString().slice(0,10);

  var html = days.map(function (d) { return '<div class="cal-day-header">' + d + '</div>'; }).join('');

  for (var i = 0; i < firstDay; i++) html += '<div class="cal-day other-month"></div>';

  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var isToday = dateStr === todayStr;
    var dayMeetings = allMeetings.filter(function (m) { return m.meeting_date === dateStr; });
    var dotsHtml = dayMeetings.slice(0,3).map(function (m) {
      return '<div class="cal-event-dot" onclick="event.stopPropagation();showDetail(\'' + m.id + '\')">' + esc(m.title.slice(0,12)) + '</div>';
    }).join('');

    html += '<div class="cal-day' + (isToday ? ' today' : '') + '">' +
      '<div class="cal-day-num">' + d + '</div>' + dotsHtml + '</div>';
  }

  grid.innerHTML = html;
}

/* ═══════════════════════════════════════
   DETAIL
═══════════════════════════════════════ */
async function showDetail (id) {
  var m = allMeetings.find(function (x) { return x.id === id; });
  if (!m) return;

  var respData = [];
  try {
    var r = await fetch(SB_URL + '/rest/v1/meeting_responses?meeting_id=eq.' + id + '&select=staff_name,response', {
      headers: authHeaders(false)
    });
    respData = await r.json();
    if (!Array.isArray(respData)) respData = [];
  } catch (e) {}

  var typeInfo = MEET_TYPES[m.type] || MEET_TYPES.other;
  var statusKey = m.status || 'upcoming';
  var statusInfo = MEET_STATUS[statusKey] || MEET_STATUS.upcoming;

  document.getElementById('detailTitle').textContent = m.title;

  var respCounts = { attending: 0, declined: 0, maybe: 0 };
  respData.forEach(function (r) { if (respCounts[r.response] !== undefined) respCounts[r.response]++; });

  var body = '<div class="detail-section">' +
    '<div class="detail-section-title">معلومات الاجتماع</div>' +
    '<div class="detail-info-grid">' +
      '<div class="detail-info-item"><div class="detail-info-label">النوع</div><div class="detail-info-value">' + typeInfo.label + '</div></div>' +
      '<div class="detail-info-item"><div class="detail-info-label">الحالة</div><div class="detail-info-value">' + statusInfo.label + '</div></div>' +
      '<div class="detail-info-item"><div class="detail-info-label">التاريخ</div><div class="detail-info-value">' + formatDate(m.meeting_date) + '</div></div>' +
      '<div class="detail-info-item"><div class="detail-info-label">الوقت</div><div class="detail-info-value">' + (m.meeting_time ? m.meeting_time.slice(0,5) : '—') + '</div></div>' +
      '<div class="detail-info-item"><div class="detail-info-label">المكان</div><div class="detail-info-value">' + esc(m.location || '—') + '</div></div>' +
      '<div class="detail-info-item"><div class="detail-info-label">المُنشئ</div><div class="detail-info-value">' + esc(m.creator_name || '—') + '</div></div>' +
    '</div>' +
  '</div>';

  if (m.agenda) {
    body += '<div class="detail-section"><div class="detail-section-title">جدول الأعمال</div><div class="agenda-box">' + esc(m.agenda) + '</div></div>';
  }

  if (m.notes) {
    body += '<div class="detail-section"><div class="detail-section-title">ملاحظات</div><div class="agenda-box">' + esc(m.notes) + '</div></div>';
  }

  if (respData.length) {
    body += '<div class="detail-section"><div class="detail-section-title">الردود (' + respData.length + '): ✅ ' + respCounts.attending + ' &nbsp; ⏳ ' + respCounts.maybe + ' &nbsp; ❌ ' + respCounts.declined + '</div>' +
      '<div class="attendees-list">' +
      respData.map(function (r) {
        var cls = r.response === 'attending' ? 'resp-confirmed' : (r.response === 'declined' ? 'resp-declined' : 'resp-pending');
        var lbl = r.response === 'attending' ? '✅ حضور' : (r.response === 'declined' ? '❌ اعتذار' : '⏳ ربما');
        return '<div class="attendee-row"><span class="attendee-name">' + esc(r.staff_name || '—') + '</span><span class="my-card-response ' + cls + '" style="font-size:.75rem;padding:3px 10px">' + lbl + '</span></div>';
      }).join('') +
    '</div></div>';
  }

  if (statusKey === 'completed') {
    body += '<div class="detail-section"><div class="detail-section-title">محضر الاجتماع</div>' +
      '<textarea class="minutes-box" id="minutesInput" placeholder="اكتبي محضر الاجتماع هنا...">' + esc(m.minutes || '') + '</textarea></div>';
  }

  document.getElementById('detailBody').innerHTML = body;

  var footer = '';
  var myResp = myResponses[id];
  var today = new Date().toISOString().slice(0,10);
  var isPast = m.meeting_date < today;

  if (isForMe(m) && !isPast && statusKey !== 'cancelled' && statusKey !== 'completed' && m.creator_id !== session.id) {
    if (!myResp) {
      footer += '<button class="rsvp-btn rsvp-confirm" onclick="rsvp(\'' + id + '\',\'attending\')">✅ تأكيد حضور</button>' +
                '<button class="rsvp-btn rsvp-pending" onclick="rsvp(\'' + id + '\',\'maybe\')">⏳ ربما</button>' +
                '<button class="rsvp-btn rsvp-decline" onclick="rsvp(\'' + id + '\',\'declined\')">❌ اعتذار</button>';
    }
  }

  if (canCreate && m.creator_id === session.id) {
    if (statusKey === 'upcoming' || statusKey === 'ongoing') {
      footer += '<button class="btn-save" onclick="markDone(\'' + id + '\')">✓ إنهاء الاجتماع</button>';
    }
    if (statusKey === 'completed') {
      footer += '<button class="btn-save" onclick="saveMinutes(\'' + id + '\')">💾 حفظ المحضر</button>';
    }
  }

  if (!footer) footer = '<button class="btn-cancel-modal" onclick="closeModal(\'modalDetail\')">إغلاق</button>';
  else footer = '<button class="btn-cancel-modal" onclick="closeModal(\'modalDetail\')" style="margin-left:auto">إغلاق</button>' + footer;

  document.getElementById('detailFooter').innerHTML = footer;
  document.getElementById('modalDetail').classList.add('open');
}

/* ═══════════════════════════════════════
   RSVP
═══════════════════════════════════════ */
async function rsvp (meetingId, response) {
  try {
    await fetch(SB_URL + '/rest/v1/meeting_responses', {
      method: 'POST',
      headers: Object.assign(authHeaders(true), { Prefer: 'resolution=merge-duplicates,return=representation' }),
      body: JSON.stringify({
        meeting_id: meetingId,
        staff_id: session.id,
        staff_name: session.name || session.name_ar || session.id,
        response: response,
        responded_at: new Date().toISOString()
      })
    });

    myResponses[meetingId] = response;
    var lbl = response === 'attending' ? 'تم تأكيد حضورك ✓' : (response === 'declined' ? 'تم تسجيل اعتذارك' : 'تم تسجيل ردك');
    showToast(lbl);
    closeModal('modalDetail');
    renderAll();
    renderMine();
  } catch (e) {
    showToast('خطأ — حاولي مرة أخرى');
  }
}

/* ═══════════════════════════════════════
   MARK DONE
═══════════════════════════════════════ */
async function markDone (id) {
  try {
    await fetch(SB_URL + '/rest/v1/meetings?id=eq.' + id, {
      method: 'PATCH',
      headers: Object.assign(authHeaders(true), { Prefer: 'return=minimal' }),
      body: JSON.stringify({ status: 'completed', updated_at: new Date().toISOString() })
    });
    showToast('تم إنهاء الاجتماع ✓');
    closeModal('modalDetail');
    loadAll();
  } catch (e) {
    showToast('خطأ — حاولي مرة أخرى');
  }
}

/* ═══════════════════════════════════════
   SAVE MINUTES
═══════════════════════════════════════ */
async function saveMinutes (id) {
  var val = document.getElementById('minutesInput') ? document.getElementById('minutesInput').value.trim() : '';
  try {
    await fetch(SB_URL + '/rest/v1/meetings?id=eq.' + id, {
      method: 'PATCH',
      headers: Object.assign(authHeaders(true), { Prefer: 'return=minimal' }),
      body: JSON.stringify({ minutes: val, updated_at: new Date().toISOString() })
    });
    showToast('تم حفظ المحضر ✓');
    closeModal('modalDetail');
    loadAll();
  } catch (e) {
    showToast('خطأ — حاولي مرة أخرى');
  }
}

/* ═══════════════════════════════════════
   DELETE
═══════════════════════════════════════ */
var pendingDeleteId = null;
function deleteMeeting (id) {
  if (pendingDeleteId === id) {
    doDelete(id);
    pendingDeleteId = null;
    return;
  }
  pendingDeleteId = id;
  showToast('اضغطي حذف مرة أخرى للتأكيد');
  setTimeout(function () { pendingDeleteId = null; }, 4000);
}

async function doDelete (id) {
  try {
    await fetch(SB_URL + '/rest/v1/meetings?id=eq.' + id, {
      method: 'DELETE',
      headers: authHeaders(false)
    });
    showToast('تم حذف الاجتماع ✓');
    loadAll();
  } catch (e) {
    showToast('خطأ في الحذف — حاولي مرة أخرى');
  }
}

/* ═══════════════════════════════════════
   NEW / EDIT / SAVE
═══════════════════════════════════════ */
function openNewMeeting () {
  editingId = null;
  document.getElementById('modalNewTitle').textContent = 'اجتماع جديد';
  document.getElementById('fTitle').value = '';
  document.getElementById('fType').value = 'general';
  document.getElementById('fStatus').value = 'upcoming';
  document.getElementById('fTargetType').value = 'all';
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('fTime').value = '08:00';
  document.getElementById('fLocation').value = '';
  document.getElementById('fDuration').value = '';
  document.getElementById('fAgenda').value = '';
  document.getElementById('fNotes').value = '';
  document.getElementById('modalNew').classList.add('open');
}

function openEditMeeting (id) {
  var m = allMeetings.find(function (x) { return x.id === id; });
  if (!m) return;
  editingId = id;
  document.getElementById('modalNewTitle').textContent = 'تعديل الاجتماع';
  document.getElementById('fTitle').value = m.title || '';
  document.getElementById('fType').value = m.type || 'general';
  document.getElementById('fStatus').value = m.status || 'upcoming';
  document.getElementById('fTargetType').value = m.target_type || 'all';
  document.getElementById('fDate').value = m.meeting_date || '';
  document.getElementById('fTime').value = m.meeting_time ? m.meeting_time.slice(0,5) : '';
  document.getElementById('fLocation').value = m.location || '';
  document.getElementById('fDuration').value = m.duration_minutes || '';
  document.getElementById('fAgenda').value = m.agenda || '';
  document.getElementById('fNotes').value = m.notes || '';
  document.getElementById('modalNew').classList.add('open');
}

async function saveMeeting () {
  var title = document.getElementById('fTitle').value.trim();
  var date  = document.getElementById('fDate').value;
  var time  = document.getElementById('fTime').value;
  if (!title || !date || !time) { showToast('يرجى ملء الحقول الإلزامية'); return; }

  var durationVal = document.getElementById('fDuration').value;

  var payload = {
    title: title,
    type: document.getElementById('fType').value,
    status: document.getElementById('fStatus').value,
    target_type: document.getElementById('fTargetType').value,
    creator_id: session.id,
    creator_name: session.name || session.name_ar || session.id,
    meeting_date: date,
    meeting_time: time,
    location: document.getElementById('fLocation').value.trim() || null,
    duration_minutes: durationVal ? parseInt(durationVal, 10) : null,
    agenda: document.getElementById('fAgenda').value.trim() || null,
    notes: document.getElementById('fNotes').value.trim() || null,
    school_id: SCHOOL_ID,
    updated_at: new Date().toISOString()
  };

  try {
    var method, url;
    if (editingId) {
      method = 'PATCH';
      url = SB_URL + '/rest/v1/meetings?id=eq.' + editingId;
    } else {
      method = 'POST';
      url = SB_URL + '/rest/v1/meetings';
    }

    var res = await fetch(url, {
      method: method,
      headers: Object.assign(authHeaders(true), { Prefer: 'return=representation' }),
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error('save failed');
    showToast(editingId ? 'تم تحديث الاجتماع ✓' : 'تم إنشاء الاجتماع ✓');
    closeModal('modalNew');
    loadAll();
  } catch (e) {
    showToast('خطأ في الحفظ — حاولي مرة أخرى');
  }
}

function switchTab (el, panel) {
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
  document.getElementById('panel-' + panel).classList.add('active');
}

function closeModal (id) { document.getElementById(id).classList.remove('open'); }

async function handleTargetTypeChange() {
  var val = document.getElementById('fTargetType').value;
  var grp = document.getElementById('specificStaffGroup');
  if (!grp) return;
  if (val === 'specific') {
    grp.style.display = 'block';
    await loadStaffList();
  } else {
    grp.style.display = 'none';
    _selectedStaff = [];
  }
}

async function loadStaffList() {
  var listEl = document.getElementById('staffCheckList');
  if (!listEl) return;
  if (_allStaffList.length) { renderStaffList(_allStaffList); return; }
  listEl.innerHTML = '<div style="text-align:center;color:#94A3B8;padding:16px">جاري التحميل...</div>';
  try {
    var res = await fetch(SB_URL + '/rest/v1/staff_profiles?is_active=eq.true&select=staff_db_id,name_ar,role_key,subject&order=name_ar&limit=200', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    var data = await res.json();
    _allStaffList = Array.isArray(data) ? data : [];
    renderStaffList(_allStaffList);
  } catch(e) {
    listEl.innerHTML = '<div style="color:#DC2626;padding:12px">خطأ في تحميل القائمة</div>';
  }
}

function renderStaffList(list) {
  var listEl = document.getElementById('staffCheckList');
  if (!listEl) return;
  if (!list.length) { listEl.innerHTML = '<div style="text-align:center;color:#94A3B8;padding:16px">لا بيانات</div>'; return; }
  var roleLabels = {teacher:'معلمة',principal:'مديرة',vice_principal:'وكيلة',admin:'إدارة',nurse:'تمريض',security:'أمن',coach:'مدرب',counselor:'مرشدة',sub_teacher:'احتياط'};
  listEl.innerHTML = list.map(function(s) {
    var checked = _selectedStaff.includes(s.staff_db_id) ? 'checked' : '';
    var role = roleLabels[s.role_key] || s.role_key || '';
    return '<label style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .12s" onmouseover="this.style.background=\'#EDE9FE\'" onmouseout="this.style.background=\'transparent\'">' +
      '<input type="checkbox" value="'+s.staff_db_id+'" data-name="'+(s.name_ar||'')+'" '+checked+' onchange="toggleStaff(this)" style="width:16px;height:16px;accent-color:#6C3DD6">' +
      '<div style="flex:1">' +
        '<div style="font-size:13px;font-weight:700;color:#1E293B">'+(s.name_ar||'—')+'</div>' +
        '<div style="font-size:11px;color:#94A3B8">'+role+(s.subject?' · '+s.subject:'')+'</div>' +
      '</div>' +
      '</label>';
  }).join('');
  updateSelectedCount();
}

function toggleStaff(cb) {
  var id = cb.value;
  var name = cb.dataset.name;
  if (cb.checked) {
    if (!_selectedStaff.includes(id)) _selectedStaff.push(id);
  } else {
    _selectedStaff = _selectedStaff.filter(function(x){ return x !== id; });
  }
  updateSelectedCount();
}

function updateSelectedCount() {
  var el = document.getElementById('selectedStaffCount');
  if (!el) return;
  var checked = document.querySelectorAll('#staffCheckList input[type=checkbox]:checked');
  if (!checked.length) { el.textContent = 'لم يُختر أحد'; }
  else { el.textContent = 'تم اختيار ' + checked.length + ' موظف/ة'; }
}

function filterStaffList() {
  var q = (document.getElementById('staffSearchInput')||{value:''}).value.toLowerCase().trim();
  var filtered = q ? _allStaffList.filter(function(s){ return (s.name_ar||'').toLowerCase().includes(q) || (s.subject||'').toLowerCase().includes(q); }) : _allStaffList;
  renderStaffList(filtered);
}

function showToast (msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 3000);
}

function esc (s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function formatDate (ds) {
  if (!ds) return '—';
  var d = new Date(ds);
  var days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
}
